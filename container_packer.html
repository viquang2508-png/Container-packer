  const byId = {}; out.units.forEach(u=> byId[u.id] = u);
  const r = {};
  out.placements.forEach(p=>{ const u = byId[p.unitId]; if (u) for (const k in u.skuCounts) r[k] = (r[k] || 0) + u.skuCounts[k]; });
  return r;
}
function runPalletWithGoal(skus, container, zones, opts, onProgress, onImprove){
  applyPalletTolerances(opts.pallet);
  // Gom SKU cùng kích thước không phải lúc nào cũng lợi (vd SKU bị vùi ở lớp giữa → khó lấy thùng kiểm hóa).
  // Thử nhanh cả 2 cách, giữ cách xếp được nhiều thùng hơn / ít pallet hơn.
  if (opts.pallet.groupSimilar !== false && !opts.pallet._groupDecided){
    const tryG = (g)=> runPalletOptimizerCore(skus, container, zones, Object.assign({}, opts, { speedLevel: 'fast',
      pallet: Object.assign({}, opts.pallet, { groupSimilar: g, loadGoal: 'compact' }) }), null, null);
    if (onProgress) onProgress(0, 1, 'So sánh: gom / không gom SKU cùng kích thước...');
    const a = tryG(true), b = tryG(false);
    const score = (o)=> o.errors ? [-1, 0] : [countPalletOutputCartons(o), -o.placements.length];
    const sa = score(a), sb = score(b);
    const useGroup = sa[0] > sb[0] || (sa[0] === sb[0] && sa[1] >= sb[1]);
    const fams = useGroup && !a.errors ? Array.from(new Set((a.planInfo || []).filter(pi=> pi.familyWith && pi.familyWith.length)
      .map(pi=> [((skus.find(k=> k.id === pi.skuId) || {}).code) || pi.skuId].concat(pi.familyWith).sort().join(' + ')))) : [];
    const P2 = Object.assign({}, opts.pallet, { groupSimilar: useGroup, _groupDecided: true });
    const out = runPalletWithGoal(skus, container, zones, Object.assign({}, opts, { pallet: P2 }), onProgress, onImprove);
    if (out && !out.errors){
      if (fams.length) (out.notes = out.notes || []).unshift(`Gom SKU cùng kích thước để chất chung: ${fams.join('; ')} (thử nhanh cả 2 cách — gom cho kết quả tốt hơn hoặc bằng).`);
      else if (!useGroup && (a.planInfo || []).some(pi=> pi.familyWith && pi.familyWith.length))
        (out.notes = out.notes || []).unshift('Có SKU cùng kích thước nhưng gom chung cho kết quả kém hơn (thử nhanh) → giữ chất riêng từng SKU.');
    }
    return out;
  }
  const P = opts.pallet;
  const out = P.loadGoal !== 'spread' ? runPalletOptimizerCore(skus, container, zones, opts, onProgress, onImprove)
                                      : runSpread(skus, container, zones, opts, onProgress, onImprove);
  return addDropDiagnostics(out, skus, container, zones, opts);
}

/* Còn rớt thùng → thử nhanh các nới lỏng thường gặp và ghi gợi ý cụ thể (không tự đổi cài đặt của người dùng). */
function addDropDiagnostics(out, skus, container, zones, opts){
  if (!out || out.errors || out.partial) return out;
  const total = skus.reduce((t,k)=> t + (k.qty || 0), 0);
  const got = countPalletOutputCartons(out);
  if (got >= total) return out;
  const P = opts.pallet, tips = [];
  const fast = (P2, sk)=> countPalletOutputCartons(runPalletOptimizerCore(sk || skus, container, zones,
    Object.assign({}, opts, { speedLevel: 'fast', pallet: Object.assign({}, P2, { _groupDecided: true }) }), null, null));
  const tip = (label, n)=>{ if (n > got) tips.push(`${label} → ${n}/${total} thùng`); };
  if (P.strapMode) tip('tắt "Pallet vuông vức"', fast(Object.assign({}, P, { strapMode: false })));
  const byIn = placedBySku(out);
  const dropped = skus.filter(k=> (byIn[k.id] || 0) < k.qty && k.thisSideUp && !k.rotLocked);
  if (dropped.length && P.allowLayDown !== false){
    const sk2 = skus.map(k=> dropped.includes(k) ? Object.assign({}, k, { thisSideUp: false, rotRoll: true }) : k);
    tip(`cho ${dropped.map(k=> k.code || k.id).join(', ')} nằm xuống (bỏ "This side up")`, fast(P, sk2));
  }
  if (P.spreadTol && (P.spreadTol.h > 0 || P.spreadTol.w > 0) && P.loadGoal === 'spread')
    tip('bỏ ràng buộc sai lệch dàn đều', fast(Object.assign({}, P, { spreadTol: {} })));
  (out.notes = out.notes || []).push(`Còn rớt ${total - got} thùng. ` + (tips.length
    ? 'Thử nhanh (mức "Nhanh") các cách nới: ' + tips.join('; ') + '.'
    : 'Đã thử nhanh: tắt vuông vức / cho thùng nằm / bỏ ràng buộc sai lệch — không cách nào xếp thêm được (hết chỗ sàn & chiều cao).'));
  return out;
}

/* Dàn đều: tìm GIỚI HẠN CAO (rồi TẢI) nhỏ nhất mà vẫn xếp hết hàng → pallet thấp & nhẹ gần bằng nhau; sau đó trong
   lõi: san bằng chiều cao + áp RÀNG BUỘC SAI LỆCH ±% giữa các pallet (nếu người dùng nhập). */
function runSpread(skus, container, zones, opts, onProgress, onImprove){
  const P = opts.pallet;
  const total = skus.reduce((t,k)=> t + (k.qty || 0), 0);
  const hLimit = Math.max(0, Math.min(container.H, (container.doorH || container.H) - (P.liftClearance || 0)));
  // pallet kiểm hóa dùng loại pallet KHÔNG bị hạ giới hạn (_uncappedTypes) — hàng kiểm hóa là bắt buộc
  const withCaps = (hCap, wCap)=> Object.assign({}, P, { _uncappedTypes: P.types, types: P.types.map(t=> Object.assign({}, t, {
    maxHeight: hCap ? Math.min(t.maxHeight || hLimit, hCap) : t.maxHeight,
    maxLoadKg: wCap ? Math.min(t.maxLoadKg > 0 ? t.maxLoadKg : Infinity, wCap) : t.maxLoadKg })) });
  const trial = (hCap, wCap)=> runPalletOptimizerCore(skus, container, zones, Object.assign({}, opts, { speedLevel: 'fast', pallet: withCaps(hCap, wCap) }), null, null);
  const fits = (o)=> countPalletOutputCartons(o) === total;
  const withNote = (note)=> onImprove ? (snap)=>{ (snap.notes = (snap.notes || []).slice()).unshift(note); onImprove(snap); } : null;
  if (onProgress) onProgress(0, 1, 'Dàn đều — chạy phương án không hạ giới hạn để so sánh...');
  const base = trial(null, null);
  if (base.errors) return base;
  const tolOn = P.spreadTol && (P.spreadTol.h > 0 || P.spreadTol.w > 0);
  if (tolOn){
    // Ràng buộc sai lệch không tăng/giảm đều theo giới hạn cao → thử 1 dãy giới hạn, giữ mức xếp được NHIỀU thùng nhất
    // (hòa thì chọn giới hạn thấp hơn = dàn đều hơn).
    const hMax = Math.max(...P.types.map(t=> Math.min(t.maxHeight || hLimit, hLimit)));
    const hMin = Math.min(...P.types.map(t=> t.H)) + 200;
    let bestCap = null, bestN = countPalletOutputCartons(base);
    const N = 12;
    for (let i=1; i<=N; i++){
      const cap = Math.round(hMax - (hMax - hMin) * i / N);
      if (onProgress) onProgress(i, N, `Dàn đều ±% — thử giới hạn cao ${cap} mm...`);
      const n = countPalletOutputCartons(trial(cap, null));
      if (n > bestN || (n === bestN && n === total)){ bestN = n; bestCap = cap; }
    }
    const note = bestCap ? `Dàn đều có ràng buộc sai lệch: chọn giới hạn chiều cao ${bestCap} mm/pallet (thử ${N} mức, mức này xếp được nhiều thùng nhất).`
                         : 'Dàn đều có ràng buộc sai lệch: giữ chiều cao tối đa (các mức thấp hơn không xếp được nhiều hơn).';
    const out = runPalletOptimizerCore(skus, container, zones, Object.assign({}, opts, { pallet: withCaps(bestCap, null) }), onProgress, withNote(note));
    if (!out.errors) (out.notes = out.notes || []).unshift(note);
    return out;
  }
  if (!fits(base)){
    const note = 'Dàn đều: KHÔNG hạ được giới hạn cao/tải — cont không còn dư chỗ (hoặc ràng buộc sai lệch làm rớt hàng). Vẫn san bằng chiều cao giữa các pallet đã vào cont.';
    const out = runPalletOptimizerCore(skus, container, zones, opts, onProgress, withNote(note));
    if (!out.errors) (out.notes = out.notes || []).unshift(note);
    return out;
  }
  const minPallet = Math.min(...P.types.map(t=> t.H));
  let lo = minPallet, hi = Math.max(...P.types.map(t=> Math.min(t.maxHeight || hLimit, hLimit))), step = 0;
  while (hi - lo > 10 && step++ < 14){
    const mid = Math.round((lo + hi) / 2);
    if (onProgress) onProgress(step, 14, `Dàn đều — thử giới hạn cao pallet ${mid} mm...`);
    const o = trial(mid, null);
    if (!o.errors && fits(o)) hi = mid; else lo = mid;
  }
  const hCap = hi;
  const wMaxCfg = Math.max(...P.types.map(t=> t.maxLoadKg > 0 ? t.maxLoadKg : 0));
  let wCap = null;
  if (wMaxCfg > 0){
    let wl = 0, wh = wMaxCfg; step = 0;
    while (wh - wl > 5 && step++ < 12){
      const mid = Math.round((wl + wh) / 2);
      if (onProgress) onProgress(step, 12, `Dàn đều — thử giới hạn tải pallet ${mid} kg...`);
      const o = trial(hCap, mid);
      if (!o.errors && fits(o)) wh = mid; else wl = mid;
    }
    if (wh < wMaxCfg) wCap = wh;
  }
  const note = `Dàn đều: giới hạn chiều cao mỗi pallet hạ còn ${hCap} mm (gồm pallet)${wCap ? ` và tải hàng ${wCap} kg` : ''} — mức thấp nhất mà cont vẫn chứa hết hàng.`;
  const out = runPalletOptimizerCore(skus, container, zones, Object.assign({}, opts, { pallet: withCaps(hCap, wCap) }), onProgress, withNote(note));
  if (!fits(out)){
    const safe = trial(hCap, wCap);
    (safe.notes = safe.notes || []).unshift(note + ' (kết quả từ lượt "Nhanh" đã xếp hết hàng).');
    return safe;
  }
  (out.notes = out.notes || []).unshift(note);
  out.spreadCaps = { hCap, wCap };
  return out;
}

/* ============================================================
   7. WEB WORKER — chạy thuật toán trong thread riêng để không treo UI.
   Ta build worker bằng Blob URL, nhúng source code của các hàm thuần
   túy (orientation generator, constraint checker, optimizer core) vào
   trong, vì Worker offline không thể import file ngoài.
   ============================================================ */

let currentWorker = null;
let currentStop = null; // hàm dừng sớm của lần chạy hiện tại (nút "Dừng & lấy phương án tốt nhất")

function buildWorkerSource(){
  const fns = [
    generateOrientations,
    checkOverlap, isWithinContainer, firstForbiddenHit, isInForbiddenZone,
    computeSupportRatio, clampNum, findDirectSupporters, _stackKey, checkStackingRules, propagateStackLoad,
    expandSkuToItems, getSortStrategies,
    findSmartFitCombo, findSmartFitForSku, applySmartFitToItems, fmtIntSafe,
    createSpatialIndex, _spKey, spatialInsert, spatialQuery,
    generateExtremePointsFromPlacement, tryPlaceAt, packContainer, packBlocksAlongAxis, packBlocksAlongLength, packBlocksAlongHeight, planBulkSlices, customsToTop,
    scoreSolution, mulberry32, perturbOrder, searchBestPacking, packageBulkOutput, runOptimizerCore,
    applyPalletTolerances, overhangCapForPallet, normalSet, homogeneousPattern, makeGuillotineDP, bestGuillotinePattern, bestPinwheelPattern, centerPattern, mirrorPattern,
    transposePattern, patternKey, layerOnLayer, findInterlockPair, _withTotal, buildLayerPlan, skuLayerGroups, planSkuPallet,
    interlockSuggestion, maxRectsPack, makeSlab, centerCartons, cartonFromSku, slabsFromPlan, makeMixPolicy, layerSpecOf,
    specItem, cartonFromPacked, buildSlabsFromLoose, groupSimilarSkus, slabFromAssignment, slabBBox, slabCornersOk, isCompleteSlab, stackStrapOk, pickLayerRects, layerSeqN,
    newStack, canPlaceSlab, pushSlab, canStackOnto, cloneStack, cartonsToItems,
    mergeTopSlabs, assembleSlabs,
    stackToUnit, palletUnitsToItems, placeAtDoor, packagePalletOutput, rebuildStack, isExposedCarton, looseItemFor, stackCapsOk, capFill3D,
    planCustomsFill, applyCustomsFill,
    runPalletOptimizerCore, countPalletOutputCartons, placedBySku, runPalletWithGoal, addDropDiagnostics, runSpread
  ].map(f=> f.toString()).join('\n\n');

  return `
const SLAB_FULL_COVERAGE = ${SLAB_FULL_COVERAGE};
let STRAP_TOL = 60, LAYER_H_TOL = 1, SUPPORT_EPS = 1.0;
let _looseUid = 0;
${fns}

self.onmessage = function(e){
  const { skus, container, forbiddenZones, opts } = e.data;
  try {
    const onProgress = (passIdx, totalPasses, stage) => self.postMessage({ type:'progress', passIdx, totalPasses, stage });
    const onImprove = (snapshot) => self.postMessage({ type:'improve', output: snapshot });
    const output = opts.loadMode === 'pallet'
      ? runPalletWithGoal(skus, container, forbiddenZones, opts, onProgress, onImprove)
      : runOptimizerCore(skus, container, forbiddenZones, opts, onProgress, onImprove);
    self.postMessage({ type:'done', output });
  } catch(err){
    self.postMessage({ type:'error', message: (err && err.message) ? err.message : String(err), stack: err && err.stack });
  }
};
`;
}

function runOptimizationInWorker(payload){
  return new Promise((resolve, reject)=>{
    if (currentWorker){ currentWorker.terminate(); currentWorker = null; }

    const src = buildWorkerSource();
    const blob = new Blob([src], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    const worker = new Worker(url);
    currentWorker = worker;
    let lastSnapshot = null; // phương án tốt nhất worker báo về gần nhất

    const finish = ()=>{
      URL.revokeObjectURL(url);
      worker.terminate();
      if (currentWorker === worker) currentWorker = null;
      currentStop = null;
    };
    currentStop = ()=>{
      if (!lastSnapshot){ showToast('Chưa có phương án nào — đợi pass đầu tiên chạy xong rồi dừng.', true); return; }
      finish();
      lastSnapshot.stoppedByUser = true;
      resolve(lastSnapshot);
    };

    worker.onmessage = (e)=>{
      const msg = e.data;
      if (msg.type === 'progress'){
        updateProgressUI(msg.passIdx, msg.totalPasses, msg.stage);
      } else if (msg.type === 'improve'){
        lastSnapshot = msg.output;
      } else if (msg.type === 'done'){
        finish();
        resolve(msg.output);
      } else if (msg.type === 'error'){
        finish();
        reject(new Error(msg.message));
      }
    };
    worker.onerror = (err)=>{
      finish();
      reject(err);
    };

    worker.postMessage(payload);
  });
}

function updateProgressUI(passIdx, totalPasses, stage){
  const pct = totalPasses>0 ? Math.round((passIdx/totalPasses)*100) : 0;
  const fill = document.getElementById('progress-fill');
  const stageEl = document.getElementById('progress-stage');
  if (fill) fill.style.width = pct + '%';
  if (stageEl) stageEl.textContent = stage;
}


/* ============================================================
   8. ĐIỀU PHỐI CHÍNH — validate input, gọi worker, xử lý kết quả
   ============================================================ */

function validateBeforeOptimize(){
  const warnings = [];
  const errors = [];
  const c = state.container;

  if (!c.L || !c.W || !c.H || c.L<=0 || c.W<=0 || c.H<=0){
    errors.push("Kích thước container không hợp lệ.");
  }
  if (!c.doorW || !c.doorH || c.doorH > c.H || c.doorW > c.W){
    errors.push("Kích thước cửa không hợp lệ (cửa phải > 0 và không lớn hơn lòng cont).");
  }
  const activeSkus = state.skus.filter(s=> s.qty > 0);
  if (activeSkus.length === 0){
    errors.push("Chưa có SKU nào với số lượng > 0.");
  }

  const pallet = state.loadMode === 'pallet';
  const lim = palletHeightLimit();
  if (pallet && lim <= 0) errors.push("Giới hạn chiều cao qua cửa ≤ 0 — kiểm tra cửa cao (H2) và khe nâng.");
  if (pallet){
    for (const t of state.pallet.types){
      if (!(t.L > 0 && t.W > 0 && t.H > 0)) errors.push(`Pallet "${t.name}": kích thước không hợp lệ.`);
      const effH = t.maxHeight ? Math.min(t.maxHeight, lim) : lim;
      if (effH - t.H <= 0) errors.push(`Pallet "${t.name}": chiều cao chất (${fmtInt(effH)} mm) không lớn hơn chiều cao pallet.`);
      if (t.maxHeight && t.maxHeight > lim) warnings.push(`Pallet "${t.name}": cao chất ${fmtInt(t.maxHeight)} mm vượt giới hạn qua cửa → dùng ${fmtInt(lim)} mm.`);
      if (Math.min(t.L, t.W) + 2*(t.overhang||0) > c.doorW) warnings.push(`Pallet "${t.name}": bề ngang (kể cả chìa mép) lớn hơn cửa rộng ${fmtInt(c.doorW)} mm.`);
    }
  }

  for (const s of activeSkus){
    if (!s.L || !s.W || !s.H || s.L<=0 || s.W<=0 || s.H<=0){
      errors.push(`SKU "${s.code||s.id}": kích thước kiện không hợp lệ.`);
      continue;
    }
    const orients = generateOrientations(s);
    if (pallet){
      const t = palletTypeById(s.palletTypeId) || defaultPalletType();
      const effH = (t.maxHeight ? Math.min(t.maxHeight, lim) : lim) - t.H;
      const X = t.L + 2*(t.overhang||0), Y = t.W + 2*(t.overhang||0);
      const fits = orients.some(o=> o.w <= effH && ((o.d <= X && o.h <= Y) || (o.d <= Y && o.h <= X)));
      if (!fits) errors.push(`SKU "${s.code||s.id}" (${s.L}×${s.W}×${s.H}mm) không đặt vừa pallet "${t.name}" ở mọi hướng xoay hợp lệ (cao chất còn ${fmtInt(effH)} mm).`);
    } else {
      const fitsAny = orients.some(o=> o.d<=c.L && o.w<=c.H && o.h<=c.W);
      if (!fitsAny){
        errors.push(`SKU "${s.code||s.id}" (${s.L}×${s.W}×${s.H}mm) lớn hơn container ở mọi hướng xoay hợp lệ — không thể xếp.`);
      }
    }
  }

  // Tổng khối lượng vượt payload → cảnh báo (có chặn cứng hay không tùy tùy chọn)
  let totalW = 0;
  for (const s of activeSkus) totalW += s.weight * s.qty;
  if (c.payload && totalW > c.payload){
    warnings.push(`Tổng khối lượng hàng yêu cầu (${fmtInt(totalW)} kg${pallet?', chưa gồm pallet':''}) vượt tải trọng container (${fmtInt(c.payload)} kg). ${state.enforcePayload ? 'Đang CHẶN CỨNG: phần vượt sẽ bị để lại.' : 'Không chặn cứng — phương án có thể vượt tải.'}`);
  }

  return { errors, warnings, activeSkus };
}

// Dữ liệu gửi worker (plain object). overrides: { qtyById, speedLevel } — dùng cho các lượt thử (ước tính chất thêm).
function buildOptimizerRequest(activeSkus, overrides){
  overrides = overrides || {};
  const skusPayload = activeSkus.map(s=> ({
    id: s.id, code: s.code, name: s.name,
    L: s.L, W: s.W, H: s.H, weight: s.weight,
    qty: overrides.qtyById && overrides.qtyById[s.id] != null ? overrides.qtyById[s.id] : s.qty,
    rotYaw: s.rotYaw, rotRoll: s.rotRoll, rotPitch: s.rotPitch, rotFree: s.rotFree, rotLocked: s.rotLocked,
    fragile: s.fragile, thisSideUp: s.thisSideUp,
    maxStackCount: s.maxStackCount, maxStackLoad: s.maxStackLoad,
    palletTypeId: s.palletTypeId || null, isSample: !!s.isSample,
    color: s.color, _mixGroup: state.mixGroups[s.id] || null
  }));
  const c = state.container;
  const containerPayload = { L: c.L, W: c.W, H: c.H, doorW: c.doorW, doorH: c.doorH, payload: c.payload };
  // Vùng cấm = vùng người dùng nhập + điểm mù cấu trúc tự sinh
  const zones = c.forbiddenZones.map(z=> Object.assign({ kind:'user' }, z)).concat(buildStructuralZones(containerPayload, c.struct));
  const opts = {
    loadMode: state.loadMode,
    speedLevel: overrides.speedLevel || state.speedLevel,
    maxTimeSec: state.maxTimeSec,
    heavyBottomPriority: state.heavyBottomPriority,
    supportThreshold: state.supportThreshold,
    enforcePayload: state.enforcePayload,
    loadingDirection: state.loadingDirection,
    smartFitEnabled: state.smartFitEnabled,
    mixMode: state.mixMode,
    partialMixType: state.partialMixType,
    partialMixN: state.partialMixN,
    partialMixBlocks: state.partialMixBlocks,
    partialMixK: state.partialMixK,
    bulkLayout: state.bulkLayout, bulkCustoms: state.bulkCustoms, zoneNoShift: state.zoneNoShift !== false,
    skuOrder: state.skuOrder,
    pallet: JSON.parse(JSON.stringify(state.pallet))
  };
  if (overrides.forceCompact) opts.pallet.loadGoal = 'compact';
  return { msg: { skus: skusPayload, container: containerPayload, forbiddenZones: zones, opts }, zones, containerPayload, opts };
}

// Đếm số thùng đã xếp trong output thô của worker (bulk hoặc pallet).
function outputPlacedCount(out){
  if (!out || (out.errors && out.errors.length)) return -1;
  if (out.mode === 'pallet'){
    const byId = {}; out.units.forEach(u=> byId[u.id] = u);
    return out.placements.reduce((t,p)=> t + (byId[p.unitId] ? Object.values(byId[p.unitId].skuCounts).reduce((a,b)=> a + b, 0) : 0), 0);
  }
  return out.placed.length;
}

/* Ước tính CÒN CHẤT THÊM ĐƯỢC BAO NHIÊU THÙNG cho từng SKU (mỗi lần chỉ tăng 1 SKU, các SKU khác giữ nguyên):
   tìm kiếm nhị phân số thùng thêm, mỗi lượt chạy thuật toán ở mức "Nhanh", luôn ở mục tiêu "gom chặt".
   Thuật toán heuristic → kết quả là ƯỚC TÍNH (thường hơi thấp hơn mức chạy kỹ đạt được). */
let estimateCancelled = false;
async function estimateExtraCapacity(){
  const r = state.result;
  if (!r){ showToast('Bấm "Tối ưu" trước rồi mới ước tính chất thêm.', true); return; }
  if (state.resultInputsHash !== hashInputs()){ showToast('Dữ liệu đã đổi sau lần tối ưu cuối — bấm "Tối ưu" lại trước.', true); return; }
  if (r.stats.totalPlaced < r.stats.totalRequested){
    state.extraEstimate = { at: Date.now(), full: true, rows: [] };
    renderExtraEstimate(); showToast('Lô hiện tại còn dư hàng chưa xếp hết → không còn chỗ chất thêm.', true); return;
  }
  const active = state.skus.filter(k=> k.qty > 0 && !k.isSample);
  const all = state.skus.filter(k=> k.qty > 0);
  const free = Math.max(0, r.stats.containerVolume - r.stats.usedVolume);
  const ov = document.getElementById('progress-overlay');
  ov.classList.add('active');
  document.getElementById('progress-label').textContent = 'Đang ước tính sức chứa còn lại...';
  document.getElementById('btn-stop-opt').style.display = 'none';
  estimateCancelled = false;
  const rows = [];
  let runs = 0;
  try {
    for (let i=0; i<active.length; i++){
      const k = active[i];
      const vol = k.L * k.W * k.H;
      let lo = 0, hi = Math.max(1, Math.floor(free / vol)) + 1;   // cận trên theo thể tích trống (không thể vượt)
      while (hi - lo > 1){
        const mid = Math.floor((lo + hi) / 2);
        const qtyById = {}; qtyById[k.id] = k.qty + mid;
        document.getElementById('progress-stage').textContent = `${k.code || k.id}: thử chất thêm ${mid} thùng (lượt ${++runs})...`;
        document.getElementById('progress-fill').style.width = Math.round((i + (1 - (hi - lo) / Math.max(2, Math.floor(free / vol) + 1))) / active.length * 100) + '%';
        const { msg } = buildOptimizerRequest(all, { qtyById, speedLevel: 'fast', forceCompact: true });
        const out = await runOptimizationInWorker(msg);
        const total = all.reduce((t,x)=> t + x.qty, 0) + mid;
        if (outputPlacedCount(out) === total) lo = mid; else hi = mid;
      }
      rows.push({ skuId: k.id, code: k.code || k.id, name: k.name, color: k.color, extra: lo, extraKg: lo * k.weight,
                  bound: Math.floor(free / vol) });
    }
  } catch(e){ showToast('Lỗi khi ước tính: ' + e.message, true); }
  ov.classList.remove('active');
  state.extraEstimate = { at: Date.now(), rows, runs, mode: r.mode };
  renderExtraEstimate();
}

/* ============================================================
   GỢI Ý XẾP ĐỦ — khi còn thùng rớt: thử nhanh (mức "Nhanh") các thay đổi TÙY CHỌN (không đổi kích thước thùng / số lượng),
   báo cách nào xếp được bao nhiêu, kèm nút "Áp dụng & tối ưu lại". Thử từng thay đổi riêng, rồi ghép 2 thay đổi tốt nhất.
   Thay đổi có thể khác thực tế (khe trần, bỏ điểm mù…) được ghi chú "cần kiểm tra thực tế".
   ============================================================ */
let fitSuggestions = null;
function trialMsg(mut){
  const active = state.skus.filter(k=> (k.qty || 0) > 0);
  const msg = JSON.parse(JSON.stringify(buildOptimizerRequest(active, { speedLevel: 'fast' }).msg));
  const struct = JSON.parse(JSON.stringify(state.container.struct));
  mut({ msg, opts: msg.opts, skus: msg.skus, struct });
  msg.forbiddenZones = state.container.forbiddenZones.map(z=> Object.assign({ kind: 'user' }, z)).concat(buildStructuralZones(msg.container, struct));
  return msg;
}
function fitCandidates(){
  const r = state.result, pal = r.mode === 'pallet', S = state.container.struct, out = [];
  const add = (key, label, mut, apply, note)=> out.push({ key, label, mut, apply, note });
  if (!pal){
    if (S.topClear > 0) [Math.round(S.topClear / 2), 10, 5, 0].filter((v, i, a)=> v < S.topClear && a.indexOf(v) === i).forEach(v=>
      add('top' + v, `Giảm "Khe trần thao tác" ${S.topClear} → ${v} mm`, (t)=> t.struct.topClear = v, ()=> S.topClear = v, 'Kiểm tra thực tế: còn đủ chỗ tay đẩy hàng trên cùng không.'));
    if (S.sideClear > 0) add('side0', `Bỏ "Khe mỗi vách hông" (${S.sideClear} → 0 mm)`, (t)=> t.struct.sideClear = 0, ()=> S.sideClear = 0, 'Chỉ khi vách cont không móp/phồng.');
    if (S.doorClear > 0) add('door0', `Bỏ "Khe sát cửa" (${S.doorClear} → 0 mm)`, (t)=> t.struct.doorClear = 0, ()=> S.doorClear = 0, 'Cần đủ chỗ đóng cửa / chèn túi khí.');
    const BL = state.bulkLayout || {};
    [['default', 'Mặc định'], ['even', 'Rải đều'], ['stair', 'Bậc thang (tự tính)']].forEach(([m, t])=>{ if (m !== BL.mode)
      add('lay' + m, `Kiểu rải lớp: ${t}`, (x)=> x.opts.bulkLayout = Object.assign({}, BL, { mode: m, keep: null }), ()=>{ state.bulkLayout.mode = m; state.bulkLayout.keep = null; }); });
    [['none', 'No mix'], ['full', 'Trộn tự do']].forEach(([m, t])=>{ if (m !== state.mixMode)
      add('mix' + m, `Logic trộn: ${t}`, (x)=> x.opts.mixMode = m, ()=> state.mixMode = m); });
    const dir2 = state.loadingDirection === 'right_to_left' ? 'floor_to_top' : 'right_to_left';
    add('dir', `Hướng chất: ${dir2 === 'right_to_left' ? 'Right to left' : 'Floor to top'}`, (x)=> x.opts.loadingDirection = dir2, ()=> state.loadingDirection = dir2);
    if (state.zoneNoShift !== false) add('shift', 'Tắt "Gặp điểm mù: bỏ trống ô" (cho xếp lệch quanh gờ)', (x)=> x.opts.zoneNoShift = false, ()=> state.zoneNoShift = false, 'Mặt hàng quanh gờ sẽ không thẳng hàng.');
  } else {
    const P = state.pallet;
    if (P.strapMode) add('strap', 'Tắt "Pallet vuông vức"', (x)=> x.opts.pallet.strapMode = false, ()=> P.strapMode = false, 'Một số pallet có lớp đỉnh lẻ.');
    if (P.allowLayDown === false) add('lay', 'Bật "Đổi hướng thùng ở lớp trên"', (x)=> x.opts.pallet.allowLayDown = true, ()=> P.allowLayDown = true);
    if (P.groupSimilar === false) add('grp', 'Bật "Gom SKU cùng kích thước"', (x)=> x.opts.pallet.groupSimilar = true, ()=> P.groupSimilar = true);
    if (P.loadGoal === 'spread') add('goal', 'Mục tiêu xếp: Gom chặt', (x)=> x.opts.pallet.loadGoal = 'compact', ()=> P.loadGoal = 'compact');
    if (P.mixMode !== 'full') add('pmix', 'Trộn SKU trên pallet: tự do', (x)=> x.opts.pallet.mixMode = 'full', ()=> P.mixMode = 'full');
    if (P.customs && P.customs.enabled && P.customs.mode !== 'fill') add('cfill', 'Pallet kiểm hóa: chèn vào pallet thường', (x)=> x.opts.pallet.customs.mode = 'fill', ()=> P.customs.mode = 'fill');
    if ((P.liftClearance || 0) > 30) add('lift', `Khe nâng qua cửa ${P.liftClearance} → 30 mm`, (x)=> x.opts.pallet.liftClearance = 30, ()=> P.liftClearance = 30, 'Kiểm tra thực tế với xe nâng.');
  }
  // xoay thùng: chỉ đề xuất với SKU KHÔNG đánh dấu "this side up" / khóa xoay
  const canFree = state.skus.filter(k=> k.qty > 0 && !k.thisSideUp && !k.rotLocked && !k.rotFree);
  if (canFree.length) add('rot', `Cho xoay tự do: ${canFree.map(k=> k.code || k.id).join(', ')}`,
    (x)=> x.skus.forEach(k=>{ if (canFree.some(c=> c.id === k.id)) k.rotFree = true; }), ()=> canFree.forEach(k=> k.rotFree = true), 'Chỉ khi hàng chịu được nằm/nghiêng.');
  return out;
}
async function findFitSuggestions(){
  const r = state.result;
  if (!r){ showToast('Bấm "Tối ưu" trước.', true); return; }
  if (state.resultInputsHash !== hashInputs()){ showToast('Dữ liệu đã đổi sau lần tối ưu cuối — bấm "Tối ưu" lại trước.', true); return; }
  const total = r.stats.totalRequested, cur = r.stats.totalPlaced;
  const ov = document.getElementById('progress-overlay');
  ov.classList.add('active');
  document.getElementById('progress-label').textContent = 'Đang thử các cách chỉnh tùy chọn...';
  document.getElementById('btn-stop-opt').style.display = 'none';
  const cands = fitCandidates(), rows = [];
  const runOne = async (label, muts)=>{
    document.getElementById('progress-stage').textContent = label;
    const out = await runOptimizationInWorker(trialMsg((t)=> muts.forEach(m=> m(t))));
    return outputPlacedCount(out);
  };
  try {
    // mốc so sánh: cài đặt hiện tại ở mức "Nhanh"
    const base = await runOne('Cài đặt hiện tại (mức Nhanh)', []);
    for (let i = 0; i < cands.length; i++){
      document.getElementById('progress-fill').style.width = Math.round(i / (cands.length + 3) * 100) + '%';
      const n = await runOne(cands[i].label, [cands[i].mut]);
      if (n >= 0) rows.push({ c: [cands[i]], n });
    }
    // ghép 2 thay đổi tốt nhất (khác nhóm) nếu chưa có cách nào xếp đủ
    if (!rows.some(x=> x.n >= total)){
      const top = rows.filter(x=> x.n > base).sort((a,b)=> b.n - a.n).slice(0, 3);
      for (let i = 0; i < top.length; i++) for (let j = i + 1; j < top.length; j++){
        const a = top[i].c[0], b = top[j].c[0];
        if (a.key.replace(/\d+$/, '') === b.key.replace(/\d+$/, '')) continue;
        const n = await runOne(a.label + ' + ' + b.label, [a.mut, b.mut]);
        if (n >= 0) rows.push({ c: [a, b], n });
      }
    }
    fitSuggestions = { at: Date.now(), total, cur, base, rows: rows.filter(x=> x.n > Math.max(cur, base)).sort((a,b)=> (b.n - a.n) || (a.c.length - b.c.length)).slice(0, 8) };
  } catch(e){ showToast('Lỗi khi thử gợi ý: ' + e.message, true); }
  ov.classList.remove('active');
  renderFitSuggestions();
}
function applyFitSuggestion(i){
  const s = fitSuggestions && fitSuggestions.rows[i]; if (!s) return;
  s.c.forEach(c=> c.apply());
  buildLeftColumn(); updateModeVisibility();
  showToast('Đã áp dụng: ' + s.c.map(c=> c.label).join(' + ') + ' — đang tối ưu lại...');
  fitSuggestions = null;
  runOptimization();
}
function renderFitSuggestions(){
  const sec = document.getElementById('rr-fit-sec'), box = document.getElementById('rr-fit');
  if (!sec || !box) return;
  const r = state.result;
  const short = r && r.stats.totalPlaced < r.stats.totalRequested;
  sec.style.display = short ? '' : 'none';
  if (!short) return;
  const F = fitSuggestions;
  if (!F){ box.innerHTML = `<div class="hint">Còn ${fmtInt(r.stats.totalRequested - r.stats.totalPlaced)} thùng chưa xếp. Bấm để tool thử nhanh các cách chỉnh tùy chọn (không đổi kích thước/số lượng thùng) và đề xuất cách xếp đủ.</div>`; return; }
  if (!F.rows.length){ box.innerHTML = `<div class="alert warn"><span class="ic">⚠</span><span>Không thay đổi tùy chọn nào xếp thêm được (thử ${fitCandidates().length} cách). Lô đang vượt sức chứa thực tế của cont với kích thước đã nhập — cần cont lớn hơn, bớt hàng, hoặc đo lại cont/thùng.</span></div>`; return; }
  box.innerHTML = F.rows.map((x, i)=> `<div class="fit-row ${x.n >= F.total ? 'ok' : ''}">
      <div><b>${fmtInt(x.n)}/${fmtInt(F.total)}</b> ${x.n >= F.total ? '✓ đủ' : `(+${fmtInt(x.n - Math.max(F.cur, F.base))})`}</div>
      <div style="flex:1">${x.c.map(c=> escapeHtml(c.label)).join(' <b>+</b> ')}${x.c.some(c=> c.note) ? `<div class="hint">${x.c.filter(c=> c.note).map(c=> escapeHtml(c.note)).join(' ')}</div>` : ''}</div>
      <button class="btn small" data-fit="${i}">Áp dụng & tối ưu lại</button></div>`).join('') +
    `<div class="hint" style="margin-top:4px;">Số liệu từ lượt thử mức "Nhanh"; chạy lại ở mức của anh có thể nhỉnh hơn. Hiện tại: ${fmtInt(F.cur)} (mức Nhanh: ${fmtInt(F.base)}).</div>`;
  box.querySelectorAll('[data-fit]').forEach(b=> b.onclick = ()=> applyFitSuggestion(parseInt(b.dataset.fit, 10)));
}

async function runOptimization(){
  const { errors, warnings, activeSkus } = validateBeforeOptimize();

  if (errors.length > 0){
    showRightPanelErrors(errors);
    showToast(errors[0], true);
    return;
  }

  document.getElementById('progress-overlay').classList.add('active');
  document.getElementById('progress-fill').style.width = '2%';
  document.getElementById('progress-stage').textContent = 'Khởi tạo...';
  document.getElementById('progress-label').textContent = state.speedLevel === 'max'
    ? `Đang tối ưu (Rất kỹ — tối đa ${fmtInt(state.maxTimeSec)} giây)...` : 'Đang tối ưu...';
  document.getElementById('btn-stop-opt').style.display = '';

  const { msg, zones, containerPayload, opts } = buildOptimizerRequest(activeSkus, {});
  const c = state.container;

  const t0 = performance.now();
  const inputsHash = hashInputs();
  let output;
  try{
    output = await runOptimizationInWorker(msg);
  } catch(err){
    document.getElementById('progress-overlay').classList.remove('active');
    showToast('Lỗi khi chạy thuật toán: ' + err.message, true);
    console.error(err);
    return;
  }
  const elapsedMs = performance.now() - t0;
  document.getElementById('btn-stop-opt').style.display = 'none';

  if (output.errors && output.errors.length){
    document.getElementById('progress-overlay').classList.remove('active');
    showRightPanelErrors(output.errors);
    showToast(output.errors[0], true);
    return;
  }

  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('progress-stage').textContent = 'Hoàn tất — đang dựng sơ đồ 3D...';
  applyOptimizerOutput(output, activeSkus, warnings, elapsedMs, { zones, containerPayload, opts }, inputsHash);
}

// Dựng kết quả hiển thị từ output thuật toán (dùng chung cho "Tối ưu" và "Vẽ tay từ đầu")
function applyOptimizerOutput(output, activeSkus, warnings, elapsedMs, req, inputsHash, after){
  const { zones, containerPayload, opts } = req;
  const c = state.container;
  const settings = {
    loadMode: state.loadMode, loadingDirection: state.loadMode === 'pallet' ? 'right_to_left' : opts.loadingDirection,
    mixMode: opts.mixMode, partialMixType: opts.partialMixType, partialMixN: opts.partialMixN,
    partialMixBlocks: opts.partialMixBlocks, partialMixK: opts.partialMixK,
    speedLevel: opts.speedLevel, supportThreshold: opts.supportThreshold, enforcePayload: opts.enforcePayload,
    heavyBottomPriority: opts.heavyBottomPriority, floorLoad: c.floorLoad, pallet: opts.pallet,
    zoneCount: zones.length, structEnabled: !!(c.struct && c.struct.enabled)
  };
  let processed = output.mode === 'pallet'
    ? processPalletOutput(output, activeSkus, containerPayload, warnings, elapsedMs, settings)
    : processOptimizerOutput(output, activeSkus, containerPayload, warnings, elapsedMs, settings);
  processed.zones = zones;
  processed.showZones = !!(c.struct && c.struct.show3D);
  processed.raw = output;                                   // dữ liệu gốc để chỉnh tay & xử lý lại
  processed.ctxSkus = JSON.parse(JSON.stringify(activeSkus));
  state.result = processed;
  Object.assign(edit, { sel: null, undo: [], tray: [], warn: [] });
  if (processed.mode === 'pallet' && state.pallet.spreadToBlock && !(processed.errors && processed.errors.length)){
    const res = arrangePallets(null, { align: true, spread: true, maxGap: state.pallet.spreadGap || 30 }, true);
    if (res.layersChanged){
      processed = reprocessQuiet(0);
      processed.warnings.push(`Dàn thùng ra mép khối: ${res.layersChanged} lớp trên ${res.units} pallet được nới đều khe (≤ ${state.pallet.spreadGap || 30} mm/khe) & căn thẳng hàng.`);
    }
  }
  state.resultInputsHash = inputsHash;
  state.extraEstimate = null;
  fitSuggestions = null;
  renderOrderStatus();

  setTimeout(()=>{
    document.getElementById('progress-overlay').classList.remove('active');
    render3DResult(processed);
    buildRightColumn();
    renderRightResults(processed);
    if (after) after();
  }, 150);
}

/* ---------- Thống kê chung: trọng tâm & quy tắc 60/50 ---------- */
// boxes: mọi khối có khối lượng (thùng, pallet rỗng). frontHalfPct = % khối lượng ở NỬA PHÍA VÁCH KÍN
// (chia theo tỉ lệ phần chiều dài nằm ở mỗi nửa).
function computeCogStats(boxes, container){
  let W = 0, sx = 0, sy = 0, sz = 0, front = 0;
  const half = container.L / 2;
  for (const p of boxes){
    const w = p.weight || 0;
    W += w; sx += (p.x + p.sizeX/2) * w; sy += (p.y + p.sizeY/2) * w; sz += (p.z + p.sizeZ/2) * w;
    front += w * (p.sizeX > 0 ? clamp((half - p.x) / p.sizeX, 0, 1) : (p.x < half ? 1 : 0));
  }
  const cogX = W ? sx/W : container.L/2, cogY = W ? sy/W : 0, cogZ = W ? sz/W : container.W/2;
  return {
    totalWeight: W, cogX, cogY, cogZ,
    cogXOffsetMm: cogX - container.L/2, cogZOffsetMm: cogZ - container.W/2,
    cogXOffsetPct: Math.abs(cogX - container.L/2) / container.L * 100,   // % CHIỀU DÀI (theo CTU Code)
    cogZOffsetPct: Math.abs(cogZ - container.W/2) / container.W * 100,   // % CHIỀU RỘNG
    frontHalfPct: W ? front / W * 100 : 50
  };
}

function cogWarnings(st){
  const w = [];
  if (st.cogXOffsetPct > state.cogWarnLong){
    w.push(`Trọng tâm lệch dọc ${fmt(st.cogXOffsetPct,1)}% chiều dài (${fmtInt(Math.abs(st.cogXOffsetMm))} mm về phía ${st.cogXOffsetMm < 0 ? 'vách kín' : 'cửa'}) — ngưỡng ${state.cogWarnLong}%. CTU Code: thường không quá ±5%.`);
  }
  if (st.cogZOffsetPct > state.cogWarnLat){
    w.push(`Trọng tâm lệch ngang ${fmt(st.cogZOffsetPct,1)}% chiều rộng (${fmtInt(Math.abs(st.cogZOffsetMm))} mm về bên ${st.cogZOffsetMm < 0 ? 'phải' : 'trái'}) — ngưỡng ${state.cogWarnLat}%.`);
  }
  const maxHalf = Math.max(st.frontHalfPct, 100 - st.frontHalfPct);
  if (st.totalWeight > 0 && maxHalf > 60){
    w.push(`Quy tắc 60/50: ${fmt(maxHalf,0)}% khối lượng nằm ở nửa phía ${st.frontHalfPct >= 50 ? 'vách kín' : 'cửa'} (khuyến nghị ≤ 60%). Cân nhắc dàn hàng nặng về giữa cont.`);
  }
  return w;
}

/* ---------- Hậu kiểm (BULK): các ràng buộc KHÔNG chặn cứng trong thuật toán ---------- */
function postCheckBulk(placed, layers, settings, container){
  const out = [];
  const skuSet = (arr)=> new Set(arr.map(p=> p.skuId));
  if (settings.mixMode === 'partial'){
    if (settings.partialMixType === 'layer'){
      const byY = new Map();
      placed.forEach(p=>{ const k = Math.round(p.y/5)*5; if (!byY.has(k)) byY.set(k, []); byY.get(k).push(p); });
      const bad = Array.from(byY.entries()).filter(([,arr])=> skuSet(arr).size > settings.partialMixN);
      out.push({ ok: !bad.length, text: bad.length
        ? `Partial mix (i): ${bad.length} lớp ngang có > N=${settings.partialMixN} SKU (vd: lớp cao ${fmtInt(bad[0][0])} mm có ${skuSet(bad[0][1]).size} SKU).`
        : `Partial mix (i): mọi lớp ngang ≤ ${settings.partialMixN} SKU.` });
    } else if (settings.partialMixType === 'count'){
      const bad = layers.filter(l=> skuSet(l.items).size > settings.partialMixK);
      out.push({ ok: !bad.length, text: bad.length
        ? `Partial mix (iii): ${bad.length} lớp chất (theo hướng chất) có > K=${settings.partialMixK} SKU cùng lúc (vd: lớp ${bad[0].index} có ${skuSet(bad[0].items).size} SKU).`
        : `Partial mix (iii): mọi lớp chất ≤ ${settings.partialMixK} SKU cùng lúc.` });
    } else if (settings.partialMixType === 'block'){
      const B = Math.max(1, settings.partialMixBlocks || 1), len = container.L / B;
      const blocksOf = new Map();
      placed.forEach(p=>{ const b = Math.min(B-1, Math.floor((p.x + p.sizeX/2) / len)); if (!blocksOf.has(p.skuId)) blocksOf.set(p.skuId, new Set()); blocksOf.get(p.skuId).add(b); });
      const bad = Array.from(blocksOf.entries()).filter(([,set])=> set.size > 1);
      out.push({ ok: !bad.length, text: bad.length
        ? `Partial mix (ii): ${bad.length} SKU trải qua nhiều hơn 1 block dọc (chia ${B} block).`
        : `Partial mix (ii): mỗi SKU nằm gọn trong 1 block dọc (${B} block).` });
    }
  }
  // Mix group: đếm cặp thùng khác nhóm chạm mặt nhau
  const groupOf = (p)=> state.mixGroups[p.skuId] || '';
  if (placed.some(p=> groupOf(p))){
    const arr = placed.slice().sort((a,b)=> a.x - b.x);
    let contacts = 0;
    for (let i=0; i<arr.length; i++){
      const a = arr[i];
      for (let j=i+1; j<arr.length && arr[j].x <= a.x + a.sizeX + 1; j++){
        const b = arr[j];
        if (groupOf(a) === groupOf(b)) continue;
        const ox = Math.min(a.x+a.sizeX, b.x+b.sizeX) - Math.max(a.x, b.x);
        const oy = Math.min(a.y+a.sizeY, b.y+b.sizeY) - Math.max(a.y, b.y);
        const oz = Math.min(a.z+a.sizeZ, b.z+b.sizeZ) - Math.max(a.z, b.z);
        const touch = [ox, oy, oz].filter(v=> Math.abs(v) <= 1).length === 1 && [ox, oy, oz].filter(v=> v > 1).length === 2;
        if (touch) contacts++;
      }
    }
    out.push({ ok: contacts === 0, text: contacts ? `Mix group: ${contacts} cặp thùng khác nhóm chạm mặt nhau (không chặn cứng).` : 'Mix group: không có thùng khác nhóm chạm nhau.' });
  }
  // Tải sàn: cột hàng trên mỗi thùng đáy / diện tích đáy (bảo thủ — không chia tải)
  if (settings.floorLoad){
    let worst = 0;
    placed.forEach(p=>{ if (p.y < 0.5){ const kgm2 = (p.weight + (p._loadOnTop||0)) / (p.sizeX * p.sizeZ / 1e6); worst = Math.max(worst, kgm2); } });
    out.push({ ok: worst <= settings.floorLoad, text: `Tải sàn lớn nhất ~${fmtInt(worst)} kg/m² (giới hạn ${fmtInt(settings.floorLoad)} kg/m²; ước tính bảo thủ).` });
  }
  return out;
}

/* Xử lý output thô từ optimizer (BULK) thành cấu trúc đầy đủ cho UI:
   layers, breakdown theo SKU, CoG, cảnh báo, báo cáo ràng buộc trung thực. */
function processOptimizerOutput(output, activeSkus, container, preWarnings, elapsedMs, settings){
  const { placed, unplaced, passesRun, totalRequested, best, stoppedByBudget, budgetMs } = output;
  const smartFitNotes = (output.smartFitNotes || []).concat(output.layoutNotes || []);
  const skuById = {};
  activeSkus.forEach(s=> skuById[s.id]=s);

  placed.forEach(p=>{
    const sku = skuById[p.skuId];
    p.skuCode = sku ? (sku.code||sku.id) : p.skuId;
    p.skuName = sku ? sku.name : '';
    p.color = sku ? sku.color : '#888';
  });

  // "Lớp" phụ thuộc hướng chất: right_to_left → lớp cắt ngang theo x; floor_to_top → lớp nằm ngang theo y
  const wallMode = !!(settings && settings.loadingDirection === 'right_to_left');
  const layerMap = new Map();
  placed.forEach(p=>{
    const key = Math.round((wallMode ? p.x : p.y)/5)*5;
    if (!layerMap.has(key)) layerMap.set(key, []);
    layerMap.get(key).push(p);
  });
  const layerKeys = Array.from(layerMap.keys()).sort((a,b)=>a-b);
  const layers = layerKeys.map((k, idx)=>({
    index: idx+1, base: k, axis: wallMode ? 'x' : 'y',
    items: layerMap.get(k).sort(wallMode ? ((a,b)=> a.y-b.y || a.z-b.z) : ((a,b)=> a.x-b.x || a.z-b.z))
  }));
  layers.forEach((layer, idx)=> layer.items.forEach(p=> p._layerIndex = idx));

  const breakdown = activeSkus.map(s=>{
    const mine = placed.filter(p=>p.skuId===s.id);
    return {
      skuId: s.id, code: s.code||s.id, name: s.name, color: s.color,
      requested: s.qty, placed: mine.length, remaining: s.qty - mine.length,
      orientationsUsed: Array.from(new Set(mine.map(p=>p.orientCode)))
    };
  });

  const totalPlaced = placed.length;
  const containerVolume = container.L*container.W*container.H;
  const usedVolume = placed.reduce((sum,p)=> sum + p.sizeX*p.sizeY*p.sizeZ, 0);
  const volumePct = containerVolume>0 ? (usedVolume/containerVolume*100) : 0;
  const cog = computeCogStats(placed, container);
  const totalWeight = cog.totalWeight;
  const weightPct = container.payload ? (totalWeight/container.payload*100) : 0;

  const warnings = [...preWarnings];
  warnings.push(...cogWarnings(cog));
  if (unplaced.length > 0){
    const bySku = {};
    unplaced.forEach(u=>{ bySku[u.skuId] = (bySku[u.skuId]||0)+1; });
    const detail = Object.entries(bySku).map(([id,c])=>{ const s = skuById[id]; return `${s?(s.code||id):id}: dư ${c} kiện`; }).join('; ');
    warnings.push(`Không xếp hết được toàn bộ hàng — ${unplaced.length} kiện còn dư (${detail})${output.payloadRejected ? `; trong đó ${output.payloadRejected} kiện bị chặn do tải trọng` : ''}.`);
  }
  if (output.stoppedByUser) warnings.push(`Đã dừng theo yêu cầu — hiển thị phương án tốt nhất tại thời điểm dừng.`);
  else if (stoppedByBudget){
    warnings.push(`Đã dừng sau ${passesRun} pass do hết ngân sách thời gian (${Math.round(budgetMs/1000)}s) — chọn "Rất kỹ" và tăng thời gian nếu muốn tìm thêm.`);
  }
  if (container.payload && totalWeight > container.payload){
    warnings.push(`Phương án có tổng khối lượng ${fmtInt(totalWeight)} kg vượt tải trọng cho phép ${fmtInt(container.payload)} kg.`);
  }

  const post = postCheckBulk(placed, layers, settings, container);
  const hasFragile = activeSkus.some(s=> s.fragile), hasStack = activeSkus.some(s=> s.maxStackCount!=null || s.maxStackLoad!=null);
  const checks = {
    enforced: [
      `Nằm trong lòng cont, né ${settings.zoneCount} vùng cấm/điểm mù${settings.structEnabled ? '' : ' (điểm mù cấu trúc đang TẮT)'}`,
      'Không chồng lấn; hướng xoay / "this side up" theo từng SKU',
      `Diện tích đỡ ≥ ${settings.supportThreshold}%`,
      ...(hasFragile ? ['Fragile: không xếp gì lên trên'] : []),
      ...(hasStack ? ['Max số lớp đè / max tải đè (cộng dồn toàn cột, bảo thủ)'] : []),
      ...(settings.enforcePayload ? ['Tải trọng hàng ≤ payload container'] : []),
      ...(settings.mixMode === 'none' ? ['No mix: mỗi SKU một khối liền'] : [])
    ],
    soft: settings.heavyBottomPriority ? [{ ok: !output.heavyRelaxed, text: output.heavyRelaxed
      ? `Nặng dưới nhẹ trên: đã phải nới ${output.heavyRelaxed} lần (không còn chỗ hợp quy tắc).` : 'Nặng dưới nhẹ trên: không phải nới lần nào.' }] : [],
    post
  };
  post.filter(c=> !c.ok).forEach(c=> warnings.push(c.text));

  return {
    mode: 'bulk',
    placed, unplaced, layers, breakdown, checks,
    stats: {
      totalPlaced, totalRequested, volumePct, weightPct, totalWeight, usedVolume, containerVolume,
      cogX: cog.cogX, cogY: cog.cogY, cogZ: cog.cogZ, cogXOffsetPct: cog.cogXOffsetPct, cogZOffsetPct: cog.cogZOffsetPct,
      cogXOffsetMm: cog.cogXOffsetMm, cogZOffsetMm: cog.cogZOffsetMm, frontHalfPct: cog.frontHalfPct,
      passesRun, elapsedMs, strategyUsed: best ? best.strategyName : '—', seed: output.seed
    },
    warnings,
    smartFitNotes: smartFitNotes || [],
    settings: settings || { loadingDirection:'floor_to_top', mixMode:'full' },
    container
  };
}

/* Xử lý output mode PALLET: đổi tọa độ thùng từ hệ pallet sang hệ cont, đánh số pallet theo thứ tự chất. */
function processPalletOutput(output, activeSkus, container, preWarnings, elapsedMs, settings){
  const skuById = {}; activeSkus.forEach(s=> skuById[s.id] = s);
  const unitById = {}; output.units.forEach(u=> unitById[u.id] = u);
  const P = settings.pallet;
  const kindLabel = { full:'Nguyên', partial:'Lẻ 1 SKU', mixed:'Mix', customs:'KIỂM HÓA' };

  // Thứ tự chất: từ vách kín ra cửa (x tăng), rồi z, rồi tầng dưới trước tầng trên
  const plc = output.placements.slice().sort((a,b)=> (a.x-b.x) || (a.z-b.z) || (a.y-b.y));
  const placed = [], pallets = [];
  let rowStart = -Infinity, rowIdx = -1;
  plc.forEach((p, i)=>{
    if (p.x - rowStart > 50){ rowIdx++; rowStart = p.x; }
    const u = unitById[p.unitId], no = i + 1;
    const rot = p.orientCode === 'P90';
    const tf = (lx, lz, sx, sz)=> rot
      ? { x: p.x + lz, z: p.z + (u.FL - lx - sx), sizeX: sz, sizeZ: sx }
      : { x: p.x + lx, z: p.z + lz, sizeX: sx, sizeZ: sz };
    placed.push(Object.assign(tf(u.deckX, u.deckZ, u.palletL, u.palletW), {
      y: p.y, sizeY: u.palletH, isPalletBase: true, skuId: '__pallet', skuCode: 'Pallet #' + no, color: '#7a5a38',
      weight: u.palletTare, instanceId: u.id + '_base', unitId: u.id, orientCode: p.orientCode, palletNo: no, _layerIndex: rowIdx
    }));
    u.cartons.forEach((c, k)=>{
      const sku = skuById[c.skuId];
      placed.push(Object.assign(tf(c.lx, c.lz, c.sx, c.sz), {
        y: p.y + u.palletH + c.ly, sizeY: c.sy, skuId: c.skuId,
        skuCode: sku ? (sku.code || sku.id) : c.skuId, skuName: sku ? sku.name : '', color: sku ? sku.color : '#888',
        weight: c.weight, fragile: c.fragile, orientCode: c.orientCode, instanceId: c.cid || (u.id + '_' + k), unitId: u.id, palletNo: no, _layerIndex: rowIdx
      }));
    });
    const below = p.y > 1 ? pallets.find(q=> Math.abs(q.placement.x - p.x) < 2 && Math.abs(q.placement.z - p.z) < 2 && q.placement.y < p.y) : null;
    // loại hiển thị theo NỘI DUNG THỰC (sau chỉnh tay pallet "nguyên" có thể đã thành mix)
    const nSku = Object.keys(u.skuCounts || {}).length;
    const kindNow = u.kind === 'customs' ? 'customs' : nSku > 1 ? 'mixed' : (u.kind === 'mixed' ? 'full' : u.kind);
    pallets.push({ no, unit: u, placement: p, row: rowIdx + 1, kind: kindNow, kindLabel: kindLabel[kindNow] || kindNow, stackedOn: below ? below.no : null });
  });

  const cartons = placed.filter(p=> !p.isPalletBase);
  const layers = [];
  pallets.forEach(pl=>{
    if (!layers[pl.row-1]) layers[pl.row-1] = { index: pl.row, base: pl.placement.x, axis:'x', items: [] };
    const comp = Object.entries(pl.unit.skuCounts).map(([id,n])=> `${skuById[id] ? (skuById[id].code||id) : id}×${n}`).join(', ');
    layers[pl.row-1].items.push({ skuCode: `#${pl.no} ${pl.kindLabel} [${comp}]`, x: pl.placement.x, y: pl.placement.y, z: pl.placement.z,
      orientCode: pl.placement.orientCode, sizeX: pl.placement.sizeX, sizeY: pl.placement.sizeY, sizeZ: pl.placement.sizeZ });
  });

  // Thùng chưa xếp: thùng trên pallet không vào được cont + thùng không lên được pallet nào
  const unplacedCount = {};
  (output.unplacedUnitIds || []).forEach(id=>{ const u = unitById[id]; if (u) for (const [sk,n] of Object.entries(u.skuCounts)) unplacedCount[sk] = (unplacedCount[sk]||0) + n; });
  (output.leftover || []).forEach(it=> unplacedCount[it.skuId] = (unplacedCount[it.skuId]||0) + 1);

  const breakdown = activeSkus.map(s=>{
    const mine = cartons.filter(p=> p.skuId === s.id);
    return { skuId: s.id, code: s.code||s.id, name: s.name, color: s.color, requested: s.qty, placed: mine.length,
             remaining: s.qty - mine.length, orientationsUsed: Array.from(new Set(mine.map(p=> p.orientCode))) };
  });

  const containerVolume = container.L * container.W * container.H;
  const usedVolume = cartons.reduce((s,p)=> s + p.sizeX*p.sizeY*p.sizeZ, 0);
  const cog = computeCogStats(placed, container);
  const floorArea = pallets.filter(pl=> pl.placement.y < 1).reduce((s,pl)=> s + pl.placement.sizeX * pl.placement.sizeZ, 0);

  const warnings = [...preWarnings];
  (output.notes || []).forEach(n=> warnings.push(n));
  warnings.push(...cogWarnings(cog));
  const nUnplacedUnits = (output.unplacedUnitIds || []).length;
  if (nUnplacedUnits) warnings.push(`${nUnplacedUnits} pallet không xếp vào được cont${output.payloadRejected ? ` (${output.payloadRejected} do tải trọng)` : ''}: ` +
    Object.entries(output.unplacedUnitIds.reduce((acc,id)=>{ const u = unitById[id]; const k = `${kindLabel[u.kind]||u.kind} ${fmtInt(u.height)}mm/${fmtInt(u.grossWeight)}kg`; acc[k] = (acc[k]||0) + 1; return acc; }, {})).map(([k,n])=> `${k} × ${n}`).join('; '));
  const lo = output.leftover || [], nOver = lo.filter(x=> x.overflow && !x.tol).length, nBad = lo.filter(x=> !x.overflow).length;
  if (nOver){
    const bySku = {}; lo.filter(x=> x.overflow && !x.tol).forEach(x=> bySku[x.skuId] = (bySku[x.skuId]||0) + 1);
    warnings.push(`${nOver} thùng không còn chỗ trong cont (đã thử chất bổ sung lên các pallet trong cont): ` + Object.entries(bySku).map(([id,n])=> `${skuById[id] ? (skuById[id].code||id) : id} × ${n}`).join(', ') + '.');
  }
  if (nBad) warnings.push(`${nBad} thùng không lên được pallet nào (vượt khổ/tải pallet).`);
  // Lưới an toàn: kiểm tra lại độ đỡ từng thùng trên kết quả cuối — không bao giờ hiển thị thùng lơ lửng mà không báo
  {
    const thrS = settings.supportThreshold || 70, bad = [];
    const byPallet = {}; placed.forEach(q=> (byPallet[q.palletNo] = byPallet[q.palletNo] || []).push(q));
    Object.values(byPallet).forEach(list=> list.forEach(q=>{
      if (q.isPalletBase) return;
      const base = list.find(b=> b.isPalletBase);
      if (base && Math.abs(q.y - (base.y + base.sizeY)) < 1) return;
      const epsS = Math.max(1, (P.layerHTol || 0)) + 0.01;
      if (computeSupportRatio(q, findDirectSupporters(q, list, epsS), epsS) < thrS - 0.01) bad.push(q.palletNo);
    }));
    if (bad.length) warnings.unshift(`LỖI KIỂM TRA: ${bad.length} thùng được đỡ < ${thrS}% (pallet ${Array.from(new Set(bad)).map(n=> '#'+n).join(', ')}). Vui lòng báo lại để sửa thuật toán; không dùng phương án này để chất hàng.`);
  }
  const jack = P.jackCapacity;
  if (jack){
    const heavy = pallets.filter(pl=> !pl.stackedOn).map(pl=>{
      const top = pallets.find(q=> q.stackedOn === pl.no);
      return { no: pl.no, kg: pl.unit.grossWeight + (top ? top.unit.grossWeight : 0), stack: !!top };
    }).filter(x=> x.kg > jack);
    if (heavy.length) warnings.push(`Xe nâng tay ${fmtInt(jack)} kg: ${heavy.length} pallet/chồng vượt tải — ` + heavy.slice(0,6).map(h=> `#${h.no}${h.stack?' (chồng)':''} ${fmtInt(h.kg)} kg`).join(', ') + (heavy.length>6?'…':''));
  }
  const noStrap = pallets.filter(pl=> pl.unit.strapOk === false && pl.kind !== 'customs');
  if (noStrap.length) warnings.push(`${noStrap.length} pallet KHÓ nẹp góc/đóng đai (có lớp thiếu thùng hoặc lệch mép/cao): ${noStrap.map(pl=> '#' + pl.no).join(', ')}.${P.strapMode ? ' Đây là phần thùng lẻ không thể xếp thành lớp đủ.' : ' Bật "Pallet vuông vức" để mọi pallet thường chỉ gồm lớp đủ.'}`);
  const sparse = pallets.filter(pl=> pl.unit.stability && pl.unit.stability !== 'ok');
  if (sparse.length) warnings.push(`${sparse.length} pallet có lớp trên cùng thưa/lệch cao (${sparse.map(pl=> '#'+pl.no).join(', ')}) — lớp dưới vẫn phẳng; nên đặt tấm lót/bìa trên đỉnh trước khi quấn màng, đai.`);
  const oh = pallets.filter(pl=> pl.unit.overhangUsed > 0.5);
  if (oh.length) warnings.push(`${oh.length} pallet có thùng chìa mép (tối đa ${fmtInt(Math.max(...oh.map(pl=> pl.unit.overhangUsed)))} mm) — sức nén thùng giảm; gia cố góc/màng co.`);
  (output.planInfo || []).forEach(pi=>{
    const sku = skuById[pi.skuId];
    if (pi.suggestion) warnings.push(`SKU "${sku ? (sku.code||sku.id) : pi.skuId}" đang chất column (cột thẳng, không khóa lớp). Gợi ý: ${pi.suggestion}.`);
    if (pi.fallback) warnings.push(`SKU "${sku ? (sku.code||sku.id) : pi.skuId}": không tìm được mẫu interlock hợp lệ (đỡ ≥ ${settings.supportThreshold}%) → dùng column.`);
    if ((pi.pattern === 'interlock' || pi.pattern === 'pinwheel') && sku && (sku.maxStackLoad != null || sku.fragile)) warnings.push(`SKU "${sku.code||sku.id}" chất interlock nhưng có giới hạn tải đè/fragile — interlock có thể giảm tới ~50% sức nén thùng; cân nhắc column.`);
  });
  if (output.stoppedByUser) warnings.push('Đã dừng theo yêu cầu — hiển thị phương án tốt nhất tại thời điểm dừng.');
  if (container.payload && cog.totalWeight > container.payload) warnings.push(`Tổng khối lượng ${fmtInt(cog.totalWeight)} kg (gồm pallet) vượt tải trọng ${fmtInt(container.payload)} kg.`);

  const customs = pallets.find(pl=> pl.kind === 'customs');
  if (customs){
    // Khoảng hở dọc giữa khối pallet phía trong và pallet kiểm hóa → hàng xô dịch khi vận chuyển
    const others = pallets.filter(pl=> pl !== customs && pl.placement.x < customs.placement.x);
    const reach = others.length ? Math.max(...others.map(pl=> pl.placement.x + pl.placement.sizeX)) : 0;
    const gap = customs.placement.x - reach;
    if (gap > 150) warnings.push(`Khoảng hở ${fmtInt(gap)} mm giữa khối pallet phía trong và pallet kiểm hóa #${customs.no} — cần chèn lót / chằng buộc (CTU Code) hoặc chọn cont nhỏ hơn.`);
  }
  const post = [];
  if (P.customs && P.customs.enabled){
    const missing = activeSkus.filter(s=> !s.isSample && (!customs || (customs.unit.skuCounts[s.id] || 0) < P.customs.n));
    const nSample = activeSkus.filter(s=> s.isSample).length;
    post.push({ ok: !!customs && !missing.length, text: customs
      ? (missing.length ? `Pallet kiểm hóa #${customs.no} thiếu SKU: ${missing.map(s=> s.code||s.id).join(', ')}` : `Pallet kiểm hóa #${customs.no}: đủ ≥ ${P.customs.n} thùng × ${activeSkus.length - nSample} SKU${nSample ? ` (+ ${nSample} SKU hàng mẫu, miễn n)` : ''}, ${output.customsModeUsed === 'fill' ? 'chèn vào pallet thường' : output.customsModeUsed === 'layers' ? 'mỗi SKU 1 lớp hoàn chỉnh' : 'lớp kiểm hóa tách riêng ở đỉnh'}, đặt sát cửa bên ${P.customs.side === 'left' ? 'trái' : 'phải'}.`)
      : 'Pallet kiểm hóa không vào được cont.' });
  }
  const checks = {
    enforced: [
      `Pallet trong lòng cont, né ${settings.zoneCount} vùng cấm/điểm mù`,
      `Cao pallet (hoặc chồng 2) ≤ ${fmtInt(output.hLimit)} mm = cửa cao − khe nâng`,
      'Tải hàng mỗi pallet ≤ giới hạn loại pallet; ràng buộc thùng (xoay, fragile, lớp đè, tải đè)',
      `Chất theo LỚP PHẲNG: mọi lớp bên dưới phủ ≥ ${Math.round(SLAB_FULL_COVERAGE*100)}% mặt pallet và cao đều; chỉ lớp trên cùng được thưa; mỗi thùng được đỡ ≥ ${settings.supportThreshold}%`,
      `Trộn SKU trên pallet: ${P.mixMode === 'none' ? 'không trộn' : P.mixMode === 'partial' ? `giới hạn ≤ ${P.mixN} SKU/lớp, ≤ ${P.mixK} SKU/pallet, theo nhóm trộn` : 'tự do'} (pallet kiểm hóa được miễn)`,
      ...(P.doubleStack && P.doubleStack.enabled ? [`Chồng 2 pallet: thẳng mép, cùng kích thước, tải đè ≤ ${fmtInt(P.doubleStack.maxLoadOnBottom)} kg; không chồng lên pallet kiểm hóa`] : ['Không chồng pallet']),
      ...(settings.enforcePayload ? ['Tải trọng hàng + pallet ≤ payload container'] : [])
    ],
    soft: settings.heavyBottomPriority ? [{ ok: !output.heavyRelaxed, text: output.heavyRelaxed ? `Nặng dưới nhẹ trên (pallet): đã nới ${output.heavyRelaxed} lần.` : 'Nặng dưới nhẹ trên: không phải nới.' }] : [],
    post
  };
  post.filter(c=> !c.ok).forEach(c=> warnings.push(c.text));

  return {
    mode: 'pallet',
    placed, unplaced: [], layers, breakdown, pallets, checks,
    planInfo: output.planInfo || [],
    stats: {
      totalPlaced: cartons.length, totalRequested: activeSkus.reduce((s,k)=> s + k.qty, 0),
      volumePct: containerVolume ? usedVolume / containerVolume * 100 : 0,
      floorPct: floorArea / (container.L * container.W) * 100,
      weightPct: container.payload ? cog.totalWeight / container.payload * 100 : 0,
      totalWeight: cog.totalWeight, usedVolume, containerVolume,
      cogX: cog.cogX, cogY: cog.cogY, cogZ: cog.cogZ, cogXOffsetPct: cog.cogXOffsetPct, cogZOffsetPct: cog.cogZOffsetPct,
      cogXOffsetMm: cog.cogXOffsetMm, cogZOffsetMm: cog.cogZOffsetMm, frontHalfPct: cog.frontHalfPct,
      passesRun: output.passesRun, elapsedMs, strategyUsed: output.best ? output.best.strategyName : '—', seed: output.seed,
      palletCount: pallets.length, hLimit: output.hLimit
    },
    warnings, smartFitNotes: [], settings, container
  };
}

function showRightPanelErrors(errors){
  buildRightColumn();
  const wrap = document.getElementById('rr-alerts');
  if (!wrap) return;
  wrap.innerHTML = errors.map(e=> `<div class="alert err"><span class="ic">⛔</span><span>${e}</span></div>`).join('');
}


/* ============================================================
   9. THREE.JS 3D RENDERER
   Hệ tọa độ app (mm): x=dọc container, y=cao, z=rộng.
   Ta scale xuống mét cho three.js để tránh số quá lớn, và giữ
   nguyên chiều (x,y,z) map thẳng sang Three.js world coords.
   ============================================================ */

let three = {
  scene:null, camera:null, renderer:null, controls:null,
  containerGroup:null, boxesGroup:null, animReq:null,
  resizeObserver:null, explodeFactor:0, wireframeOnly:false
};

const MM_TO_M = 0.001;

function initThreeIfNeeded(){
  if (three.renderer) return;
  const container = document.getElementById('three-container');
  const w = container.clientWidth, h = container.clientHeight;

  three.scene = new THREE.Scene();
  three.scene.background = null;

  three.camera = new THREE.PerspectiveCamera(45, w/h, 0.01, 1000);
  three.camera.position.set(9, 7, 11);

  three.renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  three.renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  three.renderer.setSize(w,h);
  container.appendChild(three.renderer.domElement);

  three.controls = new THREE.OrbitControls(three.camera, three.renderer.domElement);
  three.controls.enableDamping = true;
  three.controls.dampingFactor = 0.08;
  three.controls.target.set(0,0,0);

  const ambient = new THREE.AmbientLight(0xffffff, 0.65);
  three.scene.add(ambient);
  const dir1 = new THREE.DirectionalLight(0xffffff, 0.55);
  dir1.position.set(10,15,8);
  three.scene.add(dir1);
  const dir2 = new THREE.DirectionalLight(0xffffff, 0.25);
  dir2.position.set(-8,6,-10);
  three.scene.add(dir2);

  three.containerGroup = new THREE.Group();
  three.boxesGroup = new THREE.Group();
  three.scene.add(three.containerGroup);
  three.scene.add(three.boxesGroup);

  function onResize(){
    const w2 = container.clientWidth, h2 = container.clientHeight;
    if (w2===0||h2===0) return;
    three.camera.aspect = w2/h2;
    three.camera.updateProjectionMatrix();
    three.renderer.setSize(w2,h2);
  }
  window.addEventListener('resize', onResize);
  three.resizeObserver = new ResizeObserver(onResize);
  three.resizeObserver.observe(container);

  function animate(){
    three.animReq = requestAnimationFrame(animate);
    three.controls.update();
    three.renderer.render(three.scene, three.camera);
  }
  animate();
}

function clear3DScene(){
  document.getElementById('viewport-empty').style.display = 'flex';
  document.getElementById('legend-panel').classList.remove('active');
  document.getElementById('layer-slider-wrap').classList.remove('active');
  clearGroup(three.boxesGroup);
  clearGroup(three.containerGroup);
}

// Camera mặc định nhìn từ phía -z: khi đó trục x tăng về BÊN TRÁI màn hình, tức ĐÁY cont (x=0)
// nằm bên PHẢI và CỬA cont (x=L) bên TRÁI — đúng hình minh họa "Right to left" (chất từ phải sang trái).
function applyDefaultCamera(dims){
  // Lùi camera đủ xa để ôm TRỌN cont (tính theo bán kính cầu bao và góc nhìn hẹp nhất), thay vì đặt cố định
  const center = new THREE.Vector3(dims.L/2, dims.H/2, dims.W/2);
  const radius = Math.sqrt(dims.L*dims.L + dims.H*dims.H + dims.W*dims.W) / 2;
  const vfov = THREE.MathUtils.degToRad(three.camera.fov);
  const hfov = 2 * Math.atan(Math.tan(vfov/2) * three.camera.aspect);
  const dist = 1.1 * radius / Math.sin(Math.min(vfov, hfov) / 2);
  const dir = new THREE.Vector3(0.45, 0.4, -0.8).normalize(); // từ phía cửa, phía -z, hơi nhìn xuống
  three.camera.position.copy(center).addScaledVector(dir, dist);
  three.controls.target.copy(center);
  three.controls.update();
}

function buildContainerWireframe(container){
  const L = container.L*MM_TO_M, H = container.H*MM_TO_M, W = container.W*MM_TO_M;
  const geo = new THREE.BoxGeometry(L,H,W);
  const edges = new THREE.EdgesGeometry(geo);
  const mat = new THREE.LineBasicMaterial({ color: 0x6b7484, transparent:true, opacity:0.9 });
  const wire = new THREE.LineSegments(edges, mat);
  wire.position.set(L/2, H/2, W/2);
  three.containerGroup.add(wire);

  // Khung cửa cont (x = L) màu hổ phách để nhận ra đâu là cửa; đáy cont (x = 0) ở phía đối diện.
  const door = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.PlaneGeometry(W, H)),
    new THREE.LineBasicMaterial({ color: 0xe8a33d })
  );
  door.rotation.y = Math.PI/2;
  door.position.set(L, H/2, W/2);
  three.containerGroup.add(door);

  // sàn mờ
  const floorGeo = new THREE.PlaneGeometry(L, W);
  const floorMat = new THREE.MeshBasicMaterial({ color:0x232833, transparent:true, opacity:0.55, side:THREE.DoubleSide });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.position.set(L/2, 0.001, W/2);
  three.containerGroup.add(floor);

  // grid nhẹ trên sàn
  const grid = new THREE.GridHelper(Math.max(L,W), 20, 0x333a47, 0x2a2f3a);
  grid.position.set(L/2, 0.002, W/2);
  three.containerGroup.add(grid);

  return { L,H,W };
}

// Vùng cấm: đỏ = điểm mù cấu trúc tự sinh, cam = vùng người dùng nhập. Nằm trong containerGroup.
function addZoneMeshes(zones){
  zones.forEach(z=>{
    const col = z.auto ? 0xe2604f : 0xe8a33d;
    const geo = new THREE.BoxGeometry(z.dx*MM_TO_M, z.dy*MM_TO_M, z.dz*MM_TO_M);
    const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: col, transparent:true, opacity:0.22, depthWrite:false }));
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: col, transparent:true, opacity:0.8 })));
    mesh.position.set((z.x + z.dx/2)*MM_TO_M, (z.y + z.dy/2)*MM_TO_M, (z.z + z.dz/2)*MM_TO_M);
    mesh.userData.zone = z;
    three.containerGroup.add(mesh);
  });
}

function boxCenterOffset(placed, container, explodeFactor, settings){
  // Hiệu ứng "explode" tách lớp theo đúng trục của lớp: lớp cắt ngang (right_to_left) tách dọc
  // theo chiều dài cont; lớp nằm ngang (floor_to_top) tách theo chiều cao.
  if (!explodeFactor) return {dx:0, dy:0, dz:0};
  const off = (placed._layerIndex||0) * explodeFactor * 0.35;
  return (settings && settings.loadingDirection === 'right_to_left')
    ? { dx: off, dy:0, dz:0 }
    : { dx:0, dy: off, dz:0 };
}

function render3DResult(processed){
  initThreeIfNeeded();
  clear3DScene();
  document.getElementById('viewport-empty').style.display = 'none';

  const dims = buildContainerWireframe(processed.container);
  if (processed.showZones) addZoneMeshes(processed.zones || []);
  applyDefaultCamera(dims);

  // _layerIndex đã được gán lúc xử lý kết quả (bulk: theo lớp; pallet: theo hàng pallet)
  rebuildBoxMeshes(processed);
  setupLayerSlider(processed);
  setupLegend(processed);
}

/* ---------- Bộ nhớ đồ họa ----------
   Trước đây mỗi lần vẽ lại (mỗi thao tác chỉnh tay) tạo MỚI hình hộp + khung + 2 vật liệu cho TỪNG thùng và không giải phóng
   cái cũ → bộ nhớ GPU phình dần (1.000 thùng × vài trăm thao tác) → trình duyệt đơ/crash sau 30–40 phút.
   Nay: 1 hình hộp đơn vị + 1 khung dùng chung cho mọi thùng (co giãn bằng scale), vật liệu lưu đệm theo màu/độ trong/
   trạng thái tô sáng; các nhóm đánh dấu (lỗi, khóa, khung cont, vùng cấm) được giải phóng khi vẽ lại. */
const G3 = { box: null, edges: null, mats: new Map() };
function unitGeo(){
  if (!G3.box){ G3.box = new THREE.BoxGeometry(1, 1, 1); G3.edges = new THREE.EdgesGeometry(G3.box); }
  return G3;
}
function cachedMat(kind, color, opacity, emissive){
  const key = kind + '|' + (kind === 'sprite' ? color.uuid : color) + '|' + opacity + '|' + (emissive || 0);
  let m = G3.mats.get(key);
  if (!m){
    if (kind === 'line') m = new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity });
    else if (kind === 'sprite') m = new THREE.SpriteMaterial({ map: color, depthTest: false, transparent: true });
    else { m = new THREE.MeshLambertMaterial({ color, transparent: opacity < 1, opacity }); if (emissive) m.emissive.setHex(emissive); }
    m.userData = { shared: true };
    G3.mats.set(key, m);
  }
  return m;
}
// Gỡ & giải phóng mọi con của 1 nhóm (trừ hình/vật liệu dùng chung và texture nhãn đã lưu đệm)
function clearGroup(group){
  if (!group) return;
  while (group.children.length){
    const o = group.children[0];
    group.remove(o);
    o.traverse(x=>{
      if (x.geometry && x.geometry !== G3.box && x.geometry !== G3.edges) x.geometry.dispose();
      const mats = Array.isArray(x.material) ? x.material : (x.material ? [x.material] : []);
      mats.forEach(m=>{ if (!(m.userData && m.userData.shared)) m.dispose(); });
    });
  }
}
// Hộp khung (chỉ cạnh) dùng chung hình đơn vị — cho đánh dấu lỗi / khóa
function edgeBox(b, color, pad){
  const g = unitGeo(), m = new THREE.LineSegments(g.edges, cachedMat('line', color, 1));
  m.scale.set((b.sizeX + pad) * MM_TO_M, (b.sizeY + pad) * MM_TO_M, (b.sizeZ + pad) * MM_TO_M);
  m.position.set((b.x + b.sizeX / 2) * MM_TO_M, (b.y + b.sizeY / 2) * MM_TO_M, (b.z + b.sizeZ / 2) * MM_TO_M);
  return m;
}

function rebuildBoxMeshes(processed){
  clearGroup(three.boxesGroup);

  const layerFilter = state.currentLayerFilter;
  const explode = three.explodeFactor;

  processed.placed.forEach(p=>{
    if (state.hiddenSkuIds.has(p.skuId)) return;
    if (layerFilter >= 0 && p._layerIndex !== layerFilter) return;

    const L = p.sizeX*MM_TO_M, H = p.sizeY*MM_TO_M, W = p.sizeZ*MM_TO_M;
    const g = unitGeo(), color = p.color || '#888888';
    let mesh;
    if (three.wireframeOnly){
      mesh = new THREE.LineSegments(g.edges, cachedMat('line', color, 1));
    } else {
      const op = p.isPalletBase ? 1 : (p.fragile ? 0.72 : 0.92);
      mesh = new THREE.Mesh(g.box, cachedMat('mesh', color, op, 0));
      mesh.userData.mc = color; mesh.userData.mo = op;
      mesh.add(new THREE.LineSegments(g.edges, cachedMat('line', 0x14171c, 0.35)));
    }
    mesh.scale.set(L, H, W);                      // khung con kế thừa scale của hộp cha

    const offset = boxCenterOffset(p, processed.container, explode, processed.settings);
    mesh.position.set(
      (p.x + p.sizeX/2)*MM_TO_M + offset.dx,
      (p.y + p.sizeY/2)*MM_TO_M + offset.dy,
      (p.z + p.sizeZ/2)*MM_TO_M + offset.dz
    );
    mesh.userData.placement = p;
    three.boxesGroup.add(mesh);
  });
  if (processed.mode === 'pallet' && three.showPalletNos !== false) addPalletNumberSprites(processed);
  if (typeof highlightSelection === 'function') highlightSelection();
}

// Nhãn số pallet nhỏ lơ lửng ngay trên đỉnh mỗi pallet (luôn quay về phía camera), không che khối hàng.
const _palletLabelTex = {};
function palletLabelTexture(text, customs){
  const key = text + (customs ? 'K' : '');
  if (_palletLabelTex[key]) return _palletLabelTex[key];
  const cv = document.createElement('canvas'); cv.width = 128; cv.height = 64;
  const g = cv.getContext('2d');
  g.fillStyle = customs ? 'rgba(160,30,30,0.92)' : 'rgba(20,23,28,0.88)';
  g.strokeStyle = customs ? '#ff8a8a' : '#e8a33d'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(14, 4); g.arcTo(124, 4, 124, 60, 12); g.arcTo(124, 60, 4, 60, 12); g.arcTo(4, 60, 4, 4, 12); g.arcTo(4, 4, 124, 4, 12); g.closePath();
  g.fill(); g.stroke();
  g.fillStyle = '#fff'; g.font = 'bold 36px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 64, 34);
  return (_palletLabelTex[key] = new THREE.CanvasTexture(cv));
}
function addPalletNumberSprites(processed){
  const explode = three.explodeFactor;
  (processed.pallets || []).forEach(pl=>{
    const q = pl.placement;
    const base = processed.placed.find(p=> p.isPalletBase && p.palletNo === pl.no);
    if (state.currentLayerFilter >= 0 && base && base._layerIndex !== state.currentLayerFilter) return;
    const off = base ? boxCenterOffset(base, processed.container, explode, processed.settings) : { dx:0, dy:0, dz:0 };
    const tex = palletLabelTexture('#' + pl.no, pl.kind === 'customs');
    const spr = new THREE.Sprite(cachedMat('sprite', tex, 1, 0));
    spr.scale.set(0.34, 0.17, 1);
    spr.position.set((q.x + q.sizeX/2)*MM_TO_M + off.dx, (q.y + q.sizeY)*MM_TO_M + 0.2 + off.dy, (q.z + q.sizeZ/2)*MM_TO_M + off.dz);
    spr.renderOrder = 10;
    three.boxesGroup.add(spr);
  });
}

function setupLayerSlider(processed){
  const slider = document.getElementById('layer-slider');
  const label = document.getElementById('layer-label');
  slider.max = processed.layers.length;
  slider.min = 0;
  slider.value = 0;
  state.currentLayerFilter = -1;
  label.textContent = 'Tất cả lớp';

  slider.oninput = ()=>{
    const v = parseInt(slider.value);
    if (v === 0){
      state.currentLayerFilter = -1;
      label.textContent = 'Tất cả lớp';
    } else {
      state.currentLayerFilter = v-1;
      label.textContent = 'Lớp ' + v + ' / ' + processed.layers.length;
    }
    rebuildBoxMeshes(processed);
  };
  document.getElementById('layer-prev').onclick = ()=>{
    slider.value = Math.max(0, parseInt(slider.value)-1);
    slider.oninput();
  };
  document.getElementById('layer-next').onclick = ()=>{
    slider.value = Math.min(parseInt(slider.max), parseInt(slider.value)+1);
    slider.oninput();
  };
}

function setupLegend(processed){
  const panel = document.getElementById('legend-panel');
  panel.innerHTML = processed.breakdown.filter(b=>b.placed>0).map(b=>`
    <div class="lg-item" data-sku="${b.skuId}" style="cursor:pointer;${state.hiddenSkuIds.has(b.skuId)?'opacity:0.35;':''}">
      <span class="lg-dot" style="background:${b.color}"></span>
      <span class="lg-name">${b.code} (${b.placed})</span>
    </div>
  `).join('');
  panel.querySelectorAll('[data-sku]').forEach(item=>{
    item.addEventListener('click', ()=>{
      const id = item.dataset.sku;
      if (state.hiddenSkuIds.has(id)) state.hiddenSkuIds.delete(id); else state.hiddenSkuIds.add(id);
      item.style.opacity = state.hiddenSkuIds.has(id) ? '0.35' : '1';
      rebuildBoxMeshes(processed);
    });
  });
}

function exportCSV(){

  const p = state.result;
  const rows = [
    ['instance_id','sku_code','pallet_no','layer','x_mm','y_mm','z_mm','size_x_mm','size_y_mm','size_z_mm','orientation','weight_kg','fragile']
  ];

    rows.push([pl.instanceId, pl.skuCode, pl.palletNo ?? '', (pl._layerIndex??0)+1, pl.x.toFixed(0), pl.y.toFixed(0), pl.z.toFixed(0),

  });
  const csv = rows.map(r=> r.map(v=> typeof v==='string' && (v.includes(',') || v.includes('"')) ? `"${v.replace(/"/g,'""')}"` : v).join(',')).join('\n');
