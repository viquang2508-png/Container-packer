   hỗn hợp (cho phép lệch cao, luôn là lớp trên cùng của pallet). `first` (tùy chọn): các thùng phải được
   xếp ưu tiên vào lớp trên cùng (hàng kiểm hóa / mẫu). */
function buildSlabsFromLoose(items, pt, specOf, skuById, policy, opts){
  opts = opts || {};
  const slabs = { uniform: [], top: [] };
  const byClass = new Map();
  // nhóm chiều cao: các chiều cao chênh nhau ≤ LAYER_H_TOL (tính từ thùng thấp nhất nhóm) chung 1 lớp
  const hs = Array.from(new Set(items.map(it=> { const sp = specOf(it.skuId); return sp ? Math.round(sp.hUp) : null; }).filter(v=> v != null))).sort((a,b)=> a - b);
  const classOf = {}; let start = null;
  for (const h of hs){ if (start == null || h - start > LAYER_H_TOL) start = h; classOf[h] = start; }
  for (const it of items){
    const sp = specOf(it.skuId);
    if (!sp) continue;
    const key = classOf[Math.round(sp.hUp)];
    if (!byClass.has(key)) byClass.set(key, []);
    byClass.get(key).push(specItem(it, sp));
  }
  const layerCanAdd = (placed, item)=>{
    const ids = new Set(placed.map(p=> p.it.ref.skuId)); ids.add(item.ref.skuId);
    return policy.layerOk(Array.from(ids));
  };
  // gom cùng SKU cạnh nhau (khối gọn), SKU nhiều thùng trước, thùng lớn trước
  const cnt = {}; items.forEach(it=> cnt[it.skuId] = (cnt[it.skuId]||0) + 1);
  const ord = (arr)=> arr.slice().sort((p,q)=> (cnt[q.ref.skuId] - cnt[p.ref.skuId]) || (p.ref.skuId < q.ref.skuId ? -1 : p.ref.skuId > q.ref.skuId ? 1 : 0) || (q.w*q.h - p.w*p.h));
  let leftover = [];
  if (opts.topOnly){ for (const list of byClass.values()) leftover.push(...list); }
  else {
    for (const list of byClass.values()){
      let rest = ord(list), guard = 0;
      while (rest.length && guard++ < 500){
        const r = maxRectsPack(pt.L, pt.W, rest, layerCanAdd);
        if (!r.placed.length){ leftover.push(...rest); rest = []; break; }
        const ref = Math.min(...r.placed.map(pk=> pk.it.spec.refCov || SLAB_FULL_COVERAGE));
        const slab = makeSlab(centerCartons(r.placed.map(pk=> cartonFromPacked(pk, skuById)), pt), pt, ref);
        if (slab.full){ slabs.uniform.push(slab); rest = ord(r.rest); }
        else {
          // không đủ 1 lớp đầy: trả các SKU vừa thử về phần lẻ, thử tiếp các SKU khác trong nhóm cao này
          const tried = new Set(r.placed.map(pk=> pk.it.ref.skuId));
          leftover.push(...rest.filter(x=> tried.has(x.ref.skuId)));
          rest = ord(rest.filter(x=> !tried.has(x.ref.skuId)));
        }
      }
    }
  }
  // Lớp trên cùng hỗn hợp: hàng ưu tiên (first) trước, rồi thùng CAO trước, rồi thùng lớn trước
  const isFirst = (x)=> !!x.ref._first;
  let rest = leftover.slice().sort((p,q)=> (isFirst(q) - isFirst(p)) || (q.spec.hUp - p.spec.hUp) || (q.w*q.h - p.w*p.h));
  let guard = 0;
  while (!opts.noTop && rest.length && guard++ < 500){
    const r = maxRectsPack(pt.L, pt.W, rest, opts.ignorePolicy ? null : layerCanAdd);
    if (!r.placed.length){ break; }
    const ref = Math.min(...r.placed.map(pk=> pk.it.spec.refCov || SLAB_FULL_COVERAGE));
    slabs.top.push(makeSlab(centerCartons(r.placed.map(pk=> cartonFromPacked(pk, skuById)), pt), pt, ref));
    rest = r.rest;
    if (opts.maxTopLayers && slabs.top.length >= opts.maxTopLayers) break;
  }
  slabs.usedIds = new Set();
  slabs.uniform.concat(slabs.top).forEach(sl=> sl.cartons.forEach(c=> c.iid && slabs.usedIds.add(c.iid)));
  slabs.unplaced = items.filter(it=> !slabs.usedIds.has(it.instanceId));
  return slabs;
}

/* ---------- Chồng lớp (stack) = 1 pallet đang dựng ---------- */
function newStack(pt, kind){ return { pt, kind, slabs: [], h: 0, weight: 0, skus: new Set(), closed: false }; }

// Có thể đặt lớp s lên đỉnh chồng st? (chiều cao, tải pallet, chính sách trộn, đỡ ≥ ngưỡng, fragile, lớp/tải đè)
function canPlaceSlab(st, s, thrPct, policy, ignorePolicy){
  const pt = st.pt;
  if (st.closed) return false;
  if (st.h + s.h > pt._effMaxH - pt.H + 1e-6) return false;
  if (pt.maxLoadKg > 0 && st.weight + s.weight > pt.maxLoadKg + 1e-6) return false;
  if (!ignorePolicy){
    const ids = new Set(st.skus); s.skus.forEach(id=> ids.add(id));
    if (!policy.palletOk(Array.from(ids))) return false;
  }
  const top = st.slabs[st.slabs.length - 1];
  if (top){
    if (top.fragile || !top.full) return false;
    // pallet kiểm hóa (ignorePolicy = được miễn) không bắt buộc vuông vức
    if (!ignorePolicy && policy && policy.strap && st.kind !== 'customs' && (!isCompleteSlab(s) || !slabCornersOk(s, slabBBox(st.slabs[0])))) return false;
    for (const u of s.cartons){
      if (u.oy) continue;   // thùng tầng trên trong "nắp" tựa lên thùng khác của chính lớp đó
      let area = 0;
      for (const l of top.cartons){
        const ix = Math.max(0, Math.min(u.x+u.w, l.x+l.w) - Math.max(u.x, l.x));
        const iy = Math.max(0, Math.min(u.y+u.l, l.y+l.l) - Math.max(u.y, l.y));
        area += ix * iy;
      }
      if (area / (u.w * u.l) * 100 < thrPct - 1e-6) return false;
    }
    let above = s.weight;
    for (let i = st.slabs.length - 1; i >= 0; i--){
      const j = st.slabs[i], layersAbove = st.slabs.length - i;
      if (layersAbove > j.capCount) return false;
      if (above > j.capLoad + 1e-6) return false;
      above += j.weight;
    }
  }
  return true;
}
function pushSlab(st, s){
  st.slabs.push(s); st.h += s.h; st.weight += s.weight; s.skus.forEach(id=> st.skus.add(id));
  if (!s.full) st.closed = true;
}
function canStackOnto(T, S, thrPct, policy, ignorePolicy){
  const clone = { pt: T.pt, slabs: T.slabs.slice(), h: T.h, weight: T.weight, skus: new Set(T.skus), closed: T.closed };
  for (const s of S.slabs){ if (!canPlaceSlab(clone, s, thrPct, policy, ignorePolicy)) return false; pushSlab(clone, s); }
  return true;
}

function cloneStack(st){
  return { pt: st.pt, kind: st.kind, pattern: st.pattern, slabs: st.slabs.slice(), h: st.h, weight: st.weight, skus: new Set(st.skus), closed: st.closed };
}
let _looseUid = 0;
function cartonsToItems(slab){
  return slab.cartons.map(c=> ({ skuId: c.skuId, instanceId: c.iid || ('r' + (_looseUid++)), weight: c.weight, _tag: c.tag || null }));
}

// Gộp dần từng cặp lớp trên cùng (lớp thưa) vào chung 1 lớp nếu MaxRects xếp vừa & hợp chính sách trộn.
function mergeTopSlabs(tops, pt, specOf, skuById, policy){
  let arr = tops.slice(), changed = true, guard = 0;
  while (changed && guard++ < 100){
    changed = false; let best = null;
    for (let i=0; i<arr.length; i++) for (let j=i+1; j<arr.length; j++){
      const ids = Array.from(new Set(arr[i].skus.concat(arr[j].skus)));
      if (!policy.layerOk(ids) || !policy.palletOk(ids)) continue;
      if (arr[i].area + arr[j].area > pt.L * pt.W) continue;
      const r = buildSlabsFromLoose(cartonsToItems(arr[i]).concat(cartonsToItems(arr[j])), pt, specOf, skuById, policy, { topOnly: true, maxTopLayers: 1 });
      if (!r.top.length || r.unplaced.length) continue;
      if (!best || r.top[0].area > best.s.area) best = { i, j, s: r.top[0] };
    }
    if (best){ arr.splice(best.j, 1); arr.splice(best.i, 1, best.s); changed = true; }
  }
  return arr;
}

/* Lắp các lớp tự do vào pallet. fullSlabs: lớp đầy (gom theo SKU, giữ thứ tự gốc để giữ xen kẽ);
   topBlocks: khối phải nằm TRÊN CÙNG (lớp thưa, pallet kiểm hóa). variant: thứ tự & cách chọn pallet. */
function assembleSlabs(baseStacks, fullSlabs, topBlocks, pt, thrPct, policy, variant, ctx){
  const stacks = baseStacks.map(cloneStack);
  const failed = [];
  const groups = new Map();
  for (const s of fullSlabs){ const k = s.skus.length === 1 ? s.skus[0] : '__mix'; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(s); }
  const H = (g)=> g.reduce((t,s)=> t + s.h, 0);
  const garr = Array.from(groups.values()).sort(variant.groupOrder === 'asc' ? (a,b)=> H(a) - H(b) : (a,b)=> H(b) - H(a));
  const score = (st, add)=> variant.fit === 'best' ? st.h + add : -stacks.indexOf(st);
  const pickStack = (ok)=>{ let best = null, bs = -Infinity;
    for (const st of stacks){ if (st.pt.id !== pt.id || st.kind === 'customs') continue; const sc = ok(st); if (sc === null) continue; if (sc > bs){ bs = sc; best = st; } }
    return best; };
  for (const g of garr){
    let cur = null;
    for (const s of g){
      if (cur && canPlaceSlab(cur, s, thrPct, policy)){ pushSlab(cur, s); continue; }
      let st = pickStack(x=> canPlaceSlab(x, s, thrPct, policy) ? score(x, s.h) : null);
      if (!st){ st = newStack(pt, 'mixed'); if (!canPlaceSlab(st, s, thrPct, policy)){ failed.push(s); continue; } stacks.push(st); }
      pushSlab(st, s); cur = st;
    }
  }
  const blocks = topBlocks.slice().sort(variant.topOrder === 'h' ? (a,b)=> b.h - a.h : (a,b)=> b.area - a.area);
  for (const B of blocks){
    const exempt = B.kind === 'customs';
    const st = pickStack(x=> canStackOnto(x, B, thrPct, policy, exempt) ? score(x, B.h) : null);
    if (st){ B.slabs.forEach(s=> pushSlab(st, s)); if (exempt) st.kind = 'customs'; continue; }
    // Lớp thưa được xếp độc lập nên có thể không khớp chỗ đỡ với lớp đỉnh của pallet đích → xếp lại các thùng đó
    // NGAY TRÊN lớp đỉnh từng pallet (đỡ tính theo từng thùng, lấp được cả khe lớp đỉnh) trước khi mở pallet mới.
    if (ctx && ctx.skuById && B.slabs.length === 1 && !policy.strap){
      let bestFit = null;
      for (const x of stacks){
        if (x.pt.id !== pt.id || x.kind === 'customs' || !x.slabs.length) continue;
        const ids = new Set(x.skus); B.slabs[0].skus.forEach(id=> ids.add(id));
        if (!exempt && !policy.palletOk(Array.from(ids))) continue;
        const items = B.slabs[0].cartons.map(c=> looseItemFor(ctx.skuById[c.skuId], 'af' + (_looseUid++), c.tag));
        const c3 = capFill3D(x, items, thrPct);
        if (c3 && (!bestFit || c3.base.h > bestFit.c3.base.h)) bestFit = { x, c3 };
      }
      if (bestFit){
        const x = bestFit.x;
        x.slabs = bestFit.c3.base.slabs.concat([bestFit.c3.cap]);
        rebuildStack(x);
        if (exempt) x.kind = 'customs';
        continue;
      }
    }
    const ns = newStack(pt, exempt ? 'customs' : 'mixed');
    let ok = true;
    for (const s of B.slabs){ if (!canPlaceSlab(ns, s, thrPct, policy, exempt)){ ok = false; break; } pushSlab(ns, s); }
    if (ok) stacks.push(ns); else B.slabs.forEach(s=> failed.push(s));
  }
  // điểm: ít pallet nhất → ít pallet trộn nhất → pallet đầy đặn hơn
  const mixed = stacks.filter(st=> st.skus.size > 1 && st.kind !== 'customs').length;
  const fill = stacks.reduce((t,st)=> t + st.h * st.h, 0);
  return { stacks, failed, key: [stacks.length + failed.length * 100, mixed, -fill] };
}

// Đổi chồng lớp → pallet unit (thùng tọa độ tương đối, footprint thực gồm phần chìa mép).
function stackToUnit(st, id){
  const pt = st.pt, cartons = [], layers = [];
  let base = 0;
  st.slabs.forEach((s, i)=>{
    for (const c of s.cartons) cartons.push({ lx: c.x, lz: c.y, ly: base + (c.oy || 0), sx: c.w, sz: c.l, sy: c.hh,
      skuId: c.skuId, weight: c.weight, orientCode: c.orientCode, fragile: !!c.fragile, tag: c.tag || null });
    const cnt = {}; s.cartons.forEach(c=> cnt[c.skuId] = (cnt[c.skuId]||0) + 1);
    layers.push({ h: s.h, coverage: s.coverage, uniform: s.uniform, full: s.full, counts: cnt, top: i === st.slabs.length - 1 });
    base += s.h;
  });
  const top = st.slabs[st.slabs.length - 1];
  const stability = !top ? 'ok' : (st.slabs.length > 1 && top.coverage < 0.5 ? 'sparse_top' : (!top.uniform && st.slabs.length > 1 ? 'uneven_top' : 'ok'));
  const strapOk = stackStrapOk(st);
  let minX = 0, minZ = 0, maxX = pt.L, maxZ = pt.W, hTop = 0, cargoW = 0;
  const counts = {};
  for (const c of cartons){
    minX = Math.min(minX, c.lx); minZ = Math.min(minZ, c.lz);
    maxX = Math.max(maxX, c.lx + c.sx); maxZ = Math.max(maxZ, c.lz + c.sz);
    hTop = Math.max(hTop, c.ly + c.sy); cargoW += c.weight;
    counts[c.skuId] = (counts[c.skuId] || 0) + 1;
  }
  const kind = st.kind === 'customs' ? 'customs' : (Object.keys(counts).length > 1 ? 'mixed' : st.kind);
  return {
    id, kind, ptypeId: pt.id, ptypeName: pt.name,
    palletL: pt.L, palletW: pt.W, palletH: pt.H, palletTare: pt.weight || 0,
    deckX: -minX, deckZ: -minZ, FL: maxX - minX, FW: maxZ - minZ,
    height: pt.H + hTop, cargoWeight: cargoW, grossWeight: cargoW + (pt.weight || 0), skuCounts: counts,
    overhangUsed: Math.max(0, -minX, -minZ, maxX - pt.L, maxZ - pt.W),
    pattern: st.pattern || (Object.keys(counts).length > 1 ? 'mix' : 'layer'),
    layers, stability, strapOk,
    cartons: cartons.map(c=> Object.assign({}, c, { lx: c.lx - minX, lz: c.lz - minZ }))
  };
}

function palletUnitsToItems(units, P){
  const ds = P.doubleStack && P.doubleStack.enabled;
  return units.map(u=> ({
    instanceId: u.id, skuId: u.id, skuCode: u.id, weight: u.grossWeight, fragile: false,
    maxStackCount: (ds && u.kind !== 'customs') ? 1 : 0,
    maxStackLoad: ds ? (P.doubleStack.maxLoadOnBottom || null) : null,
    orientations: Math.abs(u.FL - u.FW) < 0.5
      ? [{ d:u.FL, w:u.height, h:u.FW, code:'P' }]
      : [{ d:u.FL, w:u.height, h:u.FW, code:'P' }, { d:u.FW, w:u.height, h:u.FL, code:'P90' }],
    volume: u.FL * u.FW * u.height, origL: u.FL, origW: u.FW, origH: u.height
  }));
}

// Đặt pallet kiểm hóa sát cửa nhất có thể, sát vách phía đã chọn, né vùng cấm.
function placeAtDoor(item, o, c, zones, side){
  for (let x = c.L - o.d; x >= 0 && x >= c.L - o.d - 800; x -= 5){
    for (let dz = 0; dz <= 80; dz += 2){
      const z = side === 'left' ? c.W - o.h - dz : dz;
      if (z < -0.01) continue;
      const cand = { x, y:0, z, sizeX:o.d, sizeY:o.w, sizeZ:o.h, skuId:item.skuId, weight:item.weight, fragile:false,
                     maxStackCount:0, maxStackLoad:null, orientCode:o.code, instanceId:item.instanceId };
      if (isWithinContainer(cand, c) && !isInForbiddenZone(cand, zones)) return cand;
    }
  }
  return null;
}

function packagePalletOutput(best, meta){
  return Object.assign({
    mode: 'pallet',
    placements: best.result.placed.map(p=> ({ unitId:p.instanceId, x:p.x, y:p.y, z:p.z, sizeX:p.sizeX, sizeY:p.sizeY, sizeZ:p.sizeZ, orientCode:p.orientCode })),
    unplacedUnitIds: best.result.unplaced.map(i=> i.instanceId),
    best: { strategyName: best.strategyName, score: best.score },
    heavyRelaxed: best.result.heavyRelaxed || 0,
    payloadRejected: best.result.payloadRejected || 0
  }, meta);
}

// Thùng "lộ" của 1 lớp: không có thùng nào khác trong lớp tựa lên nó (lớp đỉnh dạng nắp có thể có 2-3 tầng thùng).
// Chỉ được rút các thùng này khỏi lớp đỉnh — rút thùng đang đỡ thùng khác sẽ làm thùng phía trên lơ lửng.
function isExposedCarton(c, slab){
  const top = (c.oy || 0) + c.hh;
  return !slab.cartons.some(d=> d !== c && Math.abs((d.oy || 0) - top) < 1.5 &&
    Math.min(c.x + c.w, d.x + d.w) - Math.max(c.x, d.x) > 0.5 && Math.min(c.y + c.l, d.y + d.l) - Math.max(c.y, d.y) > 0.5);
}

// Tính lại thông số 1 chồng sau khi bớt thùng ở lớp đỉnh.
function rebuildStack(st){
  const slabs = st.slabs; st.slabs = []; st.h = 0; st.weight = 0; st.skus = new Set(); st.closed = false;
  slabs.forEach(s=> pushSlab(st, s));
}

function looseItemFor(sku, iid, tag){
  return { instanceId: iid, skuId: sku.id, weight: sku.weight, fragile: !!sku.fragile,
           maxStackCount: sku.maxStackCount, maxStackLoad: sku.maxStackLoad,
           orientations: generateOrientations(sku), volume: sku.L * sku.W * sku.H, _tag: tag || null };
}

// Kiểm tra chiều cao/tải pallet và số lớp/tải đè của các lớp bên dưới khi đặt lớp s (không xét diện tích đỡ —
// đã được packContainer kiểm tra ở mức từng thùng).
function stackCapsOk(st, s){
  const pt = st.pt;
  if (st.h + s.h > pt._effMaxH - pt.H + 1e-6) return false;
  if (pt.maxLoadKg > 0 && st.weight + s.weight > pt.maxLoadKg + 1e-6) return false;
  let above = s.weight;
  for (let i = st.slabs.length - 1; i >= 0; i--){
    const j = st.slabs[i];
    if (st.slabs.length - i > j.capCount || above > j.capLoad + 1e-6) return false;
    above += j.weight;
  }
  return true;
}

/* "Nắp" 3D: xếp các thùng `items` vào khoảng trống phía trên chồng T (lấp khe của lớp đỉnh rồi chất lên trên),
   dùng packContainer với lớp sát dưới + lớp đỉnh làm "hạt giống" để tính đỡ thật theo từng thùng; không cho thùng
   mới xuống thấp hơn đáy lớp đỉnh. Trả về { base: các lớp giữ nguyên, cap: lớp đỉnh mới } hoặc null. */
function capFill3D(T, items, thrPct, opt){
  opt = opt || {};
  // chiều cao 1 tầng = hướng đứng CAO nhất mà thùng được phép (thùng xoay tự do vẫn có thể phải đứng để vừa diện tích)
  const maxItemH = Math.max(0, ...items.map(it=> Math.max(...it.orientations.map(o=> o.w))));
  const pt = T.pt, cargoH = pt._effMaxH - pt.H;
  const slabs = T.slabs, n = slabs.length;
  const top = n ? slabs[n-1] : null, below = n > 1 ? slabs[n-2] : null;
  const topBase = top ? T.h - top.h : 0;               // đáy lớp đỉnh (từ mặt pallet)
  const y0 = below ? topBase - below.h : topBase;        // gốc mini = đáy lớp sát dưới (hoặc đáy lớp đỉnh)
  const lift = below ? below.h : 0;                      // đáy lớp đỉnh trong hệ mini
  // không xây tháp: thùng mới lấp khe lớp đỉnh + tối đa 2 tầng thùng phía trên (chất từ thấp lên, trải kín mặt trước)
  const tiers = opt.maxTiers || 2;
  const capLimit = top ? lift + top.h + tiers * maxItemH : tiers * maxItemH;
  const mini = { L: pt.L, W: pt.W, H: Math.min(cargoH - y0, capLimit + 1e-6) };
  let k = 0;
  const seedOf = (c, y)=> ({ x:c.x, y, z:c.y, sizeX:c.w, sizeY:c.hh, sizeZ:c.l, skuId:c.skuId, weight:c.weight, fragile:!!c.fragile,
                             maxStackCount:c.maxStackCount, maxStackLoad:c.maxStackLoad, instanceId:'seed' + (k++), _loadOnTop:0, _stackCountAbove:0 });
  const seeds = [];
  if (below) below.cartons.forEach(c=> seeds.push(seedOf(c, 0)));
  if (top) top.cartons.forEach(c=> seeds.push(seedOf(c, lift + (c.oy || 0))));
  const zones = below ? [{ x:-1e5, y:0, z:-1e5, dx:2e5, dy:lift, dz:2e5 }] : [];
  const eps = [{ x:0, y:lift, z:0 }];
  if (top) top.cartons.forEach(c=>{
    const yb = lift + (c.oy || 0);
    eps.push({ x:c.x + c.w, y:yb, z:c.y }, { x:c.x, y:yb, z:c.y + c.l }, { x:c.x, y:yb + c.hh, z:c.y });
  });
  const baseW = T.weight - (top ? top.weight : 0) - (below ? below.weight : 0);
  const seedW = T.weight - baseW;
  let lim = pt.maxLoadKg > 0 ? pt.maxLoadKg - baseW : Infinity;
  if (opt.extraWeightCap != null) lim = Math.min(lim, seedW + opt.extraWeightCap);
  const r = packContainer(items, mini, zones, {
    supportThreshold: thrPct, loadingDirection: 'floor_to_top', heavyBottomPriority: true,
    seedPlaced: seeds, seedExtremePoints: eps, payloadLimit: isFinite(lim) ? lim : null
  });
  if (r.unplaced.length && !opt.allowPartial) return null;
  if (!r.placed.length && opt.allowPartial) return null;
  const capCartons = (top ? top.cartons.map(c=> Object.assign({}, c)) : []).concat(r.placed.map(p=> ({
    x: p.x, y: p.z, w: p.sizeX, l: p.sizeZ, hh: p.sizeY, oy: p.y - lift, skuId: p.skuId, weight: p.weight, fragile: !!p.fragile,
    orientCode: p.orientCode, maxStackCount: p.maxStackCount, maxStackLoad: p.maxStackLoad, tag: (items.find(i=> i.instanceId === p.instanceId) || {})._tag || null
  })));
  const cap = makeSlab(capCartons, pt);
  cap.full = false; // nắp luôn là lớp trên cùng
  const base = cloneStack(T);
  if (top){ base.slabs.pop(); rebuildStack(base); }
  if (!stackCapsOk(base, cap)) return null;
  return { base, cap, placedIds: new Set(r.placed.map(p=> p.instanceId)) };
}

/* Chế độ "chèn vào pallet thường": chọn 1 pallet T đã dựng; SKU nào trên T chưa đủ n thùng thì lấy thêm
   thùng của SKU đó từ LỚP ĐỈNH các pallet khác (không đụng lớp giữa → không phá kết cấu), rồi xếp vào
   khoảng trống phía trên T: lấp chung với lớp đỉnh đang thưa của T, hoặc thêm 1 lớp mới — miễn không vượt
   chiều cao, tải, và mỗi thùng được đỡ ≥ ngưỡng. Trả về phương án ít thùng phải dời nhất. */
function planCustomsFill(stacks, reqSkuIds, n, extraItems, thrPct, specFor, skuById, strap){
  const noPolicy = { mode:'full', layerOk: ()=> true, palletOk: ()=> true };
  let best = null;
  for (const T of stacks){
    const cnt = {};
    T.slabs.forEach(sl=> sl.cartons.forEach(c=> cnt[c.skuId] = (cnt[c.skuId] || 0) + 1));
    const takes = [];   // { S, carton }
    let ok = true;
    for (const id of reqSkuIds){
      let k = n - (cnt[id] || 0);
      if (k <= 0) continue;
      // nguồn: lớp đỉnh của pallet khác, ưu tiên pallet có lớp đỉnh đang thưa (bớt thùng ít ảnh hưởng nhất)
      const sources = stacks.filter(S=> S !== T && S.slabs.length).sort((a,b)=> a.slabs[a.slabs.length-1].coverage - b.slabs[b.slabs.length-1].coverage);
      for (const S of sources){
        if (k <= 0) break;
        const topS = S.slabs[S.slabs.length-1];
        // lấy thùng ở tầng cao nhất trước; chỉ lấy thùng không có thùng khác tựa lên;
        // chế độ vuông vức: tránh rút thùng ở 4 góc (giữ được nẹp góc cho pallet nguồn)
        const ref = slabBBox(S.slabs[0]), T0 = STRAP_TOL;
        const atCorner = (c)=> [[ref.x0 + T0, ref.y0 + T0], [ref.x1 - T0, ref.y0 + T0], [ref.x0 + T0, ref.y1 - T0], [ref.x1 - T0, ref.y1 - T0]]
          .some(([px, py])=> px >= c.x - 0.5 && px <= c.x + c.w + 0.5 && py >= c.y - 0.5 && py <= c.y + c.l + 0.5) ? 1 : 0;
        const cand = topS.cartons.filter(c=> c.skuId === id).sort((a,b)=> (strap ? atCorner(a) - atCorner(b) : 0) || ((b.oy || 0) - (a.oy || 0)));
        for (const c of cand){
          if (k <= 0) break;
          if (takes.some(t=> t.carton === c)) continue;
          const remainingSlab = { cartons: topS.cartons.filter(d=> !takes.some(t=> t.carton === d)) };
          if (!isExposedCarton(c, remainingSlab)) continue;
          takes.push({ S, carton: c }); k--;
        }
      }
      if (k > 0){ ok = false; break; }
    }
    if (!ok) continue;
    const moving = takes.map(t=> ({ skuId: t.carton.skuId, instanceId: 'kh' + (_looseUid++), weight: t.carton.weight, _tag: 'customs', _first: true }))
                        .concat(extraItems);
    const movingFull = ()=> moving.map(it=> looseItemFor(skuById[it.skuId], it.instanceId, it._tag || 'customs'));
    if (!moving.length){
      const cand = { T, newTop: null, replaceTop: false, takes, moved: 0, h: T.h, layered: -1, baseH: T.h };
      if (!best || best.layered > -1 || cand.h > best.h) best = cand;
      continue;
    }
    const pt = T.pt, spec = specFor(pt);
    const top = T.slabs[T.slabs.length - 1];
    const tries = [];
    if (top && !top.full) tries.push({ replaceTop: true, items: cartonsToItems(top).concat(moving) });   // lấp vào lớp đỉnh đang thưa
    tries.push({ replaceTop: false, items: moving });                                                    // thêm 1 lớp mới lên trên
    if (top && top.full) tries.push({ replaceTop: true, items: cartonsToItems(top).concat(moving) });    // xếp lại lớp đỉnh đầy + hàng kiểm hóa
    let cand = null;
    for (const tr of tries){
      const r = buildSlabsFromLoose(tr.items, pt, spec, skuById, noPolicy, { topOnly: true, ignorePolicy: true, maxTopLayers: 1 });
      if (!r.top.length || r.unplaced.length) continue;
      const clone = cloneStack(T);
      if (tr.replaceTop){ clone.slabs.pop(); rebuildStack(clone); }
      if (!canPlaceSlab(clone, r.top[0], thrPct, noPolicy, true)) continue;
      cand = { T, newTop: r.top[0], replaceTop: tr.replaceTop, takes, moved: moving.length, h: clone.h + r.top[0].h, layered: 0 };
      break;
    }
    if (!cand){
      // 1 lớp không đủ chỗ → lấp khe lớp đỉnh + chất thêm tầng phía trên (đỡ tính theo từng thùng).
      // 2 lượt: thùng kiểm hóa trước, HÀNG MẪU sau → mẫu luôn ở tầng trên cùng, không bị thùng khác đè.
      const all = movingFull();
      const samples = all.filter(it=> it._tag === 'sample'), regular = all.filter(it=> it._tag !== 'sample');
      let c3 = null;
      if (samples.length && regular.length){
        const a = capFill3D(T, regular, thrPct, { maxTiers: 99 });   // pallet kiểm hóa: chất tới chiều cao cho phép
        if (a){
          const T2 = cloneStack(a.base); T2.slabs.push(a.cap); rebuildStack(T2);
          const b = capFill3D(T2, samples, thrPct);
          if (b) c3 = { base: b.base, cap: b.cap };
        }
      }
      if (!c3 && !samples.length) c3 = capFill3D(T, all, thrPct, { maxTiers: 99 });
      if (!c3 && samples.length && !regular.length) c3 = capFill3D(T, samples, thrPct);
      if (c3) cand = { T, newTop: c3.cap, replaceTop: !!T.slabs.length, takes, moved: moving.length, h: c3.base.h + c3.cap.h, layered: 1 };
    }
    if (cand){
      cand.baseH = T.h - (cand.replaceTop && T.slabs.length ? T.slabs[T.slabs.length-1].h : 0);
      const better = !best || cand.layered < best.layered || (cand.layered === best.layered && (cand.baseH > best.baseH + 1 || (Math.abs(cand.baseH - best.baseH) <= 1 && cand.moved < best.moved)));
      if (better) best = cand;
    }
  }
  return best;
}

function applyCustomsFill(stacks, plan){
  const bySrc = new Map();
  plan.takes.forEach(t=>{ if (!bySrc.has(t.S)) bySrc.set(t.S, new Set()); bySrc.get(t.S).add(t.carton); });
  for (const [S, set] of bySrc){
    const top = S.slabs.pop();
    const rest = top.cartons.filter(c=> !set.has(c));
    if (rest.length) S.slabs.push(makeSlab(rest, S.pt, top.refCov));
    rebuildStack(S);
    if (!S.slabs.length) stacks.splice(stacks.indexOf(S), 1);
  }
  const T = plan.T;
  if (plan.newTop){
    if (plan.replaceTop) T.slabs.pop();
    T.slabs.push(plan.newTop);
    rebuildStack(T);
  }
  T.kind = 'customs';
}

/* Gom SKU CÙNG / GẦN CÙNG kích thước thành "nhóm kích thước" để chất chung như 1 loại thùng.
   Điều kiện: cùng loại pallet, cùng quyền xoay / fragile / giới hạn chồng; dài & rộng chênh ≤ tol, cao chênh ≤ LAYER_H_TOL
   (cài đặt "chênh cao cho phép trong 1 lớp"); và chính sách trộn cho phép các SKU này chung pallet. Hàng mẫu không gom. */
function groupSimilarSkus(skus, P, typeOf, policy){
  if (P.groupSimilar === false || policy.mode === 'none') return skus.map(s=> [s]);
  // dài/rộng chênh ≤ tol (thùng đặt trong ô của thùng lớn nhất, chừa khe vài mm); chiều cao chênh ≤ LAYER_H_TOL —
  // lớp trên tựa lên thùng cao hơn, thùng thấp hơn có khe ≤ LAYER_H_TOL (vẫn tính là đỡ — thùng carton lún/bù bằng bìa).
  const tol = P.similarTol != null ? P.similarTol : 10, tolH = LAYER_H_TOL;
  const sig = (s)=> [typeOf(s.id).id, !!s.rotLocked, !!s.rotFree, !!s.rotYaw, !!s.rotRoll, !!s.rotPitch, !!s.thisSideUp, !!s.fragile,
                     s.maxStackCount == null ? '' : s.maxStackCount, s.maxStackLoad == null ? '' : s.maxStackLoad].join('|');
  const fams = [];
  for (const s of skus){
    if (s.isSample){ fams.push([s]); continue; }
    const f = fams.find(f=> !f[0].isSample && sig(f[0]) === sig(s) &&
      f.every(o=> Math.abs(o.L - s.L) <= tol && Math.abs(o.W - s.W) <= tol && Math.abs(o.H - s.H) <= tolH) &&
      policy.palletOk(f.map(o=> o.id).concat([s.id])));
    if (f) f.push(s); else fams.push([s]);
  }
  return fams;
}

// 1 lớp theo kế hoạch của nhóm kích thước, mỗi ô gán 1 SKU (ids theo thứ tự ô sắp theo x,y → SKU nằm thành khối).
// Thùng thật đặt ở góc ô, kích thước thật (≤ ô) theo CÙNG mã hướng xoay với thùng đại diện.
function slabFromAssignment(plan, li, ids, pt, skuById){
  const layer = plan.layers[li];
  const rects = pickLayerRects(layer, ids.length).slice().sort((a,b)=> (a.x - b.x) || (a.y - b.y));
  const cartons = rects.map((r, i)=>{
    const sku = skuById[ids[i]];
    const oRep = layer.orients.find(o=> Math.abs(o.d - r.w) < 1e-6 && Math.abs(o.h - r.h) < 1e-6) || layer.orients[0];
    const oAct = generateOrientations(sku).find(o=> o.code === oRep.code) || { d: r.w, h: r.h, w: layer.hUp, code: oRep.code };
    return cartonFromSku(sku, r.x - plan.oh, r.y - plan.oh, Math.min(oAct.d, r.w), Math.min(oAct.h, r.h), oAct.w, oAct.code);
  });
  const avgArea = cartons.reduce((t,c)=> t + c.w * c.l, 0) / Math.max(1, cartons.length);
  return makeSlab(cartons, pt, layer.count * avgArea / (pt.L * pt.W));
}

/* runPalletOptimizerCore — điều phối mode Pallet.
   opts.pallet: { types[], defaultTypeId, customs{enabled,n,typeId,side}, patternMode, mixMode, mixN, mixK,
                  keepTopPct, doubleStack{enabled,maxLoadOnBottom}, liftClearance }                         */
function runPalletOptimizerCore(skus, container, zones, opts, onProgress, onImprove){
  const P = opts.pallet;
  const hLimit = Math.max(0, Math.min(container.H, (container.doorH || container.H) - (P.liftClearance || 0)));
  const notes = [];
  const types = P.types.map(t=>{
    const oc = overhangCapForPallet(t, container);
    const ohEff = Math.min(t.overhang || 0, oc.cap);
    if ((t.overhang || 0) > oc.cap) notes.push(`Pallet ${t.name}: chìa mép đặt ${t.overhang} mm/bên nhưng chỉ dùng ${ohEff} mm — chìa hơn sẽ mất chỗ (bề ngang dùng được ${oc.usableW} mm cho ${oc.nW} pallet/hàng ngang, dài ${container.L} mm cho ${oc.nL} pallet nối đuôi).`);
    return Object.assign({}, t, { _effMaxH: Math.min(t.maxHeight ? t.maxHeight : hLimit, hLimit), _ohEff: ohEff, _ohCap: oc.cap });
  });
  const typeById = {}; types.forEach(t=> typeById[t.id] = t);
  const defType = typeById[P.defaultTypeId] || types[0];
  const skuById = {}; skus.forEach(s=> skuById[s.id] = s);
  const typeOf = (skuId)=> typeById[(skuById[skuId] || {}).palletTypeId] || defType;
  const thr = opts.supportThreshold ?? 70;
  const policy = makeMixPolicy(P, (id)=> (skuById[id] || {})._mixGroup || '');
  const keepTop = (P.keepTopPct ?? 50) / 100;
  const planInfo = [], stacks = [];
  if (onProgress) onProgress(0, 1, 'Tầng 1 — lập mẫu lớp & chất thùng lên pallet...');

  const bySku = {};
  for (const it of expandSkuToItems(skus)) (bySku[it.skuId] = bySku[it.skuId] || []).push(it);

  // Kế hoạch lớp cho từng SKU (trên loại pallet của SKU) + thông số lớp dùng khi ghép thùng lẻ
  const plans = {}, specCache = {};
  for (const sku of skus){ plans[sku.id] = planSkuPallet(sku, typeOf(sku.id), P, thr); }
  const specFor = (pt)=> (skuId)=>{
    const key = pt.id + '|' + skuId;
    if (!(key in specCache)){
      const plan = plans[skuId] && plans[skuId].ptypeId === pt.id ? plans[skuId] : planSkuPallet(skuById[skuId], pt, P, thr);
      specCache[key] = layerSpecOf(skuById[skuId], pt, plan);
    }
    return specCache[key];
  };

  // (1) Pallet kiểm hóa: n thùng mỗi SKU (trừ hàng mẫu) + toàn bộ hàng mẫu
  const customsOn = !!(P.customs && P.customs.enabled && P.customs.n > 0);
  const customsFill = customsOn && (P.customs.mode || 'fill') === 'fill';
  const customsLayers = customsOn && P.customs.mode === 'layers';
  // take: lấy từ lớp đỉnh pallet khác | reserve: giữ riêng từ đầu. Vuông vức: rút thùng làm lớp đỉnh thiếu → dùng reserve.
  const fillStage = customsFill ? (P.customs._fillStage || (P.strapMode ? 'reserve' : 'take')) : null;
  const customsSet = [], errors = [], sampleItems = [];
  if (customsFill && fillStage === 'take'){
    // "Chèn vào pallet thường": KHÔNG giữ riêng thùng kiểm hóa (để pallet SKU vẫn tròn); chỉ tách hàng mẫu
    for (const sku of skus){
      if (sku.isSample) (bySku[sku.id] || []).splice(0).forEach(it=>{ it._first = true; it._tag = 'sample'; sampleItems.push(it); });
      else if ((bySku[sku.id] || []).length < P.customs.n) errors.push(`SKU "${sku.code || sku.id}" chỉ có ${(bySku[sku.id] || []).length} thùng, ít hơn n = ${P.customs.n} thùng cho pallet kiểm hóa (đánh dấu "Hàng mẫu" nếu đây là hàng mẫu).`);
    }
  } else if (customsOn){
    // tách riêng, hoặc "chèn vào pallet thường" giai đoạn B: giữ riêng n thùng mỗi SKU + hàng mẫu từ đầu
    for (const sku of skus){
      const list = bySku[sku.id] || [];
      if (sku.isSample){
        list.splice(0).forEach(it=>{ it._first = true; it._tag = 'sample'; customsSet.push(it); });
        continue;
      }
      if (list.length < P.customs.n) errors.push(`SKU "${sku.code || sku.id}" chỉ có ${list.length} thùng, ít hơn n = ${P.customs.n} thùng cho pallet kiểm hóa (đánh dấu "Hàng mẫu" nếu đây là hàng mẫu).`);
      // "mỗi lớp 1 SKU": giữ riêng ĐỦ LỚP (bội số số thùng/lớp, ≥ n) để mỗi SKU là 1 lớp hoàn chỉnh trên pallet kiểm hóa
      let k = P.customs.n;
      if (customsLayers && plans[sku.id]){ const per = plans[sku.id].layers[0].count; k = Math.ceil(P.customs.n / per) * per; }
      list.splice(0, Math.min(k, list.length)).forEach(it=>{ it._first = true; it._tag = 'customs'; customsSet.push(it); });
    }
  }
  if (errors.length) return { mode:'pallet', errors };

  // (2) Pallet thuần SKU: pallet nguyên + pallet lẻ gồm các LỚP ĐẦY (+ lớp trên cùng nếu ≥ keepTop)
  let pool = [];
  // số thùng giữ lại trên pallet khi còn dư r thùng: đủ lớp; lớp dở chỉ giữ nếu ≥ keepTop (vuông vức: ≥ 4 thùng)
  const keepCountFor = (plan, r)=>{
    let keep = 0;
    for (let li=0; li<plan.layers.length; li++){
      const c = plan.layers[li].count, left = r - keep;
      if (left <= 0) break;
      if (left >= c){ keep += c; continue; }
      if (policy.mode === 'none' || (!policy.strap && left / c >= keepTop - 1e-9)) keep += left;   // vuông vức: không giữ lớp lẻ
      break;
    }
    return keep;
  };
  const planSingle = (sku)=>{
    const list = bySku[sku.id] || [];
    if (!list.length) return;
    const pt = typeOf(sku.id), plan = plans[sku.id];
    if (!plan){
      notes.push(`SKU "${sku.code || sku.id}": không lập được mẫu lớp trên ${pt.name} — chuyển sang ghép lớp.`);
      pool.push(...list);
      planInfo.push({ skuId: sku.id, ptypeName: pt.name, perPallet: 0, nFull: 0, remainder: list.length });
      return;
    }
    const nFull = Math.floor(list.length / plan.count);
    for (let i=0; i<nFull; i++){
      list.splice(0, plan.count);
      const st = newStack(pt, 'full'); st.pattern = plan.lp.kind; st.nSec = plan.nSec;
      slabsFromPlan(plan, sku, plan.count, pt).forEach(s=> pushSlab(st, s));
      stacks.push(st);
    }
    let remainder = list.length, toPool = 0;
    if (remainder > 0){
      const keep = keepCountFor(plan, remainder);
      toPool = remainder - keep;
      if (keep > 0){
        list.splice(0, keep);
        const st = newStack(pt, 'partial'); st.pattern = plan.lp.kind;
        slabsFromPlan(plan, sku, keep, pt).forEach(s=> pushSlab(st, s));
        stacks.push(st);
      }
      pool.push(...list.splice(0));
    }
    planInfo.push({ skuId: sku.id, ptypeName: pt.name, perPallet: plan.count, perLayer: plan.layers.map(l=> l.count),
                    layers: plan.layers.length, pattern: plan.lp.kind, nSec: plan.nSec, secHUp: plan.secHUp, fallback: !!plan.lp.fallback, interlockQ: plan.lp.q,
                    hUp: plan.hUp, nFull, remainder, toPool, weightLimited: plan.weightLimited,
                    suggestion: interlockSuggestion(sku, pt, plan, P, thr, types) });
  };

  /* Nhóm SKU cùng/gần cùng kích thước: lập 1 kế hoạch lớp cho cả nhóm (thùng đại diện = kích thước lớn nhất),
     rồi rót thùng theo thứ tự SKU vào từng ô lớp → pallet nguyên đủ thùng; SKU chỉ đổi giữa chừng 1 lớp nếu chính
     sách trộn cho phép (N SKU/lớp), không thì phần lẻ của SKU trước đem đi ghép. */
  const planFamily = (fam)=>{
    const pt = typeOf(fam[0].id);
    const rep = Object.assign({}, fam[0], { id: 'fam_' + fam.map(k=> k.id).join('_'),
      L: Math.max(...fam.map(k=> k.L)), W: Math.max(...fam.map(k=> k.W)), H: Math.max(...fam.map(k=> k.H)), weight: Math.max(...fam.map(k=> k.weight)) });
    const plan = planSkuPallet(rep, pt, P, thr);
    if (!plan){ fam.forEach(planSingle); return; }
    const queue = fam.slice().sort((a,b)=> (bySku[b.id] || []).length - (bySku[a.id] || []).length)
      .map(k=> ({ sku: k, list: bySku[k.id] || [] })).filter(q=> q.list.length);
    const left = ()=> queue.reduce((t,q)=> t + q.list.length, 0);
    const famCodes = fam.map(k=> k.code || k.id);
    const fullCount = {};
    const take = (k, palSkus)=>{
      const out = [];
      while (out.length < k && queue.length){
        const q = queue[0];
        const ids = Array.from(new Set(out.concat([q.sku.id])));
        if (out.length && (!policy.layerOk(ids) || !policy.palletOk(Array.from(new Set([...palSkus, ...ids]))))) break;
        // không được trộn trong lớp: phần lẻ (< 1 lớp) của SKU này đem đi ghép, lớp bắt đầu bằng SKU kế tiếp
        if (!out.length && q.list.length < k && queue.length > 1 && !policy.layerOk([q.sku.id, queue[1].sku.id])){
          pool.push(...q.list.splice(0)); queue.shift(); continue;
        }
        const t = Math.min(k - out.length, q.list.length);
        q.list.splice(0, t);
        for (let i=0; i<t; i++) out.push(q.sku.id);
        if (!q.list.length) queue.shift();
      }
      return out;
    };
    const build = (target, kind)=>{
      const st = newStack(pt, kind); st.pattern = plan.lp.kind; st.nSec = plan.nSec;
      let n = 0;
      for (let li=0; li<plan.layers.length && n < target; li++){
        const k = Math.min(plan.layers[li].count, target - n);
        const ids = take(k, st.skus);
        if (!ids.length) break;
        pushSlab(st, slabFromAssignment(plan, li, ids, pt, skuById));
        n += ids.length;
        if (ids.length < plan.layers[li].count) break;
      }
      if (n) stacks.push(st);
      return n;
    };
    let nFullPal = 0;
    while (left() >= plan.count){
      const before = stacks.length;
      const n = build(plan.count, 'full');
      if (!n) break;
      if (n < plan.count && stacks.length > before) stacks[stacks.length - 1].kind = 'partial';
      else { nFullPal++; stacks[stacks.length - 1].skus.forEach(id=> fullCount[id] = (fullCount[id] || 0) + 1); }
    }
    const r = left();
    if (r > 0){
      const keep = keepCountFor(plan, r);
      if (keep > 0) build(keep, 'partial');
      queue.forEach(q=> pool.push(...q.list.splice(0)));
    }
    fam.forEach(k=> planInfo.push({ skuId: k.id, ptypeName: pt.name, perPallet: plan.count, perLayer: plan.layers.map(l=> l.count),
      layers: plan.layers.length, pattern: plan.lp.kind, nSec: plan.nSec, secHUp: plan.secHUp, fallback: !!plan.lp.fallback, interlockQ: plan.lp.q,
      hUp: plan.hUp, nFull: fullCount[k.id] || 0, remainder: 0, weightLimited: plan.weightLimited,
      familyWith: famCodes.filter(c=> c !== (k.code || k.id)), familyPallets: nFullPal }));
  };

  const families = groupSimilarSkus(skus, P, typeOf, policy);
  for (const fam of families){ if (fam.length === 1) planSingle(fam[0]); else planFamily(fam); }

  // (3) Pallet kiểm hóa: hàng kiểm hóa/mẫu đủ nhiều → lớp đều trước; phần còn lại nằm trên ĐÚNG 1 lớp trên
  //     cùng (dễ kiểm), chỗ trống lớp đó lấp bằng thùng lẻ. Sau đó chồng này được gộp lên 1 chồng khác nếu vừa.
  let customsStack = null, customsLayerSlabs = null, customsLayerPt = null;
  if (customsOn && !customsFill){
    let pt = typeById[P.customs.typeId] || defType;
    if (P._uncappedTypes){
      // chế độ dàn đều: pallet kiểm hóa được miễn giới hạn cao/tải người dùng đặt
      const raw = P._uncappedTypes.find(t=> t.id === pt.id);
      if (raw) pt = Object.assign({}, raw, { _effMaxH: Math.min(raw.maxHeight ? raw.maxHeight : hLimit, hLimit), _ohEff: pt._ohEff, _ohCap: pt._ohCap });
    }
    const spec = specFor(pt);
    const noPolicy = { mode:'full', layerOk: ()=> true, palletOk: ()=> true };
    const fail = (msg)=> ({ mode:'pallet', errors:[msg] });
    if (customsLayers){
      // Mỗi SKU 1 lớp hoàn chỉnh theo mẫu lớp của nó (đứng ở hông pallet thấy đủ mã). Ở đây chỉ CHUẨN BỊ các lớp;
      // việc đặt lên pallet (và thứ tự lớp, hàng lấp, hàng mẫu trên cùng) làm ở bước (5a) sau khi lắp ráp pallet thường.
      const layerSlabs = []; let okL = true;
      for (const sku of skus){
        if (sku.isSample) continue;
        const its = customsSet.filter(it=> it.skuId === sku.id);
        if (!its.length) continue;
        const plan = planSkuPallet(sku, pt, P, thr);
        if (!plan){ okL = false; break; }
        slabsFromPlan(plan, sku, its.length, pt).forEach(sl=>{ sl.cartons.forEach(c=> c.tag = 'customs'); layerSlabs.push(sl); });
      }
      if (!okL){
        return runPalletOptimizerCore(skus, container, zones, Object.assign({}, opts, { pallet: Object.assign({}, P,
          { customs: Object.assign({}, P.customs, { mode: 'separate', _fromLayers: true }) }) }), onProgress, onImprove);
      }
      customsLayerSlabs = layerSlabs;
      customsLayerPt = pt;
    } else {
    // lớp đều (phía dưới) chỉ dựng từ thùng kiểm hóa thường; HÀNG MẪU luôn nằm ở lớp đỉnh để kiểm không phải dỡ pallet
    const base = buildSlabsFromLoose(customsSet.filter(it=> it._tag !== 'sample'), pt, spec, skuById, noPolicy, { noTop: true });
    const rest = customsSet.filter(it=> !base.usedIds.has(it.instanceId));
    let topSlab = null, usedPool = new Set(), finalSlabs = null;
    if (rest.length){
      const top = buildSlabsFromLoose(rest.concat(pool), pt, spec, skuById, noPolicy, { topOnly: true, ignorePolicy: true, maxTopLayers: 1 });
      let missing = rest.filter(it=> !top.usedIds.has(it.instanceId));
      if (!top.top.length || missing.length){
        // 1 lớp không đủ chỗ → đặt các lớp đều (nếu có) trước, rồi xếp hàng kiểm hóa/mẫu thành 2-3 tầng thùng
        // phía trên (đỡ tính theo từng thùng). 2 lượt: thùng kiểm hóa trước, HÀNG MẪU sau → mẫu ở tầng trên cùng.
        const baseSt = newStack(pt, 'customs');
        base.uniform.forEach(sl=> pushSlab(baseSt, sl));
        const full = rest.map(it=> looseItemFor(skuById[it.skuId], it.instanceId, it._tag));
        const reg = full.filter(it=> it._tag !== 'sample'), smp = full.filter(it=> it._tag === 'sample');
        let c3 = null;
        if (reg.length && smp.length){
          const a1 = capFill3D(baseSt, reg, thr);
          if (a1){ const T2 = cloneStack(a1.base); T2.slabs.push(a1.cap); rebuildStack(T2); const b1 = capFill3D(T2, smp, thr); if (b1) c3 = b1; }
        }
        if (!c3) c3 = capFill3D(baseSt, full, thr);
        if (c3){ finalSlabs = c3.base.slabs.concat([c3.cap]); missing = []; }
      }
      if (!finalSlabs && (!top.top.length || missing.length))
        return fail(`Pallet kiểm hóa (${pt.name}) không đủ chỗ cho ${rest.length} thùng kiểm hóa/mẫu (n = ${P.customs.n} × SKU + hàng mẫu), kể cả khi chất 2-3 tầng — thiếu ${missing.length || rest.length} thùng. Giảm n, chọn pallet lớn hơn, hoặc bớt hàng mẫu.`);
      if (!finalSlabs){ topSlab = top.top[0]; usedPool = top.usedIds; }
    }
    customsStack = newStack(pt, 'customs');
    let stackOk = true;
    for (const s of (finalSlabs || base.uniform.concat(topSlab ? [topSlab] : []))){
      if (!finalSlabs && !canPlaceSlab(customsStack, s, thr, noPolicy, true)){ stackOk = false; break; }
      pushSlab(customsStack, s);
    }
    if (!stackOk){
      // các lớp kiểm hóa xếp độc lập không khớp đỡ nhau → xếp lại toàn bộ hàng kiểm hóa/mẫu bằng "nắp" 3D trên mặt pallet
      // (đỡ tính theo từng thùng; 2 lượt: thùng kiểm hóa trước, hàng mẫu sau)
      const all = customsSet.map(it=> looseItemFor(skuById[it.skuId], it.instanceId, it._tag));
      const reg = all.filter(it=> it._tag !== 'sample'), smp = all.filter(it=> it._tag === 'sample');
      const empty = newStack(pt, 'customs');
      let c3 = null;
      // pallet kiểm hóa riêng → cho xếp nhiều tầng tới chiều cao cho phép (chất từ thấp lên, trải kín mặt trước)
      const T99 = { maxTiers: 99 };
      if (reg.length && smp.length){
        const a1 = capFill3D(empty, reg, thr, T99);
        if (a1){ const T2 = cloneStack(a1.base); T2.slabs.push(a1.cap); rebuildStack(T2); c3 = capFill3D(T2, smp, thr); }
      }
      if (!c3) c3 = capFill3D(empty, all, thr, T99);
      if (!c3) return fail(`Pallet kiểm hóa (${pt.name}) không đủ chỗ cho ${customsSet.length} thùng kiểm hóa/mẫu trong giới hạn cao/tải pallet.`);
      customsStack = newStack(pt, 'customs');
      c3.base.slabs.concat([c3.cap]).forEach(sl=> pushSlab(customsStack, sl));
      usedPool = new Set();
    }
    pool = pool.filter(it=> !usedPool.has(it.instanceId));
    }
    if (customsStack) stacks.push(customsStack);
  }

  // (4) TÁI LẮP RÁP: tháo các pallet lẻ thành lớp; lớp đầy + lớp dở + thùng lẻ được lắp lại thành ít pallet
  //     nhất có thể (thử nhiều phương án, chọn tốt nhất). "Không trộn": giữ nguyên pallet lẻ của từng SKU.
  const leftoverItems = [];
  const byPt = new Map();
  const grp = (pt)=>{ if (!byPt.has(pt.id)) byPt.set(pt.id, { pt, base: [], full: [], loose: [], blocks: [] }); return byPt.get(pt.id); };
  const keepStacks = [];
  for (const st of stacks){
    if (st.kind === 'customs') continue;
    if (st.kind === 'partial' && policy.mode !== 'none'){
      const g = grp(st.pt);
      st.slabs.forEach(sl=>{ if (sl.full) g.full.push(sl); else g.loose.push(...cartonsToItems(sl)); });
    } else keepStacks.push(st);
  }
  for (const it of pool) grp(typeOf(it.skuId)).loose.push(it);
  if (customsStack) grp(customsStack.pt).blocks.push({ kind:'customs', slabs: customsStack.slabs, h: customsStack.h, area: customsStack.slabs[customsStack.slabs.length-1].area });
  const finalStacks = keepStacks.filter(st=> !byPt.has(st.pt.id));
  // Vuông vức + "chèn vào pallet thường": lớp không đủ thùng không được nằm trên pallet thường → gom thùng của chúng
  // làm hàng lấp cho phần kiểm hóa (pallet kiểm hóa được miễn vuông vức). Không vừa thì tool tự chạy lại không dồn.
  const strapDivert = policy.strap && (customsFill || customsLayers) && !P.customs._noDivert;
  const strapLeft = [];
  const VARIANTS = [];
  for (const groupOrder of ['desc','asc']) for (const fit of ['best','first']) for (const topOrder of ['area','h']) VARIANTS.push({ groupOrder, fit, topOrder });
  for (const g of byPt.values()){
    const spec = specFor(g.pt);
    const base = keepStacks.filter(st=> st.pt.id === g.pt.id);
    // Phương án lớp từ thùng lẻ: (a) theo từng SKU rồi gộp lớp dở; (b) trộn chung theo nhóm chiều cao
    const looseVariants = [];
    {
      const bySkuL = new Map(); g.loose.forEach(it=>{ if (!bySkuL.has(it.skuId)) bySkuL.set(it.skuId, []); bySkuL.get(it.skuId).push(it); });
      const uni = [], tops = [], un = [];
      for (const list of bySkuL.values()){ const r = buildSlabsFromLoose(list, g.pt, spec, skuById, policy, {}); uni.push(...r.uniform); tops.push(...r.top); un.push(...r.unplaced); }
      looseVariants.push({ uniform: uni, tops: mergeTopSlabs(tops, g.pt, spec, skuById, policy), unplaced: un });
    }
    if (policy.mode !== 'none' && g.loose.length){
      const r = buildSlabsFromLoose(g.loose, g.pt, spec, skuById, policy, {});
      looseVariants.push({ uniform: r.uniform, tops: mergeTopSlabs(r.top, g.pt, spec, skuById, policy), unplaced: r.unplaced });
    }
    let best = null;
    let fullIn = g.full;
    if (strapDivert){
      // chỉ lớp ĐỦ được lắp vào pallet thường; lớp thiếu → thùng lấp phần kiểm hóa
      fullIn = g.full.filter(isCompleteSlab);
      g.full.filter(sl=> !isCompleteSlab(sl)).forEach(sl=> strapLeft.push(...cartonsToItems(sl)));
      for (const lv of looseVariants){
        lv.uniform.filter(sl=> !isCompleteSlab(sl)).forEach(sl=> lv.unplaced.push(...cartonsToItems(sl).map(it=> Object.assign(it, { _divert: true }))));
        lv.uniform = lv.uniform.filter(isCompleteSlab);
        lv.tops.forEach(sl=> lv.unplaced.push(...cartonsToItems(sl).map(it=> Object.assign(it, { _divert: true }))));
        lv.tops = [];
      }
    }
    for (const lv of looseVariants) for (const v of VARIANTS){
      const blocks = g.blocks.concat(lv.tops.map(sl=> ({ kind:'top', slabs:[sl], h: sl.h, area: sl.area })));
      const res = assembleSlabs(base, fullIn.concat(lv.uniform), blocks, g.pt, thr, policy, v, { skuById });
      res.unplaced = lv.unplaced;
      const better = !best || res.key[0] < best.key[0] || (res.key[0] === best.key[0] && (res.key[1] < best.key[1] || (res.key[1] === best.key[1] && res.key[2] < best.key[2])));
      if (better) best = res;
    }
    finalStacks.push(...best.stacks);
    best.unplaced.forEach(it=> (it._divert ? strapLeft : leftoverItems).push(it));
    best.failed.forEach(sl=> sl.cartons.forEach(c=> leftoverItems.push({ skuId: c.skuId })));
  }
  stacks.length = 0; stacks.push(...finalStacks);

  // (5a) Pallet kiểm hóa "mỗi SKU 1 lớp hoàn chỉnh": đặt các lớp kiểm hóa lên 1 pallet thường còn đủ chỗ (hàng thường
  //      ở dưới = "còn dư thì chất thêm") hoặc lên pallet riêng; thùng lẻ dồn (vuông vức) + hàng mẫu ở trên cùng.
  if (customsLayerSlabs){
    const noPolicy = { mode:'full', layerOk: ()=> true, palletOk: ()=> true };
    const area = (sl)=>{ const b = slabBBox(sl); return (b.x1 - b.x0) * (b.y1 - b.y0); };
    const sorted = customsLayerSlabs.slice().sort((a,b)=> (isCompleteSlab(b) - isCompleteSlab(a)) || (area(b) - area(a)) || (b.weight - a.weight));
    const perms = (arr)=> arr.length <= 1 ? [arr] : arr.flatMap((x,i)=> perms(arr.slice(0,i).concat(arr.slice(i+1))).map(p=> [x].concat(p)));
    const seqs = sorted.length <= 5 ? [sorted].concat(perms(sorted)) : [sorted];
    const samples = customsSet.filter(it=> it._tag === 'sample').map(it=> looseItemFor(skuById[it.skuId], it.instanceId, 'sample'));
    const fillers = strapLeft.map(it=> looseItemFor(skuById[it.skuId], it.instanceId || ('lf' + (_looseUid++)), 'fill'));
    const tryOn = (base)=>{
      for (const seq of seqs){
        const st = cloneStack(base); st.kind = 'customs';
        let ok = true;
        for (const sl of seq){ if (!canPlaceSlab(st, sl, thr, noPolicy, true)){ ok = false; break; } pushSlab(st, sl); }
        if (!ok) continue;
        let cur = st, used = new Set();
        // thùng lẻ trước (xếp được bao nhiêu hay bấy nhiêu), hàng mẫu sau cùng (bắt buộc đủ) → mẫu ở đỉnh
        if (fillers.length){
          const c3 = capFill3D(cur, fillers, thr, { maxTiers: 99, allowPartial: true });
          if (c3){ cur = newStack(cur.pt, 'customs'); c3.base.slabs.concat([c3.cap]).forEach(sl=> pushSlab(cur, sl)); used = c3.placedIds; }
        }
        if (samples.length){
          const c3 = capFill3D(cur, samples, thr, { maxTiers: 99 });
          if (!c3) continue;
          cur = newStack(cur.pt, 'customs'); c3.base.slabs.concat([c3.cap]).forEach(sl=> pushSlab(cur, sl));
        }
        return { st: cur, used };
      }
      return null;
    };
    // chọn: dồn được nhiều thùng lẻ nhất → đặt trên pallet thường (đỡ tốn chỗ sàn) → pallet đế cao nhất
    let best = null;
    const consider = (T, r)=>{ if (r && (!best || r.used.size > best.r.used.size || (r.used.size === best.r.used.size && (!!T) > (!!best.T)) ||
      (r.used.size === best.r.used.size && !!T === !!best.T && T && T.h > best.T.h))) best = { T, r }; };
    for (const T of stacks.filter(x=> x.pt.id === customsLayerPt.id && x.kind !== 'customs')) consider(T, tryOn(T));
    consider(null, tryOn(newStack(customsLayerPt, 'customs')));
    if (!best){
      return runPalletOptimizerCore(skus, container, zones, Object.assign({}, opts, { pallet: Object.assign({}, P,
        { customs: Object.assign({}, P.customs, { mode: 'separate', _fromLayers: true }) }) }), onProgress, onImprove);
    }
    if (best.T){ best.T.slabs = best.r.st.slabs; rebuildStack(best.T); best.T.kind = 'customs'; }
    else stacks.push(best.r.st);
    // thùng lẻ không lên được pallet kiểm hóa → 1 pallet lẻ riêng (có cảnh báo không nẹp/đai được)
    const restF = fillers.filter(it=> !best.r.used.has(it.instanceId));
    if (restF.length){
      const sl = buildSlabsFromLoose(restF, customsLayerPt, specFor(customsLayerPt), skuById, { mode:'full', layerOk: ()=> true, palletOk: ()=> true }, {});
      const st = newStack(customsLayerPt, 'mixed');
      sl.uniform.concat(sl.top).forEach(x=>{ if (canPlaceSlab(st, x, thr, { layerOk: ()=> true, palletOk: ()=> true }, true)) pushSlab(st, x); else x.cartons.forEach(c=> leftoverItems.push({ skuId: c.skuId })); });
      if (st.slabs.length) stacks.push(st);
      sl.unplaced.forEach(it=> leftoverItems.push({ skuId: it.skuId }));
    }
    notes.push(`Pallet kiểm hóa: mỗi SKU 1 lớp hoàn chỉnh (${sorted.length} lớp)${best.T ? ', đặt trên 1 pallet thường còn chỗ' : ', pallet riêng'}${best.r.used.size ? `; ${best.r.used.size} thùng lẻ dồn lên trên` : ''}${samples.length ? '; hàng mẫu trên cùng' : ''}.`);
  }

  // (5) Pallet kiểm hóa kiểu "chèn vào pallet thường": chọn pallet ít phải dời thùng nhất
  if (customsFill){
    // take: SKU chưa đủ n thùng trên pallet được chọn thì lấy thêm từ lớp đỉnh pallet khác.
    // reserve: n thùng mỗi SKU (+ hàng mẫu) đã giữ riêng từ đầu → xếp lên khoảng trống phía trên 1 pallet thường.
    const req = fillStage === 'take' ? skus.filter(s=> !s.isSample).map(s=> s.id) : [];
    const extra = (fillStage === 'take' ? sampleItems : customsSet).concat(strapLeft.map(it=> Object.assign(it, { _tag: it._tag || 'fill' })));
    const plan = planCustomsFill(stacks, req, P.customs.n, extra, thr, specFor, skuById, policy.strap);
    if (!plan && strapLeft.length){
      // không dồn được lớp lẻ vào pallet kiểm hóa → chạy lại, để lớp lẻ thành pallet riêng (có cảnh báo)
      return runPalletOptimizerCore(skus, container, zones, Object.assign({}, opts, { pallet: Object.assign({}, P, { customs: Object.assign({}, P.customs, { _noDivert: true }) }) }), onProgress, onImprove);
    }
    if (!plan){
      // take thất bại (vd SKU chỉ nằm ở lớp giữa) → thử reserve; reserve thất bại → quy trình "tách riêng"
      // (lớp kiểm hóa vẫn được gộp lên trên 1 pallet thường nếu vừa; báo cáo ghi đúng kết quả cuối)
      const next = fillStage === 'take'
        ? Object.assign({}, P.customs, { _fillStage: 'reserve' })
        : Object.assign({}, P.customs, { mode: 'separate', _fromFill: true, _fillStage: undefined });
      return runPalletOptimizerCore(skus, container, zones, Object.assign({}, opts, { pallet: Object.assign({}, P, { customs: next }) }), onProgress, onImprove);
    }
    applyCustomsFill(stacks, plan);
    if (strapLeft.length) notes.push(`Vuông vức: ${strapLeft.length} thùng lẻ (không đủ 1 lớp) được dồn lên phần kiểm hóa của pallet kiểm hóa thay vì nằm thành lớp lẻ trên pallet thường.`);
    notes.push(!plan.moved
      ? `Pallet kiểm hóa: đã có sẵn 1 pallet chứa đủ ≥ ${P.customs.n} thùng mọi SKU — không phải dời thùng.`
      : fillStage === 'take'
        ? `Pallet kiểm hóa: chèn ${plan.moved} thùng (SKU chưa đủ ${P.customs.n} thùng${sampleItems.length ? ' + hàng mẫu' : ''}) vào khoảng trống phía trên 1 pallet thường; thùng lấy từ lớp đỉnh các pallet khác.`
        : `Pallet kiểm hóa: ${plan.moved} thùng kiểm hóa/mẫu (giữ riêng từ đầu) được xếp vào khoảng trống phía trên 1 pallet thường.`);
  }

  let customsModeUsed = customsOn ? (customsFill ? 'fill' : customsLayers ? 'layers' : 'separate') : null;
  if (customsOn && !customsFill){
    const cs = stacks.find(st=> st.kind === 'customs');
    const merged = cs && customsStack && cs.slabs.length > customsStack.slabs.length;
    if (merged && !customsLayers) customsModeUsed = 'fill';
    if (P.customs._fromFill) notes.unshift(merged
      ? 'Pallet kiểm hóa: không đủ thùng ở lớp đỉnh để chèn trực tiếp → tool giữ riêng n thùng/SKU thành lớp kiểm hóa và đặt lên trên 1 pallet thường.'
      : 'Pallet kiểm hóa: không pallet thường nào còn đủ chỗ phía trên → hàng kiểm hóa nằm trên 1 pallet riêng.');
  }
  const units = []; let uSeq = 1;
  let customsUnit = null;
  for (const st of stacks){
    const u = stackToUnit(st, 'P' + (uSeq++));
    if (u.kind === 'customs') customsUnit = u; else units.push(u);
  }

  // (6) Tầng 2 — xếp pallet vào cont (chiều cao hiệu dụng = giới hạn qua cửa)
  if (onProgress) onProgress(0, 1, `Tầng 2 — xếp ${units.length + (customsUnit ? 1 : 0)} pallet vào cont...`);
  const effC = { L: container.L, W: container.W, H: hLimit, payload: container.payload };
  const payloadLimit = opts.enforcePayload ? container.payload : null;
  const items = palletUnitsToItems(units, P);
  const mkPackPass = (cp)=> (list)=>{
    const seedPlaced = cp ? [cp] : [];
    const seedEP = [{ x:0, y:0, z:0 }];
    if (cp){ seedEP.push({ x:cp.x, y:0, z:cp.z + cp.sizeZ }); if (cp.z > 1) seedEP.push({ x:cp.x, y:0, z:0 }); }
    const r = packContainer(list, effC, zones, {
      supportThreshold: 100, loadingDirection: 'right_to_left', heavyBottomPriority: opts.heavyBottomPriority,
      seedPlaced, seedExtremePoints: seedEP, payloadLimit, rules: { alignedStackOnly: true }
    });
    return { placed: seedPlaced.concat(r.placed), unplaced: r.unplaced, heavyRelaxed: r.heavyRelaxed, payloadRejected: r.payloadRejected };
  };

  let customsPlacement = null;
  if (customsUnit){
    const cItem = palletUnitsToItems([customsUnit], P)[0];
    if (payloadLimit && cItem.weight > payloadLimit) return { mode:'pallet', errors:['Riêng pallet kiểm hóa đã vượt tải trọng container.'] };
    let bestSc = null;
    for (const o of cItem.orientations){
      const cp = placeAtDoor(cItem, o, effC, zones, P.customs.side);
      if (!cp) continue;
      const trial = mkPackPass(cp)(items.slice().sort(getSortStrategies()[0].cmp));
      const sc = scoreSolution(trial, effC);
      if (!bestSc || sc.composite > bestSc.composite){ bestSc = sc; customsPlacement = cp; }
    }
    if (!customsPlacement) return { mode:'pallet', errors:['Không đặt được pallet kiểm hóa sát cửa — kiểm tra kích thước pallet, khe cửa và các vùng cấm.'] };
  }

  const allUnits = customsUnit ? units.concat([customsUnit]) : units;
  const meta = (passesRun, extra)=> Object.assign({
    units: allUnits, customsUnitId: customsUnit ? customsUnit.id : null, hLimit, planInfo, notes,
    customsModeUsed,
    leftover: leftoverItems.map(it=> ({ skuId: it.skuId, overflow: !!it.overflow, tol: !!it.tol })), passesRun, mixMode: policy.mode
  }, extra || {});
  const search = searchBestPacking(items, mkPackPass(customsPlacement), effC, opts, onProgress,
    onImprove ? (b, passes)=> onImprove(packagePalletOutput(b, meta(passes, { partial:true }))) : null, null);

  // (7) Cont đã hết chỗ sàn nhưng còn pallet bị loại → chất bổ sung hàng của chúng lên các pallet ĐÃ có trong cont
  //     (còn dư chiều cao / tải): lớp đầy trước, thùng lẻ sau (đỡ tính theo từng thùng). Footprint pallet không đổi.
  let toppedUp = 0;
  if (search.best.result.unplaced.length){
    const stackById = {}; stacks.forEach((st, i)=> stackById['P' + (i + 1)] = st);
    const unitById2 = {}; allUnits.forEach(u=> unitById2[u.id] = u);
    const placedPl = search.best.result.placed;
    const hasAbove = (p)=> placedPl.some(q=> q !== p && Math.abs(q.y - (p.y + p.sizeY)) < 2 &&
      Math.min(p.x + p.sizeX, q.x + q.sizeX) - Math.max(p.x, q.x) > 1 && Math.min(p.z + p.sizeZ, q.z + q.sizeZ) - Math.max(p.z, q.z) > 1);
    let payloadLeft = payloadLimit ? payloadLimit - placedPl.reduce((t,p)=> t + (p.weight || 0), 0) : Infinity;
    // không chất thêm lên pallet kiểm hóa (sẽ che hàng mẫu/kiểm hóa ở đỉnh)
    const targets = placedPl.filter(p=> !hasAbove(p)).map(p=> ({ p, st: stackById[p.instanceId] })).filter(t=> t.st && t.st.kind !== 'customs');
    const exempt = (st)=> st.kind === 'customs';
    const okSkus = (st, ids)=> exempt(st) || policy.palletOk(Array.from(new Set([...st.skus, ...ids])));
    const changed = new Set();
    const spareH = (st)=> (st.pt._effMaxH - st.pt.H) - st.h;
    for (const uid of search.best.result.unplaced.map(i=> i.instanceId)){
      const S = stackById[uid];
      if (!S) continue;
      const left = [];
      // (a) giữ nguyên các LỚP ĐẦY của pallet bị loại, đặt lên pallet có đỉnh đầy & còn chiều cao
      for (const sl of S.slabs){
        let done = false;
        if (sl.full && sl.weight <= payloadLeft){
          const tg = targets.slice().sort((a,b)=> spareH(b.st) - spareH(a.st))
            .find(t=> okSkus(t.st, sl.skus) && canPlaceSlab(t.st, sl, thr, Object.assign({}, policy, { palletOk: ()=> true }), false));
          if (tg){ pushSlab(tg.st, sl); changed.add(tg.p.instanceId); payloadLeft -= sl.weight; toppedUp += sl.cartons.length; done = true; }
        }
        if (!done) left.push(...sl.cartons.map(c=> ({ c })));
      }
      // (b) thùng lẻ còn lại: xếp lên đỉnh pallet (lấp khe + tối đa 2 tầng), nặng trước
      let pool = left.map(x=> looseItemFor(skuById[x.c.skuId], 'tu' + (_looseUid++), x.c.tag)).sort((a,b)=> b.weight - a.weight);
      for (const t of targets.slice().sort((a,b)=> spareH(b.st) - spareH(a.st))){
        if (!pool.length || payloadLeft <= 0 || policy.strap) break;   // vuông vức: không chất "nắp" lẻ lên đỉnh
        const cand = pool.filter(it=> okSkus(t.st, [it.skuId]));
        if (!cand.length) continue;
        const c3 = capFill3D(t.st, cand, thr, { allowPartial: true, extraWeightCap: isFinite(payloadLeft) ? payloadLeft : null });
        if (!c3) continue;
        const w0 = t.st.weight;
        t.st.slabs = c3.base.slabs.concat([c3.cap]); rebuildStack(t.st);
        payloadLeft -= (t.st.weight - w0);
        toppedUp += c3.placedIds.size; changed.add(t.p.instanceId);
        pool = pool.filter(it=> !c3.placedIds.has(it.instanceId));
      }
      leftoverItems.push(...pool.map(it=> ({ skuId: it.skuId, overflow: true })));
    }
    if (toppedUp){
      // cập nhật pallet đã đổi (giữ id, footprint), bỏ toàn bộ pallet bị loại (phần chưa chất được → danh sách dư)
      for (const id of changed){
        const nu = stackToUnit(stackById[id], id);
        const old = unitById2[id];
        Object.assign(old, nu, { id, kind: old.kind === 'customs' ? 'customs' : nu.kind });
        const pl = placedPl.find(p=> p.instanceId === id);
        pl.sizeY = old.height; pl.weight = old.grossWeight;
      }
      const goneIds = new Set(search.best.result.unplaced.map(i=> i.instanceId));
      for (let i = allUnits.length - 1; i >= 0; i--) if (goneIds.has(allUnits[i].id)) allUnits.splice(i, 1);
      search.best.result.unplaced = [];
      notes.push(`Cont hết chỗ sàn: đã chất bổ sung ${toppedUp} thùng của các pallet không vào được lên trên những pallet đã có trong cont (còn dư chiều cao/tải).`);
    } else {
      // không chất bổ sung được gì → giữ nguyên danh sách pallet bị loại, bỏ phần dư đã ghi tạm
      for (let i = leftoverItems.length - 1; i >= 0; i--) if (leftoverItems[i].overflow) leftoverItems.splice(i, 1);
    }
  }
  // (8) Dàn đều: SAN BẰNG chiều cao các pallet đã trong cont — chuyển LỚP ĐỈNH của pallet cao nhất sang pallet thấp
  //     nhất khi làm giảm chênh lệch. Giữ: footprint pallet, đỡ ≥ ngưỡng, chính sách trộn, vuông vức, tải pallet.
  //     Bỏ qua pallet kiểm hóa (giữ hàng kiểm hóa/mẫu ở đỉnh) và pallet đang chồng/được chồng.
  let leveled = 0, spreadBefore = 0, spreadAfter = 0;
  if (P.loadGoal === 'spread'){
    const stackById = {}; stacks.forEach((st, i)=> stackById['P' + (i + 1)] = st);
    const unitById3 = {}; allUnits.forEach(u=> unitById3[u.id] = u);
    const placedPl = search.best.result.placed;
    const stackedIds = new Set();
    placedPl.forEach(p=>{ if (p.y > 1) stackedIds.add(p.instanceId); placedPl.forEach(q=>{ if (q !== p && Math.abs(q.y - (p.y + p.sizeY)) < 2 &&
      Math.min(p.x + p.sizeX, q.x + q.sizeX) - Math.max(p.x, q.x) > 1 && Math.min(p.z + p.sizeZ, q.z + q.sizeZ) - Math.max(p.z, q.z) > 1) stackedIds.add(p.instanceId); }); });
    const pool2 = placedPl.filter(p=> !stackedIds.has(p.instanceId) && stackById[p.instanceId])
                          .map(p=> ({ id: p.instanceId, st: stackById[p.instanceId], u: unitById3[p.instanceId], customs: stackById[p.instanceId].kind === 'customs' }));
    // pallet kiểm hóa / pallet có lớp đỉnh thưa: lớp nhận được CHÈN XUỐNG DƯỚI cùng (đỉnh giữ nguyên)
    const insertUnder = (T, slab)=>{
      const trial = newStack(T.st.pt, T.st.kind);
      if (!canPlaceSlab(trial, slab, thr, policy)) return null;
      pushSlab(trial, slab);
      const n = T.st.slabs.length;
      for (let i=0; i<n; i++){
        const sl = T.st.slabs[i];
        if (canPlaceSlab(trial, sl, thr, policy, T.customs)){ pushSlab(trial, sl); continue; }
        if (i < n - 1 || policy.strap && !T.customs) return null;
        // lớp đỉnh (thưa / phần kiểm hóa) không khớp đỡ với lớp vừa chèn → xếp lại các thùng đó ngay trên lớp mới,
        // đỡ tính theo từng thùng; 2 lượt nếu có hàng mẫu để mẫu vẫn nằm trên cùng
        const all = sl.cartons.map(c=> looseItemFor(skuById[c.skuId], 'lv' + (_looseUid++), c.tag));
        const reg = all.filter(it=> it._tag !== 'sample'), smp = all.filter(it=> it._tag === 'sample');
        let c3 = null;
        if (reg.length && smp.length){
          const a1 = capFill3D(trial, reg, thr);
          if (a1){ const T2 = cloneStack(a1.base); T2.slabs.push(a1.cap); rebuildStack(T2); c3 = capFill3D(T2, smp, thr); }
        } else c3 = capFill3D(trial, all, thr);
        if (!c3) return null;
        const out = newStack(T.st.pt, T.st.kind);
        c3.base.slabs.concat([c3.cap]).forEach(x=> pushSlab(out, x));
        return out;
      }
      return trial;
    };
    const fits = (t, slab)=> slab.cartons.every(c=> c.x >= -t.u.deckX - 0.5 && c.x + c.w <= t.u.FL - t.u.deckX + 0.5 &&
                                                   c.y >= -t.u.deckZ - 0.5 && c.y + c.l <= t.u.FW - t.u.deckZ + 0.5);
    const range = ()=> pool2.length ? Math.max(...pool2.map(t=> t.st.h)) - Math.min(...pool2.map(t=> t.st.h)) : 0;
    spreadBefore = range();
    const changed = new Set();
    for (let guard = 0; guard < 400 && pool2.length > 1; guard++){
      let moved = false;
      for (const S of pool2.filter(x=> !x.customs).sort((a,b)=> b.st.h - a.st.h)){
        const top = S.st.slabs[S.st.slabs.length - 1];
        if (!top || S.st.slabs.length < 2) continue;
        for (const T of pool2.slice().sort((a,b)=> a.st.h - b.st.h)){
          if (T === S) continue;
          if (T.st.h + top.h >= S.st.h - 1) break;            // không còn giảm được chênh lệch
          if (!fits(T, top)) continue;
          const tTop = T.st.slabs[T.st.slabs.length - 1];
          if (T.customs || (tTop && !tTop.full)){
            if (!top.full) continue;
            const ns = insertUnder(T, top);
            if (!ns) continue;
            const kind = T.st.kind;
            S.st.slabs.pop(); rebuildStack(S.st);
            T.st.slabs = ns.slabs; rebuildStack(T.st); T.st.kind = kind;
          } else {
            if (!canPlaceSlab(T.st, top, thr, policy)) continue;
            S.st.slabs.pop(); rebuildStack(S.st); pushSlab(T.st, top);
          }
          changed.add(S.id); changed.add(T.id); leveled++; moved = true; break;
        }
        if (moved) break;
      }
      if (!moved) break;
    }
    spreadAfter = range();

    // (9) RÀNG BUỘC SAI LỆCH giữa các pallet: chiều cao tổng (gồm pallet) / khối lượng tổng (gồm pallet rỗng) của mỗi
    //     pallet phải nằm trong ±p% quanh 1 MỨC CHUẨN (pallet kiểm hóa được miễn, không tính).
    //     Mức chuẩn: thử trung bình, trung vị và từng mức (cao, nặng) của các pallet hiện có — giả lập trên bản sao,
    //     chọn mức làm RỚT ÍT THÙNG NHẤT rồi mới áp thật. Cách xử lý:
    //       pallet vượt dải trên → bớt lớp đỉnh, chuyển sang pallet còn chỗ trong dải, không được thì rớt;
    //       pallet dưới dải → nhận lớp đỉnh từ pallet khác (người cho vẫn trong dải); không được → chia lớp của nó
    //       sang pallet khác rồi bỏ pallet; lớp không chỗ nào nhận mới tính là rớt.
    const TOL = P.spreadTol || {};
    const hTol = TOL.h > 0 ? TOL.h / 100 : null, wTol = TOL.w > 0 ? TOL.w / 100 : null;
    const removedIds = new Set();
    if (hTol || wTol){
      const Ht = (t)=> t.st.h + t.st.pt.H, Wt = (t)=> t.st.weight + (t.st.pt.weight || 0);
      // dropMode = false (mặc định): KHÔNG rớt hàng vì dải — pallet không đưa vào dải được thì giữ nguyên & cảnh báo.
      // dropMode = true: loại lớp/pallet ngoài dải (rớt hàng, ghi chú) — đúng nghĩa "ngoài dải thì loại".
      const dropMode = TOL.action === 'drop';
      const enforceBand = (entries, MH, MW, sim)=>{
        const removed = new Set(), dropped = [], chg = new Set(), stuck = new Set();
        const band = { hLo: hTol ? MH * (1 - hTol) : -Infinity, hHi: hTol ? MH * (1 + hTol) : Infinity,
                       wLo: wTol ? MW * (1 - wTol) : -Infinity, wHi: wTol ? MW * (1 + wTol) : Infinity };
        const live = ()=> entries.filter(t=> !t.customs && !removed.has(t.id));
        const okHW = (h, w)=> h >= band.hLo - 0.5 && h <= band.hHi + 0.5 && w >= band.wLo - 0.5 && w <= band.wHi + 0.5;
        const roomFor = (t, sl)=> Ht(t) + sl.h <= band.hHi + 0.5 && Wt(t) + sl.weight <= band.wHi + 0.5;
        const drop = (sl)=> sl.cartons.forEach(c=> dropped.push(c.skuId));
        const placeOn = (T, slab)=>{
          if (!fits(T, slab)) return false;
          const tTop = T.st.slabs[T.st.slabs.length - 1];
          if (T.customs || (tTop && !tTop.full)){
            if (!slab.full) return false;
            const ns = insertUnder(T, slab);
            if (!ns) return false;
            const kind = T.st.kind; T.st.slabs = ns.slabs; rebuildStack(T.st); T.st.kind = kind; return true;
          }
          if (!canPlaceSlab(T.st, slab, thr, policy)) return false;
          pushSlab(T.st, slab); return true;
        };
        const relocate = (sl, except, noDrop)=>{
          const tgt = live().filter(t=> t !== except).sort((x,y)=> Ht(x) - Ht(y)).find(t=> roomFor(t, sl) && placeOn(t, sl));
          if (tgt){ chg.add(tgt.id); return true; }
          if (!noDrop) drop(sl);
          return false;
        };
        for (let guard = 0; guard < 300; guard++){
          const L = live();
          if (!L.length) break;
          const over = L.filter(t=> !stuck.has(t.id) && (Ht(t) > band.hHi + 0.5 || Wt(t) > band.wHi + 0.5)).sort((x,y)=> Ht(y) - Ht(x))[0];
          if (over){
            const top = over.st.slabs.pop(); rebuildStack(over.st);
            if (relocate(top, over, !dropMode)){ chg.add(over.id); }
            else if (dropMode){ chg.add(over.id); }
            else { pushSlab(over.st, top); stuck.add(over.id); continue; }   // giữ nguyên, cảnh báo
            if (!over.st.slabs.length) removed.add(over.id);
            continue;
          }
          const under = L.filter(t=> !stuck.has(t.id) && (Ht(t) < band.hLo - 0.5 || Wt(t) < band.wLo - 0.5)).sort((x,y)=> Ht(x) - Ht(y))[0];
          if (!under) break;
          let raised = false;
          for (const d of L.filter(t=> t !== under).sort((x,y)=> Ht(y) - Ht(x))){
            const top = d.st.slabs[d.st.slabs.length - 1];
            if (!top || d.st.slabs.length < 2 || !okHW(Ht(d) - top.h, Wt(d) - top.weight) || !roomFor(under, top)) continue;
            d.st.slabs.pop(); rebuildStack(d.st);
            if (placeOn(under, top)){ chg.add(d.id); chg.add(under.id); raised = true; break; }
            pushSlab(d.st, top);
          }
          if (!raised){
            if (!dropMode){
              // chỉ bỏ pallet nếu MỌI lớp của nó chuyển được sang pallet khác (thử trên bản sao), không thì giữ & cảnh báo
              const saved = entries.map(t=> ({ t, st: cloneStack(t.st) }));
              const slabsU = under.st.slabs.slice().reverse();
              under.st.slabs = []; rebuildStack(under.st); removed.add(under.id);
              if (slabsU.every(sl=> relocate(sl, under, true))) { chg.add(under.id); continue; }
              saved.forEach(x=>{ x.t.st.slabs = x.st.slabs; rebuildStack(x.t.st); });
              removed.delete(under.id); stuck.add(under.id);
              continue;
            }
            const slabsU = under.st.slabs.slice().reverse();
            under.st.slabs = []; rebuildStack(under.st); removed.add(under.id);
            slabsU.forEach(sl=> relocate(sl, under));
          }
        }
        return { removed, dropped, chg, band, stuck };
      };
      const cloneEntries = ()=> pool2.map(t=> Object.assign({}, t, { st: cloneStack(t.st) }));
      const live0 = pool2.filter(t=> !t.customs);
      const avg = (a)=> a.reduce((x,y)=> x + y, 0) / Math.max(1, a.length);
      const med = (a)=>{ const b = a.slice().sort((x,y)=> x - y); return b.length ? b[Math.floor(b.length / 2)] : 0; };
      const cands = [[avg(live0.map(Ht)), avg(live0.map(Wt))], [med(live0.map(Ht)), med(live0.map(Wt))]]
        .concat(live0.map(t=> [Ht(t), Wt(t)]));
      const seen = new Set(); let best = null;
      for (const [mh, mw] of cands){
        const key = Math.round(mh) + '|' + Math.round(mw);
        if (seen.has(key)) continue; seen.add(key);
        const r = enforceBand(cloneEntries(), mh, mw, true);
        const viol = r.stuck.size;
        if (!best || r.dropped.length < best.n || (r.dropped.length === best.n && (viol < best.viol || (viol === best.viol && r.removed.size < best.rm))))
          best = { n: r.dropped.length, viol, rm: r.removed.size, mh, mw };
        if (best.n === 0 && best.viol === 0) break;
      }
      const res = enforceBand(pool2, best.mh, best.mw, false);
      res.chg.forEach(id=> changed.add(id));
      res.removed.forEach(id=> removedIds.add(id));
      res.dropped.forEach(id=> leftoverItems.push({ skuId: id, overflow: true, tol: true }));
      const bySku = {}; res.dropped.forEach(id=> bySku[id] = (bySku[id] || 0) + 1);
      const B = res.band;
      notes.push(`Ràng buộc sai lệch dàn đều ${hTol ? `chiều cao ±${TOL.h}% (dải ${Math.round(B.hLo)}–${Math.round(B.hHi)} mm quanh ${Math.round(best.mh)} mm)` : ''}${hTol && wTol ? ', ' : ''}${wTol ? `khối lượng ±${TOL.w}% (dải ${Math.round(B.wLo)}–${Math.round(B.wHi)} kg quanh ${Math.round(best.mw)} kg)` : ''}: ` +
        (res.dropped.length ? `RỚT ${res.dropped.length} thùng — ` + Object.entries(bySku).map(([id,n])=> `${(skuById[id] || {}).code || id} × ${n}`).join(', ') + (res.removed.size ? `; bỏ ${res.removed.size} pallet ngoài dải.` : '.')
          : res.stuck.size ? `${res.stuck.size} pallet KHÔNG đưa vào dải được (lớp hàng không chia nhỏ hơn được / không pallet nào nhận thêm) — vẫn GIỮ để không rớt hàng: ` +
              res.stuck.size + ' pallet (xem cột Cao/KG).' + (res.removed.size ? ` Đã gộp bỏ ${res.removed.size} pallet thấp vào pallet khác.` : '')
          : 'mọi pallet nằm trong dải, không rớt thùng nào.' + (res.removed.size ? ` Đã gộp bỏ ${res.removed.size} pallet thấp vào pallet khác.` : '')));
      if (removedIds.size){
        search.best.result.placed = placedPl.filter(p=> !removedIds.has(p.instanceId));
        for (let i = allUnits.length - 1; i >= 0; i--) if (removedIds.has(allUnits[i].id)) allUnits.splice(i, 1);
      }
    }
    // (8b) RÀO CỨNG (dàn đều): pallet THƯỜNG không được thấp hơn minRatio × chiều cao hàng trung vị của các pallet thường.
    //      San bằng thường bị chặn (vd vuông vức: mẫu lớp lệch khung) → (1) nâng pallet thấp bằng lớp đỉnh của pallet cao nhất,
    //      nới điều kiện vuông vức; (2) không nâng được thì chia các lớp của nó lên pallet khác (cho phép tới giới hạn cao/tải
    //      vật lý, không theo mức hạ của dàn đều) rồi bỏ pallet. Vẫn giữ đỡ ≥ ngưỡng & chính sách trộn.
    const minRatio = Math.max(0, Math.min(1, (P.minPalletPct ?? 60) / 100));
    let barrierRaised = 0, barrierMerged = 0; const barrierStuck = [];
    if (minRatio > 0){
      const live = ()=> pool2.filter(t=> !t.customs && !removedIds.has(t.id));
      const med = ()=>{ const h = live().map(t=> t.st.h).sort((x,y)=> x - y); return h.length ? h[Math.floor(h.length / 2)] : 0; };
      const loose = Object.assign({}, policy, { strap: false });
      const phys = (st)=>{ const raw = (P._uncappedTypes || []).find(t=> t.id === st.pt.id);
        return raw ? Object.assign({}, st.pt, { _effMaxH: Math.min(raw.maxHeight ? raw.maxHeight : hLimit, hLimit), maxLoadKg: raw.maxLoadKg }) : st.pt; };
      for (let guard = 0; guard < 60; guard++){
        const M = med(), short = live().filter(t=> t.st.h < minRatio * M - 1).sort((x,y)=> x.st.h - y.st.h)[0];
        if (!short) break;
        // (1) nâng: lấy lớp đỉnh từ pallet cao nhất (người cho không tụt xuống dưới ngưỡng)
        let raised = false;
        for (const pol of [policy, loose]){          // giữ vuông vức nếu được, không thì mới nới
          for (const S of live().filter(t=> t !== short).sort((x,y)=> y.st.h - x.st.h)){
            const top = S.st.slabs[S.st.slabs.length - 1];
            if (!top || S.st.slabs.length < 2 || S.st.h - top.h < minRatio * M || !fits(short, top)) continue;
            if (short.st.h + top.h > S.st.h + 1) continue;
            const tTop = short.st.slabs[short.st.slabs.length - 1];
            if (tTop && !tTop.full) continue;
            if (!canPlaceSlab(short.st, top, thr, pol)) continue;
            S.st.slabs.pop(); rebuildStack(S.st); pushSlab(short.st, top);
            changed.add(S.id); changed.add(short.id); barrierRaised++; raised = true; break;
          }
          if (raised) break;
        }
        if (raised) continue;
        // (2) giải tán: chuyển từng lớp (từ đỉnh) sang pallet thấp nhất nhận được; thất bại thì hoàn tác
        const saved = live().map(t=> ({ t, st: cloneStack(t.st), pt: t.st.pt }));
        const slabs = short.st.slabs.slice().reverse();
        let ok = true;
        for (const sl of slabs){
          const tg = live().filter(t=> t !== short).sort((x,y)=> x.st.h - y.st.h).find(T=>{
            if (!fits(T, sl)) return false;
            const keep = T.st.pt; T.st.pt = phys(T.st);
            const okT = canPlaceSlab(T.st, sl, thr, loose);
            if (!okT) T.st.pt = keep;
            return okT;
          });
          if (!tg){ ok = false; break; }
          pushSlab(tg.st, sl); changed.add(tg.id);
        }
        if (ok){ short.st.slabs = []; rebuildStack(short.st); removedIds.add(short.id); barrierMerged++; continue; }
        saved.forEach(x=>{ x.t.st.slabs = x.st.slabs; rebuildStack(x.t.st); x.t.st.pt = x.pt; });
        barrierStuck.push(short); short.customs = true;   // đánh dấu tạm để vòng sau bỏ qua
      }
      barrierStuck.forEach(t=> t.customs = false);
      if (removedIds.size){
        search.best.result.placed = search.best.result.placed.filter(p=> !removedIds.has(p.instanceId));
        for (let i = allUnits.length - 1; i >= 0; i--) if (removedIds.has(allUnits[i].id)) allUnits.splice(i, 1);
      }
      if (barrierRaised || barrierMerged)
        notes.push(`Rào cứng dàn đều (pallet thường ≥ ${Math.round(minRatio * 100)}% chiều cao trung vị): ` +
          (barrierRaised ? `nâng pallet thấp bằng ${barrierRaised} lớp lấy từ pallet cao` : '') + (barrierRaised && barrierMerged ? '; ' : '') +
          (barrierMerged ? `gộp ${barrierMerged} pallet quá thấp vào pallet khác (sàn cont còn ô trống — dùng "Căn vị trí pallet" khi chỉnh tay nếu cần)` : '') + '.');
      if (barrierStuck.length)
        notes.push(`⚠ Rào cứng dàn đều: ${barrierStuck.length} pallet thường vẫn thấp hơn ${Math.round(minRatio * 100)}% chiều cao trung vị — không pallet nào nhận/cho lớp được (giới hạn cao/tải, đỡ, chính sách trộn). Xem lại trong Chỉnh tay.`);
    }
    if (leveled || changed.size){
      for (const id of changed){
        if (removedIds.has(id)) continue;
        const nu = stackToUnit(stackById[id], id), old = unitById3[id];
        Object.assign(old, nu, { id, kind: old.kind === 'customs' ? 'customs' : nu.kind });
        const pl = placedPl.find(p=> p.instanceId === id);
        pl.sizeY = old.height; pl.weight = old.grossWeight;
      }
      if (leveled) notes.push(`Dàn đều — san bằng: chuyển ${leveled} lớp từ pallet cao sang pallet thấp; chênh lệch chiều cao hàng giữa các pallet từ ${Math.round(spreadBefore)} mm còn ${Math.round(spreadAfter)} mm (pallet kiểm hóa chỉ nhận lớp chèn xuống dưới, hàng kiểm hóa/mẫu vẫn ở đỉnh).`);
    }
  }
  return packagePalletOutput(search.best, meta(search.passesRun, {
    stoppedByBudget: search.stoppedByBudget, budgetMs: search.budgetMs, seed: search.seed, perturbIters: search.perturbIters, toppedUp, leveled
  }));
}


/* ---------- Mục tiêu xếp pallet: "gom chặt" (mặc định) hoặc "dàn đều" ----------
   Dàn đều: khi cont còn dư, tìm GIỚI HẠN CAO (rồi GIỚI HẠN TẢI) nhỏ nhất cho mỗi pallet mà vẫn xếp hết hàng
   → hàng được chia ra nhiều pallet thấp & nhẹ gần bằng nhau, trải đều sàn cont. Mỗi lần thử dùng mức "Nhanh". */
function countPalletOutputCartons(out){
  if (!out || out.errors) return -1;
  const byId = {}; out.units.forEach(u=> byId[u.id] = u);
  let n = 0;
  out.placements.forEach(p=>{ const u = byId[p.unitId]; if (u) for (const k in u.skuCounts) n += u.skuCounts[k]; });
  return n;
}
// Số thùng đã xếp theo từng SKU trong output thô mode pallet.
function placedBySku(out){
