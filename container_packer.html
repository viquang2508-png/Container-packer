<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Container Load Optimizer — Bulk Mode</title>
<style>
/* ============================================================
   DESIGN TOKENS — industrial / logistics console aesthetic
   ============================================================ */
:root{
  --bg-0:#14171c;        /* app background, near-black blue-grey */
  --bg-1:#1b1f26;        /* panel background */
  --bg-2:#232833;        /* card / input background */
  --bg-3:#2c323f;        /* hover / active surface */
  --line-0:#333a47;      /* hairline borders */
  --line-1:#454e5f;      /* stronger borders */
  --text-0:#e8eaed;      /* primary text */
  --text-1:#a6adba;      /* secondary text */
  --text-2:#6b7484;      /* tertiary / hints */
  --accent:#e8a33d;      /* amber — hazard-stripe / logistics accent */
  --accent-dim:#8a672a;
  --accent-ink:#1c1508;
  --ok:#4caf7d;
  --ok-bg:#132a20;
  --warn:#e8a33d;
  --warn-bg:#2c2412;
  --err:#e2604f;
  --err-bg:#2c1712;
  --mono: 'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --radius-s:3px;
  --radius-m:5px;
  --col-left: 380px;
  --col-right: 360px;
}

@font-face{
  font-family:'Inter';
  src:local('Inter');
}

*,*::before,*::after{box-sizing:border-box;}
html,body{
  height:100%;
  margin:0;
  background:var(--bg-0);
  color:var(--text-0);
  font-family:var(--sans);
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

::selection{ background:var(--accent); color:var(--accent-ink); }

/* Scrollbars */
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--line-1); border-radius:5px; }
::-webkit-scrollbar-thumb:hover{ background:var(--text-2); }

button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:1px;
}

h1,h2,h3,h4{ margin:0; font-weight:600; }

/* ============================================================
   APP SHELL
   ============================================================ */
#app{
  display:flex;
  flex-direction:column;
  height:100vh;
  min-height:100vh;
}

#topbar{
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 16px;
  height:52px;
  min-height:52px;
  background:var(--bg-1);
  border-bottom:1px solid var(--line-0);
  position:relative;
  z-index:20;
}
#topbar .brand{
  display:flex; align-items:center; gap:9px;
  font-weight:700; font-size:14px; letter-spacing:0.2px;
  color:var(--text-0);
}
#topbar .brand .mark{
  width:20px;height:20px;
  background:
    linear-gradient(135deg, var(--accent) 0 25%, transparent 25% 50%, var(--accent) 50% 75%, transparent 75%) ;
  background-size: 8px 8px;
  border-radius:3px;
  border:1px solid var(--accent-dim);
  flex:none;
}
#topbar .sub{ color:var(--text-2); font-size:11.5px; }
#topbar .mode-badge{
  margin-left:auto;
  display:flex; gap:6px;
}
.badge{
  font-family:var(--mono);
  font-size:10.5px;
  padding:3px 8px;
  border-radius:20px;
  border:1px solid var(--line-1);
  color:var(--text-1);
  background:var(--bg-2);
}
.badge.active{ border-color:var(--accent); color:var(--accent); background:rgba(232,163,61,0.08); }

#main{
  flex:1;
  display:flex;
  min-height:0;
}

/* ---------- Left column: input ---------- */
#col-left{
  width:var(--col-left);
  min-width:var(--col-left);
  background:var(--bg-1);
  border-right:1px solid var(--line-0);
  overflow-y:auto;
  overflow-x:hidden;
}

/* ---------- Middle column: 3D viewport ---------- */
#col-mid{
  flex:1;
  min-width:0;
  position:relative;
  background:
    radial-gradient(circle at 50% 0%, #1e2330 0%, var(--bg-0) 70%);
  display:flex;
  flex-direction:column;
}

/* ---------- Right column: results ---------- */
#col-right{
  width:var(--col-right);
  min-width:var(--col-right);
  background:var(--bg-1);
  border-left:1px solid var(--line-0);
  overflow-y:auto;
  overflow-x:hidden;
}

/* ============================================================
   PANEL / SECTION PRIMITIVES
   ============================================================ */
.panel-section{
  border-bottom:1px solid var(--line-0);
  padding:14px 16px;
}
.panel-section:last-child{ border-bottom:none; }

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  cursor:pointer;
  user-select:none;
}
.section-head h2{
  font-size:11.5px;
  text-transform:uppercase;
  letter-spacing:0.6px;
  color:var(--text-1);
  font-weight:700;
}
.section-head .chev{
  color:var(--text-2);
  transition:transform .15s ease;
  font-size:10px;
}
.section-head.collapsed .chev{ transform:rotate(-90deg); }
.section-body{ display:block; }
.section-body.collapsed{ display:none; }

.field{ margin-bottom:10px; }
.field:last-child{ margin-bottom:0; }
.field label{
  display:block;
  font-size:11px;
  color:var(--text-1);
  margin-bottom:4px;
}
.field .hint{
  font-size:10.5px;
  color:var(--text-2);
  margin-top:3px;
}
.row{ display:flex; gap:8px; }
.row > *{ flex:1; min-width:0; }

input[type=text], input[type=number], select, textarea{
  width:100%;
  background:var(--bg-2);
  border:1px solid var(--line-0);
  border-radius:var(--radius-s);
  padding:7px 8px;
  color:var(--text-0);
}
input[type=text]:hover, input[type=number]:hover, select:hover{ border-color:var(--line-1); }
input[type=number]{ font-family:var(--mono); }
input::placeholder{ color:var(--text-2); }

select{ appearance:none; -webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0 L5 6 L10 0 Z' fill='%23a6adba'/></svg>");
  background-repeat:no-repeat;
  background-position:right 9px center;
  padding-right:26px;
}

.unit-suffix{ position:relative; }
.unit-suffix input{ padding-right:34px; }
.unit-suffix .u{
  position:absolute; right:8px; top:50%; transform:translateY(-50%);
  font-size:10.5px; color:var(--text-2); pointer-events:none;
}

/* Segmented control (mode radios etc) */
.segmented{
  display:flex;
  border:1px solid var(--line-0);
  border-radius:var(--radius-s);
  overflow:hidden;
}
.segmented button{
  flex:1;
  background:var(--bg-2);
  border:none;
  padding:7px 4px;
  cursor:pointer;
  color:var(--text-1);
  font-size:11.5px;
  border-right:1px solid var(--line-0);
  transition:background .1s;
}
.segmented button:last-child{ border-right:none; }
.segmented button:hover{ background:var(--bg-3); }
.segmented button.active{
  background:var(--accent);
  color:var(--accent-ink);
  font-weight:700;
}

/* Checkbox rows */
.check-row{
  display:flex; align-items:center; gap:7px;
  padding:5px 0;
  cursor:pointer;
  font-size:11.5px;
  color:var(--text-1);
}
.check-row input[type=checkbox]{
  width:14px;height:14px;
  accent-color:var(--accent);
  cursor:pointer;
  flex:none;
}
.check-row.disabled{ opacity:0.4; pointer-events:none; }
.check-row .lbl{ flex:1; }

/* Buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:var(--bg-2);
  border:1px solid var(--line-1);
  color:var(--text-0);
  padding:7px 12px;
  border-radius:var(--radius-s);
  cursor:pointer;
  font-size:12px;
  font-weight:600;
  transition:background .1s, border-color .1s;
  white-space:nowrap;
}
.btn:hover{ background:var(--bg-3); border-color:var(--text-2); }
.btn:active{ transform:translateY(1px); }
.btn.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:var(--accent-ink);
}
.btn.primary:hover{ background:#f0b158; }
.btn.block{ width:100%; }
.btn.small{ padding:4px 8px; font-size:11px; }
.btn.ghost{ background:transparent; border-color:var(--line-0); color:var(--text-1); }
.btn.ghost:hover{ border-color:var(--line-1); color:var(--text-0); }
.btn.danger{ color:var(--err); }
.btn:disabled{ opacity:0.4; cursor:not-allowed; }
.btn-row{ display:flex; gap:8px; }

/* ============================================================
   SKU TABLE / CARDS
   ============================================================ */
#sku-list{ display:flex; flex-direction:column; gap:8px; }
.sku-card{
  background:var(--bg-2);
  border:1px solid var(--line-0);
  border-radius:var(--radius-m);
  overflow:hidden;
}
.sku-card.expanded{ border-color:var(--line-1); }
.sku-card-head{
  display:flex; align-items:center; gap:8px;
  padding:8px 10px;
  cursor:pointer;
}
.sku-color-dot{
  width:10px;height:10px;border-radius:2px;flex:none;
  border:1px solid rgba(255,255,255,0.25);
}
.sku-card-head .sku-name{
  flex:1; min-width:0;
  font-size:12px; font-weight:600;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.sku-card-head .sku-meta{
  font-family:var(--mono);
  font-size:10px;
  color:var(--text-2);
}
.sku-card-body{
  padding:10px;
  border-top:1px solid var(--line-0);
  display:none;
}
.sku-card.expanded .sku-card-body{ display:block; }
.sku-card-body .field{ margin-bottom:8px; }

.mini-flags{ display:flex; gap:5px; flex-wrap:wrap; }
.mini-flag{
  font-family:var(--mono);
  font-size:9px;
  padding:1px 5px;
  border-radius:3px;
  border:1px solid var(--line-1);
  color:var(--text-2);
}
.mini-flag.on{ border-color:var(--accent-dim); color:var(--accent); background:rgba(232,163,61,0.08); }

.icon-btn{
  background:none; border:none; color:var(--text-2);
  cursor:pointer; padding:3px; border-radius:3px; flex:none;
  display:flex; align-items:center; justify-content:center;
}
.icon-btn:hover{ color:var(--err); background:rgba(226,96,79,0.1); }

/* rotation checkbox grid inside sku */
.rot-grid{
  display:grid; grid-template-columns:1fr; gap:2px;
  background:var(--bg-1);
  border:1px solid var(--line-0);
  border-radius:var(--radius-s);
  padding:6px 8px;
}

/* ============================================================
   MIDDLE — 3D viewport
   ============================================================ */
#viewport-toolbar{
  display:flex; align-items:center; gap:8px;
  padding:8px 12px;
  background:rgba(27,31,38,0.85);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line-0);
  flex-wrap:wrap;
  z-index:10;
}
#viewport-toolbar .grp{ display:flex; align-items:center; gap:6px; }
#viewport-toolbar .sep{ width:1px; height:18px; background:var(--line-0); margin:0 4px; }
#viewport-toolbar label{ font-size:10.5px; color:var(--text-2); }

#three-container{ flex:1; position:relative; min-height:0; }
#three-container canvas{ display:block; }

#viewport-empty{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:10px;
  color:var(--text-2);
  text-align:center;
  padding:20px;
}
#viewport-empty .big{ font-size:34px; opacity:0.5; }
#viewport-empty h3{ color:var(--text-1); font-size:14px; }
#viewport-empty p{ font-size:11.5px; max-width:280px; margin:0; }

#layer-slider-wrap{
  position:absolute;
  bottom:14px; left:50%; transform:translateX(-50%);
  background:rgba(27,31,38,0.92);
  border:1px solid var(--line-0);
  border-radius:20px;
  padding:8px 16px;
  display:none;
  align-items:center;
  gap:10px;
  backdrop-filter:blur(8px);
  z-index:10;
  max-width:90%;
}
#layer-slider-wrap.active{ display:flex; }
#layer-slider-wrap input[type=range]{ width:180px; accent-color:var(--accent); }
#layer-slider-wrap .layer-label{
  font-family:var(--mono); font-size:11px; color:var(--text-0);
  min-width:76px; text-align:center;
}

#legend-panel{
  position:absolute; top:56px; right:12px;
  background:rgba(27,31,38,0.9);
  border:1px solid var(--line-0);
  border-radius:var(--radius-m);
  padding:8px 10px;
  max-height:220px; overflow-y:auto;
  font-size:10.5px;
  display:none;
  z-index:9;
  min-width:140px;
}
#legend-panel.active{ display:block; }
#edit-panel{ position:absolute; top:10px; left:10px; z-index:11; width:min(430px, 46%); max-height:calc(100% - 70px); overflow:auto;
  background:rgba(27,31,38,0.96); border:1px solid var(--accent-dim); border-radius:var(--radius-m); padding:8px 10px; font-size:11px; display:none; }
#edit-panel.active{ display:block; }
#edit-panel .ed-head{ display:flex; align-items:center; gap:6px; margin-bottom:6px; color:var(--text-0); }
#edit-panel .ed-row{ display:flex; flex-wrap:wrap; align-items:center; gap:4px; margin:4px 0; color:var(--text-1); }
#edit-panel .ed-row .btn.active{ background:var(--accent); color:#111; }
#edit-panel .ed-title{ font-weight:600; color:var(--text-0); margin:4px 0; }
#edit-panel .ed-sub{ font-weight:600; color:var(--text-2); margin:8px 0 3px; font-size:10.5px; }
#edit-panel .ed-layer{ display:flex; align-items:center; gap:4px; padding:2px 0; border-bottom:1px solid var(--line-0); color:var(--text-1); }
#edit-panel .ed-layer span{ flex:1; min-width:0; }
#edit-panel .ed-layer select, #edit-panel .ed-row select{ font-size:10.5px; padding:1px 3px; max-width:110px; }
#edit-panel .ed-warn{ color:var(--warn); padding:1px 0; }
#edit-panel .ed-ok{ color:var(--ok); margin-top:6px; }
.struct-preset{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:8px 0 4px; padding-top:6px; border-top:1px dashed var(--line-0); }
.struct-preset label{ font-size:11.5px; color:var(--text-2); }
.struct-preset select{ flex:1 1 180px; font-size:12px; }
.fit-row{ display:flex; gap:8px; align-items:center; padding:5px 0; border-bottom:1px solid var(--line-0); font-size:11.5px; }
.fit-row.ok b{ color:var(--ok); }
#edit-panel .ed-lbl{ min-width:46px; color:var(--text-2); }
#edit-panel .ed-issues{ max-height:130px; overflow:auto; border:1px solid rgba(255,45,45,.5); border-radius:4px; padding:3px 5px; margin:2px 0 6px; }
#edit-panel .ed-issue{ color:#ff8a8a; cursor:pointer; padding:1px 0; }
#edit-panel .ed-issue:hover{ text-decoration:underline; }
#btn-edit-mode.active{ background:var(--accent); color:#111; }
#app.focus-view #col-left, #app.focus-view #col-right{ display:none; }
#btn-focus.active{ background:var(--accent); color:#111; }
#legend-panel .lg-item{ display:flex; align-items:center; gap:6px; padding:2px 0; }
#legend-panel .lg-dot{ width:9px;height:9px;border-radius:2px;flex:none; }
#legend-panel .lg-name{ color:var(--text-1); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

#help-overlay{ position:fixed; inset:0; background:rgba(10,12,16,0.72); display:none; z-index:60; align-items:center; justify-content:center; }
#shot-overlay{ position:fixed; inset:0; background:rgba(10,12,16,0.72); display:none; z-index:61; align-items:center; justify-content:center; }
#shot-overlay.active{ display:flex; }
#shot-box{ width:min(1000px, 95vw); max-height:90vh; overflow:auto; background:var(--bg-1); border:1px solid var(--accent-dim); border-radius:var(--radius-m); padding:14px 18px; font-size:12.5px; color:var(--text-1); }
#shot-box h2{ font-size:15px; color:var(--text-0); margin:0; }
.shot-opts{ display:grid; grid-template-columns:1fr 1.4fr; gap:14px; margin-top:8px; }
@media (max-width:700px){ .shot-opts{ grid-template-columns:1fr; } }
.shot-gallery{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:10px; }
.shot-gallery figure{ margin:0; background:var(--bg-2); border:1px solid var(--line-0); border-radius:8px; padding:6px; }
.shot-gallery img{ width:100%; height:auto; display:block; border-radius:4px; background:#fff; }
.shot-gallery figcaption{ display:flex; justify-content:space-between; gap:6px; margin-top:4px; font-size:11.5px; }
.shot-gallery a{ color:var(--accent); text-decoration:none; white-space:nowrap; }
.pp-3dgrid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.pp-3dgrid figure{ margin:0; border:1px solid #bbb; break-inside:avoid; page-break-inside:avoid; }
.pp-3dgrid figure.wide{ grid-column:1 / -1; }
.pp-3dgrid img{ width:100%; height:auto; display:block; }
.pp-3dgrid figcaption{ font-size:8.5pt; text-align:center; padding:2px 0; color:#111; }
.pp-pat.pp-3d img{ width:118px; height:auto; display:block; border:1px solid #ccc; }
#help-overlay.active{ display:flex; }
#help-box{ width:min(900px, 94vw); max-height:88vh; overflow:auto; background:var(--bg-1); border:1px solid var(--accent-dim); border-radius:var(--radius-m);
  padding:14px 18px; font-size:12.5px; color:var(--text-1); line-height:1.55; }
#help-box h2{ font-size:15px; color:var(--text-0); margin:0 0 6px; }
#help-box h3{ font-size:12.5px; color:var(--accent); margin:12px 0 4px; text-transform:uppercase; letter-spacing:.04em; }
#help-box table{ width:100%; border-collapse:collapse; margin:4px 0; }
#help-box td{ border-bottom:1px solid var(--line-0); padding:3px 6px; vertical-align:top; }
#help-box td:first-child{ white-space:nowrap; color:var(--text-0); font-family:var(--mono); font-size:11.5px; }
#help-box ol, #help-box ul{ margin:2px 0 2px 18px; padding:0; }
#help-tabs{ display:flex; flex-wrap:wrap; gap:4px; margin:6px 0 10px; border-bottom:1px solid var(--line-0); padding-bottom:6px; }
#help-tabs button{ background:var(--bg-2); border:1px solid var(--line-0); color:var(--text-1); border-radius:14px; padding:4px 11px; font-size:12px; cursor:pointer; }
#help-tabs button.active{ background:var(--accent); color:#111; border-color:var(--accent); font-weight:700; }
.hl-flow{ display:flex; flex-wrap:wrap; align-items:stretch; gap:6px; margin:6px 0 4px; }
.hl-step{ flex:1 1 140px; background:var(--bg-2); border:1px solid var(--line-0); border-radius:10px; padding:8px 9px; position:relative; }
.hl-step .n{ display:inline-flex; width:22px; height:22px; border-radius:50%; background:var(--accent); color:#111; font-weight:800; align-items:center; justify-content:center; margin-right:6px; }
.hl-step b{ color:var(--text-0); }
.hl-step .s{ color:var(--text-2); font-size:11.5px; margin-top:3px; }
.hl-arrow{ align-self:center; color:var(--accent); font-size:18px; }
.hl-cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:8px; margin:6px 0; }
.hl-card{ background:var(--bg-2); border:1px solid var(--line-0); border-left:3px solid var(--accent); border-radius:8px; padding:8px 10px; }
.hl-card .t{ color:var(--text-0); font-weight:700; margin-bottom:3px; }
.hl-card.warn{ border-left-color:var(--warn); } .hl-card.ok{ border-left-color:var(--ok); }
.hl-kbd{ display:inline-block; font-family:var(--mono); font-size:11px; background:var(--bg-0); border:1px solid var(--line-1, #444); border-bottom-width:2px; border-radius:4px; padding:0 5px; color:var(--text-0); }
.hl-q{ color:var(--text-0); font-weight:700; }
.hl-svg{ width:100%; background:#f7f7f4; border-radius:8px; border:1px solid var(--line-0); }
#progress-overlay{
  position:absolute; inset:0;
  background:rgba(20,23,28,0.92);
  display:none;
  align-items:center; justify-content:center;
  flex-direction:column; gap:14px;
  z-index:30;
}
#progress-overlay.active{ display:flex; }
#progress-overlay .spin-label{ font-size:12.5px; color:var(--text-1); font-family:var(--mono); }
.progress-track{
  width:280px; height:6px; background:var(--bg-2);
  border-radius:4px; overflow:hidden; border:1px solid var(--line-0);
}
.progress-fill{
  height:100%; width:0%;
  background:linear-gradient(90deg, var(--accent-dim), var(--accent));
  transition:width .2s ease;
}
#progress-overlay .stage{ font-size:10.5px; color:var(--text-2); }

/* ============================================================
   RIGHT — results
   ============================================================ */
.stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.stat-box{
  background:var(--bg-2);
  border:1px solid var(--line-0);
  border-radius:var(--radius-m);
  padding:9px 10px;
}
.stat-box .v{ font-family:var(--mono); font-size:18px; font-weight:700; color:var(--text-0); line-height:1.2; }

.alert{

  margin-bottom:6px;

.alert.warn{ background:var(--warn-bg); border-color:#5c4a1f; color:#f0c377; }
.alert.ok{ background:var(--ok-bg); border-color:#245c3d; color:#8fdcae; }

.layer-log{ display:flex; flex-direction:column; gap:6px; max-height:340px; overflow-y:auto; }

}

}

.empty-state{
  text-align:center; color:var(--text-2); font-size:11.5px; padding:20px 10px;
}

  position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);

  z-index:100; box-shadow:0 8px 24px rgba(0,0,0,0.4);
  max-width:400px;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
#toast.err{ border-color:var(--err); }

.btn-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }

.qty-table{ width:100%; border-collapse:collapse; font-size:11px; margin-top:6px; }

// Lấy thông số 1 cặp (hãng, loại cont). Payload hãng không công bố → lấy số "An toàn" và đánh dấu.
function getCarrierSpec(carrier, ctype){
  const c = CARRIER_SPECS[carrier];
  if (!c || !c.specs) return null;
  const sp = Object.assign({}, c.specs[ctype]);
  sp.payloadFallback = false;
  if (sp.payload == null){ sp.payload = CARRIER_SPECS.conservative.specs[ctype].payload; sp.payloadFallback = true; }
  return sp;
}

/* Điểm mù cấu trúc (mm). Chưa có số đo thực tế → ƯỚC LƯỢNG:
   - Gờ góc trên ở VÁCH KÍN (theo ảnh hiện trường): khối góc đúc ISO 1161 có kích thước ngoài 178×162×118;
     trừ phần nằm trong bề dày vách/nóc → phần lấn vào lòng cont ước ~120 (dọc) × 120 (ngang) × 90 (cao).
   - Ray nóc dọc 2 bên: ước 20 (ngang) × 50 (cao) — cần đo lại.
   - Đà cửa & trụ cửa: độ sâu khung cửa ước 120. Cao đà = H − H2, bề ngang trụ = (W − rộng cửa)/2 — tự tính. */

  topClear: 0,   // khe trần chừa thao tác tay (bulk)
  doorClear: 0,  // khe sát cửa (đệm/túi khí/đóng cửa)
  sideClear: 0,  // khe mỗi vách hông (móp / phồng vách cont cũ) — chỉ thu hẹp phần dùng được, KHÔNG phải do gợn sóng
  show3D: true
};

   - tool: số ước lượng ban đầu của tool (suy từ ảnh hiện trường + khối góc ISO 1161).
   - careful: thận trọng cho cont cũ / chất tay sát trần: ray nóc theo 1 bản thông số nhà sản xuất (ống vuông 60×60, vách gợn
     sóng sâu 36 → lấn vào trong ≈ 24 mm, cao 60), chừa khe trần 20, khe cửa 30, khe vách 10 mỗi bên.
   - user: bộ anh tự lưu (localStorage của máy này). */

// Áp 1 bộ số liệu: chỉ ghi đè số đo/khe; giữ nguyên các công tắc bật/tắt và hiển thị.
function applyStructPreset(v){
  const s = state.container.struct;

  const c = state.container;
  return Math.max(0, Math.min(c.H || 0, (c.doorH || c.H || 0) - (state.pallet.liftClearance || 0)));
}

/* ---------- Utility functions ---------- */
function fmt(n, d=1){
  if (n === null || n === undefined || isNaN(n)) return "—";
  return Number(n).toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
}
function fmtInt(n){
  if (n === null || n === undefined || isNaN(n)) return "—";
  return Math.round(Number(n)).toLocaleString('en-US');
}
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function uid(){ return Math.random().toString(36).slice(2,9); }

function showToast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=> t.classList.remove('show'), 3200);
}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

/* ---------- Container inputs ---------- */
function syncContainerInputsFromState(){
  const c = state.container;
  document.getElementById('in-carrier').value = c.carrier;
  document.getElementById('in-ctype').value = c.ctype;
  ['L','W','H','doorW','doorH','payload'].forEach(k=> document.getElementById('in-'+k).value = c[k] ?? '');
  document.getElementById('in-floorload').value = c.floorLoad ?? '';
  renderCarrierSource();
  renderStructPanel();
}

function renderCarrierSource(){
  const c = state.container, info = CARRIER_SPECS[c.carrier];
  const sp = getCarrierSpec(c.carrier, c.ctype);
  let html = info ? `Nguồn: ${info.url ? `<a href="${info.url}" target="_blank" rel="noopener">${info.source}</a>` : info.source}` : '';
  if (sp && sp.payloadFallback) html += ` · Payload: hãng không công bố → dùng số "An toàn" ${fmtInt(sp.payload)} kg`;
  html += '<br>Cont thực tế lệch theo nhà sản xuất — đối chiếu biển CSC trên cửa cont trước khi chốt.';
  document.getElementById('carrier-src').innerHTML = html;
}

function applyCarrierSpec(){
  const c = state.container, sp = getCarrierSpec(c.carrier, c.ctype);
  if (!sp) return; // "Tự nhập": giữ nguyên số người dùng đang có
  Object.assign(c, { L:sp.L, W:sp.W, H:sp.H, doorW:sp.doorW, doorH:sp.doorH, payload:sp.payload });
}

function bindContainerInputs(){
  const carrierSel = document.getElementById('in-carrier'), ctypeSel = document.getElementById('in-ctype');
  const onPick = ()=>{
    state.container.carrier = carrierSel.value; state.container.ctype = ctypeSel.value;
    applyCarrierSpec(); syncContainerInputsFromState(); renderPalletPanel();
  };
  carrierSel.addEventListener('change', onPick);
  ctypeSel.addEventListener('change', onPick);
  const keyMap = {'in-L':'L','in-W':'W','in-H':'H','in-doorW':'doorW','in-doorH':'doorH','in-payload':'payload','in-floorload':'floorLoad'};
  Object.keys(keyMap).forEach(id=>{
    const inp = document.getElementById(id);
    inp.addEventListener('input', e=>{
      state.container[keyMap[id]] = e.target.value === '' ? null : parseFloat(e.target.value);
      // Sửa tay kích thước → chuyển sang "Tự nhập" để không nhầm là số của hãng
      if (id !== 'in-floorload' && id !== 'in-payload' && state.container.carrier !== 'custom'){
        state.container.carrier = 'custom'; carrierSel.value = 'custom'; renderCarrierSource();
      }
    });
    inp.addEventListener('change', ()=>{ renderStructPanel(); renderPalletPanel(); });
  });

  document.getElementById('btn-add-forbidden').addEventListener('click', ()=>{
    state.container.forbiddenZones.push({ x:0, y:0, z:0, dx:500, dy:state.container.H, dz:500, note:"Vùng cấm" });
    renderForbiddenList();
  });
  renderForbiddenList();
}

/* Panel "Điểm mù & khe hở": mỗi input mang data-s="đường.dẫn" trong state.container.struct */
function renderStructPanel(){
  const wrap = document.getElementById('struct-wrap');
  if (!wrap) return;
  const s = state.container.struct, c = state.container;
  const num = (path, val, label, unit, est)=> `<div class="field unit-suffix"><label>${label}${est?'<span class="est-tag" title="Ước lượng — chưa đo thực tế">≈</span>':''}</label><input type="number" min="0" data-s="${path}" value="${val}"><span class="u">${unit||'mm'}</span></div>`;
  const chk = (path, val, label)=> `<label class="check-row"><input type="checkbox" data-s="${path}" ${val?'checked':''}><span class="lbl">${label}</span></label>`;
  const headerH = Math.max(0, (c.H||0) - (c.doorH||c.H||0));
  const postW = Math.max(0, ((c.W||0) - (c.doorW||c.W||0)) / 2);
  wrap.innerHTML = `
    <div class="subgroup-title"><span>Điểm mù &amp; khe hở (kích thước lọt lòng thực dùng) <a href="#" id="lnk-blind-help" style="color:var(--accent);font-weight:400;">· sơ đồ ❓</a></span>
      <label class="check-row" style="padding:0;"><input type="checkbox" data-s="enabled" ${s.enabled?'checked':''}><span class="lbl">Bật</span></label></div>
    <div style="${s.enabled?'':'opacity:.45;pointer-events:none;'}">
      ${chk('gusset.on', s.gusset.on, 'Gờ góc trên — 2 góc ở vách kín')}
      <div class="row">${num('gusset.dx', s.gusset.dx, 'Dọc', 'mm', true)}${num('gusset.dz', s.gusset.dz, 'Ngang', 'mm', true)}${num('gusset.dy', s.gusset.dy, 'Cao (từ trần)', 'mm', true)}</div>
      ${chk('topRail.on', s.topRail.on, 'Ray nóc chạy dọc 2 vách hông')}
      <div class="row">${num('topRail.dz', s.topRail.dz, 'Lấn ngang', 'mm', true)}${num('topRail.dy', s.topRail.dy, 'Cao (từ trần)', 'mm', true)}</div>
      ${chk('header.on', s.header.on, `Đà cửa — cao ${fmtInt(headerH)} mm (= H1 − H2, tự tính)`)}
      ${chk('doorPost.on', s.doorPost.on, `Trụ cửa — lấn ${fmt(postW,0)} mm/bên (= (rộng − rộng cửa)/2)`)}
      <div class="row">${num('header.depth', s.header.depth, 'Sâu khung cửa (đà & trụ)', 'mm', true)}</div>
      <div class="row">${num('topClear', s.topClear, 'Khe trần thao tác', 'mm')}${num('doorClear', s.doorClear, 'Khe sát cửa', 'mm')}${num('sideClear', s.sideClear || 0, 'Khe mỗi vách hông', 'mm')}</div>
      ${chk('show3D', s.show3D, 'Hiện điểm mù trong sơ đồ 3D')}
      <div class="struct-preset">
        <label>Bộ số liệu</label>
        <select id="struct-preset-sel">
          ${Object.entries(STRUCT_PRESETS).map(([k, p])=> `<option value="${k}">${p.label}</option>`).join('')}
          <option value="user" ${loadUserStructPreset() ? '' : 'disabled'}>Bộ của tôi${loadUserStructPreset() ? '' : ' (chưa lưu)'}</option>
        </select>
        <button class="btn small" id="struct-preset-apply" title="Ghi đè các số đo/khe ở trên bằng bộ đã chọn (công tắc bật/tắt giữ nguyên)">↺ Áp dụng</button>
        <button class="btn small ghost" id="struct-preset-save" title="Lưu các số đang nhập làm 'Bộ của tôi' trên máy này">💾 Lưu làm bộ của tôi</button>
      </div>
      <div class="hint">Số có nhãn ≈ là ước lượng (ảnh hiện trường + khối góc ISO 1161) — nên đo 1 cont thật rồi lưu thành "Bộ của tôi". Cao đà cửa và lấn trụ cửa luôn tự tính từ kích thước cont/cửa.</div>
    </div>`;
  wrap.querySelectorAll('[data-s]').forEach(inp=>{
    inp.addEventListener(inp.type === 'checkbox' ? 'change' : 'input', ()=>{
      const path = inp.getAttribute('data-s').split('.');
      let obj = s; for (let i=0;i<path.length-1;i++) obj = obj[path[i]];
      const k = path[path.length-1];
      obj[k] = inp.type === 'checkbox' ? inp.checked : Math.max(0, parseFloat(inp.value || 0));
      if (k === 'depth' && path[0] === 'header') s.doorPost.depth = obj[k]; // đà & trụ dùng chung độ sâu khung cửa
      if (inp.type === 'checkbox') renderStructPanel();
    });
  });
  const lk = document.getElementById('lnk-blind-help');
  if (lk) lk.onclick = (e)=>{ e.preventDefault(); openHelp('blind'); };
  document.getElementById('struct-preset-apply').onclick = ()=>{
    const k = document.getElementById('struct-preset-sel').value;
    const v = k === 'user' ? loadUserStructPreset() : (STRUCT_PRESETS[k] || {}).v;
    if (!v){ showToast('Chưa có "Bộ của tôi" — nhập số rồi bấm "Lưu làm bộ của tôi".', true); return; }
    applyStructPreset(JSON.parse(JSON.stringify(v)));
    renderStructPanel();
    showToast('Đã áp bộ số liệu điểm mù: ' + (k === 'user' ? 'Bộ của tôi' : STRUCT_PRESETS[k].label) + '. Bấm "Tối ưu" để tính lại.');
  };
  document.getElementById('struct-preset-save').onclick = ()=>{
    try { localStorage.setItem(STRUCT_USER_KEY, JSON.stringify(structPresetPick(s))); showToast('Đã lưu "Bộ của tôi" trên máy này.'); renderStructPanel(); }
    catch(e){ showToast('Không lưu được (trình duyệt chặn bộ nhớ cục bộ).', true); }
  };
}

/* ---------- Chế độ Bulk / Pallet ---------- */
function bindModeInputs(){
  document.querySelectorAll('#mode-segmented button').forEach(b=>{
    b.addEventListener('click', ()=>{
      state.loadMode = b.dataset.mode;
      updateModeVisibility();
    });
  });
  updateModeVisibility();
}
function updateModeVisibility(){
  const pallet = state.loadMode === 'pallet';
  document.getElementById('app').classList.toggle('mode-pallet', pallet);
  document.querySelectorAll('#mode-segmented button').forEach(x=> x.classList.toggle('active', x.dataset.mode === state.loadMode));
  document.getElementById('mode-badge-bulk').classList.toggle('active', !pallet);
  document.getElementById('mode-badge-pallet').classList.toggle('active', pallet);
}

function renderForbiddenList(){
  const wrap = document.getElementById('forbidden-list');
  wrap.innerHTML = '';
  state.container.forbiddenZones.forEach((z, idx)=>{
    const card = el('div', 'sku-card', '');
    card.style.marginTop = '8px';
    card.innerHTML = `
      <div class="sku-card-body" style="display:block;">
        <div class="field"><label>Ghi chú</label><input type="text" value="${z.note}" data-f="note"></div>
        <div class="row">
          <div class="field"><label>X (từ đầu cont, mm)</label><input type="number" value="${z.x}" data-f="x"></div>
          <div class="field"><label>Y (từ sàn, mm)</label><input type="number" value="${z.y}" data-f="y"></div>
          <div class="field"><label>Z (từ vách, mm)</label><input type="number" value="${z.z}" data-f="z"></div>
        </div>
        <div class="row">
          <div class="field"><label>Kích thước X</label><input type="number" value="${z.dx}" data-f="dx"></div>
          <div class="field"><label>Kích thước Y</label><input type="number" value="${z.dy}" data-f="dy"></div>
          <div class="field"><label>Kích thước Z</label><input type="number" value="${z.dz}" data-f="dz"></div>
        </div>
        <button class="btn danger ghost small block" data-remove="${idx}">Xóa vùng cấm</button>
      </div>`;
    card.querySelectorAll('[data-f]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const f = inp.getAttribute('data-f');
        z[f] = f === 'note' ? inp.value : parseFloat(inp.value || 0);
      });
    });
    card.querySelector('[data-remove]').addEventListener('click', ()=>{
      state.container.forbiddenZones.splice(idx,1);
      renderForbiddenList();
    });
    wrap.appendChild(card);
  });
}

/* ---------- Mix inputs ---------- */
function bindMixInputs(){
  const sel = document.getElementById('in-mixmode');
  sel.addEventListener('change', ()=>{
    state.mixMode = sel.value;
    updateMixVisibility();
  });
  document.getElementById('in-partial-type').addEventListener('change', e=>{
    state.partialMixType = e.target.value;
    updateMixVisibility();
  });
  document.getElementById('in-partial-n').addEventListener('input', e=> state.partialMixN = parseInt(e.target.value||1));
  document.getElementById('in-partial-blocks').addEventListener('input', e=> state.partialMixBlocks = parseInt(e.target.value||1));
  document.getElementById('in-partial-k').addEventListener('input', e=> state.partialMixK = parseInt(e.target.value||1));
  updateMixVisibility();
}
function updateMixVisibility(){
  document.getElementById('mix-none-wrap').style.display = state.mixMode === 'none' ? 'block' : 'none';
  document.getElementById('mix-partial-wrap').style.display = state.mixMode === 'partial' ? 'block' : 'none';
  if (state.mixMode === 'partial'){
    document.getElementById('partial-n-wrap').style.display = state.partialMixType === 'layer' ? 'block' : 'none';
    document.getElementById('partial-blocks-wrap').style.display = state.partialMixType === 'block' ? 'block' : 'none';
    document.getElementById('partial-k-wrap').style.display = state.partialMixType === 'count' ? 'block' : 'none';
  }
  renderSkuOrderList();
}

function renderSkuOrderList(){
  const wrap = document.getElementById('sku-order-list');
  if (!wrap) return;
  wrap.innerHTML = '';
  if (state.mixMode !== 'none') return;
  // ensure skuOrder contains all current sku ids
  const ids = state.skus.map(s=>s.id);
  state.skuOrder = state.skuOrder.filter(id=> ids.includes(id));
  ids.forEach(id=>{ if (!state.skuOrder.includes(id)) state.skuOrder.push(id); });

  state.skuOrder.forEach((id, idx)=>{
    const sku = state.skus.find(s=>s.id===id);
    if (!sku) return;
    const row = el('div', '', '');
    row.style.cssText = 'display:flex;align-items:center;gap:6px;padding:5px 6px;background:var(--bg-2);border:1px solid var(--line-0);border-radius:4px;margin-bottom:4px;cursor:grab;';
    row.draggable = true;
    row.dataset.id = id;
    row.innerHTML = `<span style="color:var(--text-2);font-family:var(--mono);font-size:10px;">${idx+1}</span>
      <span class="sku-color-dot" style="background:${sku.color}"></span>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${sku.code || sku.name || '(SKU chưa đặt tên)'}</span>`;
    row.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', id); row.style.opacity='0.4'; });
    row.addEventListener('dragend', ()=> row.style.opacity='1');
    row.addEventListener('dragover', e=> e.preventDefault());
    row.addEventListener('drop', e=>{
      e.preventDefault();
      const draggedId = e.dataTransfer.getData('text/plain');
      const from = state.skuOrder.indexOf(draggedId);
      const to = state.skuOrder.indexOf(id);
      if (from<0||to<0||from===to) return;
      state.skuOrder.splice(from,1);
      state.skuOrder.splice(to,0,draggedId);
      renderSkuOrderList();
    });
    wrap.appendChild(row);
  });
}

/* ---------- Options ---------- */
function syncOptionInputsFromState(){
  document.querySelectorAll('#speed-segmented button').forEach(x=> x.classList.toggle('active', x.dataset.speed === state.speedLevel));
  document.querySelectorAll('#direction-segmented button').forEach(x=> x.classList.toggle('active', x.dataset.dir === state.loadingDirection));
  const BL = state.bulkLayout || (state.bulkLayout = { mode: 'default', keep: null, step: 1 });
  const BC = state.bulkCustoms || (state.bulkCustoms = { enabled: false, n: 2 });
  document.getElementById('in-bulk-layout').value = BL.mode || 'default';
  document.getElementById('bulk-stair-wrap').style.display = BL.mode === 'stair' ? '' : 'none';
  document.getElementById('in-stair-keep').value = BL.keep == null ? '' : BL.keep;
  document.getElementById('in-stair-step').value = BL.step || 1;
  document.getElementById('bulk-stair-wrap2').style.display = BL.mode === 'stair' ? '' : 'none';
  document.getElementById('in-stair-every').value = BL.every || 1;
  document.getElementById('in-stair-min').value = BL.minRows || 1;
  document.getElementById('in-bulk-customs').checked = !!BC.enabled;
  document.getElementById('in-zone-noshift').checked = state.zoneNoShift !== false;
  document.getElementById('bulk-customs-n-wrap').style.display = BC.enabled ? '' : 'none';
  document.getElementById('in-bulk-customs-n').value = BC.n || 2;
  document.getElementById('maxtime-wrap').style.display = state.speedLevel === 'max' ? 'block' : 'none';
  document.getElementById('in-maxtime').value = state.maxTimeSec;
  document.getElementById('in-heavybottom').checked = state.heavyBottomPriority;
  document.getElementById('in-enforcepayload').checked = state.enforcePayload;
  document.getElementById('in-support').value = state.supportThreshold;
  document.getElementById('in-cogl').value = state.cogWarnLong;
  document.getElementById('in-cogw').value = state.cogWarnLat;
  document.getElementById('in-smartfit').checked = state.smartFitEnabled;
}

function bindOptionInputs(){
  document.querySelectorAll('#speed-segmented button').forEach(b=>{
    b.addEventListener('click', ()=>{ state.speedLevel = b.dataset.speed; syncOptionInputsFromState(); });
  });
  document.querySelectorAll('#direction-segmented button').forEach(b=>{
    b.addEventListener('click', ()=>{ state.loadingDirection = b.dataset.dir; syncOptionInputsFromState(); });
  });
  document.getElementById('in-bulk-layout').addEventListener('change', e=>{ state.bulkLayout.mode = e.target.value; syncOptionInputsFromState(); });
  document.getElementById('in-stair-keep').addEventListener('input', e=>{ const v = e.target.value; state.bulkLayout.keep = v === '' ? null : Math.max(0, parseInt(v, 10)); });
  document.getElementById('in-stair-step').addEventListener('input', e=>{ state.bulkLayout.step = Math.max(1, parseInt(e.target.value || 1, 10)); });
  document.getElementById('in-stair-every').addEventListener('input', e=>{ state.bulkLayout.every = Math.max(1, parseInt(e.target.value || 1, 10)); });
  document.getElementById('in-stair-min').addEventListener('input', e=>{ state.bulkLayout.minRows = Math.max(1, parseInt(e.target.value || 1, 10)); });
  document.getElementById('in-bulk-customs').addEventListener('change', e=>{ state.bulkCustoms.enabled = e.target.checked; syncOptionInputsFromState(); });
  document.getElementById('in-zone-noshift').addEventListener('change', e=>{ state.zoneNoShift = e.target.checked; });
  document.getElementById('in-bulk-customs-n').addEventListener('input', e=>{ state.bulkCustoms.n = Math.max(1, parseInt(e.target.value || 1, 10)); });
  document.getElementById('in-maxtime').addEventListener('input', e=> state.maxTimeSec = clamp(parseFloat(e.target.value||120), 30, 1800));
  document.getElementById('in-heavybottom').addEventListener('change', e=> state.heavyBottomPriority = e.target.checked);
  document.getElementById('in-enforcepayload').addEventListener('change', e=> state.enforcePayload = e.target.checked);
  document.getElementById('in-support').addEventListener('input', e=> state.supportThreshold = clamp(parseFloat(e.target.value||70), 10, 100));
  document.getElementById('in-cogl').addEventListener('input', e=> state.cogWarnLong = Math.max(0, parseFloat(e.target.value||5)));
  document.getElementById('in-cogw').addEventListener('input', e=> state.cogWarnLat = Math.max(0, parseFloat(e.target.value||2.5)));
  document.getElementById('in-smartfit').addEventListener('change', e=> state.smartFitEnabled = e.target.checked);
}

function buildPalletTypeCard(t){
  const P = state.pallet, lim = palletHeightLimit();
  const preset = PALLET_PRESETS.find(p=> p.id === t.preset);
  const isDefault = P.defaultTypeId === t.id;
  const effH = t.maxHeight ? Math.min(t.maxHeight, lim) : lim;
  const warns = [];
  if (t.maxHeight && t.maxHeight > lim) warns.push(`Cao chất ${fmtInt(t.maxHeight)} mm vượt giới hạn qua cửa → tool tự giới hạn về ${fmtInt(lim)} mm.`);
  const oc = overhangCapForPallet(t, state.container);
  if (t.overhang > oc.cap) warns.push(`Chìa mép ${fmtInt(t.overhang)} mm/bên vượt mức giữ chỗ trong cont → tool chỉ dùng ${fmtInt(oc.cap)} mm (để vẫn đặt ${oc.nW} pallet cạnh nhau trong ${fmtInt(oc.usableW)} mm bề ngang và ${oc.nL} pallet nối đuôi theo chiều dài).`);
  if (t.overhang > 0) warns.push(`Chìa mép ${fmtInt(t.overhang)} mm/bên: tài liệu ngành bao bì ghi nhận chìa mép có thể giảm ~1/3 sức nén thùng và dễ va đập khi xe nâng thao tác. Khuyến cáo 0 mm; nếu buộc phải chìa, giữ nhỏ nhất có thể và gia cố góc.`);
  if (effH - t.H <= 0) warns.push('Chiều cao chất không đủ cho hàng (≤ chiều cao pallet).');
  const card = el('div', 'sku-card expanded');
  card.style.marginBottom = '6px';
  card.innerHTML = `
    <div class="sku-card-head" style="cursor:default;">
      <span class="sku-color-dot" style="background:#8a6a45"></span>
      <span class="sku-name">${escapeHtml(t.name)}</span>
      <label class="check-row" style="padding:0;margin-left:auto;" title="Loại mặc định cho SKU chưa chọn pallet"><input type="radio" name="ptype-default" ${isDefault?'checked':''} data-default><span class="lbl">Mặc định</span></label>
      ${P.types.length > 1 ? '<button class="icon-btn" data-del title="Xóa loại pallet">✕</button>' : ''}
    </div>
    <div class="sku-card-body">
      <div class="field"><label>Kích thước phổ biến</label>
        <select data-p="preset">${PALLET_PRESETS.map(p=> `<option value="${p.id}" ${p.id===t.preset?'selected':''}>${p.name}</option>`).join('')}</select>
        ${preset && preset.note ? `<div class="hint">${preset.note}</div>` : ''}</div>
      <div class="row">
        <div class="field unit-suffix"><label>Dài</label><input type="number" data-p="L" min="1" value="${t.L}"><span class="u">mm</span></div>
        <div class="field unit-suffix"><label>Rộng</label><input type="number" data-p="W" min="1" value="${t.W}"><span class="u">mm</span></div>
        <div class="field unit-suffix"><label>Cao pallet</label><input type="number" data-p="H" min="1" value="${t.H}"><span class="u">mm</span></div>
      </div>
      <div class="row">
        <div class="field unit-suffix"><label>KL pallet rỗng</label><input type="number" data-p="weight" min="0" step="0.5" value="${t.weight}"><span class="u">kg</span></div>
        <div class="field unit-suffix"><label>Tải hàng tối đa</label><input type="number" data-p="maxLoadKg" min="0" value="${t.maxLoadKg ?? ''}"><span class="u">kg</span></div>
      </div>
      <div class="row">
        <div class="field unit-suffix"><label>Cao chất tối đa (gồm pallet)</label><input type="number" data-p="maxHeight" min="1" value="${t.maxHeight ?? ''}" placeholder="tối đa ${fmtInt(lim)}"><span class="u">mm</span></div>
        <div class="field unit-suffix"><label>Chìa mép tối đa/bên</label><input type="number" data-p="overhang" min="0" value="${t.overhang}"><span class="u">mm</span></div>
      </div>
      <div class="hint">Đang dùng: cao chất ${fmtInt(effH)} mm (hàng ${fmtInt(Math.max(0, effH - t.H))} mm + pallet ${fmtInt(t.H)} mm). Chìa mép tối đa không mất chỗ trong cont này: <b>${fmtInt(oc.cap)} mm/bên</b> (${oc.nW} pallet/hàng ngang, ${oc.nL} pallet theo chiều dài).</div>
      ${warns.map(w=> `<div class="alert warn" style="margin-top:6px;"><span class="ic">⚠</span><span>${w}</span></div>`).join('')}
    </div>`;
  card.querySelector('[data-default]').addEventListener('change', ()=>{ P.defaultTypeId = t.id; renderPalletPanel(); renderSkuList(); });
  const del = card.querySelector('[data-del]');
  if (del) del.addEventListener('click', ()=>{
    P.types = P.types.filter(x=> x.id !== t.id);
    if (P.defaultTypeId === t.id) P.defaultTypeId = P.types[0].id;
    if (P.customs.typeId === t.id) P.customs.typeId = null;
    state.skus.forEach(sk=>{ if (sk.palletTypeId === t.id) sk.palletTypeId = null; });
    renderPalletPanel(); renderSkuList();
  });
  card.querySelectorAll('[data-p]').forEach(inp=>{
    const f = inp.getAttribute('data-p');
    if (f === 'preset'){
      inp.addEventListener('change', ()=>{
        const p = PALLET_PRESETS.find(x=> x.id === inp.value);
        Object.assign(t, { preset:p.id, name:p.name, L:p.L, W:p.W, H:p.H, weight:p.weight });
        renderPalletPanel(); renderSkuList();
      });
      return;
    }
    inp.addEventListener('input', ()=>{
      const v = inp.value === '' ? null : parseFloat(inp.value);
      t[f] = (f === 'maxHeight' || f === 'maxLoadKg') ? v : Math.max(0, v || 0);
      if (['L','W','H','weight'].includes(f) && t.preset !== 'custom'){ t.preset = 'custom'; t.name = 'Tùy chỉnh ' + t.L + '×' + t.W; }
    });
    inp.addEventListener('change', ()=> renderPalletPanel());
  });
  return card;
}

/* ============================================================
   2b. ĐƠN HÀNG — lưu / mở / dùng làm mẫu / xuất-nhập file
   Lưu trong IndexedDB của trình duyệt (dự phòng: localStorage). Dữ liệu gắn với trình duyệt + hồ sơ
   người dùng trên máy này → xóa dữ liệu duyệt web là mất; nên "Xuất file đơn" để sao lưu / gửi đồng nghiệp.
   ============================================================ */
const ORDER_FILE_FORMAT = 'container-load-optimizer/order';
const ORDER_DB = 'ContainerLoadOptimizer', ORDER_STORE = 'orders', ORDER_LS_KEY = 'clo_orders_v1';

const orderStore = (()=>{
  let dbp = null;
  function openDb(){
    if (dbp) return dbp;
    dbp = new Promise((res, rej)=>{
      if (!window.indexedDB) return rej(new Error('no-idb'));
      const q = indexedDB.open(ORDER_DB, 1);
      q.onupgradeneeded = ()=> q.result.createObjectStore(ORDER_STORE, { keyPath: 'id' });
      q.onsuccess = ()=> res(q.result);
      q.onerror = ()=> rej(q.error);
    }).catch(err=>{ dbp = null; throw err; });
    return dbp;
  }
  const lsAll = ()=>{ try { return JSON.parse(localStorage.getItem(ORDER_LS_KEY) || '{}'); } catch(e){ return {}; } };
  const lsSave = (m)=> localStorage.setItem(ORDER_LS_KEY, JSON.stringify(m));
  async function tx(mode, fn){
    const db = await openDb();
    return new Promise((res, rej)=>{
      const t = db.transaction(ORDER_STORE, mode), st = t.objectStore(ORDER_STORE);
      const r = fn(st);
      t.oncomplete = ()=> res(r && 'result' in r ? r.result : undefined);
      t.onerror = ()=> rej(t.error); t.onabort = ()=> rej(t.error);
    });
  }
  return {
    async list(){ try { return await tx('readonly', st=> st.getAll()); } catch(e){ return Object.values(lsAll()); } },
    async get(id){ try { return await tx('readonly', st=> st.get(id)); } catch(e){ return lsAll()[id]; } },
    async put(rec){ try { await tx('readwrite', st=> st.put(rec)); } catch(e){ const m = lsAll(); m[rec.id] = rec; lsSave(m); } },
    async remove(id){ try { await tx('readwrite', st=> st.delete(id)); } catch(e){ const m = lsAll(); delete m[id]; lsSave(m); } }
  };
})();

function snapshotInputs(){
  const pick = {
    container: state.container, loadMode: state.loadMode, pallet: state.pallet,
    skus: state.skus, skuOrder: state.skuOrder, mixGroups: state.mixGroups,
    mixMode: state.mixMode, partialMixType: state.partialMixType, partialMixN: state.partialMixN,
    partialMixBlocks: state.partialMixBlocks, partialMixK: state.partialMixK,
    speedLevel: state.speedLevel, maxTimeSec: state.maxTimeSec, loadingDirection: state.loadingDirection,
    bulkLayout: state.bulkLayout, bulkCustoms: state.bulkCustoms, zoneNoShift: state.zoneNoShift,
    heavyBottomPriority: state.heavyBottomPriority, supportThreshold: state.supportThreshold,
    enforcePayload: state.enforcePayload, smartFitEnabled: state.smartFitEnabled,
    cogWarnLong: state.cogWarnLong, cogWarnLat: state.cogWarnLat
  };
  return JSON.parse(JSON.stringify(pick));
}
function hashString(str){ let h = 5381; for (let i=0; i<str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function hashInputs(){
  // "Mô tả in nhãn" chỉ dùng khi in nhãn → không tính vào dấu vân tay dữ liệu (sửa mô tả không làm phương án lỗi thời)
  const snap = JSON.parse(JSON.stringify(snapshotInputs()));
  (snap.skus || []).forEach(k=> delete k.labelDesc);
  return hashString(JSON.stringify(snap));
}

function restoreInputs(inp){
  const d = JSON.parse(JSON.stringify(inp));
  Object.keys(d).forEach(k=>{ if (k in state || k === 'pallet') state[k] = d[k]; });
  // bổ sung trường mới cho đơn lưu ở bản cũ hơn
  state.container.struct = Object.assign(JSON.parse(JSON.stringify(STRUCT_DEFAULTS)), state.container.struct || {});
  if (!state.pallet){ initPalletState(); }
  state.pallet.customs = Object.assign({ enabled:true, n:1, typeId:null, side:'right', mode:'fill' }, state.pallet.customs || {});
  state.pallet = Object.assign({ loadGoal:'compact', groupSimilar:true, similarTol:20, layerHTol:5, strapTol:60, minPalletPct:60, spreadToBlock:false, spreadGap:30, printNames:false, strapMode:false, allowLayDown:true, spreadTol:{ h:null, w:null } }, state.pallet);
  delete state.pallet.spreadLimit; // bản trước dùng giới hạn tuyệt đối — đã thay bằng sai lệch ±%
  state.bulkLayout = Object.assign({ mode: 'default', keep: null, step: 1, every: 1, minRows: 1 }, d.bulkLayout || {});
  state.bulkCustoms = Object.assign({ enabled: false, n: 2 }, d.bulkCustoms || {});
  if (d.zoneNoShift === undefined) state.zoneNoShift = true;
  // bộ đếm id không được trùng với id đã có
  const maxNum = (arr, pre)=> arr.reduce((m, x)=> Math.max(m, parseInt(String(x).replace(pre, ''), 10) || 0), 0);
  skuIdCounter = Math.max(skuIdCounter, maxNum(state.skus.map(x=> x.id), 'sku_') + 1);
  palletTypeCounter = Math.max(palletTypeCounter, maxNum(state.pallet.types.map(x=> x.id), 'pt_') + 1);
}

function orderSummary(){
  const qty = state.skus.reduce((t,k)=> t + (k.qty || 0), 0);
  const r = state.result;
  return {
    mode: state.loadMode, carrier: (CARRIER_SPECS[state.container.carrier] || {}).name || '', ctype: CONTAINER_TYPES[state.container.ctype] || '',
    skuCount: state.skus.length, totalQty: qty, skuCodes: state.skus.map(k=> k.code).join(' '),
    placed: r ? r.stats.totalPlaced : null, pallets: r && r.mode === 'pallet' ? r.stats.palletCount : null
  };
}

function buildOrderRecord(id, createdAt){
  const fresh = !!(state.result && state.resultInputsHash === hashInputs());
  return {
    id, name: state.orderName.trim(), note: (state.orderNote || '').trim(),
    createdAt: createdAt || Date.now(), updatedAt: Date.now(), appVersion: 2,
    summary: orderSummary(), inputs: snapshotInputs(),
    result: fresh ? JSON.parse(JSON.stringify(state.result)) : null
  };
}

async function saveOrder(asNew){
  if (!state.orderName || !state.orderName.trim()){ showToast('Nhập tên đơn hàng trước khi lưu.', true); document.getElementById('in-order-name').focus(); return; }
  if (asNew){
    const nn = prompt('Tên cho đơn mới:', state.currentOrder ? state.orderName + ' — lô mới' : state.orderName);
    if (nn === null) return;
    state.orderName = nn.trim() || state.orderName; document.getElementById('in-order-name').value = state.orderName;
  }
  const old = (!asNew && state.currentOrder) ? await orderStore.get(state.currentOrder.id) : null;
  const id = old ? old.id : 'ord_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const rec = buildOrderRecord(id, old ? old.createdAt : null);
  try { await orderStore.put(rec); }
  catch(e){ showToast('Không lưu được (bộ nhớ trình duyệt đầy hoặc bị chặn) — hãy dùng "Xuất file đơn".', true); return; }
  state.currentOrder = { id, savedAt: rec.updatedAt, hasResult: !!rec.result };
  renderOrderStatus();
  showToast(rec.result ? `Đã lưu "${rec.name}" kèm phương án chất hàng.` : `Đã lưu "${rec.name}" (chưa kèm phương án — dữ liệu đổi sau lần tối ưu cuối hoặc chưa tối ưu).`);
}

function applyOrderRecord(rec, asTemplate){
  restoreInputs(rec.inputs);
  state.orderName = asTemplate ? rec.name + ' — lô mới' : rec.name;
  state.orderNote = rec.note || '';
  state.currentOrder = asTemplate ? null : { id: rec.id, savedAt: rec.updatedAt, hasResult: !!rec.result };
  state.result = null; state.resultInputsHash = null;
  buildLeftColumn();
  updateModeVisibility();
  buildRightColumn();
  clear3DScene();
  Object.assign(edit, { on: false, sel: null, undo: [], tray: [], warn: [] });
  renderEditPanel();
  if (!asTemplate && rec.result){
    state.result = rec.result;
    state.resultInputsHash = hashInputs();
    render3DResult(state.result);
    buildRightColumn();
    renderRightResults(state.result);
  }
  renderOrderStatus();
  showToast(asTemplate ? `Đã nạp "${rec.name}" làm mẫu — sửa số lượng rồi bấm Tối ưu.` : `Đã mở "${rec.name}".`);
}

async function openOrderModal(){
  const modal = document.getElementById('order-modal');
  modal.classList.add('open');
  const search = document.getElementById('order-search');
  const draw = async ()=>{
    const all = (await orderStore.list()).sort((a,b)=> b.updatedAt - a.updatedAt);
    const q = search.value.trim().toLowerCase();
    const list = q ? all.filter(o=> (o.name + ' ' + (o.note||'') + ' ' + ((o.summary||{}).skuCodes||'')).toLowerCase().includes(q)) : all;
    const box = document.getElementById('order-list');
    if (!list.length){ box.innerHTML = `<div class="empty-state">${all.length ? 'Không có đơn khớp từ khóa.' : 'Chưa có đơn nào được lưu trên trình duyệt này.'}</div>`; return; }
    box.innerHTML = list.map(o=>{
      const sm = o.summary || {};
      return `<div class="order-row">
        <div class="info"><div class="nm">${escapeHtml(o.name)}</div>
          <div class="meta">${new Date(o.updatedAt).toLocaleString('vi-VN')} · ${sm.mode === 'pallet' ? 'Pallet' : 'Bulk'} · ${escapeHtml(sm.carrier||'')} ${escapeHtml(sm.ctype||'')} · ${sm.skuCount||0} SKU / ${fmtInt(sm.totalQty||0)} thùng${o.result ? ` · đã xếp ${fmtInt(sm.placed)}${sm.pallets ? ` / ${sm.pallets} pallet` : ''}` : ' · chưa có phương án'}${o.note ? ' · ' + escapeHtml(o.note) : ''}</div></div>
        <button class="btn small" data-open="${o.id}">Mở</button>
        <button class="btn ghost small" data-tpl="${o.id}" title="Nạp dữ liệu làm lô mới: giữ SKU & cài đặt, sửa số lượng rồi tối ưu lại">Dùng làm mẫu</button>
        <button class="btn ghost small" data-del="${o.id}" title="Xóa đơn">✕</button>
      </div>`;
    }).join('');
    box.querySelectorAll('[data-open]').forEach(b=> b.onclick = async ()=>{ const r = await orderStore.get(b.dataset.open); modal.classList.remove('open'); applyOrderRecord(r, false); });
    box.querySelectorAll('[data-tpl]').forEach(b=> b.onclick = async ()=>{ const r = await orderStore.get(b.dataset.tpl); modal.classList.remove('open'); applyOrderRecord(r, true); });
    box.querySelectorAll('[data-del]').forEach(b=> b.onclick = async ()=>{
      const r = await orderStore.get(b.dataset.del);
      if (!confirm(`Xóa đơn "${r.name}"? Không hoàn tác được (trừ khi đã xuất file).`)) return;
      await orderStore.remove(b.dataset.del);
      if (state.currentOrder && state.currentOrder.id === b.dataset.del){ state.currentOrder = null; renderOrderStatus(); }
      draw();
    });
  };
  search.oninput = draw;
  document.getElementById('order-close').onclick = ()=> modal.classList.remove('open');
  modal.onclick = (e)=>{ if (e.target === modal) modal.classList.remove('open'); };
  draw();
}

function exportOrderFile(){
  if (!state.orderName || !state.orderName.trim()){ showToast('Nhập tên đơn hàng trước khi xuất file.', true); return; }
  const rec = buildOrderRecord(state.currentOrder ? state.currentOrder.id : 'ord_' + Date.now().toString(36), null);
  const safe = rec.name.replace(/[\\/:*?"<>|]+/g, '_').slice(0, 80);
  downloadFile(`${safe}.clo.json`, JSON.stringify({ format: ORDER_FILE_FORMAT, version: 1, order: rec }), 'application/json');
  if (!rec.result && state.result) showToast('Đã xuất file — KHÔNG kèm phương án vì dữ liệu đã đổi sau lần tối ưu cuối.', true);
}

function bindOrderFileInput(){
  const fi = document.getElementById('order-file');
  fi.addEventListener('change', async ()=>{
    const f = fi.files && fi.files[0]; fi.value = '';
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data || data.format !== ORDER_FILE_FORMAT || !data.order || !data.order.inputs) throw new Error('Không phải file đơn của Container Load Optimizer.');
      const rec = data.order;
      rec.id = 'ord_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); // tránh ghi đè đơn đang có
      rec.updatedAt = Date.now();
      await orderStore.put(rec);
      applyOrderRecord(rec, false);
    } catch(e){ showToast('Nhập file thất bại: ' + e.message, true); }
  });
}

    <span class="sku-meta">${sku.qty} kiện</span>

    if (e.target.closest('[data-del]')) return;
    state.expandedSkuId = expanded ? null : sku.id;

  });
  head.querySelector('[data-del]').addEventListener('click', (e)=>{
    e.stopPropagation();
    state.skus = state.skus.filter(s=>s.id!==sku.id);
    delete state.mixGroups[sku.id];
    renderSkuList();
    renderSkuOrderList();
  });

  const body = el('div', 'sku-card-body');

    <div class="row">

    <div class="row">
      <div class="field unit-suffix"><label>Dài</label><input type="number" data-f="L" min="1" value="${sku.L}"><span class="u">mm</span></div>
      <div class="field unit-suffix"><label>Rộng</label><input type="number" data-f="W" min="1" value="${sku.W}"><span class="u">mm</span></div>
      <div class="field unit-suffix"><label>Cao</label><input type="number" data-f="H" min="1" value="${sku.H}"><span class="u">mm</span></div>

    <div class="row">
      <div class="field unit-suffix"><label>Khối lượng/kiện</label><input type="number" data-f="weight" min="0" step="0.1" value="${sku.weight}"><span class="u">kg</span></div>

      <label class="check-row"><input type="checkbox" data-f="rotLocked" ${sku.rotLocked?'checked':''}><span class="lbl">Khóa cứng — chỉ 1 hướng duy nhất</span></label>

function escapeAttr(s){
  return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

function applySkuFieldChange(sku, inp){
  const f = inp.getAttribute('data-f');
  if (f === 'mixGroup'){
    state.mixGroups[sku.id] = inp.value.trim();
    return;
  }
  if (f === 'palletTypeId'){
    sku.palletTypeId = inp.value || null;
    return;
  }
  if (inp.type === 'checkbox'){
    sku[f] = inp.checked;
    // Mutual exclusivity: rotLocked overrides others; rotFree implies all axes
    if (f === 'rotLocked' && sku.rotLocked){
      sku.rotYaw = false; sku.rotRoll = false; sku.rotPitch = false; sku.rotFree = false;
      refreshSkuCardInPlace(sku);
    } else if (f === 'rotFree' && sku.rotFree){
      sku.rotLocked = false;
      refreshSkuCardInPlace(sku);
    } else if ((f === 'rotYaw' || f === 'rotRoll' || f === 'rotPitch') && sku[f]){
      sku.rotLocked = false;
      refreshSkuCardInPlace(sku);
    }
  } else if (f === 'labelDesc'){
    sku.labelDesc = inp.value;      // chỉ dùng khi in nhãn — không ảnh hưởng phương án
    return;
  } else if (f === 'code' || f === 'name'){
    sku[f] = inp.value;
    // update head label live without full re-render (avoid losing focus)
    const head = document.querySelector(`.sku-card[data-id="${sku.id}"] .sku-name`);
    if (head) head.textContent = `${sku.code||'(chưa đặt mã)'} ${sku.name?'— '+sku.name:''}`;
  } else if (f === 'maxStackCount' || f === 'maxStackLoad'){
    sku[f] = inp.value === '' ? null : parseFloat(inp.value);
  } else {
    sku[f] = parseFloat(inp.value || 0);
  }
  const qtyBadge = document.querySelector(`.sku-card[data-id="${sku.id}"] .sku-meta`);
  if (qtyBadge && f==='qty') qtyBadge.textContent = sku.qty + " kiện";
  if (f === 'qty' || f === 'code' || f === 'name') renderQtyQuick();
  renderOrderStatus();
}

// Re-render just the rotation-count label + mini flags without losing scroll/focus badly
function refreshSkuCardInPlace(sku){
  renderSkuList();
}


/* ============================================================
   4. ORIENTATION GENERATOR
   Sinh danh sách các hướng xoay hợp lệ (D×R×C thực tế) cho 1 SKU,
   dựa trên các checkbox ràng buộc xoay do người dùng chọn.
   Module này được dùng cả ở main thread (hiển thị số hướng) và
   trong Web Worker (chạy thuật toán) — nên viết thuần function,
   không phụ thuộc DOM.
   ============================================================ */

// Trả về danh sách orientation: mỗi orientation = {d,w,h, code}
// d/w/h là kích thước thực tế theo 3 trục (X=dài cont, Y=cao, Z=rộng cont)
// code dùng để ghi báo cáo, ví dụ "L-W-H" nghĩa là trục X=L gốc, Y=W gốc, Z=H gốc v.v.
function generateOrientations(sku){
  const {L, W, H} = sku;

  // 6 hoán vị cơ bản của (L,W,H) gán vào (d,w,h)=(trục dài cont, trục cao, trục rộng cont)
  // Ký hiệu mỗi orientation bằng permutation index để loại trùng khi 2 chiều bằng nhau.
  // QUY ƯỚC TRỤC (đã sửa): field `w` = kích thước theo trục Y (CHIỀU CAO, thẳng
  // đứng), field `h` = kích thước theo trục Z (chiều rộng container, nằm ngang).
  // (Tên `w`/`h` giữ nguyên để không phải đổi toàn bộ code còn lại; packContainer
  // ánh xạ sizeX=d, sizeY=w, sizeZ=h.) Trục thẳng đứng của orientation gốc phải
  // là H gốc của kiện, nên `w` (cao) = H và `h` (rộng cont) = W.
  const perms = [
    { d:L, w:H, h:W, code:"L,W,H", axisUp:"H" }, // gốc — H thẳng đứng
    { d:W, w:H, h:L, code:"W,L,H", axisUp:"H" }, // yaw 90° — H vẫn thẳng đứng
    { d:L, w:W, h:H, code:"L,H,W", axisUp:"W" }, // roll — W thẳng đứng
    { d:H, w:W, h:L, code:"H,L,W", axisUp:"W" }, // roll + yaw — W thẳng đứng
    { d:W, w:L, h:H, code:"W,H,L", axisUp:"L" }, // pitch — L thẳng đứng
    { d:H, w:L, h:W, code:"H,W,L", axisUp:"L" }  // pitch + yaw — L thẳng đứng
  ];

  let allowed;

  if (sku.rotLocked){
    allowed = [perms[0]];
  } else if (sku.rotFree){
    allowed = perms.slice();
  } else {
    // Xây dựng từ các trục cho phép
    // yaw: đổi D<->R (giữ Cao=H lên) => perms[0], perms[1]
    // roll: đổi R<->Cao => cho phép W lên (perms[2], perms[3])
    // pitch: đổi D<->Cao => cho phép L lên (perms[4], perms[5])
    const set = [perms[0]]; // orientation gốc luôn hợp lệ
    if (sku.rotYaw) set.push(perms[1]);
    if (sku.rotRoll){ set.push(perms[2]); if (sku.rotYaw) set.push(perms[3]); }
    if (sku.rotPitch){ set.push(perms[4]); if (sku.rotYaw) set.push(perms[5]); }
    allowed = set;
  }

  // "This side up": chỉ giữ orientation mà trục Cao thẳng đứng = H gốc (axisUp === "H")
  if (sku.thisSideUp){
    allowed = allowed.filter(p=> p.axisUp === "H");
    if (allowed.length === 0) allowed = [perms[0]]; // fallback an toàn
  }

  // Loại bỏ orientation trùng lặp về kích thước thực tế (khi 2 chiều bằng nhau)
  const seen = new Set();
  const result = [];
  for (const p of allowed){
    const key = p.d + "x" + p.w + "x" + p.h;
    if (seen.has(key)) continue;
    seen.add(key);
    result.push({ d:p.d, w:p.w, h:p.h, code:p.code });
  }
  return result;
}

/* ============================================================
   5. CONSTRAINT CHECKER
   Các hàm thuần túy (không DOM) — dùng chung main thread & worker.
   Hệ tọa độ: x = dọc theo chiều dài container (0..L),
              y = chiều cao (0..H, 0 = sàn),
              z = chiều rộng (0..W)
   Mỗi placement (kiện đã xếp) = {x,y,z,d,w,h, skuId, weight, fragile,
                                   maxStackCount, maxStackLoad, orientCode}
   d = kích thước theo x, w = kích thước theo y (cao), h = kích thước theo z
   (lưu ý: để khớp với orientation generator, ta gọi field là d/w/h nhưng
    ánh xạ: placement.sizeX=d, placement.sizeY=w (cao), placement.sizeZ=h)
   ============================================================ */

function checkOverlap(a, b){
  // AABB overlap test theo 3 trục, với epsilon nhỏ để tránh false-positive
  // do sai số dấu phẩy động khi 2 mặt chạm nhau vừa khít.
  const EPS = 0.01;
  return !(
    a.x + a.sizeX <= b.x + EPS ||
    b.x + b.sizeX <= a.x + EPS ||
    a.y + a.sizeY <= b.y + EPS ||
    b.y + b.sizeY <= a.y + EPS ||
    a.z + a.sizeZ <= b.z + EPS ||
    b.z + b.sizeZ <= a.z + EPS
  );
}

function isWithinContainer(p, container){
  const EPS = 0.5;
  return (
    p.x >= -EPS && p.y >= -EPS && p.z >= -EPS &&
    p.x + p.sizeX <= container.L + EPS &&
    p.y + p.sizeY <= container.H + EPS &&
    p.z + p.sizeZ <= container.W + EPS
  );
}

function firstForbiddenHit(p, zones){
  if (!zones || zones.length===0) return null;
  const EPS = 0.01;
  for (const z of zones){
    const overlap = !(
      p.x + p.sizeX <= z.x + EPS || z.x + z.dx <= p.x + EPS ||
      p.y + p.sizeY <= z.y + EPS || z.y + z.dy <= p.y + EPS ||
      p.z + p.sizeZ <= z.z + EPS || z.z + z.dz <= p.z + EPS
    );
    if (overlap) return z;
  }
  return null;
}
function isInForbiddenZone(p, zones){ return !!firstForbiddenHit(p, zones); }

// Tính % diện tích đáy của kiện p được "đỡ" bởi sàn hoặc các kiện đã đặt bên dưới.
// Trả về giá trị 0..100.
function computeSupportRatio(p, placed, eps){
  const footprintArea = p.sizeX * p.sizeZ;
  if (footprintArea <= 0) return 100;
  if (Math.abs(p.y) < 0.5) return 100; // nằm trên sàn

  // Gom các ô chữ nhật (trên mặt phẳng x-z) của các kiện có mặt trên chạm đúng y = p.y
  let supportedArea = 0;
  const EPS = eps != null ? eps : SUPPORT_EPS; // dung sai mm cho việc "chạm đáy"
  for (const q of placed){
    const qTop = q.y + q.sizeY;
    if (Math.abs(qTop - p.y) > EPS) continue; // không cùng mặt phẳng tiếp xúc
    // tính phần giao nhau trên trục x
    const ix = Math.max(0, Math.min(p.x + p.sizeX, q.x + q.sizeX) - Math.max(p.x, q.x));
    const iz = Math.max(0, Math.min(p.z + p.sizeZ, q.z + q.sizeZ) - Math.max(p.z, q.z));
    if (ix > 0 && iz > 0) supportedArea += ix * iz;
  }
  return clampNum((supportedArea / footprintArea) * 100, 0, 100);
}
function clampNum(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }

// Tìm danh sách các kiện "đỡ trực tiếp" cho p (mặt trên của chúng chạm đáy p
// với vùng giao nhau thực sự > 0 trên mặt phẳng x-z).
// `placed` có thể là MẢNG hoặc HÀM (node)=>mảng ứng viên — hàm dùng chỉ mục không gian để lấy đúng
// các kiện ngay dưới node, kể cả khi node nằm lệch ra ngoài footprint của kiện đang xét.
function findDirectSupporters(p, placed, eps){
  const list = typeof placed === 'function' ? placed(p) : placed;
  const EPS = eps != null ? eps : SUPPORT_EPS;
  const out = [];
  for (const q of list){
    if (q === p) continue;
    const qTop = q.y + q.sizeY;
    if (Math.abs(qTop - p.y) > EPS) continue;
    const ix = Math.max(0, Math.min(p.x + p.sizeX, q.x + q.sizeX) - Math.max(p.x, q.x));
    const iz = Math.max(0, Math.min(p.z + p.sizeZ, q.z + q.sizeZ) - Math.max(p.z, q.z));
    if (ix > 0 && iz > 0) out.push(q);
  }
  return out;
}

function _stackKey(q){ return q.instanceId || (q.x+','+q.y+','+q.z); }

// Kiểm tra ràng buộc "đè lên fragile" / "max tải đè" / "max số lớp đè" khi đặt p.
// Leo dọc TOÀN BỘ chuỗi kiện bên dưới (đệ quy tới sàn). depth = số lớp tính từ p xuống q (q ngay dưới p: 1).
// - Tải: mỗi kiện bên dưới chỉ cộng trọng lượng p ĐÚNG 1 lần dù đỡ qua nhiều nhánh (quy ước bảo thủ:
//   không chia tải cho các kiện đỡ song song).
// - Số lớp: lấy độ sâu LỚN NHẤT qua mọi nhánh (= số lớp đè thực tế), không đếm số kiện.
// Trả về {ok:boolean, reason:string}
function checkStackingRules(p, placed){
  const bestDepth = new Map();
  function climb(node, depth){
    for (const q of findDirectSupporters(node, placed)){
      const key = _stackKey(q);
      const prev = bestDepth.get(key);
      if (prev !== undefined && prev >= depth) continue;
      bestDepth.set(key, depth);
      if (q.fragile) return { ok:false, reason:"fragile_below" };
      if (prev === undefined && q.maxStackLoad !== null && q.maxStackLoad !== undefined){
        if ((q._loadOnTop || 0) + p.weight > q.maxStackLoad + 0.001) return { ok:false, reason:"exceed_stack_load" };
      }
      if (q.maxStackCount !== null && q.maxStackCount !== undefined){
        if (Math.max(q._stackCountAbove || 0, depth) > q.maxStackCount) return { ok:false, reason:"exceed_stack_count" };
      }
      const deeper = climb(q, depth + 1);
      if (!deeper.ok) return deeper;
    }
    return { ok:true };
  }
  return climb(p, 1);
}

// Sau khi p đặt thành công: cộng tải của p vào MỖI kiện bên dưới đúng 1 lần (sửa lỗi cộng trùng khi 1 kiện
// được đỡ qua 2 nhánh), và cập nhật số lớp đè = độ sâu lớn nhất.
function propagateStackLoad(p, placed){
  const bestDepth = new Map();
  function climb(node, depth){
    for (const q of findDirectSupporters(node, placed)){
      const key = _stackKey(q);
      const prev = bestDepth.get(key);
      if (prev === undefined) q._loadOnTop = (q._loadOnTop || 0) + p.weight;
      else if (prev >= depth) continue;
      bestDepth.set(key, depth);
      q._stackCountAbove = Math.max(q._stackCountAbove || 0, depth);
      climb(q, depth + 1);
    }
  }
  climb(p, 1);
}

/* ============================================================
   6. THUẬT TOÁN TỐI ƯU — Extreme Point Heuristic + Best-Fit-Decreasing
   Chạy nhiều "pass" với các thứ tự sắp xếp SKU khác nhau, mỗi pass
   thử toàn bộ orientation hợp lệ cho từng kiện, chọn pass có điểm cao nhất.
   Toàn bộ hàm ở đây là thuần túy (không DOM) để nhúng vào Web Worker.
   ============================================================ */

// Sinh danh sách "item instances" — mỗi kiện lẻ là 1 instance riêng để xếp
function expandSkuToItems(skus){
  const items = [];
  for (const sku of skus){
    if (!sku.qty || sku.qty <= 0) continue;
    const orientations = generateOrientations(sku);
    for (let i=0;i<sku.qty;i++){
      items.push({
        instanceId: sku.id + "_" + i,
        skuId: sku.id,
        skuCode: sku.code,
        skuColor: sku.color,
        weight: sku.weight,
        fragile: !!sku.fragile,
        maxStackCount: sku.maxStackCount ?? null,
        maxStackLoad: sku.maxStackLoad ?? null,
        orientations,
        volume: sku.L * sku.W * sku.H,
        origL: sku.L, origW: sku.W, origH: sku.H,
        mixGroup: sku._mixGroup || null
      });
    }
  }
  return items;
}

// Danh sách các cách sắp xếp thứ tự thử (sort strategies)
function getSortStrategies(){
  return [
    { name:"vol_desc",    cmp:(a,b)=> b.volume - a.volume },
    { name:"height_desc", cmp:(a,b)=> Math.max(...b.orientations.map(o=>o.w),0) - Math.max(...a.orientations.map(o=>o.w),0) },
    { name:"weight_desc", cmp:(a,b)=> b.weight - a.weight },
    { name:"length_desc", cmp:(a,b)=> Math.max(...b.orientations.map(o=>o.d),0) - Math.max(...a.orientations.map(o=>o.d),0) },
    { name:"footprint_desc", cmp:(a,b)=>{
        const fa = Math.max(...a.orientations.map(o=>o.d*o.h),0);
        const fb = Math.max(...b.orientations.map(o=>o.d*o.h),0);
        return fb - fa;
      } },
    // Các biến thể bổ sung — chỉ dùng ở mức "Kỹ" (xem runOptimizerCore): kết hợp
    // 2 tiêu chí (tie-break) để tạo thứ tự KHÁC HẲN 5 thứ tự cơ bản.
    { name:"height_then_footprint", extra:true, cmp:(a,b)=>{
        const ha = Math.max(...a.orientations.map(o=>o.w),0), hb = Math.max(...b.orientations.map(o=>o.w),0);
        if (hb !== ha) return hb - ha;
        return Math.max(...b.orientations.map(o=>o.d*o.h),0) - Math.max(...a.orientations.map(o=>o.d*o.h),0);
      } },
    { name:"weight_then_volume", extra:true, cmp:(a,b)=>{
        if (b.weight !== a.weight) return b.weight - a.weight;
        return b.volume - a.volume;
      } },
    { name:"length_then_weight", extra:true, cmp:(a,b)=>{
        const la = Math.max(...a.orientations.map(o=>o.d),0), lb = Math.max(...b.orientations.map(o=>o.d),0);
        if (lb !== la) return lb - la;
        return b.weight - a.weight;
      } },
    { name:"vol_asc_small_first", extra:true, cmp:(a,b)=> a.volume - b.volume }
  ];
}

/* ------------------------------------------------------------
   SMART FIT (mục 3 — "lấp khít thông minh")
   Với 1 SKU có nhiều orientation hợp lệ, tìm xem có tổ hợp gồm TỐI ĐA 2
   orientation khác nhau (mỗi loại lặp lại N1, N2 lần) sao cho tổng kích
   thước theo trục dọc (L container) HOẶC trục ngang (W container) khớp
   vừa khít (sai số ≤ ngưỡng cho phép) hay không.

   Đây KHÔNG phải bộ giải subset-sum tổng quát — chỉ thử các tổ hợp nhỏ,
   hợp lý (N1,N2 trong khoảng 1..12), đủ để bắt được các trường hợp thực
   tế như ví dụ 53×31×20: 2 kiện dọc (53) + 4 kiện xoay ngang (31) = 106+124=230mm.
   Nếu không tìm thấy tổ hợp khít nào, trả về null — phần còn lại của
   thuật toán vẫn chạy bình thường như không có gì thay đổi (tính năng
   này không có tác dụng phụ khi không tìm được kết quả).
   ------------------------------------------------------------ */
function findSmartFitCombo(orientations, targetLength, opts, dimKey){
  dimKey = dimKey || 'd'; // 'd' = kích thước theo trục X (dài cont); 'h' = theo trục Z (rộng cont)
  const tolerancePct = (opts && opts.tolerancePct) || 1.5; // phần HỤT cho phép (không bao giờ vượt), % targetLength
  const maxEach = (opts && opts.maxEach) || 12;
  const tol = targetLength * (tolerancePct/100);

  // Danh sách kích thước duy nhất theo trục "d" (kích thước theo chiều đang xét)
  // của từng orientation — ta thử ghép mọi cặp orientation (kể cả trùng nhau,
  // tức dùng 1 orientation duy nhất nếu nó tự chia hết targetLength).
  let best = null; // {combo:[{orient, count}], totalLength, error}

  for (let i=0;i<orientations.length;i++){
    for (let j=i;j<orientations.length;j++){
      const d1 = orientations[i][dimKey], d2 = orientations[j][dimKey];
      if (d1<=0 || d2<=0) continue;
      for (let n1=1; n1<=maxEach; n1++){
        // ước lượng n2 gần đúng để giảm số vòng lặp thay vì brute-force toàn bộ maxEach^2
        const remain = targetLength - n1*d1;
        if (remain < 0) break; // n1 đã vượt chiều dài → các n1 lớn hơn càng vượt
        const n2Approx = Math.max(0, Math.round(remain / d2));
        for (let dn=-1; dn<=1; dn++){ // thử quanh giá trị ước lượng để tăng độ chính xác
          const n2 = n2Approx + dn;
          if (n2 < 0 || n2 > maxEach) continue;
          if (i===j && n2>0) continue; // tránh đếm trùng khi i===j (đã gộp vào n1)
          const total = n1*d1 + n2*d2;
          if (total > targetLength + 0.001) continue; // vượt kích thước cont → không xếp được, bỏ
          const err = targetLength - total;             // phần hụt (≥ 0)
          if (err <= tol){
            const combo = n2>0
              ? [{orient:orientations[i], count:n1}, {orient:orientations[j], count:n2}]
              : [{orient:orientations[i], count:n1}];
            if (!best || err < best.error){
              best = { combo, totalLength: total, error: err };
            }
          }
        }
      }
    }
  }
  return best;
}

// Với 1 SKU, thử tìm tổ hợp khít theo cả trục L và trục W container, trả về
// tổ hợp có sai số nhỏ nhất (hoặc null nếu không tìm thấy tổ hợp nào đủ tốt
// cho cả 2 trục). Chỉ xét khi SKU có từ 2 orientation hợp lệ trở lên (nếu chỉ
// có 1 orientation thì không có gì để "tổ hợp").
function findSmartFitForSku(sku, container){
  const orientations = generateOrientations(sku);
  if (orientations.length < 1) return null;

  const candidates = [];
  const alongL = findSmartFitCombo(orientations, container.L, { tolerancePct:1.5, maxEach:12 }, 'd');
  if (alongL) candidates.push({ axis:'L', ...alongL });
  const alongW = findSmartFitCombo(orientations, container.W, { tolerancePct:1.5, maxEach:12 }, 'h');
  if (alongW) candidates.push({ axis:'W', ...alongW });

  if (candidates.length === 0) return null;
  // ưu tiên tổ hợp có sai số tương đối nhỏ nhất, và ưu tiên tổ hợp dùng ≥2
  // orientation khác nhau (chính là trường hợp "khít nhờ xoay xen kẽ" mà
  // người dùng mô tả) hơn là tổ hợp chỉ dùng 1 orientation lặp lại (trường
  // hợp này heuristic thường tự tìm ra được, không cần can thiệp).
  candidates.sort((a,b)=>{
    const aMulti = a.combo.length>1 ? 0 : 1;
    const bMulti = b.combo.length>1 ? 0 : 1;
    if (aMulti !== bMulti) return aMulti - bMulti;
    return a.error - b.error;
  });
  return candidates[0];
}

// Áp dụng smart-fit lên danh sách items đã expand: với mỗi SKU tìm được tổ
// hợp khít, khóa cứng orientation cho ĐÚNG SỐ LƯỢNG item theo tỷ lệ tổ hợp
// (item dư ra ngoài tổ hợp vẫn giữ nguyên toàn bộ orientation hợp lệ như cũ
// để thuật toán tự do xếp phần còn lại). Trả về {items, notes} — notes ghi
// lại SKU nào áp dụng được để hiển thị cho người dùng biết.
function applySmartFitToItems(items, skus, container){
  const notes = [];
  const skuById = {}; skus.forEach(s=> skuById[s.id]=s);

  // gom item theo skuId để biết tổng số lượng mỗi SKU
  const bySku = {};
  items.forEach(it=>{ (bySku[it.skuId] = bySku[it.skuId]||[]).push(it); });

  for (const skuId in bySku){
    const sku = skuById[skuId];
    if (!sku) continue;
    const skuItems = bySku[skuId];
    const fit = findSmartFitForSku(sku, container);
    if (!fit) continue;

    const totalNeeded = fit.combo.reduce((s,c)=> s+c.count, 0);
    if (totalNeeded > skuItems.length) continue; // không đủ số lượng SKU để áp dụng trọn 1 tổ hợp

    // khóa orientation cho từng nhóm theo tổ hợp, lần lượt trên các item đầu tiên
    let idx = 0;
    fit.combo.forEach(part=>{
      for (let k=0; k<part.count; k++){
        skuItems[idx].orientations = [part.orient];
        skuItems[idx]._smartFitLocked = true;
        idx++;
      }
    });

    notes.push(`SKU "${sku.code||skuId}": áp dụng smart-fit ${totalNeeded} kiện theo trục ${fit.axis==='L'?'dài':'rộng'} container (tổng ${fmtIntSafe(fit.totalLength)}mm, lệch ${fmtIntSafe(fit.error)}mm).`);
  }

  return { items, notes };
}
function fmtIntSafe(n){ return Math.round(n).toLocaleString('en-US'); }

/* ------------------------------------------------------------
   Extreme Point management
   Ta duy trì 1 danh sách các "extreme points" (candidate anchor points)
   nơi kiện tiếp theo có thể được đặt (góc dưới-trái-trước của kiện).
   Sau mỗi lần đặt thành công 1 kiện, sinh thêm 3 extreme point mới
   từ 3 mặt (phải/trên/sau) của kiện vừa đặt.
   ------------------------------------------------------------ */

/* ------------------------------------------------------------
   Chỉ mục không gian (spatial hash) cho các kiện đã đặt.
   Mục đích: tryPlaceAt/computeSupportRatio/checkStackingRules chỉ cần xét các
   kiện Ở GẦN hộp ứng viên, thay vì quét toàn bộ danh sách đã đặt (trước đây
   ~2,2 triệu lần checkOverlap cho 250 kiện). Đây chỉ là thay đổi cấu trúc dữ
   liệu — logic ràng buộc giữ nguyên, kết quả xếp hàng phải giống hệt.
   Lưới 3 chiều với ô kích thước cellSize (mm).
