}

function downloadFile(filename, content, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
  showToast('Đã xuất ' + filename);
}

/* ============================================================
   10b. IN / PDF — MỘT TRANG để mang ra hiện trường đối chiếu.
   Gồm: dòng tóm tắt, 2 sơ đồ (nhìn ngang + nhìn từ trên xuống) có đánh số khối theo thứ tự
   chất, và bảng ngắn: mỗi khối một dòng "Rộng a × Lên b = c/lớp → d lớp = n thùng".
   Tọa độ từng thùng KHÔNG in (quá dài) — dùng "Xuất CSV/JSON" khi cần.
   ============================================================ */

const PRINT_MAX_BLOCKS = 10; // số khối tối đa liệt kê riêng; phần còn lại gộp thành "xếp lẻ"

function escapeHtml(s){
  return (s===null||s===undefined?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Gom các thùng cùng SKU + cùng kích thước đặt thành các KHỐI hình hộp đều: nx (dọc) × nz (ngang) × ny (cao).
// Tham lam: lấy thùng thấp nhất / gần đáy nhất còn lại, kéo dài theo chiều ngang (z), rồi chiều dọc (x),
// rồi chiều cao (y) chừng nào MỌI ô liền kề đều có thùng. Mỗi thùng thuộc đúng 1 khối (không đếm trùng).
// growth: 'y' = gom theo lớp nằm ngang (dài × rộng, chồng lên) — mặc định; 'x' = gom theo lớp cắt ngang (rộng × cao, nối ra cửa)
function decomposeIntoBlocks(placed, growth){
  const groups = new Map();
  for (const p of placed){
    const k = p.skuId+'|'+Math.round(p.sizeX)+'|'+Math.round(p.sizeY)+'|'+Math.round(p.sizeZ);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(p);
  }
  const key = (x,y,z)=> Math.round(x)+','+Math.round(y)+','+Math.round(z);
  const blocks = [];
  for (const boxes of groups.values()){
    const sx = boxes[0].sizeX, sy = boxes[0].sizeY, sz = boxes[0].sizeZ;
    const left = new Set(boxes.map(b=> key(b.x,b.y,b.z)));
    const has = (x,y,z)=> left.has(key(x,y,z));
    const xFirst = growth === 'x';
    const order = boxes.slice().sort(xFirst ? (a,b)=> a.x-b.x || a.y-b.y || a.z-b.z : (a,b)=> a.y-b.y || a.x-b.x || a.z-b.z);
    for (const s of order){
      if (!has(s.x,s.y,s.z)) continue;
      let nz = 1; while (has(s.x, s.y, s.z + nz*sz)) nz++;
      const rowOk = (x,y)=>{ for (let k=0;k<nz;k++) if (!has(x,y,s.z+k*sz)) return false; return true; };
      let nx = 1, ny = 1;
      if (xFirst){
        while (rowOk(s.x, s.y + ny*sy)) ny++;                          // cột: rộng × cao trong 1 lớp cắt ngang
        const wallOk = (x)=>{ for (let j=0;j<ny;j++) if (!rowOk(x, s.y + j*sy)) return false; return true; };
        while (wallOk(s.x + nx*sx)) nx++;                              // nối các lớp cắt ngang giống hệt ra phía cửa
      } else {
        while (rowOk(s.x + nx*sx, s.y)) nx++;
        const slabOk = (y)=>{ for (let i=0;i<nx;i++) if (!rowOk(s.x+i*sx, y)) return false; return true; };
        while (slabOk(s.y + ny*sy)) ny++;
      }
      for (let j=0;j<ny;j++) for (let i=0;i<nx;i++) for (let k=0;k<nz;k++) left.delete(key(s.x+i*sx, s.y+j*sy, s.z+k*sz));
      blocks.push({ skuId:s.skuId, skuCode:s.skuCode, color:s.color, sx, sy, sz,
                    x0:s.x, y0:s.y, z0:s.z, nx, ny, nz, count:nx*ny*nz, style: xFirst ? 'x' : 'y' });
    }
  }
  return blocks;
}

// Chọn các khối đáng liệt kê riêng (đánh số theo THỨ TỰ CHẤT), phần còn lại gộp thành "xếp lẻ".
// Thứ tự chất: right_to_left → từ đáy ra cửa (x nhỏ trước); floor_to_top → từ sàn lên (y nhỏ trước).
function planPrintBlocks(placed, dir){
  const rtl = dir === 'right_to_left';
  const byLoadOrder = rtl
    ? (a,b)=> a.x0-b.x0 || a.y0-b.y0 || a.z0-b.z0
    : (a,b)=> a.y0-b.y0 || a.x0-b.x0 || a.z0-b.z0;
  // gom khối theo 2 cách, lấy cách cho ÍT khối (sơ đồ gọn): lớp giống nhau gộp 1 khối, chỉ tách khi khác SKU / cách xếp
  const bx = decomposeIntoBlocks(placed, 'x'), by = decomposeIntoBlocks(placed, 'y');
  const blocks = bx.length < by.length || (bx.length === by.length && rtl) ? bx : by;
  const minCount = Math.max(4, Math.ceil(placed.length * 0.01));
  let main = blocks.filter(b=> b.count >= minCount);
  if (main.length > PRINT_MAX_BLOCKS) main = main.sort((a,b)=> b.count - a.count).slice(0, PRINT_MAX_BLOCKS);
  main.sort(byLoadOrder);
  const mainSet = new Set(main);
  const rest = blocks.filter(b=> !mainSet.has(b));
  main.forEach((b,i)=>{ b.no = i+1; });
  return { main, rest };
}

// Câu ghi chú gọn cho 1 khối. Right to left: "lớp" = lớp cắt ngang (rộng × lên); Floor to top: "lớp" = lớp sàn (dài × rộng).
function blockHowText(b, dir){
  if (b.style ? b.style === 'x' : dir === 'right_to_left') return `Rộng ${b.nz} × Lên ${b.ny} = ${b.nz*b.ny}/lớp → ${b.nx} lớp = ${fmtInt(b.count)} thùng`;
  return `Dài ${b.nx} × Rộng ${b.nz} = ${b.nx*b.nz}/lớp → ${b.ny} lớp = ${fmtInt(b.count)} thùng`;
}

// Sơ đồ SVG. view='side': nhìn ngang (Dài × Cao). view='top': nhìn từ trên xuống (Dài × Rộng).
// Luôn vẽ ĐÁY cont bên PHẢI, CỬA bên TRÁI (đúng chiều "right to left"). Ở hình nhìn từ trên xuống:
// cạnh trên = TRÁI cont, cạnh dưới = PHẢI cont khi đứng ở cửa nhìn vào (z=0 là cạnh PHẢI).
// Đường kích thước có 2 đầu mũi tên + nhãn (dùng trong bản in).
function svgDimLine(x1, y1, x2, y2, label, vertical){
  const a = 5, mid = vertical ? [(x1+x2)/2, (y1+y2)/2] : [(x1+x2)/2, (y1+y2)/2];
  const head = vertical
    ? `<path d="M${x1-a/1.6},${y1+a} L${x1},${y1} L${x1+a/1.6},${y1+a} M${x2-a/1.6},${y2-a} L${x2},${y2} L${x2+a/1.6},${y2-a}" fill="none" stroke="#444" stroke-width="1"/>`
    : `<path d="M${x1+a},${y1-a/1.6} L${x1},${y1} L${x1+a},${y1+a/1.6} M${x2-a},${y2-a/1.6} L${x2},${y2} L${x2-a},${y2+a/1.6}" fill="none" stroke="#444" stroke-width="1"/>`;
  const txt = vertical
    ? `<text x="${(mid[0]+4).toFixed(1)}" y="${mid[1].toFixed(1)}" font-size="11" fill="#333" transform="rotate(90 ${(mid[0]+4).toFixed(1)} ${mid[1].toFixed(1)})" text-anchor="middle">${label}</text>`
    : `<text x="${mid[0].toFixed(1)}" y="${(mid[1]+12).toFixed(1)}" font-size="11" fill="#333" text-anchor="middle">${label}</text>`;
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#444" stroke-width="1"/>${head}${txt}`;
}

function buildPrintSVG(view, container, main, rest, opt){
  opt = opt || {};
  const VW = 1000, padX = 24, padTop = 30, padBottom = 26;
  const scale = (VW - padX*2) / container.L;
  const vertLen = view === 'side' ? container.H : container.W;
  const VH = Math.round(padTop + vertLen*scale + padBottom);
  const rx = (x, len)=> padX + (container.L - x - len) * scale;
  const ry = (v, len)=> padTop + (vertLen - v - len) * scale;

  function blockShape(b, labelled, showDims){
    const lenX = b.nx*b.sx;
    const v0 = view === 'side' ? b.y0 : b.z0;
    const cells = view === 'side' ? b.ny : b.nz, cellLen = view === 'side' ? b.sy : b.sz;
    const x = rx(b.x0, lenX), y = ry(v0, cells*cellLen), w = lenX*scale, h = cells*cellLen*scale;
    const dash = labelled ? '' : ' stroke-dasharray="4 3"';
    let g = `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${b.color}" fill-opacity="${labelled?0.6:0.3}" stroke="${b.stroke || '#111'}" stroke-width="${b.strokeW || (labelled?1.3:0.8)}"${dash}/>`;
    if (b.hatch) g += `<rect x="${(x+3).toFixed(1)}" y="${(y+3).toFixed(1)}" width="${Math.max(0,w-6).toFixed(1)}" height="${Math.max(0,h-6).toFixed(1)}" fill="none" stroke="${b.stroke}" stroke-width="1.2" stroke-dasharray="6 4"/>`;
    if (b.sx*scale >= 4) for (let i=1;i<b.nx;i++){ const lx = x + i*b.sx*scale; g += `<line x1="${lx.toFixed(1)}" y1="${y.toFixed(1)}" x2="${lx.toFixed(1)}" y2="${(y+h).toFixed(1)}" stroke="#000" stroke-opacity="0.25" stroke-width="0.6"/>`; }
    if (cellLen*scale >= 4) for (let j=1;j<cells;j++){ const ly = y + j*cellLen*scale; g += `<line x1="${x.toFixed(1)}" y1="${ly.toFixed(1)}" x2="${(x+w).toFixed(1)}" y2="${ly.toFixed(1)}" stroke="#000" stroke-opacity="0.25" stroke-width="0.6"/>`; }
    // kích thước 1 thùng (hoặc 1 pallet) theo đúng 2 chiều của hình này: ↔ dọc cont, ↕ ngang/cao
    if (labelled && showDims !== false && w >= 46 && h >= 40) g += `<text x="${(x+w/2).toFixed(1)}" y="${(y+h/2+28).toFixed(1)}" font-size="10" fill="#222" text-anchor="middle">↔${fmtInt(b.sx)} ↕${fmtInt(cellLen)}</text>`;
    return { svg:g, cx:x+w/2, cy:y+h/2 };
  }

  let shapes = '';
  rest.forEach(b=>{ shapes += blockShape(b,false).svg; });
  // vẽ khối ở xa người nhìn (z lớn) trước, để khối gần (z nhỏ) đè lên — chỉ ảnh hưởng thứ tự chồng hình
  const drawOrder = main.slice().sort((a,b)=> view==='side' ? (b.z0 - a.z0) : (a.y0 - b.y0));
  const labels = []; let labelSvg = ''; const R = 13;
  // hình chữ nhật của từng khối trên hình (để biết khối vẽ sau có che dòng kích thước của khối vẽ trước không)
  const rectOf = (b)=>{ const lenX = b.nx*b.sx, v0 = view === 'side' ? b.y0 : b.z0, len = (view === 'side' ? b.ny*b.sy : b.nz*b.sz);
    return { x: rx(b.x0, lenX), y: ry(v0, len), w: lenX*scale, h: len*scale }; };
  const rects = drawOrder.map(rectOf);
  drawOrder.forEach((b, i)=>{
    const R0 = rects[i], tx = R0.x + R0.w/2, ty = R0.y + R0.h/2 + 28;
    const covered = rects.slice(i + 1).some(o=> tx >= o.x && tx <= o.x + o.w && ty - 10 >= o.y && ty <= o.y + o.h);
    const sh = blockShape(b, true, !covered && !opt.hideDims); shapes += sh.svg;
    let cx = sh.cx; const cy = sh.cy;
    // tránh nhãn đè lên nhau khi các khối chiếu trùng nhau: dịch sang phải
    while (labels.some(l=> Math.abs(l.cx-cx) < 2*R && Math.abs(l.cy-cy) < 2*R)) cx += 2*R + 2;
    labels.push({cx, cy});
    labelSvg += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${R}" fill="#fff" stroke="#111" stroke-width="1.6"/>` +
                `<text x="${cx.toFixed(1)}" y="${(cy+5).toFixed(1)}" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif" fill="#111">${b.no}</text>`;
  });

  const note = view === 'top' ? 'trên = TRÁI · dưới = PHẢI (đứng ở cửa nhìn vào)' : '';
  return `<svg class="pp-svg" viewBox="0 0 ${VW} ${VH}" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
    <text x="${padX}" y="${padTop-10}" font-size="15" font-weight="700" fill="#111">◀ CỬA CONT</text>
    <text x="${VW-padX}" y="${padTop-10}" font-size="15" font-weight="700" fill="#111" text-anchor="end">ĐÁY CONT ▶</text>
    <text x="${VW/2}" y="${padTop-10}" font-size="13" fill="#555" text-anchor="middle">${note}</text>
    <rect x="${padX}" y="${padTop}" width="${(container.L*scale).toFixed(1)}" height="${(vertLen*scale).toFixed(1)}" fill="#fafafa" stroke="#111" stroke-width="1.6"/>
    ${shapes}${labelSvg}
    ${svgDimLine(padX, padTop + vertLen*scale + 8, padX + container.L*scale, padTop + vertLen*scale + 8, `dài lòng cont ${fmtInt(container.L)} mm`, false)}
    <text x="${VW - padX - 4}" y="${(padTop + vertLen*scale - 4).toFixed(1)}" font-size="11" fill="#555" text-anchor="end">${view === 'side' ? 'cao lòng ' + fmtInt(container.H) : 'rộng lòng ' + fmtInt(container.W)} mm</text>
  </svg>`;
}

/* ============================================================
   NHÃN PALLET — mỗi pallet 1 trang A4 ngang, theo mẫu nhãn đóng pallet:
   bảng DESCRIPTION | QUANTITY (CARTON), liệt kê MỌI SKU của lô (SKU không có trên pallet → để trống số lượng),
   dòng cuối TOTAL = tổng số thùng trên pallet. Mô tả = "Mô tả in nhãn" của SKU, trống thì lấy tên SKU (rồi mã).
   Số lượng lấy từ phương án đang hiển thị (đã gồm chỉnh tay). In theo thứ tự đưa pallet vào cont #1 → #n.
   ============================================================ */
function buildLabelPrintView(){
  const r = state.result, root = document.getElementById('print-root');
  const order = (r.ctxSkus || state.skus).filter(k=> (k.qty || 0) > 0);
  const descOf = (k)=>{
    const cur = state.skus.find(x=> x.id === k.id) || k;      // mô tả có thể nhập/sửa sau khi tối ưu
    return (cur.labelDesc || '').trim() || (cur.name || '').trim() || cur.code || k.id;
  };
  const n = order.length;
  const fs = Math.max(11, Math.min(26, 32 - n * 1.5));          // nhiều dòng → chữ nhỏ lại để vừa 1 trang
  root.innerHTML = r.pallets.map(pl=>{
    const cnt = pl.unit.skuCounts || {};
    const total = Object.values(cnt).reduce((a,b)=> a + b, 0);
    const rows = order.map((k, i)=> `<tr><td>${i + 1}. ${escapeHtml(descOf(k))}</td><td class="q">${cnt[k.id] ? fmtInt(cnt[k.id]) : ''}</td></tr>`).join('');
    return `<div class="lbl-page"><table class="lbl-table" style="font-size:${fs.toFixed(1)}pt">
      <thead><tr><th>DESCRIPTION</th><th>QUANTITY<br>(CARTON)</th></tr></thead>
      <tbody>${rows}<tr class="tot"><td style="text-align:right;">TOTAL</td><td class="q">${fmtInt(total)}</td></tr></tbody>
    </table></div>`;
  }).join('');
}
function printPalletLabels(){
  const r = state.result;
  if (!r){ showToast('Chưa có kết quả. Hãy bấm "Tối ưu" trước.', true); return; }
  if (r.mode !== 'pallet' || !(r.pallets || []).length){ showToast('Nhãn pallet chỉ dùng cho phương án mode Pallet.', true); return; }
  buildLabelPrintView();
  // khổ A4 NGANG chỉ trong lần in nhãn; in xong trả về khổ dọc của bản in phương án
  const st = document.createElement('style');
  st.id = 'label-page-style';
  st.textContent = '@page{ size:A4 landscape; margin:10mm; }';
  document.head.appendChild(st);
  const cleanup = ()=>{ const x = document.getElementById('label-page-style'); if (x) x.remove(); window.removeEventListener('afterprint', cleanup); };
  window.addEventListener('afterprint', cleanup);
  const outside = (r.raw && r.raw.unplacedUnitIds || []).length;
  if (outside) showToast(`In ${r.pallets.length} nhãn cho pallet trong cont (bỏ qua ${outside} pallet ngoài cont).`);
  setTimeout(()=> window.print(), 50);
}

function buildPrintView(){
  const root = document.getElementById('print-root');
  if (!state.result){
    root.innerHTML = `<div class="pp-page"><p>Chưa có kết quả tối ưu để in.</p></div>`;
    return;
  }
  const p = state.result, s = p.stats, c = p.container;
  const settings = p.settings || {};
  const dir = settings.loadingDirection || 'floor_to_top';
  const rtl = dir === 'right_to_left';
  const now = new Date();
  const dateStr = now.toLocaleDateString('vi-VN') + ' ' + now.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
  const mixLabel = { none:'No mix — mỗi SKU 1 khối', partial:'Partial mix', full:'Full mix' }[settings.mixMode] || 'Full mix';

  // --- cảnh báo ngắn, chỉ những gì cần chú ý khi chất hàng ---
  const alerts = [];
  const short = p.breakdown.filter(b=> b.remaining > 0);
  if (short.length) alerts.push(`CÒN DƯ ${fmtInt(short.reduce((a,b)=>a+b.remaining,0))} thùng: ` + short.map(b=> `${escapeHtml(b.code)} × ${fmtInt(b.remaining)}`).join(', '));
  if (p.container.payload && s.totalWeight > p.container.payload) alerts.push(`QUÁ TẢI ${fmtInt(s.totalWeight - p.container.payload)} kg (tối đa ${fmtInt(p.container.payload)} kg)`);
  if (s.cogXOffsetPct > state.cogWarnLong || s.cogZOffsetPct > state.cogWarnLat) alerts.push(`Trọng tâm lệch: dọc ${fmt(s.cogXOffsetPct,1)}% dài · ngang ${fmt(s.cogZOffsetPct,1)}% rộng`);
  if (p.manualOps && p.raw){
    const mw = validateManual(p);
    alerts.push(`Phương án đã CHỈNH TAY (${p.manualOps} thao tác)` + (mw.length ? ` — ${mw.length} điểm cần xem lại: ` + mw.map(escapeHtml).join(' · ') : ' — không phát hiện vi phạm.'));
  }

  if (p.placed.length === 0){
    root.innerHTML = `<div class="pp-page"><div class="pp-head"><h1>Phương án xếp hàng</h1></div><div class="pp-alert">Không xếp được thùng nào vào container này.</div></div>`;
    return;
  }

  if (p.mode === 'pallet'){ buildPrintViewPallet(p, root, dateStr, alerts); return; }
  // ---- theo LỚP CẮT NGANG từ vách kín ra cửa (đúng trình tự bốc xếp) ----
  const SG = sliceGroupsForPrint(p.placed);
  const planInfo = (p.smartFitNotes || []).filter(n=> /^(Rải đều|Bậc thang|Số hàng|Kiểm hóa|Mọi SKU cùng kích thước)/.test(n));
  const nCus = p.placed.filter(q=> q.tag === 'customs').length;
  if (nCus && !planInfo.some(n=> /Kiểm hóa/.test(n))) planInfo.push(`Kiểm hóa: ${nCus} thùng ở lớp sát cửa, nằm trên cùng.`);
  const sizes = new Set(p.placed.map(q=> [q.sizeX, q.sizeY, q.sizeZ].map(Math.round).join('×')));
  const one = sizes.size === 1 ? p.placed[0] : null;
  let cum = 0;
  const rows = SG.groups.map(G=>{
    cum += G.n;
    return `<tr>
      <td><span class="pp-no">${G.no}</span></td>
      <td><b>${G.from === G.to ? `Lớp ${G.from}` : `Lớp ${G.from}–${G.to}`}</b><br><span style="color:#555">${G.slices.length} lớp</span></td>
      <td class="pp-how">${sliceGroupText(G)}</td>
      <td>${fmtInt(G.slices[0].n)}${G.kind === 'alt' ? ' / ' + fmtInt(G.pair[1].n) : ''}/lớp<br><b>${fmtInt(G.n)}</b> thùng</td>
      <td>đáy +${fmtInt(G.x0)} → ${fmtInt(G.x1)}<br><span style="color:#555">lũy kế ${fmtInt(cum)}</span></td>
    </tr>`;
  }).join('');

  root.innerHTML = `
    <div class="pp-page">
      <div class="pp-head">
        <h1>${state.orderName ? escapeHtml(state.orderName) + ' — ' : ''}Sơ đồ chất hàng — Cont ${fmtInt(c.L)} × ${fmtInt(c.W)} × ${fmtInt(c.H)} mm</h1>
        <div class="pp-meta">${dateStr}</div>
      </div>
      <div class="pp-chips">
        <span class="pp-chip"><b>${fmtInt(s.totalPlaced)}/${fmtInt(s.totalRequested)}</b> thùng</span>
        <span class="pp-chip"><b>${fmt(s.volumePct,0)}%</b> thể tích</span>
        <span class="pp-chip"><b>${fmtInt(s.totalWeight)}</b> kg (${fmt(s.weightPct,0)}% tải)</span>
        <span class="pp-chip"><b>${SG.slices.length}</b> lớp cắt ngang · ${SG.groups.length} bước chất</span>
        <span class="pp-chip">${mixLabel}</span>
      </div>
      ${alerts.map(a=> `<div class="pp-alert">⚠ ${a}</div>`).join('')}
      ${printSkuLegend(p)}
      ${one ? `<div class="pp-foot" style="margin:2px 0 4px;">Cỡ thùng khi chất (mọi lớp): <b>dọc ${fmtInt(one.sizeX)} × ngang ${fmtInt(one.sizeZ)} × cao ${fmtInt(one.sizeY)} mm</b>.</div>` : ''}
      ${planInfo.length ? `<div class="pp-foot" style="margin:2px 0 4px;">${planInfo.map(escapeHtml).join('<br>')}</div>` : ''}
      <div class="pp-sec">Trình tự chất — từng lớp cắt ngang (rộng × cao), từ VÁCH KÍN ra CỬA</div>
      <table class="pp-table">
        <thead><tr><th>Bước</th><th>Lớp</th><th>Cách xếp mỗi lớp (từ dưới lên)</th><th>Số thùng</th><th>Vị trí (mm)</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="pp-view-title">Nhìn từ bên hông (Dài × Cao) — số = bước chất</div>
      ${svgSliceView('side', c, p.placed, SG.groups)}
      <div class="pp-view-title">Nhìn từ trên xuống (Dài × Rộng) — màu đậm = chồng cao hơn</div>
      ${svgSliceView('top', c, p.placed, SG.groups)}
      <div class="pp-foot">"Lớp" = 1 lát thùng xếp đứng thành vách (rộng × cao) dày 1 thùng; chất xong lớp này mới tiến ra lớp kế. "Rộng c × Lên r" = c thùng theo bề ngang cont × r hàng chồng lên; "(+m lẻ ở trên)" = hàng trên cùng chỉ có m thùng. Viền đỏ / KH = hàng kiểm hóa (luôn nằm trên cùng, sát cửa). "Đáy +x" = khoảng cách từ vách kín. Tọa độ từng thùng: Xuất CSV / JSON.</div>
      ${(()=>{ const sh = printShots([]); return sh.views.length ? `<div class="pp-sec pp-break">Hình 3D minh họa</div>
        <div class="pp-3dgrid">${sh.views.map(v=> `<figure class="${v.wide ? 'wide' : ''}"><img src="${v.url}" alt=""><figcaption>${escapeHtml(v.label)}</figcaption></figure>`).join('')}</div>` : ''; })()}
    </div>`;
}

/* ============================================================
   BẢN IN BULK THEO LỚP CẮT NGANG — đúng trình tự bốc xếp: chất từng lớp (rộng × cao) từ vách kín ra cửa.
   Lớp = các thùng có cùng mép trong (x, làm tròn 5 mm). Mỗi lớp mô tả từ dưới lên theo từng "đoạn" (SKU + cỡ/hướng thùng):
   "Rộng c × Lên r (+m lẻ ở trên)". Các lớp liền nhau giống hệt gộp 1 dòng; 2 kiểu lớp xen kẽ A,B,A,B… gộp thành 1 dòng
   "xen kẽ". Hàng kiểm hóa ghi (KH).
   ============================================================ */
function sliceGroupsForPrint(placed){
  const byX = new Map();
  placed.forEach(p=>{ const k = Math.round(p.x / 5) * 5; if (!byX.has(k)) byX.set(k, []); byX.get(k).push(p); });
  const xs = Array.from(byX.keys()).sort((a,b)=> a - b);
  const longSide = (p)=> p.sizeX >= p.sizeZ ? 'dọc' : 'ngang';      // cạnh dài của thùng nằm dọc / ngang theo cont
  const orients = new Set(placed.map(p=> longSide(p) + Math.round(p.sizeY)));
  const showOrient = orients.size > 1;
  const slices = xs.map(x=>{
    const ps = byX.get(x);
    const segMap = new Map();
    ps.forEach(p=>{
      const key = p.skuId + '|' + Math.round(p.sizeX) + 'x' + Math.round(p.sizeY) + 'x' + Math.round(p.sizeZ);
      if (!segMap.has(key)) segMap.set(key, { skuId: p.skuId, code: p.skuCode, color: p.color, sx: p.sizeX, sy: p.sizeY, sz: p.sizeZ, items: [] });
      segMap.get(key).items.push(p);
    });
    const segs = Array.from(segMap.values()).map(sg=>{
      const lv = new Map(); sg.items.forEach(p=>{ const k = Math.round(p.y); lv.set(k, (lv.get(k) || 0) + 1); });
      const c = Math.max(...lv.values());
      const fullRows = Array.from(lv.values()).filter(v=> v === c).length;
      const m = sg.items.length - c * fullRows;
      const yMin = Math.min(...sg.items.map(p=> p.y)), zMin = Math.min(...sg.items.map(p=> p.z));
      const kh = sg.items.filter(p=> p.tag === 'customs').length;
      const txt = `Rộng ${c} × Lên ${fullRows}` + (m ? ` (+${m} lẻ ở trên)` : '') + (showOrient ? ` · thùng ${longSide(sg.items[0])}` : '');
      return Object.assign(sg, { c, fullRows, m, n: sg.items.length, yMin, zMin, kh, txt });
    }).sort((a,b)=> a.yMin - b.yMin || a.zMin - b.zMin);
    const depth = Math.max(...ps.map(p=> p.sizeX));
    const sig = segs.map(g=> [g.skuId, g.txt, g.kh].join('/')).join(' + ');
    return { x, depth, segs, n: ps.length, sig };
  });
  // gộp các lớp liền nhau giống hệt
  const groups = [];
  slices.forEach((sl, i)=>{
    const g = groups[groups.length - 1];
    if (g && g.kind === 'same' && g.sig === sl.sig) { g.slices.push(sl); }
    else groups.push({ kind: 'same', sig: sl.sig, slices: [sl] });
  });
  // gộp kiểu xen kẽ A,B,A,B… (mỗi nhóm 1 lớp)
  const merged = [];
  for (let i = 0; i < groups.length; i++){
    const g = groups[i], h = groups[i + 1];
    if (h && g.slices.length === 1 && h.slices.length === 1){
      let j = i + 2;
      while (j < groups.length && groups[j].slices.length === 1 && groups[j].sig === groups[j - 2].sig) j++;
      if (j - i >= 4){
        merged.push({ kind: 'alt', sig: g.sig + '||' + h.sig, slices: groups.slice(i, j).flatMap(x=> x.slices), pair: [g.slices[0], h.slices[0]] });
        i = j - 1; continue;
      }
    }
    merged.push(g);
  }
  let idx = 1;
  merged.forEach((g, k)=>{
    g.no = k + 1; g.from = idx; g.to = idx + g.slices.length - 1; idx += g.slices.length;
    g.x0 = g.slices[0].x; g.x1 = Math.max(...g.slices.map(sl=> sl.x + sl.depth));
    g.n = g.slices.reduce((t, sl)=> t + sl.n, 0);
  });
  return { slices, groups: merged, showOrient };
}
function sliceGroupText(g){
  const segTxt = (sl)=> sl.segs.map(sg=> `<span class="pp-swatch" style="background:${sg.color}"></span><b>${escapeHtml(sg.code)}</b> ${sg.txt}${sg.kh ? ` <span class="pp-kh">KH ${sg.kh}</span>` : ''}`).join('<br>');
  if (g.kind === 'alt') return `<i>Xen kẽ 2 kiểu lớp:</i><br>A — ${segTxt(g.pair[0])}<br>B — ${segTxt(g.pair[1])}`;
  return segTxt(g.slices[0]);
}
// Sơ đồ theo lớp: hông (dài × cao) hoặc trên xuống (dài × rộng) — vẽ từng thùng (màu SKU), viền đỏ = kiểm hóa,
// số trong vòng tròn = NHÓM LỚP theo trình tự chất (khớp bảng). Cửa bên TRÁI, vách kín bên PHẢI như các hình khác.
function svgSliceView(view, c, placed, groups){
  const VW = 1000, padX = 24, padTop = 44, padBottom = 26;
  const scale = (VW - padX * 2) / c.L, vert = view === 'side' ? c.H : c.W;
  const VH = Math.round(padTop + vert * scale + padBottom);
  const rx = (x, len)=> padX + (c.L - x - len) * scale, ry = (v, len)=> padTop + (vert - v - len) * scale;
  // chỉ vẽ thùng nhìn thấy được: hông → thùng gần vách PHẢI (z nhỏ) mỗi ô (x,y); trên → thùng cao nhất mỗi ô (x,z)
  const cell = new Map();
  placed.forEach(p=>{
    const k = view === 'side' ? Math.round(p.x) + '|' + Math.round(p.y) : Math.round(p.x) + '|' + Math.round(p.z);
    const cur = cell.get(k);
    if (!cur || (view === 'side' ? p.z < cur.z : p.y > cur.y)) cell.set(k, p);
  });
  let g = '';
  cell.forEach(p=>{
    const v0 = view === 'side' ? p.y : p.z, len = view === 'side' ? p.sizeY : p.sizeZ;
    const isK = p.tag === 'customs';
    g += `<rect x="${rx(p.x, p.sizeX).toFixed(1)}" y="${ry(v0, len).toFixed(1)}" width="${(p.sizeX * scale).toFixed(1)}" height="${(len * scale).toFixed(1)}" fill="${p.color}" fill-opacity="${view === 'top' ? Math.min(0.95, 0.35 + 0.6 * (p.y + p.sizeY) / c.H).toFixed(2) : 0.85}" stroke="${isK ? '#c0392b' : '#222'}" stroke-opacity="${isK ? 1 : 0.35}" stroke-width="${isK ? 1.6 : 0.5}"/>`;
  });
  // nhãn nhóm lớp: ngoặc trên đầu + số
  groups.forEach(G=>{
    const x1 = rx(G.x0, G.x1 - G.x0), x2 = x1 + (G.x1 - G.x0) * scale, y = padTop - 8;
    g += `<path d="M${x1.toFixed(1)},${(y + 5).toFixed(1)} L${x1.toFixed(1)},${y.toFixed(1)} L${x2.toFixed(1)},${y.toFixed(1)} L${x2.toFixed(1)},${(y + 5).toFixed(1)}" fill="none" stroke="#333" stroke-width="1"/>`;
    g += `<circle cx="${((x1 + x2) / 2).toFixed(1)}" cy="${(y - 9).toFixed(1)}" r="9" fill="#fff" stroke="#111" stroke-width="1.2"/><text x="${((x1 + x2) / 2).toFixed(1)}" y="${(y - 5.5).toFixed(1)}" font-size="10" font-weight="700" text-anchor="middle">${G.no}</text>`;
  });
  return `<svg viewBox="0 0 ${VW} ${VH + 14}" style="width:100%;height:auto;display:block;border:1px solid #ccc;background:#fff">
    <g transform="translate(0,14)">
    <text x="${padX}" y="-2" font-size="11" font-weight="700">◀ CỬA CONT (chất sau cùng)</text><text x="${VW - padX}" y="-2" font-size="11" font-weight="700" text-anchor="end">ĐÁY CONT (chất trước) ▶</text>
    <rect x="${padX}" y="${padTop}" width="${(c.L * scale).toFixed(1)}" height="${(vert * scale).toFixed(1)}" fill="#fafafa" stroke="#111" stroke-width="1.6"/>
    ${g}
    ${svgDimLine(padX, padTop + vert * scale + 8, padX + c.L * scale, padTop + vert * scale + 8, `dài lòng cont ${fmtInt(c.L)} mm`, false)}
    </g></svg>`;
}

// Bảng chú thích SKU dùng chung cho bản in Bulk & Pallet: mã — tên hàng — D×R×C — số lượng.
function printSkuLegend(p){
  const pal = p.mode === 'pallet';
  const rows = p.breakdown.map(b=>{
    const sku = state.skus.find(k=> k.id === b.skuId);
    const nPal = pal ? p.pallets.filter(pl=> pl.unit.skuCounts && pl.unit.skuCounts[b.skuId]).length : 0;
    return `<tr><td><span class="pp-swatch" style="background:${b.color}"></span><b>${escapeHtml(b.code)}</b></td><td>${escapeHtml(b.name || (sku && sku.name) || '')}</td>
      <td>${sku ? `${fmtInt(sku.L)} × ${fmtInt(sku.W)} × ${fmtInt(sku.H)}` : '—'}</td><td>${sku ? fmtInt(sku.weight) : '—'}</td>
      <td>${fmtInt(b.requested)}</td><td><b>${fmtInt(b.placed)}</b>${b.remaining ? ` <span style="color:#c0392b">(dư ${fmtInt(b.remaining)})</span>` : ''}</td>
      ${pal ? `<td>${nPal}</td>` : ''}
      <td>${sku ? [sku.thisSideUp ? '↑ this side up' : '', sku.fragile ? 'dễ vỡ' : '', sku.isSample ? 'hàng mẫu' : ''].filter(Boolean).join(', ') : ''}</td></tr>`;

/* ---------- Bản in mode Pallet ----------
   Trang 1: thông tin đơn, tổng hợp SKU, sơ đồ vị trí pallet (nhìn từ trên + từ hông), thứ tự đưa pallet vào cont.
   Trang sau: "phiếu chất" cho từng pallet (pallet giống nhau gộp 1 phiếu) — bảng lớp từ đáy lên + hình mẫu lớp. */
function palletLayersOf(u){
  // gom thùng theo lớp (dựa vào chiều cao từng lớp đã ghi khi dựng pallet)
  const out = []; let base = 0;
  (u.layers || [{ h: Infinity }]).forEach((L, i)=>{
    if (L.base != null) base = L.base;
    const top = base + L.h;
    out.push({ idx: i, base, h: L.h, info: L, cartons: u.cartons.filter(c=> c.ly >= base - 0.5 && c.ly < top - 0.5) });
    base = top;
  });
  return out;
}
// Chữ ký lớp tính từ góc MẶT PALLET, làm tròn 5 mm — 2 pallet xếp giống nhau nhưng khung lệch (chìa mép khác) vẫn gộp chung phiếu
function deckLayerSignature(L, u){
  const q5 = (v)=> Math.round(v / 5);
  return L.cartons.map(c=> [q5(c.lx - u.deckX), q5(c.lz - u.deckZ), q5(c.sx), q5(c.sz), q5(c.ly - L.base), c.skuId, c.tag || ''].join(',')).sort().join(';');
}
function layerSignature(L){
  return L.cartons.map(c=> [Math.round(c.lx), Math.round(c.lz), Math.round(c.sx), Math.round(c.sz), Math.round(c.ly - L.base), c.skuId, c.tag || ''].join(',')).sort().join(';');
}
function palletLayerSVG(u, L, colorOf, codeOf){
  const size = 150, pad = 10, sc = (size - 2*pad) / Math.max(u.FL, u.FW);
  const W = u.FL*sc + 2*pad, H = u.FW*sc + 2*pad + 10;
  let g = `<rect x="${(pad + u.deckX*sc).toFixed(1)}" y="${(pad + u.deckZ*sc).toFixed(1)}" width="${(u.palletL*sc).toFixed(1)}" height="${(u.palletW*sc).toFixed(1)}" fill="#f3ead9" stroke="#8a6a45" stroke-width="1.2" stroke-dasharray="4 2"/>`;
  const cs = L.cartons.slice().sort((a,b)=> a.ly - b.ly);
  const shownDims = new Set();
  cs.forEach(c=>{
    const x = pad + c.lx*sc, y = pad + c.lz*sc, w = c.sx*sc, h = c.sz*sc;
    const upper = c.ly - L.base > 1;
    const special = c.tag === 'customs' || c.tag === 'sample';
    g += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${colorOf(c.skuId)}" fill-opacity="${upper?0.95:0.75}" stroke="${special?'#c0392b':'#111'}" stroke-width="${special?2.4:0.9}"${upper?' stroke-dasharray="3 2"':''}/>`;
    // mã SKU dài → 4 ký tự cuối; tên hàng (tùy chọn in tên) → giữ nguyên, quá dài thì cắt 14 ký tự
    const code = codeOf(c.skuId), short = state.pallet.printNames ? (code.length > 14 ? code.slice(0, 13) + '…' : code) : (code.length > 6 ? code.slice(-4) : code);
    const lbl = (upper ? '↑' : '') + short + (c.tag === 'customs' ? ' KH' : c.tag === 'sample' ? ' M' : '');
    const vert = h > w * 1.3;                         // thùng dài theo chiều đứng của hình → viết chữ dọc
    const along = vert ? h : w, across = vert ? w : h;
    const fs = Math.min(9, along / Math.max(3, lbl.length) * 1.6, across * 0.45);
    const cx = x + w/2, cy = y + h/2;
    // dòng 2: kích thước thùng theo chiều của hình — chỉ ở 1 thùng mẫu mỗi SKU/hướng, và chỉ khi đủ chỗ 2 dòng
    const key = c.skuId + '|' + Math.round(c.sx) + 'x' + Math.round(c.sz);
    const dims = !shownDims.has(key) && across >= fs * 2.6 && along >= 30 ? `${fmtInt(c.sx)}×${fmtInt(c.sz)}` : null;
    if (dims) shownDims.add(key);
    const rotA = vert ? ` transform="rotate(-90 ${cx.toFixed(1)} ${cy.toFixed(1)})"` : '';
    if (fs >= 4.5) g += `<text x="${cx.toFixed(1)}" y="${(cy + fs/3 - (dims ? fs * 0.55 : 0)).toFixed(1)}" font-size="${fs.toFixed(1)}" text-anchor="middle" fill="#111" font-weight="700"${rotA}>${escapeHtml(lbl)}</text>`;
    if (fs >= 4.5 && dims) g += `<text x="${cx.toFixed(1)}" y="${(cy + fs * 1.05).toFixed(1)}" font-size="${Math.max(5, fs * 0.75).toFixed(1)}" text-anchor="middle" fill="#222"${rotA}>${dims}</text>`;
  });
  let bx0=Infinity, by0=Infinity, bx1=-Infinity, by1=-Infinity;
  cs.forEach(c=>{ bx0=Math.min(bx0,c.lx); by0=Math.min(by0,c.lz); bx1=Math.max(bx1,c.lx+c.sx); by1=Math.max(by1,c.lz+c.sz); });
  g += `<text x="${(W/2).toFixed(1)}" y="${(H-2).toFixed(1)}" font-size="7.5" text-anchor="middle" fill="#555">khung lớp ${fmtInt(bx1-bx0)}×${fmtInt(by1-by0)} mm</text>`;
  return `<svg width="${W.toFixed(0)}" height="${H.toFixed(0)}" viewBox="0 0 ${W.toFixed(1)} ${H.toFixed(1)}" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">${g}</svg>`;
}

function buildPrintViewPallet(p, root, dateStr, alerts){
  const s = p.stats, c = p.container;
  const bd = (id)=> p.breakdown.find(x=> x.skuId === id);
  // tùy chọn: ghi TÊN HÀNG (tên SKU) lên hình mẫu lớp thay cho mã SKU
  const codeOf = (id)=>{
    const b = bd(id); if (!b) return id;
    if (state.pallet.printNames){ const k = state.skus.find(x=> x.id === id); const nm = k && (k.name || '').trim(); if (nm) return nm; }
    return b.code;
  };
  const colorOf = (id)=> bd(id) ? bd(id).color : '#999';
  const carrier = CARRIER_SPECS[state.container.carrier], ctype = CONTAINER_TYPES[state.container.ctype];
  // Màu khối = màu SKU (1 SKU) hoặc xám (mix). Pallet kiểm hóa: VIỀN ĐỎ ĐẬM (không dùng màu nền đỏ — dễ trùng màu SKU)
  const palColor = (pl)=>{
    const ids = Object.keys(pl.unit.skuCounts);
    return ids.length === 1 ? colorOf(ids[0]) : '#9aa3b0';
  };
  const kindTxt = { full:'Nguyên 1 SKU', partial:'Lẻ 1 SKU', mixed:'Mix nhiều SKU', customs:'KIỂM HÓA' };
  const posTxt = (pl)=>{
    const q = pl.placement, zc = q.z + q.sizeZ/2;
    const side = Math.abs(zc - c.W/2) < c.W*0.12 ? 'giữa' : (zc < c.W/2 ? 'bên PHẢI' : 'bên TRÁI');
    return `Hàng ${pl.row} · ${side} · ${pl.stackedOn ? 'tầng trên (đặt lên #' + pl.stackedOn + ')' : 'tầng sàn'}`;
  };
  const compTxt = (u)=> Object.entries(u.skuCounts).map(([id,n])=> `${escapeHtml(codeOf(id))} × ${n}`).join(', ');
  const blocks = p.pallets.map(pl=> ({ no: pl.no, color: palColor(pl), sx: pl.placement.sizeX, sy: pl.placement.sizeY, sz: pl.placement.sizeZ,
    x0: pl.placement.x, y0: pl.placement.y, z0: pl.placement.z, nx:1, ny:1, nz:1,
    stroke: pl.kind === 'customs' ? '#c0392b' : null, strokeW: pl.kind === 'customs' ? 4 : null, hatch: pl.kind === 'customs' }));

  // Tổng hợp theo SKU

  // Thứ tự đưa pallet vào cont
  const loadRows = p.pallets.map(pl=> `<tr>
      <td><span class="pp-no">${pl.no}</span></td>
      <td>${posTxt(pl)}</td>
      <td><span class="pp-swatch" style="background:${palColor(pl)}"></span>${kindTxt[pl.kind] || pl.kind}${pl.kind === 'customs' ? ' <span class="pp-tag red">KH</span>' : ''}</td>
      <td>${compTxt(pl.unit)}</td>
      <td>${fmtInt(pl.unit.height)} mm · ${fmtInt(pl.unit.grossWeight)} kg</td>
    </tr>`).join('');

  // Phiếu chất: gộp các pallet giống hệt nhau
  const groups = [];
  p.pallets.forEach(pl=>{
    const layers = palletLayersOf(pl.unit);
    const sig = pl.unit.ptypeId + '|' + pl.kind + '|' + layers.map(L=> deckLayerSignature(L, pl.unit)).join('#');
    const g = groups.find(x=> x.sig === sig);
    if (g) g.nos.push(pl.no); else groups.push({ sig, nos:[pl.no], pl, layers });
  });
  const shots = printShots(groups.map(g=> g.pl.unit.id));
  const cards = groups.map(g=>{
    const u = g.pl.unit, pats = [], patOf = [];
    g.layers.forEach((L, i)=>{
      const sg = layerSignature(L);
      let k = pats.findIndex(x=> x.sig === sg);
      if (k < 0){ pats.push({ sig: sg, L, idxs: [] }); k = pats.length - 1; }
      pats[k].idxs.push(i + 1); patOf.push(k);
    });
    const letter = (k)=> String.fromCharCode(65 + k);
    const rows = g.layers.map((L, i)=>{
      const cnt = {}; L.cartons.forEach(cc=> cnt[cc.skuId] = (cnt[cc.skuId]||0) + 1);
      const kh = L.cartons.filter(cc=> cc.tag === 'customs').length, mau = L.cartons.filter(cc=> cc.tag === 'sample').length;
      const stacked = L.cartons.some(cc=> cc.ly - L.base > 1);
      const note = [i === 0 ? 'đáy' : '', i === g.layers.length - 1 ? 'trên cùng' : '', stacked ? 'có thùng chồng 2 tầng' : '', kh ? `${kh} thùng KH` : '', mau ? `${mau} hàng mẫu` : ''].filter(Boolean).join(', ');
      return `<tr><td>${i+1}</td><td>${Object.entries(cnt).map(([id,n])=> `${escapeHtml(codeOf(id))}×${n}`).join(' + ')}</td><td>${fmtInt(L.h)}</td><td><b>${letter(patOf[i])}</b></td><td>${note}</td></tr>`;
    }).join('');
    const patFig = (shots.pallets[u.id] ? `<div class="pp-pat pp-3d"><img src="${shots.pallets[u.id]}" alt="">3D (góc phía cửa)</div>` : '') +
      pats.slice(0, 6).map((pt, k)=> `<div class="pp-pat">${palletLayerSVG(u, pt.L, colorOf, codeOf)}Mẫu <b>${letter(k)}</b> — lớp ${pt.idxs.join(', ')}</div>`).join('');
    const patTxt = u.pattern === 'interlock' ? 'xen kẽ (interlock)' : u.pattern === 'pinwheel' ? 'chong chóng (pinwheel), lớp sau đổi chiều quay' : u.pattern === 'column' ? 'cột thẳng (column)' : u.pattern === 'column_toplock' ? 'column + khóa lớp trên' : u.pattern === 'manual' ? 'chỉnh tay' : 'ghép lớp';
    const isC = g.pl.kind === 'customs';
    return `<div class="pp-card ${isC ? 'customs' : ''}">
      <div class="pp-card-h">${g.nos.map(n=> `<span class="pp-no">${n}</span>`).join('')}
        <span>${g.nos.length > 1 ? `${g.nos.length} pallet giống nhau` : 'Pallet'} — ${kindTxt[g.pl.kind] || g.pl.kind}</span>${isC ? '<span class="pp-tag red">KIỂM HÓA</span>' : ''}</div>
      <div class="pp-card-sub">${escapeHtml(u.ptypeName)} (${u.palletL}×${u.palletW}×${u.palletH}) · ${g.layers.length} lớp · cao tổng ${fmtInt(u.height)} mm · ${fmtInt(u.grossWeight)} kg/pallet · cách chất: ${patTxt} · nẹp góc/đai: <b>${u.strapOk === false ? '✕ khó (đỉnh thiếu góc)' : '✓ được'}</b><br>Nội dung: ${compTxt(u)}</div>
      <table class="pp-ltab"><thead><tr><th>Lớp</th><th>Nội dung</th><th>Cao</th><th>Mẫu</th><th>Ghi chú</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="pp-pats">${patFig}</div>
    </div>`;
  }).join('');

  const legendSku = p.breakdown.map(b=> `<span><span class="pp-swatch" style="background:${b.color}"></span>${escapeHtml(b.code)}</span>`).join('');
  root.innerHTML = `
    <div class="pp-page">
      <div class="pp-head">
        <h1>${state.orderName ? escapeHtml(state.orderName) + ' — ' : ''}Phương án chất pallet</h1>
        <div class="pp-meta">${dateStr}</div>
      </div>
      <div class="pp-guide">Cont: <b>${carrier ? escapeHtml(carrier.name) : ''} ${ctype || ''}</b> — lọt lòng ${fmtInt(c.L)} × ${fmtInt(c.W)} × ${fmtInt(c.H)} mm, cửa ${fmtInt(c.doorW)} × ${fmtInt(c.doorH)} mm.
        Pallet cao tối đa (kể cả hàng) khi đưa qua cửa: <b>${fmtInt(s.hLimit)} mm</b>.${state.orderNote ? `<br>Ghi chú: ${escapeHtml(state.orderNote)}` : ''}</div>
      <div class="pp-chips">
        <span class="pp-chip"><b>${s.palletCount}</b> pallet</span>
        <span class="pp-chip"><b>${fmtInt(s.totalPlaced)}/${fmtInt(s.totalRequested)}</b> thùng</span>
        <span class="pp-chip"><b>${fmtInt(s.totalWeight)}</b> kg gồm pallet (${fmt(s.weightPct,0)}% tải)</span>
        <span class="pp-chip">Thể tích hàng <b>${fmt(s.volumePct,0)}%</b> · sàn <b>${fmt(s.floorPct,0)}%</b></span>
      </div>
      ${alerts.map(a=> `<div class="pp-alert">⚠ ${a}</div>`).join('')}

      ${printSkuLegend(p).replace('Chú thích SKU', '1. Chú thích SKU (mã — tên — kích thước)')}

      <div class="pp-sec">2. Vị trí pallet trong cont</div>
      <div class="pp-guide">Số trong vòng tròn = <b>thứ tự đưa pallet vào cont</b>: #1 vào đầu tiên, nằm sâu nhất sát vách kín; số lớn nhất ra sau cùng, sát cửa. "Phải/trái" tính khi đứng ở cửa nhìn vào trong cont.</div>
      <div class="pp-legend">${legendSku}<span><span class="pp-swatch" style="background:#9aa3b0"></span>Pallet mix</span><span><span class="pp-swatch" style="background:#fff;border:2.5px solid #c0392b"></span>Viền đỏ đậm = pallet kiểm hóa</span></div>
      <div class="pp-keep"><div class="pp-view-title">Nhìn từ trên xuống (dài × rộng cont)</div>
      ${buildPrintSVG('top', c, blocks, [])}</div>
      <div class="pp-keep"><div class="pp-view-title">Nhìn từ bên hông (dài × cao cont) — pallet gần vách PHẢI vẽ đè lên</div>
      ${buildPrintSVG('side', c, blocks, [])}</div>

      <div class="pp-sec">3. Thứ tự đưa pallet vào cont</div>
      <table class="pp-table"><thead><tr><th>#</th><th>Vị trí (hàng tính từ vách kín)</th><th>Loại</th><th>Nội dung (SKU × số thùng)</th><th>Cao · KL</th></tr></thead><tbody>${loadRows}</tbody></table>

      ${shots.views.length ? `<div class="pp-sec pp-break">4. Hình 3D minh họa</div>
      <div class="pp-guide">Số trên đầu pallet = thứ tự đưa vào cont. "Cửa bên trái" = cửa cont ở mép trái ảnh.</div>
      <div class="pp-3dgrid">${shots.views.map(v=> `<figure class="${v.wide ? 'wide' : ''}"><img src="${v.url}" alt=""><figcaption>${escapeHtml(v.label)}</figcaption></figure>`).join('')}</div>` : ''}

      <div class="pp-sec pp-break">${shots.views.length ? 5 : 4}. Phiếu chất hàng lên từng pallet</div>
      <div class="pp-guide">Chất từ <b>lớp 1 (đáy)</b> lên. Hình = nhìn từ trên xuống mặt pallet (nền nâu nét đứt = mặt pallet; thùng ra ngoài nền = chìa mép). Các lớp cùng chữ cái xếp giống hệt nhau.
        Viền đỏ <b>KH</b> = thùng kiểm hóa, <b>M</b> = hàng mẫu; thùng nét đứt có dấu <b>↑</b> = thùng đặt chồng lên thùng khác trong cùng lớp đỉnh.</div>
      <div class="pp-cards">${cards}</div>
    </div>`;
}

/* ============================================================
   10b. CHỈNH TAY — sửa trực tiếp phương án trước khi chốt
   Bấm chọn trên 3D → thao tác ở bảng nổi (hoặc phím tắt). Thao tác KHÔNG bị ràng buộc, nhưng sau mỗi bước tool
   kiểm tra lại và hiện cảnh báo (chồng lấn, ra ngoài cont, thiếu đỡ, vượt cao/tải...). Có hoàn tác.
   Dữ liệu sửa là bản "raw" của lần tối ưu (pallet: units + placements; bulk: danh sách thùng) → xử lý lại để
   cập nhật thống kê, 3D, bảng, bản in.
   ============================================================ */
const edit = { on: false, sel: null, selKind: 'pallet', step: 50, undo: [], tray: [], warn: [], addSku: null, addQty: 1,
               review: false, issues: null, compactTol: 30, multi: new Set(), focus: false, additive: false, addLayer: 0,
               arrange: { lenMode: 'even', lenGap: 50, widMode: 'walls', widGap: 50 } };

function editAvailable(){ return !!(state.result && state.result.raw && state.result.ctxSkus); }

function pushUndo(){
  edit.undo.push(JSON.stringify({ raw: state.result.raw, tray: edit.tray }));
  if (edit.undo.length > 40) edit.undo.shift();
}
function doUndo(){
  const s = edit.undo.pop();
  if (!s){ showToast('Không còn thao tác để hoàn tác.', true); return; }
  const o = JSON.parse(s);
  state.result.raw = o.raw; edit.tray = o.tray;
  reprocessAfterEdit(-1);
}

// Xử lý lại raw → kết quả hiển thị mới (giữ camera), kèm cảnh báo của phần chỉnh tay.
function reprocessAfterEdit(delta){
  const proc = reprocessQuiet(delta);
  rebuildBoxMeshes(proc);
  buildRightColumn();
  renderRightResults(proc);
  renderEditPanel();
}
// Xử lý lại raw → kết quả hiển thị (không vẽ). delta = số thao tác chỉnh tay cộng thêm.
function reprocessQuiet(delta){
  const r = state.result;
  const keep = { zones: r.zones, showZones: r.showZones, raw: r.raw, ctxSkus: r.ctxSkus, manualOps: Math.max(0, (r.manualOps || 0) + (delta == null ? 1 : delta)) };
  const proc = r.mode === 'pallet'
    ? processPalletOutput(r.raw, r.ctxSkus, r.container, [], r.stats.elapsedMs, r.settings)
    : processOptimizerOutput(r.raw, r.ctxSkus, r.container, [], r.stats.elapsedMs, r.settings);
  Object.assign(proc, keep);
  // lỗi đỡ phát sinh do CHỈNH TAY đã được liệt kê trong cảnh báo chỉnh tay → bỏ thông báo "lỗi thuật toán" của lưới an toàn
  if (proc.manualOps) proc.warnings = proc.warnings.filter(w=> !w.startsWith('LỖI KIỂM TRA'));
  edit.warn = validateManual(proc);
  if (proc.manualOps) proc.warnings.unshift(`Phương án đã CHỈNH TAY (${proc.manualOps} thao tác).` + (edit.warn.length ? ` ${edit.warn.length} cảnh báo bên dưới.` : ' Không phát hiện vi phạm.'));
  edit.warn.slice().reverse().forEach(w=> proc.warnings.splice(1, 0, '✎ ' + w));
  state.result = proc;
  return proc;
}

/* ============================================================
   DÀN THÙNG RA MÉP KHỐI & CĂN CHỈNH LỚP (mode pallet)
   - Căn chỉnh lớp: trong mỗi lớp, thùng lệch hàng/cột ≤ 25 mm được kéo về thẳng hàng/cột; rồi đặt TÂM mọi lớp trùng tâm khối
     → cùng 1 cách xếp thì vị trí giống hệt (bản in gộp lớp/phiếu được).
   - Dàn ra mép khối: lớp nhỏ hơn khối to nhất của pallet được nới đều các khe giữa thùng (mỗi khe nới thêm ≤ X mm) để mép
     lớp chạm mép khối (thay vì gom giữa, chỗ lòi chỗ thụt). Thứ tự thùng theo mỗi trục giữ nguyên → không phát sinh chồng lấn.
   Mỗi lớp: kiểm tra thùng lớp đó được lớp dưới đỡ ≥ ngưỡng VÀ lớp trên vẫn được nó đỡ; không đạt thì nới ít lại (¾, ½, ¼)
   hoặc giữ nguyên. Bỏ qua lớp "nắp" (thùng chồng 2 tầng trong cùng lớp) và pallet đang khóa.
   ============================================================ */
function unitLayerRefs(u){
  const out = []; let base = 0;
  (u.layers || []).forEach(L=>{
    if (L.base != null) base = L.base;
    const top = base + L.h;
    const cs = u.cartons.filter(c=> c.ly >= base - 0.5 && c.ly < top - 0.5);
    if (cs.length) out.push({ base, cs, flat: cs.every(c=> Math.abs(c.ly - base) < 1.5) });
    base = top;
  });
  return out;
}
// tỉ lệ đỡ nhỏ nhất của các thùng (ở đáy lớp) trên 1 lớp bên dưới — chỉ xét trên mặt bằng
function layerMinSupport(cs, below){
  let worst = 1;
  cs.forEach(c=>{
    let a = 0;
    below.forEach(b=>{
      const ox = Math.min(c.lx + c.sx, b.lx + b.sx) - Math.max(c.lx, b.lx), oz = Math.min(c.lz + c.sz, b.lz + b.sz) - Math.max(c.lz, b.lz);
      if (ox > 0 && oz > 0) a += ox * oz;
    });
    worst = Math.min(worst, a / (c.sx * c.sz));
  });
  return worst;
}
// gom các mốc gần nhau (≤ tol) thành 1 nhóm → hạng (rank) của từng mốc
function clusterRanks(vals, tol){
  const u = Array.from(new Set(vals.map(v=> Math.round(v)))).sort((a,b)=> a - b);
  const rank = new Map(); let r = -1, last = -Infinity;
  u.forEach(v=>{ if (v - last > tol) r++; rank.set(v, r); last = v; });
  return { rank: (v)=> rank.get(Math.round(v)), n: r + 1 };
}
function arrangeUnitLayers(u, opt){
  const thr = ((state.result.settings && state.result.settings.supportThreshold) || 70) / 100 - 1e-6;
  const layers = unitLayerRefs(u);
  if (!layers.some(l=> l.flat)) return 0;
  const AX = [['lx', 'sx'], ['lz', 'sz']];
  // số cặp thùng chồng lấn trong lớp (lớp đang lỗi do chỉnh tay vẫn được sửa: chỉ cần KHÔNG tăng thêm)
  const overlapN = (cs)=>{
    let n = 0;
    for (let a = 0; a < cs.length; a++) for (let b = a + 1; b < cs.length; b++){
      const p = cs[a], q = cs[b];
      if (Math.min(p.lx + p.sx, q.lx + q.sx) - Math.max(p.lx, q.lx) > 0.5 && Math.min(p.lz + p.sz, q.lz + q.sz) - Math.max(p.lz, q.lz) > 0.5) n++;
    }
    return n;
  };
  const supportOk = (i)=>{
    const L = layers[i], below = i > 0 ? layers[i - 1].cs : null, A = layers[i + 1];
    if (below && layerMinSupport(L.cs.filter(c=> Math.abs(c.ly - L.base) < 1.5), below) < thr) return false;
    if (A && layerMinSupport(A.cs.filter(c=> Math.abs(c.ly - A.base) < 1.5), L.cs) < thr) return false;
    return true;
  };
  const save = (L)=> L.cs.map(c=> ({ c, lx: c.lx, lz: c.lz }));
  const restore = (sv)=> sv.forEach(o=>{ o.c.lx = o.lx; o.c.lz = o.lz; });
  const moved = (sv)=> sv.some(o=> Math.abs(o.c.lx - o.lx) > 0.5 || Math.abs(o.c.lz - o.lz) > 0.5);
  const changedLayers = new Set();
  // (A) CĂN THẲNG HÀNG: mốc lệch ≤ 25 mm về TRUNG VỊ nhóm, từng trục; trục nào kéo về gây chồng lấn / thiếu đỡ thì bỏ trục đó
  if (opt.align) layers.forEach((L, i)=>{
    if (!L.flat) return;
    AX.forEach(([P])=>{
      const sv = save(L), ov0 = overlapN(L.cs), K = clusterRanks(L.cs.map(c=> c[P]), 25), groups = new Map();
      L.cs.forEach(c=>{ const k = K.rank(c[P]); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(Math.round(c[P])); });
      // mốc chuẩn mỗi nhóm = vị trí NHIỀU thùng đứng nhất (thùng lệch kéo về theo số đông); hòa thì thử mốc nhỏ rồi mốc lớn
      for (const tieMin of [true, false]){
        restore(sv);
        const anchor = new Map(Array.from(groups, ([k, v])=>{
          const cnt = new Map(); v.forEach(x=> cnt.set(x, (cnt.get(x) || 0) + 1));
          const best = Array.from(cnt).sort((a,b)=> (b[1] - a[1]) || (tieMin ? a[0] - b[0] : b[0] - a[0]))[0][0];
          return [k, best];
        }));
        L.cs.forEach(c=> c[P] = anchor.get(K.rank(c[P])));
        if (overlapN(L.cs) <= ov0 && supportOk(i)){ if (moved(sv)) changedLayers.add(i); return; }
      }
      restore(sv);
    });
  });
  // khung mục tiêu = khung bao của cả khối (sau khi đã căn thẳng hàng)
  const flat = layers.filter(l=> l.flat);
  const ref = {
    lx: [Math.min(...flat.map(l=> Math.min(...l.cs.map(c=> c.lx)))), Math.max(...flat.map(l=> Math.max(...l.cs.map(c=> c.lx + c.sx))))],
    lz: [Math.min(...flat.map(l=> Math.min(...l.cs.map(c=> c.lz)))), Math.max(...flat.map(l=> Math.max(...l.cs.map(c=> c.lz + c.sz))))]
  };
  // (B) DÀN RA MÉP KHỐI: mỗi trục, các mốc bắt đầu (gom ≤ 20 mm) xếp hạng; hạng k dời thêm k × khe → khe đều nhau, mép lớp
  //     chạm 2 mép khối. Thứ tự giữ nguyên nên không chồng lấn. maxGap = trần mỗi khe (Infinity = đồng nhất khối hoàn toàn).
  if (opt.spread) layers.forEach((L, i)=>{
    if (!L.flat) return;
    const sv = save(L), ov0 = overlapN(L.cs);
    const base = AX.map(([P, S])=>{
      const K = clusterRanks(L.cs.map(c=> c[P]), 20);
      const x0 = Math.min(...L.cs.map(c=> c[P])), x1 = Math.max(...L.cs.map(c=> c[P] + c[S]));
      const [lo, hi] = ref[P], room = (hi - lo) - (x1 - x0);
      return { P, K, x0, x1, lo, hi, per: K.n > 1 && room > 0 ? Math.min(room / (K.n - 1), opt.maxGap) : 0, rank: new Map(L.cs.map(c=> [c, K.rank(c[P])])) };
    });
    for (const f of [1, 0.75, 0.5, 0.25, 0]){
      restore(sv);
      base.forEach(B=>{
        const per = B.per * f, used = per * (B.K.n - 1);
        const shift = B.lo + ((B.hi - B.lo) - ((B.x1 - B.x0) + used)) / 2 - B.x0;   // canh giữa khối
        L.cs.forEach(c=> c[B.P] = c[B.P] + shift + per * B.rank.get(c));
      });
      if (overlapN(L.cs) <= ov0 && supportOk(i)){ if (moved(sv)) changedLayers.add(i); return; }
    }
    restore(sv);
  });
  return changedLayers.size;
}
// Áp cho 1 pallet hoặc mọi pallet trong cont. auto=true: chạy ngay sau tối ưu (không tính là chỉnh tay, giữ nhãn cách chất).
function arrangePallets(ids, opt, auto){
  const raw = state.result.raw; let layersChanged = 0, units = 0;
  raw.units.forEach(u=>{
    if (ids && !ids.includes(u.id)) return;
    if (!rawPlacement(u.id) || (raw.locks && raw.locks.units.includes(u.id))) return;
    const n = arrangeUnitLayers(u, opt);
    if (n){ layersChanged += n; units++; finalizeUnit(u, true, auto); }
  });
  return { layersChanged, units };
}
function edArrangeLayers(spread, full){
  const r = state.result; if (r.mode !== 'pallet') return;
  const P = state.pallet;
  const ids = edit.arrScope === 'sel' ? (edit.selKind === 'carton' ? [((cartonRef(edit.sel) || {}).u || {}).id] : [edit.sel]).filter(Boolean) : null;
  if (edit.arrScope === 'sel' && !(ids && ids.length)){ showToast('Chọn 1 pallet trước (hoặc chọn phạm vi "Tất cả pallet").', true); return; }
  pushUndo();
  const res = arrangePallets(ids, { align: true, spread: !!spread, maxGap: full ? Infinity : (P.spreadGap || 30) }, false);
  if (!res.layersChanged){ edit.undo.pop(); showToast('Các lớp đã thẳng hàng / không nới thêm được (giữ đỡ ≥ ngưỡng).'); return; }
  showToast(`${full ? 'Đã đồng nhất khối' : spread ? 'Đã dàn ra mép khối' : 'Đã căn chỉnh'}: ${res.layersChanged} lớp trên ${res.units} pallet.`);
  reprocessAfterEdit();
}

/* ---------- Kiểm tra sau chỉnh tay (không chặn — chỉ cảnh báo) ---------- */
function validateManual(p){
  const out = [], c = p.container;
  const ovl = (a, b)=> Math.min(a.x + a.sizeX, b.x + b.sizeX) - Math.max(a.x, b.x) > 0.5 &&
                       Math.min(a.y + a.sizeY, b.y + b.sizeY) - Math.max(a.y, b.y) > 0.5 &&
                       Math.min(a.z + a.sizeZ, b.z + b.sizeZ) - Math.max(a.z, b.z) > 0.5;
  const inZone = (a)=> (p.zones || []).some(z=> ovl(a, { x:z.x, y:z.y, z:z.z, sizeX:z.dx, sizeY:z.dy, sizeZ:z.dz }));
  const thr = (p.settings && p.settings.supportThreshold) || 70;
  if (p.mode === 'pallet'){
    const pls = p.pallets.map(pl=> ({ no: pl.no, q: pl.placement, u: pl.unit }));
    for (let i=0; i<pls.length; i++) for (let j=i+1; j<pls.length; j++)
      if (ovl(pls[i].q, pls[j].q)) out.push(`Pallet #${pls[i].no} và #${pls[j].no} chồng lấn nhau.`);
    const hLim = p.stats.hLimit || c.H;
    const types = (p.settings.pallet && p.settings.pallet.types) || [];
    const eps = Math.max(1, (p.settings.pallet && p.settings.pallet.layerHTol) || 0) + 0.01;
    pls.forEach(({ no, q, u })=>{
      if (q.x < -0.5 || q.z < -0.5 || q.x + q.sizeX > c.L + 0.5 || q.z + q.sizeZ > c.W + 0.5) out.push(`Pallet #${no} ra ngoài lòng cont.`);
      if (q.y + u.height > hLim + 0.5) out.push(`Pallet #${no} cao ${fmtInt(q.y + u.height)} mm > giới hạn qua cửa ${fmtInt(hLim)} mm.`);
      if (inZone(q)) out.push(`Pallet #${no} chạm vùng cấm / điểm mù.`);
      const t = types.find(x=> x.id === u.ptypeId);
      if (t && t.maxLoadKg > 0 && u.cargoWeight > t.maxLoadKg + 0.5) out.push(`Pallet #${no} chở ${fmtInt(u.cargoWeight)} kg > tải pallet ${fmtInt(t.maxLoadKg)} kg.`);
      // đỡ từng thùng trong pallet (tọa độ pallet)
      const cs = u.cartons.map(k=> ({ x:k.lx, y:k.ly, z:k.lz, sizeX:k.sx, sizeY:k.sy, sizeZ:k.sz }));
      let bad = 0, clash = 0;
      cs.forEach((k, i)=>{
        if (k.y > 0.5 && computeSupportRatio(k, findDirectSupporters(k, cs, eps), eps) < thr - 0.01) bad++;
        for (let j=i+1; j<cs.length; j++) if (ovl(k, cs[j])) clash++;
      });
      if (bad) out.push(`Pallet #${no}: ${bad} thùng được đỡ < ${thr}%.`);
      if (clash) out.push(`Pallet #${no}: ${clash} cặp thùng chồng lấn.`);
    });
  } else {
    const P = p.placed.slice().sort((a,b)=> a.x - b.x);
    let clash = 0, oob = 0, zone = 0, bad = 0;
    for (let i=0; i<P.length; i++){
      const a = P[i];
      for (let j=i+1; j<P.length && P[j].x < a.x + a.sizeX - 0.5; j++) if (ovl(a, P[j])) clash++;
      if (a.x < -0.5 || a.y < -0.5 || a.z < -0.5 || a.x + a.sizeX > c.L + 0.5 || a.y + a.sizeY > c.H + 0.5 || a.z + a.sizeZ > c.W + 0.5) oob++;
      if (inZone(a)) zone++;
      if (a.y > 0.5 && computeSupportRatio(a, findDirectSupporters(a, P, 1), 1) < thr - 0.01) bad++;
    }
    if (clash) out.push(`${clash} cặp thùng chồng lấn.`);
    const covered = P.filter(a=> a.tag === 'customs' && P.some(o=> o !== a && Math.abs(o.y - (a.y + a.sizeY)) < 1.5 &&
      Math.min(a.x + a.sizeX, o.x + o.sizeX) - Math.max(a.x, o.x) > 1 && Math.min(a.z + a.sizeZ, o.z + o.sizeZ) - Math.max(a.z, o.z) > 1)).length;
    if (covered) out.push(`${covered} thùng kiểm hóa đang bị thùng khác đè lên (hải quan khó lấy).`);
    if (oob) out.push(`${oob} thùng ra ngoài lòng cont.`);
    if (zone) out.push(`${zone} thùng chạm vùng cấm / điểm mù.`);
    if (bad) out.push(`${bad} thùng được đỡ < ${thr}% (lơ lửng / thiếu đỡ).`);
  }
  // hướng thùng chỉnh tay mà thẻ SKU không cho phép (vd đặt nằm khi "This side up")
  const bad = {};
  const cartons = p.placed.filter(x=> !x.isPalletBase && /^M/.test(x.orientCode || ''));
  cartons.forEach(x=>{ const k = (p.ctxSkus || []).find(s=> s.id === x.skuId); if (k && !orientAllowed(k, x.sizeX, x.sizeY, x.sizeZ)) bad[k.code || k.id] = (bad[k.code || k.id] || 0) + 1; });
  Object.entries(bad).forEach(([code, n])=> out.push(`${n} thùng ${code} đặt theo hướng thẻ SKU không cho phép (this side up / khóa xoay).`));
  p.breakdown.forEach(b=>{ if (b.placed > b.requested) out.push(`${b.code}: đã xếp ${b.placed} > yêu cầu ${b.requested} thùng.`); });
  if (c.payload && p.stats.totalWeight > c.payload) out.push(`Tổng khối lượng ${fmtInt(p.stats.totalWeight)} kg > tải trọng cont ${fmtInt(c.payload)} kg.`);
  return out;
}

/* ---------- Thao tác mức PALLET ---------- */
function rawUnit(id){ return state.result.raw.units.find(u=> u.id === id); }
function rawPlacement(id){ return state.result.raw.placements.find(q=> q.unitId === id); }

// Các lớp của 1 pallet: [{ h, info, cartons (ly tương đối trong lớp) }] từ dưới lên
function unitLayerList(u){
  const out = []; let base = 0;
  (u.layers || [{ h: Infinity }]).forEach(L=>{
    if (L.base != null) base = L.base;
    const top = base + L.h;
    out.push({ h: L.h, info: L, cartons: u.cartons.filter(c=> c.ly >= base - 0.5 && c.ly < top - 0.5).map(c=> Object.assign({}, c, { ly: c.ly - base })) });
    base = top;
  });
  return out;
}
// Ghi lại danh sách lớp vào pallet (xếp liền nhau từ mặt pallet) rồi tính lại pallet.
function writeUnitLayers(u, layers){
  let base = 0; const cartons = [];
  layers.forEach(L=>{ L.cartons.forEach(c=> cartons.push(Object.assign({}, c, { ly: base + c.ly }))); base += L.h; });
  u.cartons = cartons;
  u.layers = layers.map((L, i)=>{
    const cnt = {}; L.cartons.forEach(c=> cnt[c.skuId] = (cnt[c.skuId] || 0) + 1);
    return Object.assign({}, L.info, { h: L.h, base: undefined, counts: cnt, top: i === layers.length - 1 });
  });
  finalizeUnit(u, true);
}
// Sau khi sửa TỪNG THÙNG: dựng lại danh sách lớp từ cao độ đáy thùng (đáy chênh ≤ 5 mm = cùng lớp).
function deriveUnitLayers(u){
  const groups = [];
  u.cartons.slice().sort((a,b)=> a.ly - b.ly).forEach(c=>{
    const g = groups.find(g=> Math.abs(g.base - c.ly) <= 5);
    if (g) g.cs.push(c); else groups.push({ base: c.ly, cs: [c] });
  });
  groups.sort((a,b)=> a.base - b.base);
  u.layers = groups.map((g, i)=>{
    const top = Math.max(...g.cs.map(c=> c.ly + c.sy));
    const cnt = {}; g.cs.forEach(c=> cnt[c.skuId] = (cnt[c.skuId] || 0) + 1);
    const area = g.cs.reduce((t,c)=> t + c.sx * c.sz, 0);
    const hs = g.cs.map(c=> c.ly + c.sy);
    const uniform = Math.max(...hs) - Math.min(...hs) <= 5;
    const cov = area / (u.palletL * u.palletW);
    // cao lớp = tới đỉnh thùng cao nhất của lớp (không lấy theo đáy lớp kế) — khi xếp lại lớp liền nhau không bao giờ chồng
    return { base: g.base, h: Math.max(1, top - g.base), counts: cnt, coverage: cov, uniform, full: uniform && cov >= 0.75, top: i === groups.length - 1 };
  });
}
// Tọa độ pallet ↔ tọa độ cont (khớp phép biến đổi khi dựng 3D trong processPalletOutput)
function unitToWorld(u, q, lx, lz, sx, sz){
  return q.orientCode === 'P90' ? { x: q.x + lz, z: q.z + (u.FL - lx - sx), sizeX: sz, sizeZ: sx }
                                : { x: q.x + lx, z: q.z + lz, sizeX: sx, sizeZ: sz };
}
function worldToUnit(u, q, w){
  return q.orientCode === 'P90' ? { lz: w.x - q.x, sz: w.sizeX, sx: w.sizeZ, lx: u.FL - w.sizeZ - (w.z - q.z) }
                                : { lx: w.x - q.x, lz: w.z - q.z, sx: w.sizeX, sz: w.sizeZ };
}
// Tính lại pallet sau chỉnh tay: footprint = mặt pallet ∪ các thùng (co lại khi thùng đã chuyển đi), MẶT PALLET đứng yên
// trong cont; cao/nặng/số thùng; loại pallet (1 SKU / mix); nẹp-đai; dựng lại lớp (keepLayers=false).
function finalizeUnit(u, keepLayers, keepPattern){
  const cartons = u.cartons, q = rawPlacement(u.id);
  const deckBefore = q ? unitToWorld(u, q, u.deckX, u.deckZ, u.palletL, u.palletW) : null;
  let minX = u.deckX, minZ = u.deckZ, maxX = u.deckX + u.palletL, maxZ = u.deckZ + u.palletW, top = 0, w = 0; const counts = {};
  cartons.forEach(c=>{ minX = Math.min(minX, c.lx); minZ = Math.min(minZ, c.lz); maxX = Math.max(maxX, c.lx + c.sx); maxZ = Math.max(maxZ, c.lz + c.sz);
                      top = Math.max(top, c.ly + c.sy); w += c.weight; counts[c.skuId] = (counts[c.skuId] || 0) + 1; });
  cartons.forEach(c=>{ c.lx -= minX; c.lz -= minZ; }); u.deckX -= minX; u.deckZ -= minZ;
  u.FL = maxX - minX; u.FW = maxZ - minZ;
  u.height = u.palletH + top; u.cargoWeight = w; u.grossWeight = w + (u.palletTare || 0); u.skuCounts = counts;
  if (u.kind !== 'customs') u.kind = Object.keys(counts).length > 1 ? 'mixed' : 'full';
  u.stability = 'ok'; if (!keepPattern) u.pattern = 'manual';
  if (!keepLayers) deriveUnitLayers(u);
  u.strapOk = manualStrapOk(u);
  if (q){
    const rot = q.orientCode === 'P90';
    q.sizeX = rot ? u.FW : u.FL; q.sizeZ = rot ? u.FL : u.FW; q.sizeY = u.height;
    const deckAfter = unitToWorld(u, q, u.deckX, u.deckZ, u.palletL, u.palletW);
    q.x += deckBefore.x - deckAfter.x; q.z += deckBefore.z - deckAfter.z;
  }
  if (!u.cartons.length && !u.keepEmpty){ // pallet rỗng (không do người dùng chủ động tạo/làm rỗng) → bỏ khỏi cont
    state.result.raw.placements = state.result.raw.placements.filter(x=> x.unitId !== u.id);
    state.result.raw.units = state.result.raw.units.filter(x=> x.id !== u.id);
  }
}
// Nẹp góc/đai cho pallet đã chỉnh tay: mọi lớp phủ ≥ 75% mặt pallet, cao đều, và thẳng 4 góc với lớp đáy.
function manualStrapOk(u){
  const L = unitLayerList(u).filter(l=> l.cartons.length);
  if (!L.length) return true;
  const pseudo = (l)=> ({ cartons: l.cartons.map(c=> ({ x: c.lx, y: c.lz, w: c.sx, l: c.sz, hh: c.sy, oy: c.ly })) });
  const ref = slabBBox(pseudo(L[0]));
  return L.every(l=> (l.info.full !== false) && slabCornersOk(pseudo(l), ref));
}
// Thùng dời sang đứng trên MẶT PALLET khác (tâm thùng nằm trong mặt pallet đó) → chuyển hẳn sang pallet đó.
// Nhờ vậy chọn pallet / bảng in / số liệu theo đúng pallet thực tế, footprint pallet cũ co lại.
function reassignCartonOwners(cids){
  const raw = state.result.raw;
  const decks = raw.units.filter(u=> rawPlacement(u.id)).map(u=>{ const q = rawPlacement(u.id); return { u, q, d: unitToWorld(u, q, u.deckX, u.deckZ, u.palletL, u.palletW) }; });
  const touched = new Set(); let moved = 0;
  cids.forEach(cid=>{
    const ref = cartonRef(cid); if (!ref || !ref.q) return;
    const w = unitToWorld(ref.u, ref.q, ref.c.lx, ref.c.lz, ref.c.sx, ref.c.sz);
    const cx = w.x + w.sizeX / 2, cz = w.z + w.sizeZ / 2;
    const host = decks.find(d=> cx >= d.d.x - 0.5 && cx <= d.d.x + d.d.sizeX + 0.5 && cz >= d.d.z - 0.5 && cz <= d.d.z + d.d.sizeZ + 0.5);
    if (!host || host.u === ref.u || isUnitLocked(host.u.id)) return;
    const wy = (ref.q.y || 0) + ref.u.palletH + ref.c.ly;
    ref.u.cartons.splice(ref.u.cartons.indexOf(ref.c), 1);
    Object.assign(ref.c, worldToUnit(host.u, host.q, w), { ly: wy - (host.q.y || 0) - host.u.palletH });
    host.u.cartons.push(ref.c);
    touched.add(ref.u); touched.add(host.u); moved++;
  });
  touched.forEach(u=> finalizeUnit(u, false));
  return moved;
}
// Gán id ổn định cho thùng trong pallet (để chọn/sửa từng thùng không bị lệch khi thêm bớt)
function ensureCartonIds(){
  if (!state.result || !state.result.raw || !state.result.raw.units) return;
  state.result.raw.units.forEach(u=> u.cartons.forEach((c, k)=>{ if (!c.cid) c.cid = u.id + ':' + k + ':' + Math.random().toString(36).slice(2, 6); }));
}

/* ---------- Đẩy sát: trượt hộp theo 1 trục tới khi chạm hộp khác / biên ---------- */
const AXSZ = { x: 'sizeX', y: 'sizeY', z: 'sizeZ' };
function snapDelta(box, others, axis, dir, lo, hi){
  const ax = ['x','y','z'].filter(a=> a !== axis);
  const ov = (o)=> ax.every(a=> Math.min(box[a] + box[AXSZ[a]], o[a] + o[AXSZ[a]]) - Math.max(box[a], o[a]) > 0.5);
  let limit = dir > 0 ? hi : lo;
  for (const o of others){
    if (!ov(o)) continue;
    if (dir > 0 && o[axis] >= box[axis] + box[AXSZ[axis]] - 0.5) limit = Math.min(limit, o[axis]);
    if (dir < 0 && o[axis] + o[AXSZ[axis]] <= box[axis] + 0.5) limit = Math.max(limit, o[axis] + o[AXSZ[axis]]);
  }
  return dir > 0 ? limit - (box[axis] + box[AXSZ[axis]]) : limit - box[axis];
}
// Nhóm hộp cùng trượt: lấy bước nhỏ nhất của các thành viên (không đâm xuyên hộp ngoài nhóm)
function snapGroupDelta(group, all, axis, dir, lo, hi){
  const set = new Set(group);
  const others = all.filter(o=> !set.has(o));
  let d = null;
  group.forEach(b=>{ const v = snapDelta(b, others, axis, dir, lo, hi); if (d == null || Math.abs(v) < Math.abs(d)) d = v; });
  return d || 0;
}

/* ---------- Hướng thùng: xoay ngang / nằm-đứng (6 hướng); cảnh báo nếu hướng không được SKU cho phép ---------- */
function orientCycle(sku, cur){
  const dims = [[sku.L, sku.H, sku.W], [sku.W, sku.H, sku.L], [sku.L, sku.W, sku.H], [sku.H, sku.W, sku.L], [sku.W, sku.L, sku.H], [sku.H, sku.L, sku.W]];
  const key = (d)=> d.map(Math.round).join('x');
  const i = Math.max(0, dims.findIndex(d=> key(d) === key(cur)));
  // "nằm/đứng": ưu tiên hướng có CHIỀU CAO khác hiện tại (đổi mặt đáy); hết thì mới tới hướng chỉ xoay ngang
  for (let k=1; k<=6; k++){ const d = dims[(i + k) % 6]; if (Math.abs(d[1] - cur[1]) > 0.5) return d; }
  for (let k=1; k<=6; k++){ const d = dims[(i + k) % 6]; if (key(d) !== key(cur)) return d; }
  return cur;
}
function orientAllowed(sku, sx, sy, sz){
  return generateOrientations(sku).some(o=> Math.abs(o.d - sx) < 1 && Math.abs(o.w - sy) < 1 && Math.abs(o.h - sz) < 1);
}
function ctxSku(id){ return (state.result.ctxSkus || []).find(k=> k.id === id); }

/* ---------- Từng THÙNG trong pallet (chế độ chọn "Thùng") ---------- */
// Tìm thùng theo id ở mọi pallet — thùng chuyển lớp sang pallet khác vẫn giữ id cũ, nên KHÔNG suy pallet từ tiền tố id.
function cartonRef(cid){
  if (!cid || !state.result || !state.result.raw.units) return null;
  for (const u of state.result.raw.units){
    const c = u.cartons.find(x=> x.cid === cid);
    if (c) return { u, c, q: rawPlacement(u.id) };
  }
  return null;
}
const cBox = (c)=> ({ x: c.lx, y: c.ly, z: c.lz, sizeX: c.sx, sizeY: c.sy, sizeZ: c.sz, _c: c });
// Nhóm thùng đang chọn (Ctrl/Shift + bấm hoặc "chọn cả lớp"); không có nhóm thì là thùng đang chọn
function groupIds(){ return edit.multi && edit.multi.size ? Array.from(edit.multi) : (edit.sel ? [edit.sel] : []); }
function groupRefs(){ return groupIds().map(cartonRef).filter(Boolean); }
// Chọn cả lớp chứa thùng đang chọn (mode pallet: lớp của pallet đó; bulk: lớp chất)
function edSelectLayer(){
  const r = state.result;
  if (r.mode === 'pallet'){
    const ref = cartonRef(edit.sel); if (!ref) return;
    let base = 0, lo = null, hi = null;
    (ref.u.layers || []).forEach(info=>{
      if (info.base != null) base = info.base;
      if (lo == null && ref.c.ly >= base - 0.5 && ref.c.ly < base + info.h - 0.5){ lo = base; hi = base + info.h; }
      base += info.h;
    });
    if (lo == null) return;
    addToSelection(ref.u.cartons.filter(c=> c.ly >= lo - 0.5 && c.ly < hi - 0.5).map(c=> c.cid));
  } else {
    const one = r.raw.placed.find(p=> p.instanceId === edit.sel); if (!one) return;
    addToSelection(r.raw.placed.filter(p=> p._layerIndex === one._layerIndex).map(p=> p.instanceId));
  }
  highlightSelection(); renderEditPanel();
}
// "Cộng dồn" bật: thêm vào nhóm đang chọn (chọn được nhiều lớp/khối cùng lúc); tắt: thay nhóm cũ
function addToSelection(ids){
  if (edit.additive){ if (!edit.multi.size && edit.sel) edit.multi.add(edit.sel); ids.forEach(id=> edit.multi.add(id)); }
  else edit.multi = new Set(ids);
}
// Chọn cả KHỐI: mọi thùng cùng SKU nối liền (chạm mặt) với thùng đang chọn — bulk
function edSelectBlock(){
  const r = state.result; if (r.mode === 'pallet') return;
  const P = r.raw.placed, one = P.find(p=> p.instanceId === edit.sel); if (!one) return;
  const same = P.filter(p=> p.skuId === one.skuId).sort((a,b)=> a.x - b.x);
  const touch = (a, b)=>{
    const gx = Math.max(a.x, b.x) - Math.min(a.x + a.sizeX, b.x + b.sizeX), gy = Math.max(a.y, b.y) - Math.min(a.y + a.sizeY, b.y + b.sizeY),
          gz = Math.max(a.z, b.z) - Math.min(a.z + a.sizeZ, b.z + b.sizeZ);
    const near = [gx, gy, gz].filter(g=> g > -1 && g < 2).length, over = [gx, gy, gz].filter(g=> g <= -1).length;
    return near === 1 && over === 2;                 // chạm đúng 1 mặt, chồng phủ 2 trục còn lại
  };
  const seen = new Set([one]), queue = [one];
  while (queue.length){
    const a = queue.pop();
    for (const b of same){
      if (seen.has(b) || b.x > a.x + a.sizeX + 2) continue;
      if (b.x + b.sizeX < a.x - 2) continue;
      if (touch(a, b)){ seen.add(b); queue.push(b); }
    }
  }
  addToSelection(Array.from(seen).map(p=> p.instanceId));
  highlightSelection(); renderEditPanel();
}
// hướng trong cont → trục & dấu trong hệ tọa độ pallet (pallet xoay 90° thì đổi trục)
function worldToLocalAxis(q, axis, dir){
  if (axis === 'y') return { axis: 'y', dir };
  const rot = q && q.orientCode === 'P90';
  if (!rot) return { axis, dir };
  return axis === 'x' ? { axis: 'z', dir } : { axis: 'x', dir: -dir };
}
// Xoay ngang / nằm-đứng thùng đang chọn. Nhóm nhiều thùng + xoay ngang: xoay CẢ NHÓM 90° quanh tâm nhóm (theo từng pallet).
function edTurnCartonInPallet(layDown){
  const refs = groupRefs(); if (!refs.length || guardUnits(refs.map(x=> x.u.id))) return;
  pushUndo();
  const units = new Set(refs.map(x=> x.u));
  if (!layDown && refs.length > 1){
    units.forEach(u=> rotateGroup90(refs.filter(x=> x.u === u).map(x=> ({ x: x.c.lx, z: x.c.lz, sx: x.c.sx, sz: x.c.sz,
      set: (lx, lz, sx, sz)=>{ x.c.lx = lx; x.c.lz = lz; x.c.sx = sx; x.c.sz = sz; } }))));
  } else refs.forEach(x=>{
    const sku = ctxSku(x.c.skuId); if (!sku) return;
    if (layDown){ const d = orientCycle(sku, [x.c.sx, x.c.sy, x.c.sz]); x.c.sx = d[0]; x.c.sy = d[1]; x.c.sz = d[2]; }
    else { const t = x.c.sx; x.c.sx = x.c.sz; x.c.sz = t; }
  });
  refs.forEach(x=> x.c.orientCode = 'M' + Math.round(x.c.sx) + 'x' + Math.round(x.c.sy) + 'x' + Math.round(x.c.sz));
  units.forEach(u=> finalizeUnit(u, false));
  reassignCartonOwners(refs.map(x=> x.c.cid));
  reprocessAfterEdit();
}
// Lật đối xứng nhóm thùng (mode pallet: trong từng pallet; bulk: trong cont)
function edMirrorGroup(axis){
  const r = state.result;
  if (r.mode === 'pallet'){
    const refs = groupRefs(); if (refs.length < 2 || guardUnits(refs.map(x=> x.u.id))) return;
    pushUndo();
    new Set(refs.map(x=> x.u)).forEach(u=>{
      // trục theo hướng cont → trục trong pallet (pallet xoay 90° thì đổi trục)
      const q = rawPlacement(u.id), la = q && q.orientCode === 'P90' ? (axis === 'x' ? 'z' : 'x') : axis;
      mirrorGroup(refs.filter(x=> x.u === u).map(x=> ({ x: x.c.lx, z: x.c.lz, sx: x.c.sx, sz: x.c.sz,
        set: (lx, lz)=>{ x.c.lx = lx; x.c.lz = lz; } })), la);
      finalizeUnit(u, false);
    });
  } else {
    const sel = bulkSelected(); if (sel.length < 2 || guardBulk(sel)) return;
    pushUndo();
    mirrorGroup(sel.map(p=> ({ x: p.x, z: p.z, sx: p.sizeX, sz: p.sizeZ, set: (x, z)=>{ p.x = x; p.z = z; } })), axis);
  }
  reprocessAfterEdit();
}
// Gỡ thùng: 1 thùng → thành "hàng thiếu" (thêm lại được); nhóm → khay hàng chờ dạng 1 lớp (đặt lại lên pallet được)
function edCartonInPalletToTray(){
  const refs = groupRefs(); if (!refs.length || guardUnits(refs.map(x=> x.u.id))) return;
  pushUndo();
  if (refs.length === 1){
    const r = refs[0];
    r.u.cartons = r.u.cartons.filter(c=> c !== r.c);
    (state.result.raw.leftover = state.result.raw.leftover || []).push({ skuId: r.c.skuId, overflow: true, manual: true });
    finalizeUnit(r.u, false);
  } else {
    const y0 = Math.min(...refs.map(x=> x.c.ly)), h = Math.max(...refs.map(x=> x.c.ly + x.c.sy)) - y0;
    const cartons = refs.map(x=> Object.assign({}, x.c, { lx: x.c.lx - x.u.deckX, lz: x.c.lz - x.u.deckZ, ly: x.c.ly - y0 }));
    edit.tray.push({ kind: 'layer', h, info: { h }, cartons, label: layerLabel({ h, cartons }) });
    new Set(refs.map(x=> x.u)).forEach(u=>{
      const gone = new Set(refs.filter(x=> x.u === u).map(x=> x.c));
      u.cartons = u.cartons.filter(c=> !gone.has(c)); finalizeUnit(u, false);
    });
  }
  edit.sel = null; edit.multi.clear();
  reprocessAfterEdit();
}

/* ---------- Di chuyển có CHẶN VA CHẠM (thùng/pallet không đi xuyên nhau) ----------
   Mọi thao tác dời đều tính trong hệ tọa độ CONT với toàn bộ thùng + mặt pallet + vùng cấm + vách cont làm vật cản:
   bước thường = min(bước, khoảng trống còn lại); "đẩy sát" = đi hết khoảng trống tới khi chạm. */
function zoneBoxes(){
  return (state.result.zones || []).map(z=> ({ x: z.x, y: z.y, z: z.z, sizeX: z.dx, sizeY: z.dy, sizeZ: z.dz }));
}
function freeDistance(group, others, axis, dir, lo, hi){
  let d = Infinity;
  group.forEach(b=>{ d = Math.min(d, Math.abs(snapDelta(b, others, axis, dir, lo, hi))); });
  return isFinite(d) ? Math.max(0, d) : 0;
}
function edMove(axis, dir, snap){
  const r = state.result, c = r.container, pal = r.mode === 'pallet';
  const bnd = { x: [0, c.L], y: [0, c.H], z: [0, c.W] }[axis];
  let apply = null, free = 0;
  if (pal && edit.selKind === 'carton'){
    const ids = new Set(groupIds()), refs = groupRefs();
    const wbs = r.placed.filter(p=> ids.has(p.instanceId));
    if (!refs.length || !wbs.length) return;
    if (guardUnits(refs.map(x=> x.u.id))) return;
    free = freeDistance(wbs, r.placed.filter(p=> !ids.has(p.instanceId)).concat(zoneBoxes(), lockedBoxes()), axis, dir, bnd[0], bnd[1]);
    apply = (d)=>{
      refs.forEach(ref=>{ const L = worldToLocalAxis(ref.q, axis, dir); ref.c[{ x: 'lx', y: 'ly', z: 'lz' }[L.axis]] += L.dir * d; });
      new Set(refs.map(x=> x.u)).forEach(u=> finalizeUnit(u, false));
      reassignCartonOwners(Array.from(ids));
    };
  } else if (pal){
    if (axis === 'y') return;
    const q = rawPlacement(edit.sel); if (!q) return;
    if (guardUnits([edit.sel])) return;
    const box = (p)=> ({ x: p.x, y: p.y || 0, z: p.z, sizeX: p.sizeX, sizeY: p.sizeY, sizeZ: p.sizeZ });
    free = freeDistance([box(q)], r.raw.placements.filter(p=> p !== q).map(box).concat(zoneBoxes()), axis, dir, bnd[0], bnd[1]);
    apply = (d)=>{ q[axis] += dir * d; };
  } else {
    const sel = bulkSelected(); if (!sel.length) return;
    if (guardBulk(sel)) return;
    const set = new Set(sel);
    free = freeDistance(sel, r.raw.placed.filter(p=> !set.has(p)).concat(zoneBoxes(), lockedBoxes()), axis, dir, bnd[0], bnd[1]);
    apply = (d)=>{ sel.forEach(p=> p[axis] += dir * d); };
  }
  const d = snap ? free : Math.min(edit.step, free);
  if (d < 0.5){ showToast('Đã chạm thùng / pallet / vách bên cạnh theo hướng này — không đi xuyên được.'); return; }
  pushUndo(); apply(d); reprocessAfterEdit();
}

/* ---------- RÀ LỖI: tìm & khoanh đỏ mọi thùng / pallet / vùng bất hợp lý ---------- */
function collectIssues(r){
  const byId = new Map();
  const add = (id, msg)=>{ if (!byId.has(id)) byId.set(id, []); const a = byId.get(id); if (!a.includes(msg)) a.push(msg); };
  const c = r.container, pal = r.mode === 'pallet';
  const thr = (r.settings && r.settings.supportThreshold) || 70;
  const eps = pal ? Math.max(1, (r.settings.pallet && r.settings.pallet.layerHTol) || 0) + 0.01 : 1;
  const ov = (a, b)=> Math.min(a.x + a.sizeX, b.x + b.sizeX) - Math.max(a.x, b.x) > 0.5 && Math.min(a.y + a.sizeY, b.y + b.sizeY) - Math.max(a.y, b.y) > 0.5 && Math.min(a.z + a.sizeZ, b.z + b.sizeZ) - Math.max(a.z, b.z) > 0.5;
  const zones = zoneBoxes();
  const P = r.placed.slice().sort((a,b)=> a.x - b.x);
  for (let i=0; i<P.length; i++){
    const a = P[i];
    for (let j=i+1; j<P.length && P[j].x < a.x + a.sizeX - 0.5; j++) if (ov(a, P[j])){ add(a.instanceId, 'chồng lấn'); add(P[j].instanceId, 'chồng lấn'); }
    if (a.x < -0.5 || a.y < -0.5 || a.z < -0.5 || a.x + a.sizeX > c.L + 0.5 || a.y + a.sizeY > c.H + 0.5 || a.z + a.sizeZ > c.W + 0.5) add(a.instanceId, 'ra ngoài cont');
    if (zones.some(z=> ov(a, z))) add(a.instanceId, 'chạm vùng cấm');
    if (a.isPalletBase) continue;
    if (a.y > 0.5 && computeSupportRatio(a, findDirectSupporters(a, P, eps), eps) < thr - 0.01) add(a.instanceId, `đỡ < ${thr}%`);
    if (pal && r.stats.hLimit && a.y + a.sizeY > r.stats.hLimit + 0.5) add(a.instanceId, 'cao hơn giới hạn qua cửa');
    if (/^M/.test(a.orientCode || '')){ const k = ctxSku(a.skuId); if (k && !orientAllowed(k, a.sizeX, a.sizeY, a.sizeZ)) add(a.instanceId, 'sai hướng cho phép'); }
    if (!pal && a.tag === 'customs' && P.some(o=> o !== a && Math.abs(o.y - (a.y + a.sizeY)) < 1.5 && Math.min(a.x + a.sizeX, o.x + o.sizeX) - Math.max(a.x, o.x) > 1 &&
        Math.min(a.z + a.sizeZ, o.z + o.sizeZ) - Math.max(a.z, o.z) > 1)) add(a.instanceId, 'hàng kiểm hóa bị đè');
  }
  const list = Array.from(byId.entries()).map(([id, why])=>{
    const p = r.placed.find(x=> x.instanceId === id) || {};
    return { id, why, palletNo: p.palletNo, code: p.isPalletBase ? 'mặt pallet' : (p.skuCode || ''), base: !!p.isPalletBase };
  }).sort((a,b)=> (a.palletNo || 0) - (b.palletNo || 0));
  return { byId, list };
}
function drawIssueMarkers(){
  if (!three.scene) return;
  if (!three.issueGroup){ three.issueGroup = new THREE.Group(); three.scene.add(three.issueGroup); }
  clearGroup(three.issueGroup);
  if (!edit.on || !edit.review || !state.result) return;
  const iss = collectIssues(state.result);
  edit.issues = iss;
  const byId = new Map(state.result.placed.map(x=> [x.instanceId, x]));
  iss.byId.forEach((_, id)=>{
    const p = byId.get(id); if (!p) return;
    three.issueGroup.add(edgeBox(p, 0xff2d2d, 12));
  });
}

/* ---------- KHÍT LẠI: đóng các khe nhỏ (≤ dung sai) do chỉnh tay ----------
   Mỗi thùng: rơi xuống nếu hở ≤ dung sai, rồi trượt về phía vách kín / vách phải nếu khe tới thùng bên cạnh ≤ dung sai.
   Khe lớn hơn dung sai (cố ý chừa) giữ nguyên. Mode pallet: thùng khít trong từng pallet, pallet khít với nhau. */
function edCompact(tol){
  const r = state.result, pal = r.mode === 'pallet';
  pushUndo();
  let moved = 0;
  const steps = [['y', -1], ['x', -1], ['z', -1]];
  const lockedIds = r.mode === 'pallet' ? new Set() : lockedIdSet();
  const close = (boxes, setPos, lo)=>{
    for (let pass = 0; pass < 3; pass++){
      let any = false;
      for (const [ax, dir] of steps){
        boxes.slice().sort((a,b)=> a[ax] - b[ax]).forEach(b=>{
          if ((b._q && isUnitLocked(b._q.unitId)) || lockedIds.has(b.instanceId)) return;     // mục khóa đứng yên
          const d = Math.abs(snapDelta(b, boxes.filter(o=> o !== b), ax, dir, lo[ax], Infinity));
          if (d > 0.5 && d <= tol){ b[ax] -= d; setPos(b); moved++; any = true; }
        });
      }
      if (!any) break;
    }
  };
  if (pal){
    r.raw.units.forEach(u=>{
      if (!rawPlacement(u.id) || isUnitLocked(u.id)) return;
      const boxes = u.cartons.map(c=> ({ x: c.lx, y: c.ly, z: c.lz, sizeX: c.sx, sizeY: c.sy, sizeZ: c.sz, _c: c }));
      const before = moved;
      // trong pallet: chỉ mặt pallet (y = 0) là biên; theo x/z chỉ khít vào thùng khác (không kéo lệch cả lớp về mép)
      close(boxes, (b)=>{ b._c.lx = b.x; b._c.ly = b.y; b._c.lz = b.z; }, { x: -Infinity, y: 0, z: -Infinity });
      if (moved !== before) finalizeUnit(u, false);
    });
    const pb = r.raw.placements.map(q=> ({ x: q.x, y: q.y || 0, z: q.z, sizeX: q.sizeX, sizeY: q.sizeY, sizeZ: q.sizeZ, _q: q }));
    close(pb, (b)=>{ b._q.x = b.x; b._q.z = b.z; }, { x: 0, y: 0, z: 0 });
  } else {
    const boxes = r.raw.placed;
    close(boxes, ()=>{}, { x: 0, y: 0, z: 0 });
  }
  if (!moved){ edit.undo.pop(); showToast(`Không có khe nào ≤ ${tol} mm cần khít lại.`); return; }
  showToast(`Đã khít ${moved} bước dời (khe ≤ ${tol} mm).`);
  reprocessAfterEdit();
}

/* ---------- KHÓA (chỉnh tay): pallet (mode pallet) hoặc lớp hàng (bulk) ----------
   Mục đã khóa không dời/xoay/gỡ/đổi được; không gì được xếp vào hay chồng lên:
   pallet khóa → cả cột không gian trên mặt bằng pallet (tới trần) là vật cản; lớp bulk khóa → vùng của lớp đó
   (Right to left: cả lát cắt ngang tới trần; Floor to top: dải chiều cao của lớp). Lưu trong phương án (raw.locks). */
function locksOf(){
  const raw = state.result.raw;
  if (!raw.locks) raw.locks = { units: [], regions: [] };
  return raw.locks;
}
function isUnitLocked(id){ return !!(state.result && state.result.raw && state.result.raw.locks && state.result.raw.locks.units.includes(id)); }
function lockedIdSet(){
  const L = state.result.raw.locks; const set = new Set();
  if (L) L.regions.forEach(R=> R.ids.forEach(id=> set.add(id)));
  return set;
}
// Hộp vật cản do khóa (dùng khi dời / thêm / nhân bản thùng). Không dùng cho "rà lỗi" (không phải vùng cấm).
function lockedBoxes(){
  const r = state.result, L = r.raw && r.raw.locks; if (!L) return [];
  const c = r.container, out = [];
  if (r.mode === 'pallet') L.units.forEach(id=>{ const q = rawPlacement(id); if (q) out.push({ x: q.x, y: 0, z: q.z, sizeX: q.sizeX, sizeY: c.H, sizeZ: q.sizeZ, _lock: id }); });
  else L.regions.forEach(R=> out.push(Object.assign({ _lock: R.key }, R.box)));
  return out;
}
// true (và báo) nếu thao tác đụng mục đã khóa
function blockedByLock(what){
  showToast(`${what} đang KHÓA — mở khóa trước khi chỉnh.`, true); return true;
}
function guardUnits(ids){ const hit = ids.find(isUnitLocked); return hit ? blockedByLock(`Pallet #${(state.result.pallets.find(p=> p.unit.id === hit) || {}).no || '?'}`) : false; }
function guardBulk(list){ const set = lockedIdSet(); return list.some(p=> set.has(p.instanceId)) ? blockedByLock('Lớp hàng') : false; }
function edToggleLockPallet(id){
  const L = locksOf(), i = L.units.indexOf(id);
  pushUndo();
