  if (i >= 0) L.units.splice(i, 1); else L.units.push(id);
  reprocessAfterEdit(0);
}
function edToggleLockLayer(p){
  const r = state.result, L = locksOf(), set = lockedIdSet();
  pushUndo();
  if (set.has(p.instanceId)){ L.regions = L.regions.filter(R=> !R.ids.includes(p.instanceId)); reprocessAfterEdit(0); return; }
  const li = bulkLayerOf(p); if (li < 0){ edit.undo.pop(); return; }
  const Ly = r.layers[li], B = bulkLayerBounds(Ly), c = r.container;
  let box;
  if (B.ax === 'x') box = { x: B.lo, y: 0, z: 0, sizeX: B.hi - B.lo, sizeY: c.H, sizeZ: c.W };
  else {
    const x0 = Math.min(...Ly.items.map(q=> q.x)), x1 = Math.max(...Ly.items.map(q=> q.x + q.sizeX));
    const z0 = Math.min(...Ly.items.map(q=> q.z)), z1 = Math.max(...Ly.items.map(q=> q.z + q.sizeZ));
    box = { x: x0, y: B.lo, z: z0, sizeX: x1 - x0, sizeY: B.hi - B.lo, sizeZ: z1 - z0 };
  }
  L.regions.push({ key: 'L' + Date.now().toString(36), label: `Lớp ${li + 1}`, axis: B.ax, box, ids: Ly.items.map(q=> q.instanceId) });
  reprocessAfterEdit(0);
}
function drawLockMarkers(){
  if (!three.scene) return;
  if (!three.lockGroup){ three.lockGroup = new THREE.Group(); three.scene.add(three.lockGroup); }
  clearGroup(three.lockGroup);
  if (!edit.on || !state.result || !state.result.raw) return;
  const r = state.result;
  const add = (b)=> three.lockGroup.add(edgeBox(b, 0x3fd0ff, 16));
  const L = r.raw.locks; if (!L) return;
  if (r.mode === 'pallet') L.units.forEach(id=>{ const q = rawPlacement(id); if (q) add({ x: q.x, y: q.y || 0, z: q.z, sizeX: q.sizeX, sizeY: q.sizeY, sizeZ: q.sizeZ }); });
  else L.regions.forEach(R=>{
    const its = r.placed.filter(p=> R.ids.includes(p.instanceId)); if (!its.length) return;
    const x0 = Math.min(...its.map(p=> p.x)), y0 = Math.min(...its.map(p=> p.y)), z0 = Math.min(...its.map(p=> p.z));
    add({ x: x0, y: y0, z: z0, sizeX: Math.max(...its.map(p=> p.x + p.sizeX)) - x0, sizeY: Math.max(...its.map(p=> p.y + p.sizeY)) - y0, sizeZ: Math.max(...its.map(p=> p.z + p.sizeZ)) - z0 });
  });
}

/* ---------- Lớp bulk: vùng không gian & chặn phần ngoài lớp ----------
   Right to left: lớp = lát cắt ngang (khoảng x, đủ rộng × cao). Floor to top: lớp = dải ngang (khoảng y, toàn sàn). */
function bulkLayerOf(p){ return (state.result.layers || []).findIndex(L=> L.items.includes(p)); }
function bulkLayerBounds(L){
  const c = state.result.container, ax = L.axis, sz = ax === 'x' ? 'sizeX' : 'sizeY';
  const lo = L.base, hi = Math.max(...L.items.map(p=> p[ax] + p[sz]));
  const full = { x: 0, y: 0, z: 0, sizeX: c.L, sizeY: c.H, sizeZ: c.W };
  const outside = (ax === 'x'
    ? [Object.assign({}, full, { sizeX: lo }), Object.assign({}, full, { x: hi, sizeX: c.L - hi })]
    : [Object.assign({}, full, { sizeY: lo }), Object.assign({}, full, { y: hi, sizeY: c.H - hi })]).filter(b=> b.sizeX > 0.5 && b.sizeY > 0.5);
  return { ax, lo, hi, outside, seed: ax === 'x' ? { x: lo, y: 0, z: 0 } : { x: 0, y: lo, z: 0 } };
}
const toZone = (b)=> ({ x: b.x, y: b.y, z: b.z, dx: b.sizeX, dy: b.sizeY, dz: b.sizeZ });

/* ---------- Thêm thùng còn thiếu ---------- */
// Lấy n thùng của SKU từ phần "ngoài cont" (danh sách dư, rồi pallet không vào cont) — để số liệu khớp.
function drawFromOutside(skuId, n){
  const raw = state.result.raw;
  let left = n;
  if (raw.leftover){ for (let i = raw.leftover.length - 1; i >= 0 && left > 0; i--) if (raw.leftover[i].skuId === skuId){ raw.leftover.splice(i, 1); left--; } }
  if (raw.unplaced){ for (let i = raw.unplaced.length - 1; i >= 0 && left > 0; i--) if (raw.unplaced[i].skuId === skuId){ raw.unplaced.splice(i, 1); left--; } }
  if (left > 0 && raw.unplacedUnitIds){
    for (const id of raw.unplacedUnitIds.slice()){
      const u = rawUnit(id); if (!u) continue;
      const cs = u.cartons.filter(c=> c.skuId === skuId).sort((a,b)=> b.ly - a.ly);
      for (const c of cs){ if (left <= 0) break; u.cartons.splice(u.cartons.indexOf(c), 1); left--; }
      if (!u.cartons.length){ raw.units = raw.units.filter(x=> x !== u); raw.unplacedUnitIds = raw.unplacedUnitIds.filter(x=> x !== id); }
      else finalizeUnit(u, false);
      if (left <= 0) break;
    }
  }
  return n - left;   // số thùng thực sự lấy từ phần còn thiếu (phần vượt = thêm quá số yêu cầu)
}
function missingBySku(){
  const r = state.result;
  return (r.ctxSkus || []).map(k=>{ const b = r.breakdown.find(x=> x.skuId === k.id); return { sku: k, missing: b ? Math.max(0, b.requested - b.placed) : k.qty }; });
}
/* ---------- ĐỒNG NHẤT PALLET: pallet cùng loại pallet, cùng dãy lớp (cao lớp + số thùng mỗi SKU trong lớp) nhưng
   khác cách xoay/xếp → chép cách xếp của pallet "mẫu" (cách xếp phổ biến nhất trong nhóm) sang các pallet còn lại.
   Số thùng từng SKU trên mỗi pallet giữ nguyên (vì từng lớp có cùng số thùng mỗi SKU). Pallet kiểm hóa không đụng tới. */
function palletEquivalenceGroups(){
  const r = state.result; const classes = {};
  const posSig = (u)=> u.cartons.map(c=> [c.skuId, Math.round((c.lx - u.deckX) / 5), Math.round(c.ly / 5), Math.round((c.lz - u.deckZ) / 5),
                                          Math.round(c.sx), Math.round(c.sy), Math.round(c.sz)].join(',')).sort().join(';');
  r.pallets.forEach(pl=>{
    if (pl.kind === 'customs' || isUnitLocked(pl.unit.id)) return;
    const u = rawUnit(pl.unit.id); if (!u) return;
    const L = unitLayerList(u).filter(l=> l.cartons.length);
    const key = u.ptypeId + '|' + L.map(l=>{ const cnt = {}; l.cartons.forEach(c=> cnt[c.skuId] = (cnt[c.skuId] || 0) + 1);
      return Math.round(l.h) + ':' + Object.keys(cnt).sort().map(k=> k + '=' + cnt[k]).join(','); }).join('#');
    (classes[key] = classes[key] || []).push({ pl, u, pos: posSig(u) });
  });
  return Object.values(classes).filter(g=> g.length > 1 && new Set(g.map(x=> x.pos)).size > 1);
}
function edUnifyPallets(){
  const groups = palletEquivalenceGroups();
  if (!groups.length){ showToast('Không có nhóm pallet nào cùng số lớp & số thùng mà khác cách xếp — không cần đồng nhất.'); return; }
  pushUndo();
  const done = [];
  groups.forEach(g=>{
    const freq = {}; g.forEach(x=> freq[x.pos] = (freq[x.pos] || 0) + 1);
    const ref = g.slice().sort((a,b)=> (freq[b.pos] - freq[a.pos]) || (a.pl.no - b.pl.no))[0];
    const changed = [];
    g.forEach(x=>{
      if (x.pos === ref.pos) return;
      x.u.cartons = ref.u.cartons.map(c=> Object.assign({}, c, { lx: c.lx - ref.u.deckX + x.u.deckX, lz: c.lz - ref.u.deckZ + x.u.deckZ,
        cid: x.u.id + ':u' + Math.random().toString(36).slice(2, 8) }));
      finalizeUnit(x.u, false); changed.push('#' + x.pl.no);
    });
    done.push(`${changed.join(', ')} theo mẫu #${ref.pl.no}`);
  });
  showToast('Đã đồng nhất cách xếp: ' + done.join('; ') + '.');
  reprocessAfterEdit();
}

/* ---------- CĂN VỊ TRÍ PALLET trong cont ----------
   Chia pallet trên sàn thành các HÀNG theo chiều dài cont (tính từ vách kín).
   Chiều dài: "dàn đều" = hàng đầu sát vách kín, hàng cuối sát cửa, khe giữa các hàng bằng nhau;
              "khe cố định" = xếp từ vách kín, mỗi hàng cách nhau đúng X mm (phần dư dồn ra cửa).
   Chiều rộng (hàng ≥ 2 pallet): "sát 2 vách" = pallet ngoài cùng sát vách, khe giữa đều nhau;
              "khe cố định" = các pallet cách nhau X mm, cả cụm nằm giữa cont. Hàng 1 pallet: giữ bên đang đứng, ép sát vách đó.
   Pallet chồng tầng 2 đi theo pallet bên dưới. */
function edArrangePallets(){
  const r = state.result, c = r.container, raw = r.raw, A = edit.arrange;
  if (raw.locks && raw.locks.units.length){ showToast('Có pallet đang khóa — "Căn vị trí" sẽ dời toàn bộ hàng pallet. Mở khóa trước khi căn.', true); return; }
  const base = raw.placements.filter(q=> (q.y || 0) < 1);
  if (!base.length) return;
  const on = (a, q)=> Math.min(a.x + a.sizeX, q.x + q.sizeX) - Math.max(a.x, q.x) > 1 && Math.min(a.z + a.sizeZ, q.z + q.sizeZ) - Math.max(a.z, q.z) > 1;
  const riders = new Map(base.map(q=> [q, raw.placements.filter(a=> (a.y || 0) >= 1 && on(a, q))]));
  const rows = [];
  base.slice().sort((a,b)=> a.x - b.x).forEach(q=>{
    const cx = q.x + q.sizeX / 2;
    const R = rows.find(R=> cx >= R.x0 && cx <= R.x1);
    if (R){ R.items.push(q); R.x0 = Math.min(R.x0, q.x); R.x1 = Math.max(R.x1, q.x + q.sizeX); }
    else rows.push({ x0: q.x, x1: q.x + q.sizeX, items: [q] });
  });
  rows.sort((a,b)=> a.x0 - b.x0);
  const lens = rows.map(R=> Math.max(...R.items.map(q=> q.sizeX)));
  const sumL = lens.reduce((a,b)=> a + b, 0);
  let gapL = A.lenMode === 'even' ? (rows.length > 1 ? Math.max(0, (c.L - sumL) / (rows.length - 1)) : 0) : Math.max(0, A.lenGap || 0);
  if (sumL + gapL * (rows.length - 1) > c.L + 0.5){
    showToast(`Không đủ chiều dài: ${rows.length} hàng pallet (${fmtInt(sumL)} mm) + khe ${fmtInt(gapL)} mm vượt ${fmtInt(c.L)} mm.`, true); return;
  }
  const moves = new Map();
  let x = 0, widthWarn = 0;
  rows.forEach((R, i)=>{
    const its = R.items.slice().sort((a,b)=> a.z - b.z);
    const sumW = its.reduce((t,q)=> t + q.sizeZ, 0);
    let zs;
    if (its.length >= 2){
      const g = A.widMode === 'walls' ? Math.max(0, (c.W - sumW) / (its.length - 1)) : Math.max(0, A.widGap || 0);
      let z = A.widMode === 'walls' ? 0 : Math.max(0, (c.W - (sumW + g * (its.length - 1))) / 2);
      if (sumW + g * (its.length - 1) > c.W + 0.5) widthWarn++;
      zs = its.map(q=>{ const v = z; z += q.sizeZ + g; return v; });
    } else {
      const q = its[0];
      zs = [q.z + q.sizeZ / 2 < c.W / 2 ? 0 : c.W - q.sizeZ];
    }
    its.forEach((q, k)=> moves.set(q, { dx: x - q.x, dz: zs[k] - q.z }));
    x += lens[i] + gapL;
  });
  pushUndo();
  moves.forEach((m, q)=>{ riders.get(q).forEach(a=>{ a.x += m.dx; a.z += m.dz; }); q.x += m.dx; q.z += m.dz; });
  showToast(`Đã căn ${base.length} pallet thành ${rows.length} hàng` + (A.lenMode === 'even' ? `, khe giữa các hàng ≈ ${fmtInt(gapL)} mm.` : `, khe ${fmtInt(gapL)} mm (dư ${fmtInt(c.L - sumL - gapL * (rows.length - 1))} mm phía cửa).`) +
            (widthWarn ? ` ⚠ ${widthWarn} hàng không đủ bề ngang với khe đã chọn.` : ''), !!widthWarn);
  reprocessAfterEdit();
}

/* ---------- NHÂN BẢN (Ctrl+D): lấy thêm thùng CÙNG SKU, CÙNG HƯỚNG với thùng đang chọn ----------
   Chỉ lấy trong số còn thiếu của từng SKU (rút từ phần "ngoài cont" → số liệu luôn khớp). Chọn nhiều thùng thì nhân bản
   cả nhóm, giữ nguyên sắp xếp tương đối. Bản sao đặt sát cạnh nhóm gốc ở chỗ trống đầu tiên (ra cửa → vào trong →
   trái → phải → lên trên); không có chỗ thì đặt tạm trên đỉnh để anh dời tiếp. Bản sao được chọn sẵn. */
function edDuplicate(){
  const r = state.result, pal = r.mode === 'pallet', c = r.container;
  if (pal && edit.selKind !== 'carton'){ if (edit.sel) edDuplicatePallet(1); else showToast('Chọn 1 pallet (nhân bản pallet) hoặc chuyển "Từng thùng" để lấy thêm thùng (Ctrl+D).', true); return; }
  // nhóm gốc ở tọa độ cont
  const src = pal ? (()=>{ const ids = new Set(groupIds()); return r.placed.filter(p=> ids.has(p.instanceId) && !p.isPalletBase); })() : bulkSelected();
  if (!src.length){ showToast('Chọn thùng cần nhân bản trước (Ctrl+D).', true); return; }
  // giới hạn theo số còn thiếu của từng SKU
  const quota = {}; missingBySku().forEach(m=> quota[m.sku.id] = m.missing);
  const pick = src.filter(p=> quota[p.skuId] > 0 && quota[p.skuId]-- > 0);
  if (!pick.length){ showToast('Các SKU đang chọn đã đủ số lượng yêu cầu — không còn thùng thiếu để lấy thêm.', true); return; }
  if (pal && guardUnits(pick.map(p=> p.unitId))) return;
  // khung nhóm & chỗ đặt bản sao
  const b = { x0: Math.min(...pick.map(p=> p.x)), y0: Math.min(...pick.map(p=> p.y)), z0: Math.min(...pick.map(p=> p.z)),
              x1: Math.max(...pick.map(p=> p.x + p.sizeX)), y1: Math.max(...pick.map(p=> p.y + p.sizeY)), z1: Math.max(...pick.map(p=> p.z + p.sizeZ)) };
  const obstacles = r.placed.concat(zoneBoxes(), lockedBoxes());
  const ov = (a, o)=> Math.min(a.x + a.sizeX, o.x + o.sizeX) - Math.max(a.x, o.x) > 0.5 && Math.min(a.y + a.sizeY, o.y + o.sizeY) - Math.max(a.y, o.y) > 0.5 && Math.min(a.z + a.sizeZ, o.z + o.sizeZ) - Math.max(a.z, o.z) > 0.5;
  const fits = (dx, dy, dz)=> pick.every(p=>{
    const q = { x: p.x + dx, y: p.y + dy, z: p.z + dz, sizeX: p.sizeX, sizeY: p.sizeY, sizeZ: p.sizeZ };
    return q.x >= -0.5 && q.y >= -0.5 && q.z >= -0.5 && q.x + q.sizeX <= c.L + 0.5 && q.y + q.sizeY <= c.H + 0.5 && q.z + q.sizeZ <= c.W + 0.5 && !obstacles.some(o=> ov(q, o));
  });
  const W = b.x1 - b.x0, D = b.z1 - b.z0, H = b.y1 - b.y0;
  // Bulk: ưu tiên ở LẠI LỚP HIỆN TẠI — (1) sát cạnh nhóm trong lớp; (2) chỗ trống bất kỳ trong lớp (giữ đúng hướng thùng);
  // (3) mới sang lớp kế. Pallet: sát cạnh theo 4 phía rồi lên trên.
  const layerIdx = pal ? -1 : bulkLayerOf(pick[0]);
  const L = layerIdx >= 0 ? r.layers[layerIdx] : null;
  const sameLayer = !L ? [] : L.axis === 'x' ? [[0, 0, D], [0, 0, -D], [0, H, 0]] : [[W, 0, 0], [-W, 0, 0], [0, 0, D], [0, 0, -D]];
  const crossLayer = pal ? [[W, 0, 0], [-W, 0, 0], [0, 0, D], [0, 0, -D], [0, H, 0]]
                         : L && L.axis === 'x' ? [[W, 0, 0], [-W, 0, 0]] : [[0, H, 0]];
  let off = sameLayer.find(([dx, dy, dz])=> fits(dx, dy, dz));
  let scattered = null;
  if (!off && L){
    // tìm chỗ trống trong lớp cho từng thùng (cùng hướng với thùng gốc), mức thấp nhất trước
    const B = bulkLayerBounds(L);
    const zones = (r.zones || []).concat(lockedBoxes().map(toZone), B.outside.map(toZone));
    const eps = [B.seed]; r.raw.placed.forEach(p=> eps.push(...generateExtremePointsFromPlacement(p, c)));
    const items = pick.map((p, i)=> Object.assign(looseItemFor(ctxSku(p.skuId), 'dup' + Date.now().toString(36) + i, null),
      { orientations: [{ d: p.sizeX, w: p.sizeY, h: p.sizeZ, code: p.orientCode }] }));
    const res = packContainer(items, c, zones, { supportThreshold: r.settings.supportThreshold || 70, loadingDirection: 'floor_to_top',
      seedPlaced: r.raw.placed, seedExtremePoints: eps.slice(0, 6000) });
    if (res.placed.length === pick.length) scattered = res.placed;
  }
  if (!off && !scattered) off = crossLayer.find(([dx, dy, dz])=> fits(dx, dy, dz));
  let temp = false;
  if (!off && !scattered){
    // đặt tạm ngay trên mọi thứ đang nằm trong khung nhóm (không chồng lấn) — có thể vượt chiều cao cho phép, sẽ có cảnh báo
    const top = r.placed.filter(o=> Math.min(b.x1, o.x + o.sizeX) - Math.max(b.x0, o.x) > 0.5 && Math.min(b.z1, o.z + o.sizeZ) - Math.max(b.z0, o.z) > 0.5)
                        .reduce((m, o)=> Math.max(m, o.y + o.sizeY), 0);
    off = [0, top - b.y0, 0]; temp = true;
  }
  const [dx, dy, dz] = off || [0, 0, 0];
  pushUndo();
  const newIds = [];
  if (pal){
    const units = new Set();
    pick.forEach(p=>{
      const ref = cartonRef(p.instanceId); if (!ref || !ref.q) return;
      const w = { x: p.x + dx, z: p.z + dz, sizeX: p.sizeX, sizeZ: p.sizeZ };
      const cid = ref.u.id + ':d' + Math.random().toString(36).slice(2, 8);
      ref.u.cartons.push(Object.assign({}, ref.c, worldToUnit(ref.u, ref.q, w),
        { ly: p.y + dy - (ref.q.y || 0) - ref.u.palletH, sy: ref.c.sy, cid }));
      units.add(ref.u); newIds.push(cid);
    });
    units.forEach(u=> finalizeUnit(u, false));
    reassignCartonOwners(newIds);       // bản sao đứng trên mặt pallet khác → thuộc pallet đó
    edit.selKind = 'carton';
  } else {
    pick.forEach((p, i)=>{
      const pos = scattered ? scattered[i] : { x: p.x + dx, y: p.y + dy, z: p.z + dz };
      const q = Object.assign({}, p, { x: pos.x, y: pos.y, z: pos.z, instanceId: 'dup' + Math.random().toString(36).slice(2, 9), tag: undefined });
      r.raw.placed.push(q); newIds.push(q.instanceId);
    });
  }
  const bySku = {}; pick.forEach(p=> bySku[p.skuId] = (bySku[p.skuId] || 0) + 1);
  Object.entries(bySku).forEach(([id, n])=> drawFromOutside(id, n));
  edit.multi = new Set(newIds); edit.sel = newIds[newIds.length - 1];
  const skipped = src.length - pick.length;
  showToast(`Đã lấy thêm ${pick.length} thùng` + (skipped ? ` (bỏ ${skipped} thùng vì SKU đã đủ số lượng)` : '') +
            (temp ? ' — không còn chỗ trống sát bên, đặt TẠM phía trên; dời tới chỗ đúng rồi kiểm tra cảnh báo.'
                  : scattered ? ` — đặt vào chỗ trống trong lớp ${layerIdx + 1}, đã chọn sẵn.`
                  : off && sameLayer.includes(off) ? ' — đặt sát cạnh trong cùng lớp, đã chọn sẵn.' : ' — lớp hiện tại hết chỗ, đặt sang lớp kế, đã chọn sẵn.'), temp);
  reprocessAfterEdit();
}

// Xếp thùng mới lên 1 pallet: tìm chỗ trống được đỡ (lấp khe trước, rồi lên trên) trong giới hạn cao & tải pallet.
// Xếp thùng mới lên 1 pallet. Thứ tự thử: (1) chỗ trống được đỡ ≥ ngưỡng trong giới hạn cao/tải; (2) chỗ trống bất kỳ
// không chồng lấn (bỏ ràng buộc đỡ/tải); (3) đặt tạm lên ĐỈNH pallet (giữa mặt pallet) để người dùng xoay/nằm/dời tiếp.
// Trả về danh sách cid thùng mới + số thùng phải dùng cách (2)/(3).
function addCartonsToUnit(u, sku, n){
  const r = state.result;
  const types = (r.settings.pallet && r.settings.pallet.types) || [];
  const t = types.find(x=> x.id === u.ptypeId) || {};
  const thr = r.settings.supportThreshold || 70;
  const hLim = (r.stats.hLimit || r.container.H) - u.palletH;
  const newIds = []; let relaxed = 0;
  const push = (p, how)=>{
    const cid = u.id + ':a' + Math.random().toString(36).slice(2, 8);
    u.cartons.push({ lx: p.x, ly: p.y, lz: p.z, sx: p.sizeX, sy: p.sizeY, sz: p.sizeZ, skuId: sku.id, weight: sku.weight,
      orientCode: p.orientCode, fragile: !!sku.fragile, cid });
    newIds.push(cid); if (how) relaxed++;
  };
  const tryPack = (cnt, support, H, payload)=>{
    const seeds = u.cartons.map((c, i)=> ({ x: c.lx, y: c.ly, z: c.lz, sizeX: c.sx, sizeY: c.sy, sizeZ: c.sz, skuId: c.skuId, weight: c.weight,
      fragile: false, instanceId: 'seed' + i, _loadOnTop: 0, _stackCountAbove: 0 }));
    const mini = { L: u.FL, W: u.FW, H };
    const eps = [{ x: u.deckX, y: 0, z: u.deckZ }];
    seeds.forEach(sd=> eps.push(...generateExtremePointsFromPlacement(sd, mini)));
    const items = Array.from({ length: cnt }, (_, i)=> looseItemFor(sku, 'add' + Date.now().toString(36) + i, null));
    return packContainer(items, mini, [], { supportThreshold: support, loadingDirection: 'floor_to_top', heavyBottomPriority: false,
      seedPlaced: seeds, seedExtremePoints: eps, payloadLimit: payload }).placed;
  };
  tryPack(n, thr, hLim, t.maxLoadKg > 0 ? t.maxLoadKg : null).forEach(p=> push(p, false));
  if (newIds.length < n) tryPack(n - newIds.length, 0, hLim, null).forEach(p=> push(p, true));
  while (newIds.length < n){
    // đặt tạm trên đỉnh, giữa mặt pallet (không chồng lấn — nằm trên mọi thùng hiện có)
    const top = u.cartons.reduce((m, c)=> Math.max(m, c.ly + c.sy), 0);
    const o = generateOrientations(sku)[0] || { d: sku.L, w: sku.H, h: sku.W, code: 'L' };
    push({ x: u.deckX + (u.palletL - o.d) / 2, y: top, z: u.deckZ + (u.palletW - o.h) / 2, sizeX: o.d, sizeY: o.w, sizeZ: o.h, orientCode: o.code }, true);
  }
  finalizeUnit(u, false);
  return { ids: newIds, relaxed };
}
function edAddToPallet(skuId, n, newPallet){
  const r = state.result, sku = ctxSku(skuId); if (!sku || n < 1) return;
  let u = null;
  pushUndo();
  if (newPallet){
    const types = (r.settings.pallet && r.settings.pallet.types) || [];
    const t = types.find(x=> x.id === sku.palletTypeId) || types.find(x=> x.id === r.settings.pallet.defaultTypeId) || types[0];
    u = { id: 'M' + Date.now().toString(36), kind: 'mixed', ptypeId: t.id, ptypeName: t.name, palletL: t.L, palletW: t.W, palletH: t.H, palletTare: t.weight || 0,
          deckX: 0, deckZ: 0, FL: t.L, FW: t.W, height: t.H, cargoWeight: 0, grossWeight: t.weight || 0, skuCounts: {}, cartons: [], layers: [] };
    r.raw.units.push(u);
  } else {
    const id = edit.selKind === 'carton' ? (cartonRef(edit.sel) || {}).u && cartonRef(edit.sel).u.id : edit.sel;
    u = id ? rawUnit(id) : null;
    if (u && isUnitLocked(u.id)){ edit.undo.pop(); guardUnits([u.id]); return; }
    if (!u){ edit.undo.pop(); showToast('Chọn 1 pallet (hoặc 1 thùng trên pallet) trước khi thêm.', true); return; }
  }
  const res = addCartonsToUnit(u, sku, n), got = res.ids.length;
  drawFromOutside(sku.id, got);
  if (!newPallet && got){ u.keepEmpty = false; resettleUnit(u); }
  if (newPallet){
    if (!edPlacePalletInternal(u.id)) showToast('Đã tạo pallet mới nhưng sàn cont hết chỗ → pallet nằm ở "Khay hàng chờ"; gỡ/dời pallet khác rồi bấm "Đặt vào chỗ trống".', true);
    edit.sel = u.id;
  }
  // chọn ngay thùng vừa thêm để xoay / nằm / đẩy sát tiếp
  if (!newPallet){ edit.selKind = 'carton'; edit.multi.clear(); edit.sel = res.ids[res.ids.length - 1]; }
  if (res.relaxed) showToast(`${res.relaxed}/${got} thùng ${sku.code || sku.id} được đặt TẠM (chưa đủ đỡ / ở đỉnh pallet) — đã chọn sẵn thùng cuối để anh xoay, nằm, đẩy sát cho khớp.`, true);
  reprocessAfterEdit();
}
// layerIdx (tùy chọn): chỉ tìm chỗ trong 1 lớp — trải ra theo MỨC THẤP NHẤT còn trống của lớp (lấp ngang hết bề rộng rồi mới
// lên cao), không dựng cột. Lớp hết chỗ thì báo và chỉ thêm số thùng vừa. Không chọn lớp: tìm khắp cont, hết chỗ thì đặt TẠM
// thành 1 hàng ngang phía trên (để dời tiếp), không chồng thành tháp.
function edAddBulk(skuId, n, layerIdx){
  const r = state.result, sku = ctxSku(skuId); if (!sku || n < 1) return;
  const placed = r.raw.placed, c = r.container;
  const inLayer = layerIdx != null && r.layers && r.layers[layerIdx];
  let zones = (r.zones || []).concat(lockedBoxes().map(toZone)), seed0 = { x: 0, y: 0, z: 0 };
  if (inLayer){
    const B = bulkLayerBounds(r.layers[layerIdx]);
    zones = zones.concat(B.outside.map(toZone)); seed0 = B.seed;
  }
  const pack = (cnt, support)=>{
    const eps = [seed0];
    placed.forEach(p=> eps.push(...generateExtremePointsFromPlacement(p, c)));
    placed.forEach(p=>{ p._loadOnTop = p._loadOnTop || 0; });
    const items = Array.from({ length: cnt }, (_, i)=> looseItemFor(sku, 'add' + Date.now().toString(36) + i, null));
    return packContainer(items, c, zones, { supportThreshold: support,
      loadingDirection: inLayer ? 'floor_to_top' : r.settings.loadingDirection,     // trong 1 lớp: mức thấp nhất trước → trải ngang
      seedPlaced: placed, seedExtremePoints: eps.slice(0, 6000) }).placed;
  };
  pushUndo();
  let added = pack(n, r.settings.supportThreshold || 70), relaxed = 0;
  added.forEach(p=> placed.push(p));
  if (added.length < n){ const more = pack(n - added.length, 0); more.forEach(p=> placed.push(p)); added = added.concat(more); relaxed += more.length; }
  if (inLayer && added.length < n){
    if (!added.length){ edit.undo.pop(); showToast(`Lớp ${layerIdx + 1} không còn chỗ trống cho thùng ${sku.code || sku.id} — chọn lớp khác hoặc "+ tự tìm chỗ".`, true); return; }
    showToast(`Lớp ${layerIdx + 1} chỉ còn chỗ cho ${added.length}/${n} thùng — đã thêm ${added.length}.`, true);
  }
  if (!inLayer && added.length < n){
    // đặt tạm thành 1 HÀNG NGANG trên đỉnh khối hàng gần thùng đang chọn (hoặc sát cửa) — không chồng thành cột
    const o = generateOrientations(sku)[0] || { d: sku.L, w: sku.H, h: sku.W, code: 'L' };
    const ref = bulkSelected()[0];
    const cnt = n - added.length, perRow = Math.max(1, Math.floor(c.W / o.h));
    const x0 = ref ? ref.x : Math.max(0, c.L - o.d * Math.ceil(cnt / perRow));
    const tmp = [];
    for (let i = 0; i < cnt; i++) tmp.push({ x: x0 + Math.floor(i / perRow) * o.d, z: (i % perRow) * o.h });
    const top = placed.filter(p=> tmp.some(t=> Math.min(t.x + o.d, p.x + p.sizeX) - Math.max(t.x, p.x) > 0.5 && Math.min(t.z + o.h, p.z + p.sizeZ) - Math.max(t.z, p.z) > 0.5))
                      .reduce((m, p)=> Math.max(m, p.y + p.sizeY), 0);
    tmp.forEach((t, i)=>{
      const p = { x: t.x, y: top, z: t.z, sizeX: o.d, sizeY: o.w, sizeZ: o.h, skuId: sku.id, weight: sku.weight, fragile: !!sku.fragile, orientCode: o.code,
                  instanceId: 'add' + Date.now().toString(36) + 't' + i, maxStackCount: sku.maxStackCount, maxStackLoad: sku.maxStackLoad };
      placed.push(p); added.push(p); relaxed++;
    });
  }
  added.forEach(p=> Object.assign(p, { skuCode: sku.code || sku.id, color: sku.color }));
  drawFromOutside(sku.id, added.length);
  edit.multi = new Set(added.map(p=> p.instanceId)); edit.sel = added[added.length - 1].instanceId;
  if (relaxed && !inLayer) showToast(`${relaxed}/${added.length} thùng được đặt TẠM (chưa đủ đỡ / phía trên khối hàng) — đã chọn sẵn để anh dời, xoay, đẩy sát cho khớp.`, true);
  reprocessAfterEdit();
}

function edRotatePallet(){
  const q = rawPlacement(edit.sel), u = rawUnit(edit.sel); if (!q || !u) return;
  if (guardUnits([u.id])) return;
  pushUndo();
  const cx = q.x + q.sizeX/2, cz = q.z + q.sizeZ/2;
  q.orientCode = q.orientCode === 'P90' ? 'P' : 'P90';
  q.sizeX = q.orientCode === 'P90' ? u.FW : u.FL; q.sizeZ = q.orientCode === 'P90' ? u.FL : u.FW;
  q.x = Math.max(0, cx - q.sizeX/2); q.z = Math.max(0, cz - q.sizeZ/2);
  reprocessAfterEdit();
}
function edSwapPallet(otherId){
  const a = rawPlacement(edit.sel), b = rawPlacement(otherId); if (!a || !b || a === b) return;
  if (guardUnits([edit.sel, otherId])) return;
  pushUndo();
  const ax = a.x, az = a.z; a.x = b.x; a.z = b.z; b.x = ax; b.z = az;
  reprocessAfterEdit();
}
function edRemovePallet(){
  const id = edit.sel; if (!rawPlacement(id)) return;
  if (guardUnits([id])) return;
  pushUndo();
  const u0 = rawUnit(id);
  if (u0 && !u0.cartons.length){      // pallet rỗng: xóa hẳn (không đưa ra khay)
    state.result.raw.placements = state.result.raw.placements.filter(q=> q.unitId !== id);
    state.result.raw.units = state.result.raw.units.filter(x=> x.id !== id);
    edit.sel = null; showToast('Đã xóa pallet rỗng.'); reprocessAfterEdit(); return;
  }
  state.result.raw.placements = state.result.raw.placements.filter(q=> q.unitId !== id);
  state.result.raw.unplacedUnitIds = (state.result.raw.unplacedUnitIds || []).concat([id]);
  edit.sel = null; reprocessAfterEdit();
}
// Đặt pallet (đang ở ngoài cont) vào chỗ trống đầu tiên trên sàn, tính từ vách kín
function edPlacePallet(id){
  pushUndo();
  if (edPlacePalletInternal(id)){ edit.sel = id; reprocessAfterEdit(); return; }
  edit.undo.pop();
  showToast('Không còn chỗ trống trên sàn cho pallet này — gỡ bớt pallet khác hoặc gỡ lớp ra khay.', true);
}
function edPlacePalletInternal(id){
  const u = rawUnit(id), c = state.result.container; if (!u) return false;
  const others = state.result.raw.placements;
  const zones = state.result.zones || [];
  const free = (x, z, sx, sz)=> x >= -0.5 && z >= -0.5 && x + sx <= c.L + 0.5 && z + sz <= c.W + 0.5 &&
    !others.some(q=> Math.min(x + sx, q.x + q.sizeX) - Math.max(x, q.x) > 0.5 && Math.min(z + sz, q.z + q.sizeZ) - Math.max(z, q.z) > 0.5) &&
    !zones.some(zn=> zn.y < u.height && Math.min(x + sx, zn.x + zn.dx) - Math.max(x, zn.x) > 0.5 && Math.min(z + sz, zn.z + zn.dz) - Math.max(z, zn.z) > 0.5);
  // (1) điểm mép: sát vách kín / sát đuôi pallet khác; sát vách hông / sát cạnh pallet khác — vị trí nhỏ nhất theo chiều dài
  let best = null;
  for (const rot of [false, true]){
    const sx = rot ? u.FW : u.FL, sz = rot ? u.FL : u.FW;
    const xs = [0].concat(others.map(q=> q.x + q.sizeX)), zs = [0, c.W - sz].concat(others.map(q=> q.z + q.sizeZ), others.map(q=> q.z - sz));
    for (const x of xs) for (const z of zs){
      if (!free(x, z, sx, sz)) continue;
      if (!best || x < best.x - 0.5 || (Math.abs(x - best.x) <= 0.5 && z < best.z)) best = { x, z, sx, sz, rot };
    }
  }
  if (best){
    state.result.raw.placements.push({ unitId: id, x: best.x, y: 0, z: best.z, sizeX: best.sx, sizeY: u.height, sizeZ: best.sz, orientCode: best.rot ? 'P90' : 'P' });
    state.result.raw.unplacedUnitIds = (state.result.raw.unplacedUnitIds || []).filter(x2=> x2 !== id);
    return true;
  }
  // (2) quét lưới 20 mm
  for (const rot of [false, true]){
    const sx = rot ? u.FW : u.FL, sz = rot ? u.FL : u.FW;
    for (let x = 0; x + sx <= c.L + 0.5; x += 20) for (let z = 0; z + sz <= c.W + 0.5; z += 20){
      const box = { x, z, sizeX: sx, sizeZ: sz };
      const hit = others.some(q=> Math.min(x + sx, q.x + q.sizeX) - Math.max(x, q.x) > 0.5 && Math.min(z + sz, q.z + q.sizeZ) - Math.max(z, q.z) > 0.5);
      const zh = zones.some(zn=> zn.y < u.height && Math.min(x + sx, zn.x + zn.dx) - Math.max(x, zn.x) > 0.5 && Math.min(z + sz, zn.z + zn.dz) - Math.max(z, zn.z) > 0.5);
      if (!hit && !zh){
        state.result.raw.placements.push({ unitId: id, x, y: 0, z, sizeX: sx, sizeY: u.height, sizeZ: sz, orientCode: rot ? 'P90' : 'P' });
        state.result.raw.unplacedUnitIds = (state.result.raw.unplacedUnitIds || []).filter(x2=> x2 !== id);
        return true;
      }
    }
  }
  // không còn chỗ: để pallet ở ngoài cont (khay)
  if (!(state.result.raw.unplacedUnitIds || []).includes(id)) state.result.raw.unplacedUnitIds = (state.result.raw.unplacedUnitIds || []).concat([id]);
  return false;
}
function edLayerMove(i, dir){
  const u = rawUnit(edit.sel); if (!u || guardUnits([u.id])) return;
  const L = unitLayerList(u), j = i + dir;
  if (j < 0 || j >= L.length) return;
  pushUndo(); const t = L[i]; L[i] = L[j]; L[j] = t; writeUnitLayers(u, L); reprocessAfterEdit();
}
function edLayerToTray(i){
  const u = rawUnit(edit.sel); if (!u || guardUnits([u.id])) return;
  const L = unitLayerList(u); const layer = L[i]; if (!layer) return;
  pushUndo();
  edit.tray.push({ kind: 'layer', h: layer.h, info: layer.info,
    cartons: layer.cartons.map(c=> Object.assign({}, c, { lx: c.lx - u.deckX, lz: c.lz - u.deckZ })), label: layerLabel(layer) });
  u.keepEmpty = true; L.splice(i, 1); writeUnitLayers(u, L); reprocessAfterEdit();
}
function edLayerToPallet(i, targetId){
  const u = rawUnit(edit.sel), t = rawUnit(targetId); if (!u || !t || u === t || guardUnits([u.id, t.id])) return;
  const L = unitLayerList(u); const layer = L[i]; if (!layer) return;
  pushUndo();
  u.keepEmpty = true; L.splice(i, 1); writeUnitLayers(u, L);
  const LT = unitLayerList(t);
  LT.push({ h: layer.h, info: layer.info, cartons: layer.cartons.map(c=> Object.assign({}, c, { lx: c.lx - u.deckX + t.deckX, lz: c.lz - u.deckZ + t.deckZ })) });
  t.keepEmpty = false; writeUnitLayers(t, LT); resettleUnit(t); reprocessAfterEdit();
}
function edTrayToPallet(k){
  const it = edit.tray[k], t = rawUnit(edit.sel);
  if (!it || !t){ showToast('Chọn 1 pallet trên sơ đồ trước, rồi bấm "Đặt lên pallet đang chọn".', true); return; }
  if (guardUnits([t.id])) return;
  pushUndo();
  const LT = unitLayerList(t);
  LT.push({ h: it.h, info: it.info, cartons: it.cartons.map(c=> Object.assign({}, c, { lx: c.lx + t.deckX, lz: c.lz + t.deckZ })) });
  t.keepEmpty = false; writeUnitLayers(t, LT); resettleUnit(t);
  edit.tray.splice(k, 1); reprocessAfterEdit();
}
/* ============================================================
   PALLET RỖNG · NHÂN BẢN · CHÉP LỚP · CHÉP CÁCH XẾP · LỚP THEO MẪU (chỉnh tay, mode pallet)
   Mọi thao tác thêm hàng chỉ lấy trong SỐ CÒN THIẾU của từng SKU → số lượng luôn khớp đơn hàng.
   ============================================================ */
// Pallet nở khung (thêm lớp chìa mép...) có thể lấn pallet bên cạnh / ra ngoài cont → dịch nhẹ (≤ 150 mm) cho hết lấn;
// không được thì chuyển sang chỗ trống đầu tiên. Trả về chuỗi mô tả (rỗng = không phải dời).
function resettleUnit(u){
  const r = state.result, q = rawPlacement(u.id), c = r.container; if (!q) return '';
  const others = r.raw.placements.filter(p=> p !== q);
  const bad = (x, z)=> x < -0.5 || z < -0.5 || x + q.sizeX > c.L + 0.5 || z + q.sizeZ > c.W + 0.5 ||
    others.some(p=> Math.min(x + q.sizeX, p.x + p.sizeX) - Math.max(x, p.x) > 0.5 && Math.min(z + q.sizeZ, p.z + p.sizeZ) - Math.max(z, p.z) > 0.5 &&
                    Math.min((q.y || 0) + q.sizeY, (p.y || 0) + p.sizeY) - Math.max(q.y || 0, p.y || 0) > 0.5);
  if (!bad(q.x, q.z)) return '';
  for (let d = 5; d <= 150; d += 5) for (const [dx, dz] of [[d,0],[-d,0],[0,d],[0,-d],[d,d],[d,-d],[-d,d],[-d,-d]]){
    if (!bad(q.x + dx, q.z + dz)){ q.x += dx; q.z += dz; return `dịch ${Math.round(Math.hypot(dx, dz))} mm cho khỏi lấn pallet bên cạnh`; }
  }
  if ((q.y || 0) > 1) return 'đang lấn pallet bên cạnh (pallet chồng tầng 2 — dời tay)';
  r.raw.placements = r.raw.placements.filter(p=> p !== q);
  if (edPlacePalletInternal(u.id)) return 'khung nở ra nên chuyển sang chỗ trống khác trong cont';
  r.raw.placements.push(q); return 'đang lấn pallet bên cạnh (không còn chỗ trống để dời)';
}
function newCid(uid){ return uid + ':' + Math.random().toString(36).slice(2, 9); }
function quotaMap(){ const q = {}; missingBySku().forEach(m=> q[m.sku.id] = m.missing); return q; }
function countsOf(cs){ const m = {}; cs.forEach(c=> m[c.skuId] = (m[c.skuId] || 0) + 1); return m; }
function fitsQuota(cnt, q){ return Object.entries(cnt).every(([id, n])=> (q[id] || 0) >= n); }
function takeQuota(cnt, q){ Object.entries(cnt).forEach(([id, n])=> q[id] = (q[id] || 0) - n); }
function palletTypes(){ const r = state.result; return (r.settings.pallet && r.settings.pallet.types) || state.pallet.types || []; }
function emptyUnitOf(t, id){
  return { id: id || ('M' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5)), kind: 'full', ptypeId: t.id, ptypeName: t.name,
           palletL: t.L, palletW: t.W, palletH: t.H, palletTare: t.weight || 0, deckX: 0, deckZ: 0, FL: t.L, FW: t.W, height: t.H,
           cargoWeight: 0, grossWeight: t.weight || 0, skuCounts: {}, cartons: [], layers: [], keepEmpty: true, pattern: 'manual', stability: 'ok', strapOk: true };
}
// Tạo pallet rỗng (loại pallet chọn được), đặt vào chỗ trống đầu tiên tính từ vách kín
function edNewEmptyPallet(typeId){
  const types = palletTypes(); const t = types.find(x=> x.id === typeId) || types[0];
  if (!t){ showToast('Chưa có loại pallet nào trong mục Pallet.', true); return; }
  pushUndo();
  const u = emptyUnitOf(t); state.result.raw.units.push(u);
  if (!edPlacePalletInternal(u.id)){
    state.result.raw.units.pop(); edit.undo.pop();
    showToast('Sàn cont hết chỗ cho pallet mới — gỡ/dời pallet khác trước.', true); return;
  }
  edit.selKind = 'pallet'; edit.sel = u.id; edit.multi.clear();
  showToast(`Đã tạo pallet rỗng ${t.name}. Thêm hàng: "＋ Lớp theo mẫu", "+ lên pallet đang chọn", hoặc chép lớp từ pallet khác.`);

}
// Gỡ HẾT hàng của pallet đang chọn ra khay (theo từng lớp, đặt lại được) — giữ pallet rỗng
function edClearPallet(){
  const u = rawUnit(edit.sel); if (!u || guardUnits([u.id])) return;
  const L = unitLayerList(u).filter(l=> l.cartons.length);
  if (!L.length){ showToast('Pallet đã rỗng.'); return; }
  pushUndo();
  L.forEach(layer=> edit.tray.push({ kind: 'layer', h: layer.h, info: layer.info,
    cartons: layer.cartons.map(c=> Object.assign({}, c, { lx: c.lx - u.deckX, lz: c.lz - u.deckZ })), label: layerLabel(layer) }));
  u.keepEmpty = true; writeUnitLayers(u, []);
  showToast(`Đã gỡ ${L.length} lớp ra khay — pallet giữ lại rỗng (hàng gỡ ra tính là còn thiếu).`);
  reprocessAfterEdit();
}
// Bản sao 1 lớp cho pallet đích: dời theo mặt pallet (deck) của 2 pallet, cid mới
function copyLayerFor(layer, src, dst){
  return { h: layer.h, info: Object.assign({}, layer.info),
    cartons: layer.cartons.map(c=> Object.assign({}, c, { lx: c.lx - src.deckX + dst.deckX, lz: c.lz - src.deckZ + dst.deckZ, cid: newCid(dst.id), tag: null })) };
}
// Nhân bản pallet đang chọn n lần (n = 0 → tối đa theo số còn thiếu & chỗ sàn). Thiếu hàng cho cả pallet → chép các lớp
// đủ hàng từ DƯỚI lên (dừng ở lớp đầu tiên không đủ). Hết chỗ sàn → dừng.
function edDuplicatePallet(n){
  const src = rawUnit(edit.selKind === 'carton' ? ((cartonRef(edit.sel) || {}).u || {}).id : edit.sel);
  if (!src){ showToast('Chọn 1 pallet làm mẫu trước.', true); return; }
  const L = unitLayerList(src).filter(l=> l.cartons.length);
  if (!L.length){ showToast('Pallet mẫu đang rỗng — thêm hàng trước khi nhân bản.', true); return; }
  const t = palletTypes().find(x=> x.id === src.ptypeId) || { id: src.ptypeId, name: src.ptypeName, L: src.palletL, W: src.palletW, H: src.palletH, weight: src.palletTare };
  const q = quotaMap(), want = n > 0 ? n : 999;
  pushUndo();
  let made = 0, partial = 0, floorFull = false;
  for (let k = 0; k < want; k++){
    const take = [];
    for (const layer of L){ const cnt = countsOf(layer.cartons); if (!fitsQuota(cnt, q)) break; takeQuota(cnt, q); take.push(layer); }
    if (!take.length) break;
    const u = emptyUnitOf(t); u.keepEmpty = false;
    state.result.raw.units.push(u);
    writeUnitLayers(u, take.map(l=> copyLayerFor(l, src, u)));
    if (!edPlacePalletInternal(u.id)){
      state.result.raw.units = state.result.raw.units.filter(x=> x !== u);
      state.result.raw.unplacedUnitIds = (state.result.raw.unplacedUnitIds || []).filter(x=> x !== u.id);
      floorFull = true; break;
    }
    Object.entries(countsOf(u.cartons)).forEach(([id, c])=> drawFromOutside(id, c));
    made++; if (take.length < L.length) partial++;
    if (take.length < L.length) break;      // đã hết hàng cho lớp kế → dừng
  }
  if (!made){ edit.undo.pop(); showToast(floorFull ? 'Sàn cont hết chỗ — không đặt thêm pallet được.' : 'Không còn hàng thiếu của các SKU trên pallet mẫu — không nhân bản được.', true); return; }
  showToast(`Đã nhân bản ${made} pallet theo mẫu` + (partial ? ` (pallet cuối chỉ đủ hàng cho một phần các lớp)` : '') +
            (floorFull ? ' — sàn cont hết chỗ.' : (n > 0 && made < n) ? ' — hết hàng còn thiếu.' : '.'), floorFull);
  reprocessAfterEdit();
}
// Chép các lớp idxs của pallet nguồn lên ĐỈNH pallet đích, lặp `times` lần (lấy trong số còn thiếu)
function edCopyLayers(idxs, targetId, times){
  const src = rawUnit(edit.sel), dst = rawUnit(targetId || edit.sel);
  if (!src || !dst){ showToast('Chọn pallet nguồn và pallet đích.', true); return; }
  if (guardUnits([dst.id])) return;
  const L = unitLayerList(src);
  const pick = idxs.map(i=> L[i]).filter(l=> l && l.cartons.length);
  if (!pick.length){ showToast('Tick chọn ít nhất 1 lớp có hàng để chép.', true); return; }
  const q = quotaMap(); const add = []; let stop = false;
  for (let t = 0; t < Math.max(1, times) && !stop; t++) for (const l of pick){
    const cnt = countsOf(l.cartons); if (!fitsQuota(cnt, q)){ stop = true; break; }
    takeQuota(cnt, q); add.push(l);
  }
  if (!add.length){ showToast('Không còn hàng thiếu cho các lớp đã chọn.', true); return; }
  pushUndo();
  const LT = unitLayerList(dst).filter(l=> l.cartons.length);
  add.forEach(l=> LT.push(copyLayerFor(l, src, dst)));
  dst.keepEmpty = false; writeUnitLayers(dst, LT);
  Object.entries(countsOf(add.flatMap(l=> l.cartons))).forEach(([id, c])=> drawFromOutside(id, c));
  const mv = resettleUnit(dst);
  const pl = state.result.pallets.find(p=> p.unit.id === dst.id);
  showToast(`Đã chép ${add.length} lớp lên pallet #${pl ? pl.no : '?'}` + (mv ? ` (pallet ${mv})` : '') + (stop ? ' — dừng vì hết hàng còn thiếu.' : '.'), stop);
  reprocessAfterEdit();
}
/* Chép CÁCH XẾP của pallet mẫu sang pallet khác: mỗi lớp của pallet đích tìm lớp của mẫu có CÙNG thành phần
   (SKU + cỡ thùng + cao, cùng số thùng) — ưu tiên lớp cùng số thứ tự, rồi cùng chẵn/lẻ (giữ nhịp xen kẽ) — rồi lấy vị trí
   từng thùng theo mẫu (tính từ mặt pallet). Lớp không có lớp mẫu tương ứng hoặc làm thiếu đỡ thì giữ nguyên.
   Chỉ áp cho pallet cùng kích thước mặt pallet; bỏ qua pallet đang khóa. */
function cartonKeyOf(c){ return c.skuId + '|' + Math.round(Math.min(c.sx, c.sz)) + 'x' + Math.round(Math.max(c.sx, c.sz)) + '|' + Math.round(c.sy); }
function layerKeyOf(cs){ const m = {}; cs.forEach(c=>{ const k = cartonKeyOf(c); m[k] = (m[k] || 0) + 1; }); return Object.keys(m).sort().map(k=> k + '=' + m[k]).join(';'); }
function copyLayoutInto(ref, u){
  if (ref === u || Math.abs(ref.palletL - u.palletL) > 1 || Math.abs(ref.palletW - u.palletW) > 1) return 0;
  const thr = ((state.result.settings && state.result.settings.supportThreshold) || 70) / 100 - 1e-6;
  const RL = unitLayerList(ref).filter(l=> l.cartons.length).map((l, j)=> ({ l, j, key: layerKeyOf(l.cartons) }));
  const L = unitLayerList(u).filter(l=> l.cartons.length);
  const out = []; let changed = 0;
  L.forEach((layer, i)=>{
    const key = layerKeyOf(layer.cartons), ms = RL.filter(x=> x.key === key);
    const prev = out[i - 1];
    const tryRef = (m)=>{
      const pool = {}; m.l.cartons.slice().sort((a,b)=> a.lx - b.lx || a.lz - b.lz).forEach(rc=> (pool[cartonKeyOf(rc)] = pool[cartonKeyOf(rc)] || []).push(rc));
      const cs = layer.cartons.slice().sort((a,b)=> a.lx - b.lx || a.lz - b.lz).map(c=>{
        const rc = pool[cartonKeyOf(c)].shift();
        return Object.assign({}, c, { lx: rc.lx - ref.deckX + u.deckX, lz: rc.lz - ref.deckZ + u.deckZ, ly: rc.ly, sx: rc.sx, sz: rc.sz, sy: rc.sy, orientCode: rc.orientCode });
      });
      const base = cs.filter(c=> c.ly < 1.5);
      if (prev && layerMinSupport(base, prev.cartons) < thr) return null;
      return { h: layer.h, info: layer.info, cartons: cs };
    };
    const order = ms.slice().sort((a,b)=> ((a.j !== i) - (b.j !== i)) || ((a.j % 2 !== i % 2) - (b.j % 2 !== i % 2)) || (a.j - b.j));
    let got = null;
    for (const m of order){ got = tryRef(m); if (got) break; }
    if (got){
      const moved = JSON.stringify(got.cartons.map(c=> [Math.round(c.lx), Math.round(c.lz), Math.round(c.sx)]).sort()) !==
                    JSON.stringify(layer.cartons.map(c=> [Math.round(c.lx), Math.round(c.lz), Math.round(c.sx)]).sort());
      if (moved) changed++;
      out.push(got);
    } else out.push(layer);
  });
  // lớp đã đổi phải vẫn đỡ được lớp ngay trên nó (lớp trên giữ nguyên) — không đạt thì trả lớp đó về như cũ
  for (let i = 0; i + 1 < out.length; i++){
    const up = out[i + 1].cartons.filter(c=> c.ly < 1.5);
    if (out[i] !== L[i] && layerMinSupport(up, out[i].cartons) < thr){ out[i] = L[i]; changed = Math.max(0, changed - 1); }
  }
  if (changed) writeUnitLayers(u, out);
  return changed;
}
function edCopyLayout(refId, scope){
  const r = state.result, ref = rawUnit(refId);
  if (!ref){ showToast('Chọn pallet mẫu.', true); return; }
  let targets;
  if (scope === 'all'){
    const keys = new Set(unitLayerList(ref).filter(l=> l.cartons.length).map(l=> layerKeyOf(l.cartons)));
    targets = r.raw.units.filter(u=> u !== ref && rawPlacement(u.id) && u.kind !== 'customs' && !isUnitLocked(u.id) &&
      unitLayerList(u).some(l=> l.cartons.length && keys.has(layerKeyOf(l.cartons))));
  } else {
    const u = rawUnit(edit.sel);
    if (!u || u === ref){ showToast('Chọn pallet cần sửa (khác pallet mẫu).', true); return; }
    if (guardUnits([u.id])) return;
    targets = [u];
  }
  pushUndo();
  let layers = 0, pals = 0;
  targets.forEach(u=>{ const n = copyLayoutInto(ref, u); if (n){ layers += n; pals++; resettleUnit(u); } });
  const refNo = (r.pallets.find(p=> p.unit.id === ref.id) || {}).no;
  if (!layers){ edit.undo.pop(); showToast(`Không lớp nào đổi: các lớp đã giống pallet #${refNo}, hoặc không có lớp mẫu cùng thành phần (cùng SKU, cỡ thùng, số thùng), hoặc khác cỡ mặt pallet.`, true); return; }
  showToast(`Đã chép cách xếp của pallet #${refNo} cho ${layers} lớp trên ${pals} pallet.`);
  reprocessAfterEdit();
}
// Thêm k LỚP theo MẪU LỚP TỐI ƯU của 1 SKU lên đỉnh pallet đang chọn (dùng đúng bộ tạo mẫu của thuật toán: guillotine /
// xen kẽ / chong chóng — lớp thứ i theo nhịp mẫu thứ i). Thiếu hàng → lớp cuối chỉ lấy số thùng còn thiếu (ưu tiên 4 góc).
function edAddPatternLayers(skuId, k){
  const r = state.result, c = r.container, sku = ctxSku(skuId), u = rawUnit(edit.sel);
  if (!sku || !u){ showToast('Chọn 1 pallet (có thể là pallet rỗng) trước.', true); return; }
  if (guardUnits([u.id])) return;
  const P = Object.assign({}, state.pallet, r.settings.pallet || {});
  const t = palletTypes().find(x=> x.id === u.ptypeId) || { id: u.ptypeId, name: u.ptypeName, L: u.palletL, W: u.palletW, H: u.palletH, weight: u.palletTare, overhang: 0 };
  const hLimit = Math.max(0, Math.min(c.H, (c.doorH || c.H) - (P.liftClearance || 0)));
  const oc = overhangCapForPallet(t, c);
  const pt = Object.assign({}, t, { _effMaxH: Math.min(t.maxHeight ? t.maxHeight : hLimit, hLimit), _ohEff: Math.min(t.overhang || 0, oc.cap), _ohCap: oc.cap });
  applyPalletTolerances(P);
  const thr = r.settings.supportThreshold || 70;
  const plan = planSkuPallet(sku, Object.assign({}, pt, { maxLoadKg: 0 }), P, thr);
  if (!plan || !plan.layers || !plan.layers.length){ showToast(`Không lập được mẫu lớp cho ${sku.code || sku.id} trên pallet này (thùng vượt khổ/cao?).`, true); return; }
  const q = quotaMap(); let left = q[sku.id] || 0;
  if (left <= 0){ showToast(`${sku.code || sku.id} đã đủ số lượng — không còn thùng thiếu.`, true); return; }
  pushUndo();
  const LT = unitLayerList(u).filter(l=> l.cartons.length);
  const period = Math.min(2, plan.layers.length);
  let added = 0, nl = 0;
  for (let j = 0; j < Math.max(1, k) && left > 0; j++){
    const lay = plan.layers[(LT.length) % period];
    const rects = pickLayerRects(lay, left);
    const cs = rects.map(rc=>{
      const o = lay.orients.find(o=> Math.abs(o.d - rc.w) < 1e-6 && Math.abs(o.h - rc.h) < 1e-6) || lay.orients[0];
      return { lx: rc.x - plan.oh + u.deckX, lz: rc.y - plan.oh + u.deckZ, ly: 0, sx: rc.w, sz: rc.h, sy: lay.hUp, skuId: sku.id, weight: sku.weight,
               orientCode: o.code, fragile: !!sku.fragile, tag: null, cid: newCid(u.id) };
    });
    LT.push({ h: lay.hUp, info: { full: rects.length === lay.count }, cartons: cs });
    left -= cs.length; added += cs.length; nl++;
  }
  u.keepEmpty = false; writeUnitLayers(u, LT);
  drawFromOutside(sku.id, added);
  const mv = resettleUnit(u);
  const over = u.height > hLimit + 0.5;
  showToast(`Đã thêm ${nl} lớp ${sku.code || sku.id} (${added} thùng, mẫu ${plan.layers[0].count} thùng/lớp)` +
            (mv ? ` — pallet ${mv}` : '') + (over ? ` — ⚠ pallet cao ${fmtInt(u.height)} mm > giới hạn qua cửa ${fmtInt(hLimit)} mm.` : '.'), over);
  reprocessAfterEdit();
}

function layerLabel(L){
  const cnt = {}; L.cartons.forEach(c=> cnt[c.skuId] = (cnt[c.skuId] || 0) + 1);
  const code = (id)=> ((state.result.ctxSkus || []).find(k=> k.id === id) || {}).code || id;
  return Object.entries(cnt).map(([id,n])=> `${code(id)}×${n}`).join(' + ') + ` · cao ${fmtInt(L.h)}`;
}

/* ---------- Thao tác mức THÙNG (bulk) ---------- */
function bulkSelected(){
  const raw = state.result.raw.placed;
  if (edit.multi && edit.multi.size) return raw.filter(p=> edit.multi.has(p.instanceId));
  const one = raw.find(p=> p.instanceId === edit.sel);
  return one ? [one] : [];
}
// Xoay 90° CẢ NHÓM quanh tâm khung nhóm (mặt bằng): vị trí từng thùng xoay theo, mỗi thùng đổi dọc↔ngang.
// boxes: [{x, z, sx, sz, set(x, z, sx, sz)}]
// Lật đối xứng CẢ NHÓM quanh trục giữa khung nhóm. axis 'x' = lật trái↔phải theo chiều dọc, 'z' = theo chiều ngang.
// Dùng khi xoay 90° không đổi gì (mẫu pinwheel đối xứng xoay) — lật cho ra mẫu chiều quay ngược để xen kẽ với lớp dưới.
function mirrorGroup(boxes, axis){
  let lo = Infinity, hi = -Infinity;
  boxes.forEach(b=>{ const p = axis === 'x' ? b.x : b.z, s2 = axis === 'x' ? b.sx : b.sz; lo = Math.min(lo, p); hi = Math.max(hi, p + s2); });
  boxes.forEach(b=>{ if (axis === 'x') b.set(lo + hi - b.x - b.sx, b.z, b.sx, b.sz); else b.set(b.x, lo + hi - b.z - b.sz, b.sx, b.sz); });
}
function rotateGroup90(boxes){
  let x0 = Infinity, z0 = Infinity, x1 = -Infinity, z1 = -Infinity;
  boxes.forEach(b=>{ x0 = Math.min(x0, b.x); z0 = Math.min(z0, b.z); x1 = Math.max(x1, b.x + b.sx); z1 = Math.max(z1, b.z + b.sz); });
  const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
  boxes.forEach(b=> b.set(cx - (b.z + b.sz - cz), cz + (b.x - cx), b.sz, b.sx));
}
// Xoay ngang (đổi dọc↔ngang) hoặc đổi hướng nằm/đứng (lần lượt qua 6 hướng của thùng)
function edRotateCartons(layDown){
  const sel = bulkSelected(); if (!sel.length || guardBulk(sel)) return;
  pushUndo();
  if (!layDown && sel.length > 1){
    rotateGroup90(sel.map(p=> ({ x: p.x, z: p.z, sx: p.sizeX, sz: p.sizeZ, set: (x, z, sx, sz)=>{ p.x = x; p.z = z; p.sizeX = sx; p.sizeZ = sz; } })));
  } else sel.forEach(p=>{
    const sku = ctxSku(p.skuId);
    if (layDown && sku){ const d = orientCycle(sku, [p.sizeX, p.sizeY, p.sizeZ]); p.sizeX = d[0]; p.sizeY = d[1]; p.sizeZ = d[2]; }
    else { const t = p.sizeX; p.sizeX = p.sizeZ; p.sizeZ = t; }
  });
  sel.forEach(p=> p.orientCode = 'M' + Math.round(p.sizeX) + 'x' + Math.round(p.sizeY) + 'x' + Math.round(p.sizeZ));
  reprocessAfterEdit();
}
function edCartonsToTray(){
  const sel = bulkSelected(); if (!sel.length || guardBulk(sel)) return;
  pushUndo();
  const ids = new Set(sel.map(p=> p.instanceId));
  state.result.raw.placed = state.result.raw.placed.filter(p=> !ids.has(p.instanceId));
  state.result.raw.unplaced = (state.result.raw.unplaced || []).concat(sel.map(p=> ({ skuId: p.skuId, skuCode: p.skuCode, instanceId: p.instanceId, weight: p.weight })));
  edit.tray.push({ kind: 'cartons', list: JSON.parse(JSON.stringify(sel)), label: `${sel.length} thùng ${sel[0].skuCode}${sel.length > 1 ? ' (nhóm)' : ''}` });
  edit.sel = null; edit.multi.clear(); reprocessAfterEdit();
}
function edTrayRestore(k){
  const it = edit.tray[k]; if (!it || it.kind !== 'cartons') return;
  pushUndo();
  const ids = new Set(it.list.map(p=> p.instanceId));
  state.result.raw.placed = state.result.raw.placed.concat(it.list);
  state.result.raw.unplaced = (state.result.raw.unplaced || []).filter(u=> !ids.has(u.instanceId));
  edit.tray.splice(k, 1); reprocessAfterEdit();
}

/* ---------- Chọn trên 3D + tô sáng ---------- */
function selectionKeyOf(p){
  if (!p) return null;
  if (state.result.mode !== 'pallet') return p.instanceId;
  if (edit.selKind === 'carton') return p.isPalletBase ? null : p.instanceId;
  return p.unitId || String(p.instanceId).split(/[:_]/)[0];
}
function highlightSelection(){
  if (!three.boxesGroup) return;
  let sel = new Set();
  if (edit.on && edit.sel && state.result){
    if (state.result.mode === 'pallet') sel = edit.selKind === 'carton' ? new Set(groupIds())
      : new Set(state.result.placed.filter(p=> (p.unitId || String(p.instanceId).split(/[:_]/)[0]) === edit.sel).map(p=> p.instanceId));
    else sel = new Set(bulkSelected().map(p=> p.instanceId));
  }
  drawIssueMarkers();
  drawLockMarkers();
  const bad = edit.on && edit.review && edit.issues ? edit.issues.byId : null;
  three.boxesGroup.children.forEach(m=>{
    if (!m.isMesh || m.userData.mc == null) return;
    const id = m.userData.placement && m.userData.placement.instanceId;
    // vật liệu dùng chung → đổi sang vật liệu "đã tô sáng" (lưu đệm) thay vì sửa vật liệu chung
    m.material = cachedMat('mesh', m.userData.mc, m.userData.mo, sel.has(id) ? 0x8a5a00 : (bad && bad.has(id) ? 0x7a0000 : 0));
  });
}
function bindEditPicking(){
  const dom = three.renderer && three.renderer.domElement;
  if (!dom || dom._editBound) return;
  dom._editBound = true;
  let down = null;
  dom.addEventListener('pointerdown', e=>{ down = { x: e.clientX, y: e.clientY }; });
  dom.addEventListener('pointerup', e=>{
    if (!edit.on || !down || !state.result) return;
    if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) return;   // đang xoay camera, không phải bấm chọn
    const rect = dom.getBoundingClientRect();
    const mouse = new THREE.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
    const ray = new THREE.Raycaster(); ray.setFromCamera(mouse, three.camera);
    const hit = ray.intersectObjects(three.boxesGroup.children.filter(o=> o.isMesh), false)[0];   // bỏ qua nhãn số pallet
    const key = hit ? selectionKeyOf(hit.object.userData.placement) : null;
    const multiOk = state.result.mode !== 'pallet' || edit.selKind === 'carton';
    if (multiOk && (e.ctrlKey || e.shiftKey || e.metaKey) && key){
      // Ctrl/Shift + bấm: thêm / bỏ thùng khỏi nhóm đang chọn
      if (!edit.multi.size && edit.sel) edit.multi.add(edit.sel);
      if (edit.multi.has(key)) edit.multi.delete(key); else edit.multi.add(key);
      edit.sel = edit.multi.has(key) ? key : (edit.multi.size ? Array.from(edit.multi).pop() : null);
    } else { edit.multi.clear(); edit.sel = key; }
    highlightSelection(); renderEditPanel();
  });
  document.addEventListener('keydown', e=>{
    if (!edit.on || /INPUT|SELECT|TEXTAREA/.test((e.target.tagName || ''))) return;
    if ((e.ctrlKey || e.metaKey) && (e.key === 'd' || e.key === 'D')){ e.preventDefault(); edDuplicate(); return; }
    if (!edit.sel) return;
    const pal = state.result.mode === 'pallet';
    const k = e.key;
    if (k === 'z' && (e.ctrlKey || e.metaKey)){ doUndo(); e.preventDefault(); return; }
    const dirs = { ArrowLeft: ['x',-1], ArrowRight: ['x',1], ArrowUp: ['z',1], ArrowDown: ['z',-1], PageUp: ['y',1], PageDown: ['y',-1] };
    const dv = dirs[k];
    const cart = pal && edit.selKind === 'carton';
    if (dv){
      e.preventDefault();
      edMove(dv[0], dv[1], e.shiftKey);
      return;
    }
    if (k === 'r' || k === 'R'){ cart ? edTurnCartonInPallet(false) : pal ? edRotatePallet() : edRotateCartons(false); return; }
    if (k === 'l' || k === 'L'){ cart ? edTurnCartonInPallet(true) : (!pal && edRotateCartons(true)); return; }
    if (k === 'Delete'){ cart ? edCartonInPalletToTray() : pal ? edRemovePallet() : edCartonsToTray(); return; }
    if (k === 'Escape'){ edit.multi.clear(); edit.sel = null; highlightSelection(); renderEditPanel(); }
  });
}

/* ============================================================
   ẢNH 3D MINH HỌA — chụp sơ đồ 3D ở các góc chuẩn (khung hình tự ôm vừa), nền trắng để in.

const SHOT_VIEWS = [
  { id: 'door',  label: 'Góc phía cửa (3/4)',       dir: [0.62, 0.48, -0.62], fov: 35 },

  { id: 'top',   label: 'Nhìn từ trên (cửa bên trái)', dir: [0, 1, 0], up: [0, 0, 1], fov: 12 },

// Kích thước ảnh theo góc: nhìn trên / nhìn hông dùng khung dài theo tỉ lệ cont (16:9 → 4:1) để hình không bị nhỏ
function shotSize(view, baseW){
  const c = state.result.container;
  const ar = view === 'top' ? c.L / c.W * 0.92 : view === 'side' ? c.L / c.H * 0.92 : 16 / 9;
  const a = Math.max(16 / 9, Math.min(4, ar));
  return { w: baseW, h: Math.round(baseW / a), wide: a > 2.05 };
}

// Đặt camera nhìn theo hướng dir, lùi/tiến tới khi 8 góc hộp b (mét) chiếm ~margin khung hình
function fitCameraToBox(cam, b, dir, up, margin){
  const c = new THREE.Vector3((b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2, (b.z0 + b.z1) / 2);
  const d = new THREE.Vector3(dir[0], dir[1], dir[2]).normalize();
  cam.up.set(...(up || [0, 1, 0]));
  const corners = [];
  for (const x of [b.x0, b.x1]) for (const y of [b.y0, b.y1]) for (const z of [b.z0, b.z1]) corners.push(new THREE.Vector3(x, y, z));
  const R = c.distanceTo(corners[0]);
  const place = (dist)=>{ cam.position.copy(c).addScaledVector(d, dist); cam.lookAt(c); cam.updateMatrixWorld(); };
  const fits = (dist)=>{
    place(dist);
    return corners.every(p=>{ const v = p.clone().project(cam); return v.z < 1 && Math.abs(v.x) <= margin && Math.abs(v.y) <= margin; });
  };
  // khoảng cách NHỎ NHẤT mà 8 góc đều nằm trong khung (tìm nhị phân — đúng cả khi góc gần camera bị phóng to phối cảnh)
  let lo = R * 1.02, hi = R * 200;
  if (fits(lo)) hi = lo;
  for (let i = 0; i < 40 && hi - lo > R * 1e-3; i++){ const m = (lo + hi) / 2; if (fits(m)) hi = m; else lo = m; }
  place(hi);
}
// Chụp 1 ảnh. o: { view (SHOT_VIEWS id), w, h, bg 'white'|'dark', labels, only (unitId — chỉ 1 pallet), fmt 'png'|'jpeg' }
function snap3D(o){
  initThreeIfNeeded();
  const R = three.renderer, cam = three.camera, r = state.result;
  const v = SHOT_VIEWS.find(x=> x.id === o.view) || SHOT_VIEWS[0];
  const keep = { pr: R.getPixelRatio(), size: R.getSize(new THREE.Vector2()), aspect: cam.aspect, fov: cam.fov, pos: cam.position.clone(), up: cam.up.clone(),
                 quat: cam.quaternion.clone(), bg: three.scene.background };
  const hidden = [], swapped = [];
  const hide = (obj)=>{ if (obj && obj.visible){ obj.visible = false; hidden.push(obj); } };
  three.boxesGroup.children.forEach(m=>{
    if (m.isSprite){ if (!o.labels || o.only) hide(m); return; }
    const p = m.userData.placement;
    if (o.only && (!p || p.unitId !== o.only)) { hide(m); return; }
    if (m.isMesh && m.userData.mc != null){ swapped.push([m, m.material]); m.material = cachedMat('mesh', m.userData.mc, m.userData.mo, 0); }   // bỏ tô sáng
  });
  if (o.only) hide(three.containerGroup);
  else three.containerGroup.children.forEach(ch=>{ if (ch.type === 'GridHelper') hide(ch); });   // lưới sàn lớn hơn cont → bỏ cho ảnh gọn
  hide(three.issueGroup); hide(three.lockGroup);
  try {
    R.setPixelRatio(1); R.setSize(o.w, o.h, false);
    cam.aspect = o.w / o.h; if (v.fov) cam.fov = v.fov; cam.updateProjectionMatrix();
    three.scene.background = new THREE.Color(o.bg === 'dark' ? 0x14171c : 0xffffff);
    if (v.id !== 'cur'){
      let b;
      if (o.only){
        const ps = r.placed.filter(p=> p.unitId === o.only);
        b = { x0: Math.min(...ps.map(p=> p.x)), x1: Math.max(...ps.map(p=> p.x + p.sizeX)), y0: Math.min(...ps.map(p=> p.y)), y1: Math.max(...ps.map(p=> p.y + p.sizeY)),
              z0: Math.min(...ps.map(p=> p.z)), z1: Math.max(...ps.map(p=> p.z + p.sizeZ)) };
      } else { const c = r.container; b = { x0: 0, x1: c.L, y0: 0, y1: c.H, z0: 0, z1: c.W }; }
      Object.keys(b).forEach(k=> b[k] *= MM_TO_M);
      fitCameraToBox(cam, b, v.dir, v.up, o.only ? 0.9 : 0.94);
    }
    R.render(three.scene, cam);
    return trimShot(R.domElement, o.w, o.h, o.bg === 'dark' ? [20, 23, 28] : [255, 255, 255], o.fmt);
  } finally {
    hidden.forEach(x=> x.visible = true);
    swapped.forEach(([m, mat])=> m.material = mat);
    three.scene.background = keep.bg;
    R.setPixelRatio(keep.pr); R.setSize(keep.size.x, keep.size.y, false);
    cam.aspect = keep.aspect; cam.fov = keep.fov; cam.up.copy(keep.up); cam.position.copy(keep.pos); cam.quaternion.copy(keep.quat); cam.updateProjectionMatrix();
    three.controls.update();
  }
}
// Cắt bớt nền thừa quanh hình (giữ đúng tỉ lệ khung w×h, lề ~3%) để hàng hóa chiếm trọn ảnh
function trimShot(src, w, h, bg, fmt){
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'); g.drawImage(src, 0, 0, w, h);
  const px = g.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2){
    const i = (y * w + x) * 4;
    if (Math.abs(px[i] - bg[0]) + Math.abs(px[i + 1] - bg[1]) + Math.abs(px[i + 2] - bg[2]) > 30){ if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  const type = fmt === 'jpeg' ? 'image/jpeg' : 'image/png';
  if (x1 < 0) return cv.toDataURL(type, 0.9);
  let cw = (x1 - x0 + 1), ch = (y1 - y0 + 1);
  const pad = Math.max(cw, ch) * 0.03; cw += 2 * pad; ch += 2 * pad;
  const ar = w / h;
  if (cw / ch > ar) ch = cw / ar; else cw = ch * ar;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  const o2 = out.getContext('2d');
  o2.fillStyle = `rgb(${bg[0]},${bg[1]},${bg[2]})`; o2.fillRect(0, 0, w, h);
  o2.imageSmoothingQuality = 'high';
  o2.drawImage(cv, cx - cw / 2, cy - ch / 2, cw, ch, 0, 0, w, h);
  return out.toDataURL(type, 0.9);
}
// Chạy fn với cảnh 3D "đầy đủ" (không lọc lớp, không tách lớp, không ẩn SKU, không wireframe), xong trả lại
function withFullScene(fn){
  const r = state.result; if (!r || !three.renderer) return null;
  const keep = { lf: state.currentLayerFilter, ex: three.explodeFactor, hid: new Set(state.hiddenSkuIds), wf: three.wireframeOnly };
  const dirty = keep.lf >= 0 || keep.ex || keep.hid.size || keep.wf;
  if (dirty){ state.currentLayerFilter = -1; three.explodeFactor = 0; state.hiddenSkuIds = new Set(); three.wireframeOnly = false; rebuildBoxMeshes(r); }
  try { return fn(); }
  finally {
    if (dirty){ state.currentLayerFilter = keep.lf; three.explodeFactor = keep.ex; state.hiddenSkuIds = keep.hid; three.wireframeOnly = keep.wf; rebuildBoxMeshes(r); }
  }
}
function shotFileBase(){
  const n = (state.orderName || 'phuong-an').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').replace(/[^A-Za-z0-9_-]+/g, '_').replace(/^_+|_+$/g, '');
  return n || 'phuong-an';
}
// Ảnh cho bản in: các góc cont đã chọn + (mode pallet) ảnh từng pallet theo id
function printShots(unitIds){
  const P = shotPrefs(); if (!P.inPrint || !state.result || !three.renderer) return { views: [], pallets: {} };
  return withFullScene(()=>{
    const views = SHOT_VIEWS.filter(v=> P.views[v.id]).map(v=>{ const z = shotSize(v.id, 1500);
      return { label: v.label, wide: z.wide, url: snap3D({ view: v.id, w: z.w, h: z.h, bg: 'white', labels: P.labels, fmt: 'jpeg' }) }; });
    const pallets = {};
    if (state.result.mode === 'pallet' && P.palletImgs) (unitIds || []).forEach(id=>{ pallets[id] = snap3D({ view: 'door', w: 520, h: 600, bg: 'white', only: id, fmt: 'jpeg' }); });
    return { views, pallets };
  }) || { views: [], pallets: {} };
}

  };

function zoomView(f){
  if (!three.camera || !three.controls) return;
  const t = three.controls.target, v = three.camera.position.clone().sub(t).multiplyScalar(f);
  if (v.length() < 0.3 || v.length() > 80) return;
  three.camera.position.copy(t).add(v); three.controls.update();
}
// Phím tắt xem: F = mở rộng/thu lại, + / − = phóng to/thu nhỏ (khi không gõ trong ô nhập)
document.addEventListener('keydown', e=>{
  const help = document.getElementById('help-overlay');
  if (help && help.classList.contains('active') && e.key === 'Escape'){ help.classList.remove('active'); e.preventDefault(); return; }
  const so = document.getElementById('shot-overlay');
  if (so && so.classList.contains('active') && e.key === 'Escape'){ so.classList.remove('active'); e.preventDefault(); return; }
  if (/INPUT|SELECT|TEXTAREA/.test((e.target.tagName || '')) || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '?'){ openHelp(); e.preventDefault(); return; }
  if (e.key === 'f' || e.key === 'F'){ setFocusView(!edit.focus); e.preventDefault(); }
  else if (e.key === '+' || e.key === '='){ zoomView(0.8); e.preventDefault(); }
  else if (e.key === '-' || e.key === '_'){ zoomView(1.25); e.preventDefault(); }
});

function toggleEditMode(force){
  edit.on = force != null ? force : !edit.on;
  if (edit.on && !editAvailable()){
    edit.on = false;
    showToast(state.result ? 'Phương án này lưu từ bản cũ — bấm "Tối ưu" lại để chỉnh tay.' : 'Bấm "Tối ưu" trước rồi mới chỉnh tay.', true);
  }
  const b = document.getElementById('btn-edit-mode'); if (b) b.classList.toggle('active', edit.on);
  if (edit.on){
    bindEditPicking(); ensureCartonIds();
    if (state.result && state.result.mode === 'pallet'){
      const all = []; state.result.raw.units.forEach(u=> u.cartons.forEach(c=> all.push(c.cid)));
      const n = reassignCartonOwners(all);
      if (n) showToast(`Đã gán lại ${n} thùng (trước đó dời sang pallet khác) về đúng pallet đang đỡ chúng.`);
      reprocessAfterEdit(0);
    }
  }
  if (!edit.on){ edit.sel = null; edit.multi.clear(); }
  // vào chỉnh tay: tự mở rộng sơ đồ; thoát: thu lại như cũ
  setFocusView(edit.on);
  highlightSelection(); renderEditPanel();
}

  const addBox = `<div class="ed-sub">Thêm thùng còn thiếu</div>
    <div class="ed-row"><select id="ed-add-sku">${miss.map(m=> `<option value="${m.sku.id}" ${m.sku.id === edit.addSku ? 'selected' : ''}>${escapeHtml(m.sku.code || m.sku.id)} — thiếu ${m.missing}</option>`).join('')}</select>
      <input type="number" id="ed-add-n" min="1" value="${edit.addQty}" style="width:58px;padding:2px 4px;">
      ${pal ? `<button class="btn small" data-act="addp" title="Tự tìm chỗ trống được đỡ trên pallet đang chọn">+ lên pallet đang chọn</button><button class="btn small ghost" data-act="addnew">+ pallet mới</button>`
            : `<button class="btn small" data-act="addb" title="Tự tìm chỗ trống được đỡ trong cont">+ tự tìm chỗ</button></div>
      <div class="ed-row"><span>trên lớp</span><select id="ed-add-layer">${(r.layers || []).map((L, i)=> `<option value="${i}" ${edit.addLayer === i ? 'selected' : ''}>${i + 1} (${L.axis === 'x' ? 'đáy +' : 'cao '}${fmtInt(L.base)} mm · ${L.items.length} thùng)</option>`).join('')}</select>
        <button class="btn small" data-act="addbl" title="Chỉ tìm chỗ trong lớp đã chọn (lớp cắt ngang khi Right to left, lớp nằm ngang khi Floor to top)">+ tự tìm chỗ trên lớp này</button>`}</div>`;
  // khay: lớp/thùng đã gỡ + pallet đang ở ngoài cont
  const outPal = pal ? (r.raw.unplacedUnitIds || []).map(id=> rawUnit(id)).filter(Boolean) : [];
  const tray = edit.tray.map((it, k)=> `<div class="ed-layer"><span>${escapeHtml(it.label)}</span>${it.kind === 'layer'
      ? `<button class="btn small ghost" data-tray="${k}">Đặt lên pallet đang chọn</button>`
      : `<button class="btn small ghost" data-tray="${k}">Đặt lại chỗ cũ</button>`}</div>`).join('') +
    outPal.map(u=> `<div class="ed-layer"><span>Pallet ngoài cont: ${escapeHtml(Object.entries(u.skuCounts).map(([id,n])=> (((r.ctxSkus||[]).find(k=> k.id === id)||{}).code || id) + '×' + n).join(', '))} · ${fmtInt(u.height)} mm</span>
      <button class="btn small ghost" data-place="${u.id}">Đặt vào chỗ trống</button></div>`).join('');
  el2.innerHTML = `
    <div class="ed-head"><b>✎ Chỉnh tay</b><span style="flex:1"></span>
      <button class="btn small ghost" data-act="undo" title="Ctrl+Z">↶ Hoàn tác</button><button class="btn small" data-act="done">Xong</button></div>
    ${kindSeg}
    ${(()=>{ const LK = r.raw && r.raw.locks; if (!LK || (!LK.units.length && !LK.regions.length)) return '';
      const items = pal ? LK.units.map(id=> ({ k: id, t: 'Pallet #' + ((r.pallets.find(p=> p.unit.id === id) || {}).no || '?') }))
                        : LK.regions.map(R=> ({ k: R.key, t: R.label }));
      return `<div class="ed-row"><span style="color:#3fd0ff">🔒 Đang khóa:</span>${items.map(x=> `<button class="btn small ghost" data-unlock="${x.k}" title="Mở khóa">${escapeHtml(x.t)} ✕</button>`).join('')}</div>`; })()}
    <div class="ed-row"><button class="btn small ${edit.review ? 'active' : 'ghost'}" data-act="review" title="Khoanh đỏ mọi thùng/pallet bất hợp lý">🔍 Rà lỗi${edit.review && edit.issues ? ` (${edit.issues.list.length})` : ''}</button>
      <button class="btn small ghost" data-act="compact" title="Đóng các khe nhỏ do chỉnh tay (khe lớn hơn dung sai giữ nguyên)">⇲ Khít lại khe ≤</button>
      <input type="number" id="ed-tol" min="1" max="200" value="${edit.compactTol}" style="width:52px;padding:2px 4px;"><span>mm</span>
      ${!pal && r.raw && r.raw.placed.some(q=> q.tag === 'customs') ? '<button class="btn small ghost" data-act="custop" title="Đổi chỗ để mọi thùng kiểm hóa nằm trên cùng, gần cửa nhất (không thùng nào đè lên)">⇡ Kiểm hóa lên trên</button>' : ''}</div>
    ${edit.review && edit.issues ? (edit.issues.list.length
      ? `<div class="ed-issues">${edit.issues.list.slice(0, 15).map((it, k)=> `<div class="ed-issue" data-iss="${k}">${it.palletNo ? '#' + it.palletNo + ' · ' : ''}${escapeHtml(it.code)}: ${escapeHtml(it.why.join(', '))}</div>`).join('')}${edit.issues.list.length > 15 ? `<div class="ed-issue">… +${edit.issues.list.length - 15}</div>` : ''}</div>`
      : `<div class="ed-ok">✓ Rà xong: không có thùng/pallet bất hợp lý.</div>`) : ''}
    ${pal ? (()=>{ const A = edit.arrange, nEq = palletEquivalenceGroups().reduce((t,g)=> t + g.length, 0);
      const pts = palletTypes();
      return `<div class="ed-sub">Pallet rỗng / vẽ tay</div>
      <div class="ed-row"><select id="ed-new-pt">${pts.map(t=> `<option value="${t.id}" ${t.id === edit.newPT ? 'selected' : ''}>${escapeHtml(t.name)}</option>`).join('')}</select>
        <button class="btn small" data-act="newpal" title="Tạo pallet rỗng, đặt vào chỗ trống đầu tiên tính từ vách kín">＋ Pallet rỗng</button></div>
      <div class="ed-sub">Vị trí & đồng nhất pallet</div>
      <div class="ed-row"><span class="ed-lbl">Dài cont</span>
        <select id="ar-len"><option value="even" ${A.lenMode==='even'?'selected':''}>Dàn đều (vách kín → cửa)</option><option value="gap" ${A.lenMode==='gap'?'selected':''}>Khe cố định</option></select>
        <input type="number" id="ar-lgap" min="0" value="${A.lenGap}" style="width:56px;padding:2px 4px;" ${A.lenMode==='gap'?'':'disabled'}><span>mm</span></div>
      <div class="ed-row"><span class="ed-lbl">Rộng cont</span>
        <select id="ar-wid"><option value="walls" ${A.widMode==='walls'?'selected':''}>Sát 2 vách</option><option value="gap" ${A.widMode==='gap'?'selected':''}>Khe cố định (cụm ở giữa)</option></select>
        <input type="number" id="ar-wgap" min="0" value="${A.widGap}" style="width:56px;padding:2px 4px;" ${A.widMode==='gap'?'':'disabled'}><span>mm</span>
        <button class="btn small" data-act="arrange">▦ Căn vị trí pallet</button></div>
      <div class="ed-row"><button class="btn small ghost" data-act="unify" title="Pallet cùng số lớp & cùng số thùng mỗi lớp nhưng xếp/xoay khác nhau → chép cách xếp của pallet mẫu">⇆ Tự xoay để đồng nhất${nEq ? ` (${nEq} pallet)` : ''}</button></div>
      <div class="ed-row"><span class="ed-lbl">Lớp hàng</span>
        <select id="ar-scope"><option value="all" ${edit.arrScope !== 'sel' ? 'selected' : ''}>Tất cả pallet</option><option value="sel" ${edit.arrScope === 'sel' ? 'selected' : ''}>Pallet đang chọn</option></select>
        <button class="btn small ghost" data-act="alignl" title="Kéo thùng lệch hàng/cột (≤ 25 mm) về thẳng hàng, đặt mọi lớp cùng tâm khối">⌖ Căn chỉnh lớp</button>
        <button class="btn small ghost" data-act="spreadl" title="Nới đều khe giữa các thùng (mỗi khe ≤ khe đặt ở Tùy chọn pallet) cho lớp bằng mép khối to nhất">⇔ Dàn ra mép khối (≤ ${state.pallet.spreadGap || 30} mm)</button>
        <button class="btn small" data-act="blockl" title="Mọi lớp thành 1 khối thống nhất: lấy khung dài × rộng của cả khối, lớp nhỏ hơn tự nới đều khe (không giới hạn khe) cho chạm đủ 4 mép. Vẫn giữ đỡ ≥ ngưỡng.">▣ Đồng nhất khối</button></div>`; })() : ''}
    <div class="ed-row"><span>Bước</span>${stepBtns}<span style="color:var(--text-2)">mm · ←→↑↓${pal && !cart ? '' : ' PgUp/PgDn'} dời, Shift+phím = đẩy sát, R xoay${pal && !cart ? '' : ', L nằm/đứng, Ctrl+D lấy thêm'}, Del gỡ</span></div>
    ${body}
    ${addBox}
    ${tray ? `<div class="ed-sub">Khay hàng chờ</div>${tray}` : ''}
    ${edit.warn.length ? `<div class="ed-sub" style="color:var(--err)">Cảnh báo (${edit.warn.length})</div>${edit.warn.slice(0, 8).map(w=> `<div class="ed-warn">⚠ ${escapeHtml(w)}</div>`).join('')}${edit.warn.length > 8 ? `<div class="ed-warn">… +${edit.warn.length - 8}</div>` : ''}`
      : (r.manualOps ? `<div class="ed-ok">✓ Không phát hiện vi phạm sau chỉnh tay.</div>` : '')}`;
  el2.querySelectorAll('[data-step]').forEach(b=> b.onclick = ()=>{ edit.step = parseFloat(b.dataset.step); renderEditPanel(); });
  el2.querySelectorAll('[data-kind]').forEach(b=> b.onclick = ()=>{ edit.selKind = b.dataset.kind; edit.sel = null; edit.multi.clear(); highlightSelection(); renderEditPanel(); });
  el2.querySelectorAll('[data-mv]').forEach(b=> b.onclick = ()=>{ const [ax, d] = b.dataset.mv.split(','); edMove(ax, parseInt(d, 10), false); });
  el2.querySelectorAll('[data-sn]').forEach(b=> b.onclick = ()=>{ const [ax, d] = b.dataset.sn.split(','); edMove(ax, parseInt(d, 10), true); });
  const qty = ()=> Math.max(1, parseInt((document.getElementById('ed-add-n') || {}).value || 1, 10));
  const sk = ()=> (document.getElementById('ed-add-sku') || {}).value;
  const acts = {
    undo: doUndo, done: ()=> toggleEditMode(false),
    rot: edRotatePallet, swap: ()=> edSwapPallet(document.getElementById('ed-swap').value), rmpal: edRemovePallet,
    ptrot: ()=> edTurnCartonInPallet(false), ptlay: ()=> edTurnCartonInPallet(true), pttray: edCartonInPalletToTray,
    crot: ()=> edRotateCartons(false), clay: ()=> edRotateCartons(true), ctray: edCartonsToTray,
    addp: ()=> edAddToPallet(sk(), qty(), false), addnew: ()=> edAddToPallet(sk(), qty(), true), addb: ()=> edAddBulk(sk(), qty()), addbl: ()=> edAddBulk(sk(), qty(), edit.addLayer),
    review: ()=>{ edit.review = !edit.review; highlightSelection(); renderEditPanel(); },
    sellayer: edSelectLayer, selblock: edSelectBlock, selclear: ()=>{ edit.multi.clear(); highlightSelection(); renderEditPanel(); },
    mirx: ()=> edMirrorGroup('x'), mirz: ()=> edMirrorGroup('z'), dup: edDuplicate,
    arrange: edArrangePallets, unify: edUnifyPallets,
    alignl: ()=> edArrangeLayers(false), spreadl: ()=> edArrangeLayers(true), blockl: ()=> edArrangeLayers(true, true),
    lockp: ()=> edToggleLockPallet(edit.sel),
    newpal: ()=> edNewEmptyPallet((document.getElementById('ed-new-pt') || {}).value),
    duppal: ()=> edDuplicatePallet(parseInt((document.getElementById('ed-dup-n') || {}).value || '0', 10) || 0),
    cpyin: ()=> edCopyLayout((document.getElementById('ed-cpy-ref') || {}).value, 'sel'),
    cpyall: ()=> edCopyLayout(edit.sel, 'all'),
    patl: ()=> edAddPatternLayers(edit.plSku, Math.max(1, parseInt((document.getElementById('ed-pl-n') || {}).value || '1', 10))),
    clearp: edClearPallet,
    cpl: ()=>{
      const set = edit.lySel && edit.lySel.id === edit.sel ? Array.from(edit.lySel.set).sort((a,b)=> a - b) : [];
      edCopyLayers(set, (document.getElementById('ed-cpl-to') || {}).value || edit.sel, Math.max(1, parseInt((document.getElementById('ed-cpl-n') || {}).value || '1', 10)));
    },
    lockl: ()=>{ const p = bulkSelected()[0]; if (p) edToggleLockLayer(p); },
    custop: ()=>{ pushUndo(); const n = customsToTop(state.result.raw.placed); if (!n){ edit.undo.pop(); showToast('Hàng kiểm hóa đã nằm trên cùng.'); return; } showToast(`Đã đổi chỗ ${n} thùng kiểm hóa lên trên cùng.`); reprocessAfterEdit(); },
    compact: ()=> edCompact(edit.compactTol)
  };
  el2.querySelectorAll('[data-act]').forEach(b=> b.onclick = ()=> acts[b.dataset.act] && acts[b.dataset.act]());
  el2.querySelectorAll('[data-lact]').forEach(b=>{
    const i = parseInt(b.dataset.ly, 10), a = b.dataset.lact;
    if (a === 'to') b.onchange = ()=>{ if (b.value) edLayerToPallet(i, b.value); };
    else b.onclick = ()=>{ if (a === 'up') edLayerMove(i, 1); else if (a === 'down') edLayerMove(i, -1); else edLayerToTray(i); };
  });
  el2.querySelectorAll('[data-tray]').forEach(b=> b.onclick = ()=>{ const k = parseInt(b.dataset.tray, 10); edit.tray[k].kind === 'layer' ? edTrayToPallet(k) : edTrayRestore(k); });
  el2.querySelectorAll('[data-place]').forEach(b=> b.onclick = ()=> edPlacePallet(b.dataset.place));
  el2.querySelectorAll('[data-unlock]').forEach(b=> b.onclick = ()=>{
    const LK = locksOf(), k = b.dataset.unlock; pushUndo();
    LK.units = LK.units.filter(id=> id !== k); LK.regions = LK.regions.filter(R=> R.key !== k);
    reprocessAfterEdit(0);
  });
  const as = document.getElementById('ed-add-sku'); if (as) as.onchange = ()=>{ edit.addSku = as.value; };
  const tl = document.getElementById('ed-tol'); if (tl) tl.oninput = ()=>{ edit.compactTol = Math.max(1, parseFloat(tl.value || 30)); };
  const ad = document.getElementById('ed-additive'); if (ad) ad.onchange = ()=>{ edit.additive = ad.checked; };
  const asc = document.getElementById('ar-scope'); if (asc) asc.onchange = ()=>{ edit.arrScope = asc.value; };
  const npt = document.getElementById('ed-new-pt'); if (npt) npt.onchange = ()=>{ edit.newPT = npt.value; };
  const dn = document.getElementById('ed-dup-n'); if (dn) dn.oninput = ()=>{ edit.dupN = dn.value; };
  const pls = document.getElementById('ed-pl-sku'); if (pls) pls.onchange = ()=>{ edit.plSku = pls.value; };
  const pln = document.getElementById('ed-pl-n'); if (pln) pln.oninput = ()=>{ edit.plN = Math.max(1, parseInt(pln.value || '1', 10)); };
  const cpn = document.getElementById('ed-cpl-n'); if (cpn) cpn.oninput = ()=>{ edit.cplN = Math.max(1, parseInt(cpn.value || '1', 10)); };
  el2.querySelectorAll('[data-lysel]').forEach(b=> b.onchange = ()=>{
    if (!edit.lySel || edit.lySel.id !== edit.sel) edit.lySel = { id: edit.sel, set: new Set() };
    const i = parseInt(b.dataset.lysel, 10); if (b.checked) edit.lySel.set.add(i); else edit.lySel.set.delete(i);
  });
  const al = document.getElementById('ed-add-layer'); if (al) al.onchange = ()=>{ edit.addLayer = parseInt(al.value, 10) || 0; };
  const arL = document.getElementById('ar-len'), arW = document.getElementById('ar-wid');
  if (arL){
    arL.onchange = ()=>{ edit.arrange.lenMode = arL.value; renderEditPanel(); };
    arW.onchange = ()=>{ edit.arrange.widMode = arW.value; renderEditPanel(); };
    document.getElementById('ar-lgap').oninput = (e)=>{ edit.arrange.lenGap = Math.max(0, parseFloat(e.target.value || 0)); };
    document.getElementById('ar-wgap').oninput = (e)=>{ edit.arrange.widGap = Math.max(0, parseFloat(e.target.value || 0)); };
  }
  el2.querySelectorAll('[data-iss]').forEach(d=> d.onclick = ()=>{
    const it = edit.issues.list[parseInt(d.dataset.iss, 10)]; if (!it) return;
    edit.multi.clear();
    if (r.mode === 'pallet'){ const p = r.placed.find(x=> x.instanceId === it.id) || {}; if (it.base){ edit.selKind = 'pallet'; edit.sel = p.unitId; } else { edit.selKind = 'carton'; edit.sel = it.id; } }
    else { edit.sel = it.id; }
    highlightSelection(); renderEditPanel();
  });
  const an = document.getElementById('ed-add-n'); if (an) an.oninput = ()=>{ edit.addQty = Math.max(1, parseInt(an.value || 1, 10)); };
}

/* ============================================================
   11. INIT
   ============================================================ */
function initApp(){
  bindOrderFileInput();
  applyCarrierSpec();
  buildLeftColumn();
  updateModeVisibility();
  buildViewportToolbar();
  buildRightColumn();

  // Seed 1 SKU mẫu để người dùng thấy ngay hình dạng form (dễ bắt đầu)
  const sample = defaultSku();
  sample.color = colorForIndex(0);
  sample.code = "SKU-001";
  sample.name = "Thùng carton mẫu";
  state.nextSkuSeq = 2;
  state.skus.push(sample);
  renderSkuList();
  renderSkuOrderList();
}

document.addEventListener('DOMContentLoaded', initApp);

</script>
</body>
</html>
