   ------------------------------------------------------------ */
function createSpatialIndex(cellSize){
  return { cell: cellSize, map: new Map() };
}
function _spKey(ix,iy,iz){ return ix+'|'+iy+'|'+iz; }
function spatialInsert(idx, p){
  const c = idx.cell;
  const x0=Math.floor(p.x/c), x1=Math.floor((p.x+p.sizeX-0.01)/c);
  const y0=Math.floor(p.y/c), y1=Math.floor((p.y+p.sizeY-0.01)/c);
  const z0=Math.floor(p.z/c), z1=Math.floor((p.z+p.sizeZ-0.01)/c);
  for (let ix=x0; ix<=x1; ix++) for (let iy=y0; iy<=y1; iy++) for (let iz=z0; iz<=z1; iz++){
    const k=_spKey(ix,iy,iz);
    let arr=idx.map.get(k);
    if(!arr){ arr=[]; idx.map.set(k,arr); }
    arr.push(p);
  }
}
// Trả về các kiện đã đặt có thể giao/chạm hộp (x,y,z,sizeX,sizeY,sizeZ), nới ra
// 2mm mỗi phía để bắt cả trường hợp chạm mặt (support kiểm tra qTop≈p.y).
function spatialQuery(idx, x,y,z,sx,sy,sz){
  const c=idx.cell, m=2;
  const x0=Math.floor((x-m)/c), x1=Math.floor((x+sx+m)/c);
  const y0=Math.floor((y-m)/c), y1=Math.floor((y+sy+m)/c);
  const z0=Math.floor((z-m)/c), z1=Math.floor((z+sz+m)/c);
  const seen=new Set(), out=[];
  for (let ix=x0; ix<=x1; ix++) for (let iy=y0; iy<=y1; iy++) for (let iz=z0; iz<=z1; iz++){
    const arr=idx.map.get(_spKey(ix,iy,iz));
    if(!arr) continue;
    for (let i=0;i<arr.length;i++){ const q=arr[i]; if(!seen.has(q)){ seen.add(q); out.push(q); } }
  }
  return out;
}

function generateExtremePointsFromPlacement(p, container){
  const pts = [];

  const ex = p.x + p.sizeX;
  const ey = p.y + p.sizeY;
  const ez = p.z + p.sizeZ;
  if (ex <= container.L + 0.01) pts.push({x:ex, y:p.y, z:p.z});
  if (ey <= container.H + 0.01) pts.push({x:p.x, y:ey, z:p.z});
  if (ez <= container.W + 0.01) pts.push({x:p.x, y:p.y, z:ez});
  return pts;
}

// Thử đặt 1 item tại 1 extreme point, với 1 orientation cụ thể.
// Trả về placement object nếu hợp lệ, null nếu vi phạm ràng buộc.
// rules (tùy chọn): { heavyBottom, alignedStackOnly, _noShift }
//  - heavyBottom: không đặt kiện nặng hơn lên kiện nhẹ hơn (dùng làm "ưu tiên": packContainer nới khi hết chỗ)
//  - alignedStackOnly: chỉ chồng thẳng mép lên ĐÚNG 1 kiện cùng footprint (dùng cho chồng pallet)
// Khi kiện chạm vùng cấm (điểm mù cấu trúc/vùng người dùng), thử "đẩy" kiện ra khỏi vùng 1 lần theo trục
// z (vách) và x (dọc) — cần thiết vì extreme point chỉ sinh từ mặt các kiện, không từ mặt vùng cấm.
function tryPlaceAt(item, orient, point, container, placed, forbiddenZones, supportThreshold, spIndex, rules){
  rules = rules || {};
  const cand = {
    x: point.x, y: point.y, z: point.z,
    sizeX: orient.d, sizeY: orient.w, sizeZ: orient.h,
    skuId: item.skuId, weight: item.weight, fragile: item.fragile,
    maxStackCount: item.maxStackCount, maxStackLoad: item.maxStackLoad,
    orientCode: orient.code, instanceId: item.instanceId
  };

  if (!isWithinContainer(cand, container)) return null;
  const hit = firstForbiddenHit(cand, forbiddenZones);
  if (hit){
    if (rules._noShift) return null;
    const alts = [
      { x: point.x, y: point.y, z: hit.z + hit.dz },
      { x: point.x, y: point.y, z: hit.z - cand.sizeZ },
      { x: hit.x + hit.dx, y: point.y, z: point.z },
      { x: hit.x - cand.sizeX, y: point.y, z: point.z }
    ];
    const r2 = Object.assign({}, rules, { _noShift:true });
    for (const a of alts){
      if (a.x < -0.5 || a.z < -0.5) continue;
      if (Math.abs(a.x - point.x) < 0.01 && Math.abs(a.z - point.z) < 0.01) continue;
      const res = tryPlaceAt(item, orient, a, container, placed, forbiddenZones, supportThreshold, spIndex, r2);
      if (res) return res;
    }
    return null;
  }

  // Chồng lấn: chỉ xét các kiện ở gần (chỉ mục không gian); không có chỉ mục thì quét toàn bộ.
  const near = spIndex ? spatialQuery(spIndex, cand.x, cand.y, cand.z, cand.sizeX, cand.sizeY, cand.sizeZ) : placed;
  for (const q of near){
    if (checkOverlap(cand, q)) return null;
  }

  // "below": lấy các kiện có mặt trên sát đáy của 1 node bất kỳ — dùng cho support & leo chuỗi xếp chồng.
  const below = spIndex
    ? (n)=> spatialQuery(spIndex, n.x, n.y - 2, n.z, n.sizeX, 4, n.sizeZ)
    : placed;
  const direct = cand.y > 0.5 ? findDirectSupporters(cand, below) : [];
  const support = cand.y > 0.5 ? computeSupportRatio(cand, direct) : 100;
  if (support < supportThreshold - 0.001) return null;

  if (rules.alignedStackOnly && cand.y > 0.5){
    if (direct.length !== 1) return null;
    const q = direct[0];
    if (Math.abs(q.x - cand.x) > 1 || Math.abs(q.z - cand.z) > 1 ||
        Math.abs(q.sizeX - cand.sizeX) > 1 || Math.abs(q.sizeZ - cand.sizeZ) > 1) return null;
  }
  if (rules.heavyBottom && cand.y > 0.5){
    for (const q of direct) if (cand.weight > (q.weight || 0) + 1e-6) return null;
  }

  const stackCheck = checkStackingRules(cand, below);
  if (!stackCheck.ok) return null;

  cand._support = support;
  return cand;
}

/* ------------------------------------------------------------
   packContainer — chạy 1 pass đóng gói với 1 thứ tự item cho trước.
   opts: { supportThreshold, loadingDirection, heavyBottomPriority, payloadLimit,
           seedPlaced, seedExtremePoints, rules, yieldEvery, onYield }
   Trả về { placed, unplaced, payloadRejected, heavyRelaxed }.
   ------------------------------------------------------------ */
function packContainer(orderedItems, container, forbiddenZones, opts){
  // seedPlaced: các kiện đã đặt SẴN (khối SKU trước ở no-mix, hoặc pallet kiểm hóa ở mode Pallet) —
  // dùng để tính overlap/support/stacking/tải trọng trên hình học thật, nhưng KHÔNG nằm trong kết quả trả về.
  const seed = opts.seedPlaced || [];
  const placed = seed.slice();
  const ownPlaced = [];
  const unplaced = [];
  let extremePoints = opts.seedExtremePoints ? opts.seedExtremePoints.slice() : [{x:0,y:0,z:0}];
  const supportThreshold = opts.supportThreshold ?? 70;
  const baseRules = Object.assign({}, opts.rules || {});
  const heavyRules = Object.assign({}, baseRules, { heavyBottom:true });
  const heavyFirst = !!opts.heavyBottomPriority;
  const payloadLimit = (opts.payloadLimit && opts.payloadLimit > 0) ? opts.payloadLimit : null;
  let placedWeight = 0;
  for (const p of seed) placedWeight += p.weight || 0;
  let payloadRejected = 0, heavyRelaxed = 0;

  // Kích thước nhỏ nhất theo từng trục trong mọi orientation của mọi kiện. Dùng cho:
  // (1) ô lưới của chỉ mục không gian; (2) loại các extreme point không thể chứa nổi
  // kiện nhỏ nhất (điểm như vậy luôn bị isWithinContainer từ chối — loại đi KHÔNG đổi kết quả).
  let minD = Infinity, minW = Infinity, minH = Infinity;
  for (const it of orderedItems) for (const o of it.orientations){
    if (o.d < minD) minD = o.d;
    if (o.w < minW) minW = o.w;
    if (o.h < minH) minH = o.h;
  }
  const minDim = Math.min(minD, minW, minH);
  const spIndex = createSpatialIndex(Math.max(50, isFinite(minDim) ? minDim : 200));
  for (const p of seed) spatialInsert(spIndex, p);
  const belowFn = (n)=> spatialQuery(spIndex, n.x, n.y - 2, n.z, n.sizeX, 4, n.sizeZ);

  // QUY ƯỚC TỌA ĐỘ: x = dọc cont, x=0 là ĐÁY cont (vách kín), x tăng dần về phía CỬA;
  //                 y = chiều cao, y=0 là sàn;  z = chiều rộng cont.
  // HƯỚNG CHẤT HÀNG chỉ quyết định TRỤC ƯU TIÊN khi chọn điểm đặt kế tiếp (k0 > k1 > k2):
  //  - floor_to_top : y → x → z. Trải kín sàn theo cả chiều dài (tới tận cửa) rồi mới
  //                   lên lớp cao hơn. Dùng khi cont không chất đầy nhưng hàng phải trải tới cửa.
  //  - right_to_left: x → y → z. Chất từng "lớp cắt ngang" (rộng × cao) từ đáy cont ra cửa,
  //                   kín hết chiều cao rồi mới tiến ra. Nếu còn dư thì phần dư nằm ở phía cửa.
  const rtl = opts.loadingDirection === 'right_to_left';
  const k0 = rtl ? 'x' : 'y', k1 = rtl ? 'y' : 'x', k2 = 'z';

  function sortPoints(){
    extremePoints.sort((a,b)=> (a[k0]-b[k0]) || (a[k1]-b[k1]) || (a[k2]-b[k2]));
  }

  // Thử các extreme point (đã sắp theo trục ưu tiên) × mọi orientation hợp lệ; chọn điểm có trục ưu
  // tiên nhỏ nhất, hòa thì xét trục kế tiếp.
  function findBest(item, rules){
    let bestPlacement = null, bestPointIdx = -1, bestScore = -Infinity;
    for (let pi=0; pi<extremePoints.length; pi++){
      const point = extremePoints[pi];
      for (const orient of item.orientations){
        const placement = tryPlaceAt(item, orient, point, container, placed, forbiddenZones, supportThreshold, spIndex, rules);
        if (!placement) continue;
        const localScore = -(point[k0]*1000000 + point[k1]*100 + point[k2]);
        if (localScore > bestScore){
          bestScore = localScore;
          bestPlacement = placement;
          bestPointIdx = pi;
        }
      }
      // Danh sách đã sắp theo k0 tăng dần: đã có chỗ đặt ở mức k0 hiện tại thì không cần thử mức k0 cao hơn.
      if (bestPlacement && pi < extremePoints.length-1 && extremePoints[pi+1][k0] > point[k0] + 0.01) break;
    }
    return { placement: bestPlacement, idx: bestPointIdx };
  }

  let count = 0;
  for (const item of orderedItems){
    count++;
    if (opts.yieldEvery && count % opts.yieldEvery === 0 && opts.onYield){
      opts.onYield(count, orderedItems.length);
    }
    if (payloadLimit && placedWeight + item.weight > payloadLimit + 1e-6){
      unplaced.push(item); payloadRejected++;
      continue;
    }

    sortPoints();
    let found = findBest(item, heavyFirst ? heavyRules : baseRules);
    if (!found.placement && heavyFirst){
      // "Ưu tiên" nặng dưới: không còn chỗ hợp quy tắc → nới quy tắc cho kiện này, có đếm để báo cáo
      found = findBest(item, baseRules);
      if (found.placement) heavyRelaxed++;
    }

    if (found.placement){
      const bp = found.placement;
      placed.push(bp);
      ownPlaced.push(bp);
      placedWeight += bp.weight || 0;
      spatialInsert(spIndex, bp);
      propagateStackLoad(bp, belowFn);
      extremePoints.splice(found.idx, 1);
      // Loại các extreme point "chết" nằm bên trong khối vừa đặt (luôn bị từ chối vì chồng lấn).
      extremePoints = extremePoints.filter(pt => !(
        pt.x >= bp.x - 0.01 && pt.x < bp.x + bp.sizeX - 0.01 &&
        pt.y >= bp.y - 0.01 && pt.y < bp.y + bp.sizeY - 0.01 &&
        pt.z >= bp.z - 0.01 && pt.z < bp.z + bp.sizeZ - 0.01
      ));
      const newPts = generateExtremePointsFromPlacement(bp, container);
      for (const np of newPts){
        // bỏ điểm không thể chứa nổi kiện nhỏ nhất (vd: sát trần) — nếu giữ lại, mọi kiện sau
        // đều phải thử lại các điểm vô ích này
        if (np.x + minD > container.L + 0.5 || np.y + minW > container.H + 0.5 || np.z + minH > container.W + 0.5) continue;
        let dup = false;
        for (const ep of extremePoints){
          if (Math.abs(ep.x-np.x)<0.01 && Math.abs(ep.y-np.y)<0.01 && Math.abs(ep.z-np.z)<0.01){ dup = true; break; }
        }
        if (!dup) extremePoints.push(np);
      }
      // giới hạn số extreme points để tránh nổ bộ nhớ với rất nhiều kiện nhỏ
      if (extremePoints.length > 4000){
        sortPoints();
        extremePoints = extremePoints.slice(0, 3000);
      }
    } else {
      unplaced.push(item);
    }
  }

  return { placed: ownPlaced, unplaced, payloadRejected, heavyRelaxed };
}

/* ------------------------------------------------------------
   packBlocksAlongLength — dùng cho "No mix" + "Right to left".
   Mỗi SKU được chất HẾT thành một khối liền (nhiều lớp cắt ngang) trước khi sang SKU kế
   tiếp; SKU sau chỉ bắt đầu SAU phần dài mà SKU trước đã chiếm (tính theo điểm xa nhất),
   nên hai SKU không bao giờ xen kẽ hay nằm chồng lên nhau.
   Cách làm: gọi packContainer (giữ nguyên, không sửa) cho từng SKU trên một container
   "ảo" ngắn hơn (đã trừ phần dài đã dùng), rồi dịch tọa độ x về vị trí thật.
   Đánh đổi: đầu khối SKU trước hơi lởm chởm nên có một khe hở nhỏ giữa 2 SKU (không chèn
   SKU sau vào đó — vì chèn tức là trộn).
   Thứ tự SKU lấy theo thứ tự xuất hiện trong danh sách đã sắp (đã theo thứ tự người dùng kéo-thả).
   ------------------------------------------------------------ */
// packBlocksAlongAxis — tổng quát cho cả 2 hướng chất: mỗi SKU chất HẾT thành một khối
// liền theo TRỤC ĐANG ƯU TIÊN của hướng chất đó (right_to_left → trục X/dọc cont,
// floor_to_top → trục Y/chiều cao) trước khi sang SKU kế tiếp, nên 2 SKU không bao giờ
// xen kẽ hay chồng lên nhau.
// QUAN TRỌNG: khác bản trước — ta KHÔNG cắt container thành "sub-container ảo" độc lập
// (cách đó khiến support/stacking của khối sau tính sai khi khối trước không phủ kín cả
// mặt cắt, gây ra kiện "treo lơ lửng"). Thay vào đó: gọi packContainer trên ĐÚNG container
// thật, truyền seedPlaced = toàn bộ kiện các khối trước (để support/overlap/stacking tính
// trên hình học thật), và cấm khối hiện tại lấn NGƯỢC vào phần trục đã dùng bằng 1 vùng cấm.
function packBlocksAlongAxis(orderedItems, container, forbiddenZones, opts, axis){
  const groups = new Map();
  for (const it of orderedItems){
    if (!groups.has(it.skuId)) groups.set(it.skuId, []);
    groups.get(it.skuId).push(it);
  }
  const placed = [];
  const unplaced = [];
  let payloadRejected = 0, heavyRelaxed = 0;
  let cursor = 0; // biên đã dùng theo trục (x hoặc y), tính bằng điểm xa nhất của khối trước
  for (const groupItems of groups.values()){
    const fullExtent = axis === 'x' ? container.L : container.H;
    if (cursor >= fullExtent - 0.5){ unplaced.push(...groupItems); continue; }
    // vùng cấm chặn toàn bộ phần TRỤC đã dùng (từ 0 đến cursor), trên suốt 2 trục còn lại —
    // đảm bảo khối mới không bao giờ đặt kiện lấn vào không gian khối trước (dù trước đó có
    // chỗ trống cục bộ), giữ đúng ngữ nghĩa "mỗi SKU một khối liền, không xen kẽ".
    const blockingZone = axis === 'x'
      ? { x:0, y:0, z:0, dx:cursor, dy:container.H, dz:container.W }
      : { x:0, y:0, z:0, dx:container.L, dy:cursor, dz:container.W };
    const zones = cursor > 0.5 ? forbiddenZones.concat([blockingZone]) : forbiddenZones;
    // Điểm khởi đầu cho khối này: gốc (0,0,0) mặc định chỉ dùng được khi cursor=0 (nó nằm
    // trong blockingZone nếu cursor>0). Từ khối thứ 2 trở đi, seed điểm khởi đầu ngay tại
    // biên cursor để khối mới có chỗ bắt đầu (blockingZone chặn phần TRƯỚC cursor, không
    // chặn đúng tại cursor).
    const seedPts = cursor > 0.5
      ? (axis === 'x' ? [{x:cursor,y:0,z:0}] : [{x:0,y:cursor,z:0}])
      : undefined;
    const passOpts = Object.assign({}, opts, { seedPlaced: placed, seedExtremePoints: seedPts });
    let r;
    if (axis === 'x' && opts.spreadLength){
      // "Floor to top" + No mix: khối SKU này chỉ được dùng đoạn dài ∝ thể tích của nó trên phần còn lại → hàng trải
      // tới cửa, thấp đều; không vừa trong đoạn thì phần dư mới được đi tiếp ra phía cửa.
      const vol = (list)=> list.reduce((t,it)=> t + it.volume, 0);
      const remVol = Array.from(groups.values()).filter(g=> !g._done).reduce((t,g)=> t + vol(g), 0);
      const end = cursor + (container.L - cursor) * Math.min(1, vol(groupItems) / Math.max(1, remVol));
      const budgetZone = { x: end, y: 0, z: 0, dx: container.L - end, dy: container.H, dz: container.W };
      r = packContainer(groupItems, container, end < container.L - 0.5 ? zones.concat([budgetZone]) : zones, passOpts);
      if (r.unplaced.length){
        const r2 = packContainer(r.unplaced, container, zones, Object.assign({}, opts, { seedPlaced: placed.concat(r.placed),
          seedExtremePoints: [{ x: end, y: 0, z: 0 }].concat(r.placed.flatMap(p=> generateExtremePointsFromPlacement(p, container))) }));
        r = { placed: r.placed.concat(r2.placed), unplaced: r2.unplaced, payloadRejected: (r.payloadRejected || 0) + (r2.payloadRejected || 0), heavyRelaxed: (r.heavyRelaxed || 0) + (r2.heavyRelaxed || 0) };
      }
      groupItems._done = true;
    } else r = packContainer(groupItems, container, zones, passOpts);
    let blockEnd = cursor;
    for (const p of r.placed){
      if (axis === 'x') blockEnd = Math.max(blockEnd, p.x + p.sizeX);
      else blockEnd = Math.max(blockEnd, p.y + p.sizeY);
      placed.push(p);
    }
    unplaced.push(...r.unplaced);
    payloadRejected += r.payloadRejected || 0;
    heavyRelaxed += r.heavyRelaxed || 0;
    cursor = blockEnd;
  }
  return { placed, unplaced, payloadRejected, heavyRelaxed };
}
// Giữ 2 tên cũ để tương thích (right_to_left dùng trục x, floor_to_top dùng trục y)
function packBlocksAlongLength(orderedItems, container, forbiddenZones, opts){
  return packBlocksAlongAxis(orderedItems, container, forbiddenZones, opts, 'x');
}
function packBlocksAlongHeight(orderedItems, container, forbiddenZones, opts){
  return packBlocksAlongAxis(orderedItems, container, forbiddenZones, opts, 'y');
}

/* ------------------------------------------------------------
   scoreSolution — hàm điểm đánh giá 1 lời giải, theo thứ tự ưu tiên:
   (1) số kiện xếp được, (2) thể tích sử dụng, (3) độ phẳng mặt trên,
   (4) CoG cân bằng.
   ------------------------------------------------------------ */
function scoreSolution(result, container){
  const { placed } = result;
  const totalCount = placed.length;
  let usedVolume = 0, totalWeight = 0;
  let sumX=0, sumZ=0;
  let maxY = 0;
  for (const p of placed){
    usedVolume += p.sizeX * p.sizeY * p.sizeZ;
    totalWeight += p.weight;
    sumX += (p.x + p.sizeX/2) * p.weight;
    sumZ += (p.z + p.sizeZ/2) * p.weight;
    maxY = Math.max(maxY, p.y + p.sizeY);
  }
  const containerVolume = container.L * container.W * container.H;
  const volumeRatio = containerVolume>0 ? usedVolume/containerVolume : 0;

  // độ phẳng mặt trên: phương sai độ cao thấp hơn = điểm cao hơn (đơn giản hóa:
  // dùng số lượng "độ cao đỉnh" khác nhau càng ít càng tốt, chuẩn hóa nghịch đảo)
  const topHeights = new Set(placed.map(p=> Math.round((p.y+p.sizeY)/10)));
  const flatnessScore = placed.length>0 ? 1/(1+topHeights.size/Math.max(1,placed.length)) : 0;

  // CoG: lệch so với tâm hình học container theo X (dọc) và Z (ngang)
  let cogXOffsetPct = 0, cogZOffsetPct = 0;
  if (totalWeight>0){
    const cogX = sumX/totalWeight, cogZ = sumZ/totalWeight;
    cogXOffsetPct = Math.abs(cogX - container.L/2) / (container.L/2) * 100;
    cogZOffsetPct = Math.abs(cogZ - container.W/2) / (container.W/2) * 100;
  }
  const cogScore = 1/(1+ (cogXOffsetPct+cogZOffsetPct)/10);

  // Trọng số tổng hợp: ưu tiên (1) rồi (2) rồi (3)(4) làm tie-breaker nhỏ
  const composite = totalCount * 1000000 + volumeRatio * 10000 + flatnessScore * 100 + cogScore * 10;

  return { totalCount, volumeRatio, usedVolume, containerVolume, flatnessScore, cogScore, cogXOffsetPct, cogZOffsetPct, totalWeight, composite };
}

/* ------------------------------------------------------------
   Bộ sinh số ngẫu nhiên có seed (tái lập được kết quả khi cần)
   ------------------------------------------------------------ */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// Xáo trộn nhẹ 1 thứ tự: đổi chỗ vài cặp lân cận hoặc đảo ngược 1 đoạn ngắn. groupKeyFn (nếu có) giữ
// nguyên ràng buộc nhóm (vd: no-mix — không bao giờ đổi chỗ 2 kiện khác SKU).
function perturbOrder(list, rng, groupKeyFn){
  const a = list.slice(), n = a.length;
  if (n < 2) return a;
  const sameGroup = (i,j)=> !groupKeyFn || groupKeyFn(a[i]) === groupKeyFn(a[j]);
  if (rng() < 0.5){
    const k = Math.max(1, Math.round(n * (0.01 + rng()*0.04)));
    const reach = Math.max(2, Math.round(n * 0.1));
    for (let t=0; t<k; t++){
      const i = Math.floor(rng()*n);
      const j = Math.min(n-1, Math.max(0, i + Math.round((rng()*2-1)*reach)));
      if (i !== j && sameGroup(i,j)){ const tmp = a[i]; a[i] = a[j]; a[j] = tmp; }
    }
  } else {
    const len = 2 + Math.floor(rng() * Math.min(n-1, 30));
    const i = Math.floor(rng() * Math.max(1, n - len));
    let ok = true;
    for (let t=i+1; t<i+len && t<n; t++) if (!sameGroup(i,t)){ ok = false; break; }
    if (ok){ const seg = a.slice(i, i+len).reverse(); for (let t=0; t<seg.length; t++) a[i+t] = seg[t]; }
  }
  return a;
}

/* ------------------------------------------------------------
   searchBestPacking — vòng tìm kiếm dùng chung cho Bulk và Pallet.
   Giai đoạn 1: các thứ tự sắp xếp tất định (sort strategies).
   Giai đoạn 2 (Kỹ / Rất kỹ): tìm kiếm cục bộ ngẫu nhiên quanh thứ tự tốt nhất cho tới khi hết ngân sách
   thời gian (Rất kỹ) hoặc liên tiếp nhiều vòng không cải thiện (Kỹ).
   groupKeyFn: giữ thứ tự nhóm cố định (no-mix / partial-block), chỉ thay đổi thứ tự BÊN TRONG nhóm.
   onImprove(best): gọi khi có phương án tốt hơn (tối đa ~1 lần/0,8s) — cho phép "Dừng & lấy kết quả".
   ------------------------------------------------------------ */
function searchBestPacking(items, packPass, container, opts, onProgress, onImprove, groupKeyFn){
  const LEVELS = {
    fast:     { passes:2, budget:2000,  perturb:false, patience:0 },
    balanced: { passes:5, budget:8000,  perturb:false, patience:0 },
    thorough: { passes:9, budget:30000, perturb:true,  patience:60 },
    max:      { passes:9, budget:Math.max(30, opts.maxTimeSec || 120) * 1000, perturb:true, patience:Infinity }
  };
  const lv = LEVELS[opts.speedLevel] || LEVELS.balanced;
  const allStrategies = getSortStrategies();
  const strategies = lv.perturb ? allStrategies : allStrategies.filter(s=> !s.extra);
  const maxPasses = Math.min(lv.passes, strategies.length);
  const t0 = Date.now();
  const seed = (opts.seed >>> 0) || ((Date.now() ^ 0x5bd1e995) >>> 0);
  let best = null, passesRun = 0, stoppedByBudget = false, lastPost = 0;

  const sortBy = (cmp)=> groupKeyFn
    ? items.slice().sort((a,b)=> (groupKeyFn(a) - groupKeyFn(b)) || cmp(a,b))
    : items.slice().sort(cmp);
  const consider = (result, name, order)=>{
    const sc = scoreSolution(result, container);
    if (!best || sc.composite > best.score.composite + 1e-9){
      best = { result, score: sc, strategyName: name, order };
      if (onImprove && Date.now() - lastPost > 800){ lastPost = Date.now(); onImprove(best, passesRun); }
      return true;
    }
    return false;
  };

  for (let s=0; s<strategies.length && passesRun < maxPasses; s++){
    if (passesRun >= 1 && (Date.now() - t0) > lv.budget){ stoppedByBudget = true; break; }
    const strat = strategies[s];
    const ordered = sortBy(strat.cmp);
    if (onProgress) onProgress(passesRun+1, maxPasses, "Pass " + (passesRun+1) + "/" + maxPasses + " — thứ tự: " + strat.name);
    consider(packPass(ordered), strat.name, ordered);
    passesRun++;
  }

  let perturbIters = 0;
  if (lv.perturb && best && items.length > 1 && !stoppedByBudget){
    const rng = mulberry32(seed);
    let sinceImprove = 0;
    const baseName = best.strategyName;
    while ((Date.now() - t0) < lv.budget && sinceImprove < lv.patience){
      perturbIters++;
      const cand = perturbOrder(best.order, rng, groupKeyFn);
      if (consider(packPass(cand), baseName + "~r" + perturbIters, cand)) sinceImprove = 0; else sinceImprove++;
      passesRun++;
      if (onProgress && perturbIters % 2 === 0){
        onProgress(Date.now() - t0, lv.budget, `Tìm kiếm ngẫu nhiên — vòng ${perturbIters} · tốt nhất: ${best.score.totalCount} kiện, ${(best.score.volumeRatio*100).toFixed(1)}% thể tích`);
      }
    }
    if ((Date.now() - t0) >= lv.budget && opts.speedLevel !== 'max') stoppedByBudget = true;
  }
  if (best && onImprove) onImprove(best, passesRun);
  return { best, passesRun, perturbIters, stoppedByBudget, budgetMs: lv.budget, t0, seed };
}

function packageBulkOutput(best, meta){
  return Object.assign({
    mode: 'bulk',
    placed: best.result.placed,
    unplaced: best.result.unplaced,
    best: { strategyName: best.strategyName, score: best.score },
    heavyRelaxed: best.result.heavyRelaxed || 0,
    payloadRejected: best.result.payloadRejected || 0
  }, meta);
}

/* ------------------------------------------------------------
   runOptimizerCore (BULK) — tiền xử lý, gọi searchBestPacking, vòng lấp khoảng trống.
   opts: { speedLevel, maxTimeSec, heavyBottomPriority, supportThreshold, enforcePayload, mixMode,
           partialMixType, skuOrder, loadingDirection, smartFitEnabled }
   ------------------------------------------------------------ */
function runOptimizerCore(skus, container, forbiddenZones, opts, onProgress, onImprove){
  const items = expandSkuToItems(skus);
  const totalRequested = items.length;

  if (totalRequested === 0){
    return { mode:'bulk', placed:[], unplaced:[], best:null, passesRun:0, totalRequested:0, smartFitNotes:[] };
  }

  // Smart fit (tùy chọn): khóa orientation cho 1 số item để lấp khít (không vượt) trục L hoặc W.
  let smartFitNotes = [];
  if (opts.smartFitEnabled){
    const sf = applySmartFitToItems(items, skus, container);
    smartFitNotes = sf.notes;
  }

  const packOpts = {
    supportThreshold: opts.supportThreshold,
    heavyBottomPriority: opts.heavyBottomPriority,
    loadingDirection: opts.loadingDirection,
    payloadLimit: opts.enforcePayload ? container.payload : null,
    // thùng chạm điểm mù: bỏ trống ô đó (như bốc xếp thật) thay vì đẩy lệch thùng ra ôm sát cạnh gờ
    rules: opts.zoneNoShift === false ? {} : { _noShift: true }
  };
  // "No mix": mỗi SKU là một khối liền theo CHIỀU DÀI cont (từ đáy ra cửa) — đúng thực tế bốc xếp, với mọi hướng chất.
  // Floor to top: mỗi khối được cấp đoạn dài theo tỉ lệ thể tích → hàng trải tới cửa, thấp đều (không chồng SKU lên nhau).
  const blockByLength = opts.mixMode === 'none';
  // Kiểm hóa (bulk): n thùng mỗi SKU dành cho lớp sát cửa → lượt chính chừa 1 đoạn ở cửa (doorZone)
  const customsOn = opts.bulkCustoms && opts.bulkCustoms.enabled && opts.bulkCustoms.n > 0;
  let customsItems = [], doorZone = null;
  if (customsOn){
    const n = opts.bulkCustoms.n;
    skus.forEach(k=>{ const its = items.filter(it=> it.skuId === k.id); customsItems.push(...its.slice(-Math.min(n, its.length))); });
    const cs = new Set(customsItems);
    for (let i = items.length - 1; i >= 0; i--) if (cs.has(items[i])) items.splice(i, 1);
    // chiều sâu đoạn cửa: đủ chứa số thùng kiểm hóa theo hướng thùng cho nhiều thùng nhất trên 1 mặt cắt rộng × cao
    let best = null;
    if (customsItems.length) customsItems[0].orientations.forEach(o=>{
      const per = Math.floor(container.W / o.h) * Math.floor(Math.min(container.H, container.doorH || container.H) / o.w);
      if (per > 0){ const depth = Math.ceil(customsItems.length / per) * o.d; if (best == null || depth < best) best = depth; }
    });
    if (best) doorZone = { x: container.L - best, y: 0, z: 0, dx: best, dy: container.H, dz: container.W, kind: 'customs-door' };
  }
  const zonesMain = doorZone ? forbiddenZones.concat([doorZone]) : forbiddenZones;
  const blockOpts = Object.assign({}, packOpts, { spreadLength: opts.loadingDirection !== 'right_to_left' });
  const packPass = (list)=>{
    if (!blockByLength) return packContainer(list, container, zonesMain, packOpts);
    const r = packBlocksAlongLength(list, container, zonesMain, blockOpts);
    if (!blockOpts.spreadLength || !r.unplaced.length) return r;
    // cont gần đầy: chia đoạn theo tỉ lệ có thể làm rớt hàng → thử thêm cách khối liền không chia đoạn, lấy cách xếp được nhiều hơn
    const r2 = packBlocksAlongLength(list, container, zonesMain, packOpts);
    return r2.placed.length > r.placed.length ? r2 : r;
  };

  // No-mix / partial-block: thứ tự SKU khóa cứng, chỉ thứ tự BÊN TRONG từng SKU được thay đổi.
  let groupKeyFn = null;
  if (opts.mixMode === 'none' || (opts.mixMode === 'partial' && opts.partialMixType === 'block')){
    const orderMap = {};
    (opts.mixMode === 'none' ? (opts.skuOrder || []) : skus.map(s=> s.id)).forEach((id,idx)=> orderMap[id] = idx);
    groupKeyFn = (it)=> orderMap[it.skuId] ?? 999;
  }

  const meta = (passesRun, extra)=> Object.assign({ totalRequested, smartFitNotes, passesRun }, extra || {});
  // Kiểu rải lớp khi cont chưa đầy: "rải đều" / "bậc thang" — lập kế hoạch theo lớp cắt ngang (rộng × cao)
  const layoutMode = opts.bulkLayout && opts.bulkLayout.mode;
  if (layoutMode === 'even' || layoutMode === 'stair'){
    const plan = planBulkSlices(skus, container, forbiddenZones, opts);
    if (plan && !plan.na){
      const result = { placed: plan.placed, unplaced: plan.unplaced, payloadRejected: plan.payloadRejected || 0, heavyRelaxed: 0 };
      return packageBulkOutput({ result, score: scoreSolution(result, container), strategyName: 'slices-' + layoutMode },
        meta(1, { layoutNotes: plan.notes }));
    }
    smartFitNotes = smartFitNotes.concat([plan && plan.na ? plan.na : 'Không lập được kế hoạch rải lớp — dùng cách chất thường.']);
  }
  const search = searchBestPacking(items, packPass, container, opts, onProgress,
    onImprove ? (b, passes)=> onImprove(packageBulkOutput(b, meta(passes, { partial:true }))) : null, groupKeyFn);
  let best = search.best;

  // Vòng bổ sung: thử đặt thêm các kiện dư vào khoảng trống (bỏ qua khi chất theo khối — chèn = trộn SKU).
  if (best && !blockByLength && best.result.unplaced.length > 0 && opts.speedLevel !== 'fast' && (Date.now() - search.t0) <= search.budgetMs){
    if (onProgress) onProgress(1, 1, "Vòng bổ sung — lấp khoảng trống còn lại...");
    const byId = new Map(items.map(it=> [it.instanceId, it]));
    const retryOrdered = best.result.unplaced.slice().sort((a,b)=> a.volume - b.volume); // thử hàng nhỏ trước
    const combinedOrder = [
      ...best.result.placed.map(p=> byId.get(p.instanceId)),
      ...retryOrdered
    ].filter(Boolean);
    const combinedResult = packPass(combinedOrder);
    const combinedScore = scoreSolution(combinedResult, container);
    if (combinedScore.composite > best.score.composite){
      best = { result: combinedResult, score: combinedScore, strategyName: best.strategyName + "+fill", order: combinedOrder };
    }
  }

  const layoutNotes = [];
  // Mọi SKU cùng kích thước: thử thêm lưới thẳng hàng theo lớp cắt ngang (tương đương hướng chất đang chọn) —
  // lô gần đầy cont thường xếp được nhiều hơn thuật toán điểm cực trị; lấy cách nào xếp được NHIỀU thùng hơn.
  // (trộn giới hạn: lưới chỉ có tối đa 2 SKU ở lớp chuyển SKU → dùng được khi cho phép ≥ 2 SKU/lớp)
  if (best && (!opts.bulkLayout || !opts.bulkLayout.mode || opts.bulkLayout.mode === 'default') && (opts.mixMode !== 'partial' || (opts.partialMixN || 1) >= 2)){
    const rtl = opts.loadingDirection === 'right_to_left';
    const alt = planBulkSlices(skus, container, forbiddenZones, Object.assign({}, opts, { bulkLayout: rtl ? { mode: 'stair', keep: null, step: 999 } : { mode: 'even' } }));
    if (alt && !alt.na && alt.placed.length > best.result.placed.length + customsItems.length){
      const result = { placed: alt.placed, unplaced: alt.unplaced, payloadRejected: alt.payloadRejected || 0, heavyRelaxed: 0 };
      return packageBulkOutput({ result, score: scoreSolution(result, container), strategyName: 'grid-' + (rtl ? 'rtl' : 'even') },
        meta(search.passesRun, { layoutNotes: [`Mọi SKU cùng kích thước → xếp lưới thẳng hàng theo lớp cắt ngang được nhiều hơn (${alt.placed.length} so với ${best.result.placed.length + customsItems.length} thùng).`].concat(alt.notes.slice(-1)) }));
    }
  }
  if (customsItems.length && best){
    // lượt kiểm hóa: chất n thùng/SKU vào đoạn sát cửa đã chừa (khít với khối hàng phía trong)
    const seedEps = [{ x: doorZone ? doorZone.x : 0, y: 0, z: 0 }].concat(best.result.placed.flatMap(p=> generateExtremePointsFromPlacement(p, container)));
    const rc = packContainer(customsItems.slice().sort((a,b)=> b.weight - a.weight), container, forbiddenZones,
      Object.assign({}, packOpts, { loadingDirection: 'floor_to_top', seedPlaced: best.result.placed, seedExtremePoints: seedEps }));
    rc.placed.forEach(p=> p.tag = 'customs');
    // hàng thường còn dư: lấp phần trống còn lại của lớp cửa (cùng lớp với hàng kiểm hóa — không chắn phía trước nó)
    let placedAll = best.result.placed.concat(rc.placed), restUnplaced = best.result.unplaced;
    if (restUnplaced.length){
      const rf = packContainer(restUnplaced, container, forbiddenZones, Object.assign({}, packOpts, { seedPlaced: placedAll,
        seedExtremePoints: placedAll.flatMap(p=> generateExtremePointsFromPlacement(p, container)) }));
      const csMin = rc.placed.length ? Math.min(...rc.placed.map(p=> p.x)) : Infinity;
      const ok = rf.placed.filter(p=> p.x + p.sizeX <= container.L - 0.5 || p.x >= csMin - 0.5 || !rc.placed.length);
      // không nhận thùng thường nằm chắn ngoài thùng kiểm hóa (x lớn hơn đầu ngoài của hàng kiểm hóa)
      const csMaxX = rc.placed.length ? Math.max(...rc.placed.map(p=> p.x + p.sizeX)) : Infinity;
      const onCustoms = (p)=> rc.placed.some(cq=> p.y >= cq.y + cq.sizeY - 1 && Math.min(p.x + p.sizeX, cq.x + cq.sizeX) - Math.max(p.x, cq.x) > 1 &&
                                                   Math.min(p.z + p.sizeZ, cq.z + cq.sizeZ) - Math.max(p.z, cq.z) > 1);
      const keep = ok.filter(p=> p.x < csMaxX - 0.5 && !onCustoms(p));      // không chắn trước, không đè lên hàng kiểm hóa
      placedAll = placedAll.concat(keep);
      const kept = new Set(keep.map(p=> p.instanceId));
      restUnplaced = restUnplaced.filter(it=> !kept.has(it.instanceId));
    }
    customsToTop(placedAll);
    const result = { placed: placedAll, unplaced: restUnplaced.concat(rc.unplaced),
                     payloadRejected: best.result.payloadRejected, heavyRelaxed: best.result.heavyRelaxed };
    best = { result, score: scoreSolution(result, container), strategyName: best.strategyName + '+kiểm hóa', order: best.order };
    layoutNotes.push(`Kiểm hóa: ${rc.placed.length}/${customsItems.length} thùng (${opts.bulkCustoms.n} thùng/SKU) chất ở lớp sát cửa` +
      (rc.unplaced.length ? ` — ${rc.unplaced.length} thùng không còn chỗ ở đoạn cửa.` : ', nằm trên cùng (không thùng nào đè lên).'));
  }
  return packageBulkOutput(best, meta(search.passesRun, {
    stoppedByBudget: search.stoppedByBudget, budgetMs: search.budgetMs, seed: search.seed, perturbIters: search.perturbIters, layoutNotes
  }));
}

/* Thùng kiểm hóa phải LỘ RA TRÊN CÙNG (không thùng nào đè lên) và càng gần cửa càng tốt: chọn các ô "lộ đỉnh" cùng cỡ
   thùng, ưu tiên gần cửa rồi cao hơn; đổi DANH TÍNH (SKU/mã thùng/khối lượng) giữa thùng kiểm hóa đang bị đè và thùng thường
   đang chiếm ô lộ đỉnh. Hình học không đổi → không phát sinh chồng lấn/thiếu đỡ. */
function customsToTop(placed){
  const cus = placed.filter(p=> p.tag === 'customs');
  if (!cus.length) return 0;
  const dimKey = (p)=> Math.round(p.sizeX) + 'x' + Math.round(p.sizeY) + 'x' + Math.round(p.sizeZ);
  const byX = placed.slice().sort((a,b)=> a.x - b.x);
  const exposed = (q)=> !byX.some(o=> o !== q && Math.abs(o.y - (q.y + q.sizeY)) < 1.5 &&
    Math.min(q.x + q.sizeX, o.x + o.sizeX) - Math.max(q.x, o.x) > 1 && Math.min(q.z + q.sizeZ, o.z + o.sizeZ) - Math.max(q.z, o.z) > 1);
  let swaps = 0;
  const groups = {};
  cus.forEach(p=> (groups[dimKey(p)] = groups[dimKey(p)] || []).push(p));
  Object.entries(groups).forEach(([key, cs])=>{
    const targets = placed.filter(p=> dimKey(p) === key && exposed(p)).sort((a,b)=> (b.x - a.x) || (b.y - a.y) || (a.z - b.z)).slice(0, cs.length);
    const tset = new Set(targets);
    const wrong = cs.filter(p=> !tset.has(p)), free = targets.filter(p=> p.tag !== 'customs');
    const ID = ['skuId', 'skuCode', 'color', 'weight', 'fragile', 'instanceId', 'tag', 'maxStackCount', 'maxStackLoad'];
    wrong.forEach((c, i)=>{
      const t = free[i]; if (!t) return;
      ID.forEach(f=>{ const v = c[f]; c[f] = t[f]; t[f] = v; });
      swaps++;
    });
  });
  return swaps;
}

/* ------------------------------------------------------------
   KẾ HOẠCH LỚP CẮT NGANG (bulk) — cho cont chưa đầy:
   chia chiều dài cont thành các LỚP (lát cắt rộng × cao, sâu = 1 thùng), mọi lớp cùng 1 hướng thùng, lưới thẳng hàng.
   Chiều cao (số hàng) từng lớp theo kiểu:
     'even'  — RẢI ĐỀU tới cửa: các lớp cao bằng nhau, chênh tối đa 1 hàng (lớp phía trong cao hơn);
     'stair' — BẬC THANG: giữ k lớp cao tối đa (k tự tính nếu bỏ trống), rồi mỗi lớp hạ n hàng.
   Thùng điền theo thứ tự SKU (khối liền từ đáy ra cửa); trong lớp: hàng dưới trước, phải → trái. Thùng kiểm hóa
   (nếu bật) điền SAU CÙNG → nằm ở lớp sát cửa. Ô lưới chạm vùng cấm/điểm mù bị bỏ qua.
   Chỉ áp dụng khi mọi SKU cùng kích thước & quyền xoay, không giới hạn chồng/dễ vỡ; ngược lại trả { na }.
   ------------------------------------------------------------ */
function planBulkSlices(skus, container, zones, opts){
  const act = skus.filter(k=> (k.qty || 0) > 0);
  if (!act.length) return null;
  const k0 = act[0], o0 = generateOrientations(k0);
  const sameDims = act.every(k=> Math.abs(k.L - k0.L) <= 1 && Math.abs(k.W - k0.W) <= 1 && Math.abs(k.H - k0.H) <= 1 &&
                                 generateOrientations(k).length === o0.length);
  if (!sameDims) return { na: 'Kiểu rải lớp (rải đều / bậc thang) chỉ áp dụng khi mọi SKU cùng kích thước thùng — đã dùng cách chất thường.' };
  if (act.some(k=> k.fragile || k.maxStackCount != null || k.maxStackLoad != null))
    return { na: 'Có SKU dễ vỡ / giới hạn chồng — kiểu rải lớp không áp dụng, đã dùng cách chất thường.' };
  const L = container.L, W = container.W, H = container.H;
  const BL = opts.bulkLayout || {};
  const ordered = (opts.skuOrder || []).map(id=> act.find(k=> k.id === id)).filter(Boolean);
  act.forEach(k=>{ if (!ordered.includes(k)) ordered.push(k); });
  const nCus = opts.bulkCustoms && opts.bulkCustoms.enabled ? Math.max(0, opts.bulkCustoms.n | 0) : 0;
  const seq = [], cus = [];
  ordered.forEach(k=>{
    const c = Math.min(nCus, k.qty);
    for (let i = 0; i < k.qty - c; i++) seq.push({ k, i });
    for (let i = k.qty - c; i < k.qty; i++) cus.push({ k, i, customs: true });
  });
  const all = seq.concat(cus), total = all.length;
  /* Mẫu lớp cắt ngang: mọi hàng cùng chiều sâu d (dọc cont) nhưng MỖI HÀNG CÓ THỂ KHÁC HƯỚNG THÙNG — vd 8 hàng thùng
     đứng (cao 265, 9 thùng/hàng) + 1 hàng trên cùng thùng nằm (cao 245, 8 thùng/hàng) khi trần không đủ cho hàng đứng thứ 9.
     Thử mọi tổ hợp số hàng mỗi kiểu (chỉ các hướng thẻ SKU cho phép), xếp kiểu nhiều thùng/hàng ở dưới, kiểu thấp lên trên;
     chọn tổ hợp chứa nhiều thùng nhất sau khi trừ ô chạm điểm mù (ô chạm điểm mù bỏ trống, không xếp lệch ôm gờ). */
  const templateFor = (os)=>{
    const d = os[0].d, S = Math.floor(L / d);
    if (!S) return null;
    const seen = new Set(), types = [];
    os.forEach(o=>{
      const k = Math.round(o.w) + 'x' + Math.round(o.h);
      if (seen.has(k)) return; seen.add(k);
      const nW = Math.floor(W / o.h);
      if (nW > 0 && o.w <= H) types.push({ o, h: o.w, w: o.h, nW, z0: (W - nW * o.h) / 2 });
    });
    if (!types.length) return null;
    types.sort((a,b)=> (b.nW - a.nW) || (b.h - a.h));       // hàng nhiều thùng / cao hơn ở dưới
    const minH = Math.min(...types.map(t=> t.h));
    let best = null;
    const evaluate = (counts)=>{
      const rows = []; let y = 0;
      types.forEach((t, i)=>{ for (let n = 0; n < counts[i]; n++){ rows.push(Object.assign({ y }, t)); y += t.h; } });
      if (!rows.length) return;
      const free = []; let cap = 0;
      for (let sI = 0; sI < S; sI++){
        const rr = rows.map(R=>{
          const cols = [];
          for (let c = 0; c < R.nW; c++){
            if (!firstForbiddenHit({ x: sI * d, y: R.y, z: R.z0 + c * R.w, sizeX: d, sizeY: R.h, sizeZ: R.w }, zones)) cols.push(c);
          }
          cap += cols.length; return cols;
        });
        free.push(rr);
      }
      const nTypes = counts.filter(n=> n > 0).length;
      if (!best || cap > best.cap || (cap === best.cap && (nTypes < best.nTypes || (nTypes === best.nTypes && rows.length < best.rows.length))))
        best = { d, S, rows, free, cap, nTypes, nH: rows.length };
    };
    const counts = types.map(()=> 0);
    const rec = (i, hLeft)=>{
      if (i === types.length){ if (hLeft < minH) evaluate(counts); return; }   // chỉ tổ hợp đã kín chiều cao
      for (let n = Math.floor(hLeft / types[i].h); n >= 0; n--){ counts[i] = n; rec(i + 1, hLeft - n * types[i].h); }
      counts[i] = 0;
    };
    rec(0, H);
    return best;
  };
  const fams = new Map();
  o0.forEach(o=>{ const k = Math.round(o.d); if (!fams.has(k)) fams.set(k, []); fams.get(k).push(o); });
  const grids = Array.from(fams.values()).map(templateFor).filter(Boolean);
  if (!grids.length) return { na: 'Thùng không vừa lòng cont theo hướng nào — đã dùng cách chất thường.' };
  // mẫu lớp: đủ chỗ cho cả lô trước, rồi nhiều thùng / mm chiều dài nhất
  grids.sort((a,b)=> ((b.cap >= total) - (a.cap >= total)) || (b.cap / (b.S * b.d) - a.cap / (a.S * a.d)));
  const G = grids[0];
  const rowTxt = (()=>{
    const parts = []; G.rows.forEach(R=>{ const last = parts[parts.length - 1]; if (last && last.R.h === R.h && last.R.w === R.w) last.n++; else parts.push({ R, n: 1 }); });
    return parts.map(p=> `${p.n} hàng × ${p.R.nW} thùng (cao ${fmtIntSafe(p.R.h)}, ngang ${fmtIntSafe(p.R.w)})`).join(' + ');
  })();
  const capRows = (sI, rows)=>{ let n = 0; for (let r = 0; r < rows; r++) n += G.free[sI][r].length; return n; };
  const capOf = (p)=> p.reduce((t, rr, i)=> t + capRows(i, rr), 0);
  let profile = null; const notes = [], trimmed = new Set();
  if (BL.mode === 'even'){
    // R hàng nhỏ nhất mà mọi lớp R hàng chứa đủ; rồi hạ 1 hàng ở các lớp phía cửa khi vẫn đủ chỗ
    let R = 1; while (R < G.nH && capOf(Array(G.S).fill(R)) < total) R++;
    profile = Array(G.S).fill(R);
    for (let sI = G.S - 1; sI >= 0 && R > 1; sI--){
      const drop = capRows(sI, R) - capRows(sI, R - 1);
      if (capOf(profile) - drop >= total) profile[sI] = R - 1; else break;
    }
    notes.push(`Rải đều tới cửa: ${G.S} lớp cắt ngang, cao ${Math.min(...profile)}–${Math.max(...profile)} hàng. Mẫu lớp đầy (sâu ${fmtIntSafe(G.d)}): ${rowTxt}.`);
  } else {
    // giữ k lớp cao tối đa → sau đó CỨ m lớp hạ n hàng → không thấp hơn h hàng (các lớp sau giữ mức h)
    const step = Math.max(1, (BL.step | 0) || 1);
    const every = Math.max(1, (BL.every | 0) || 1);
    const minR = Math.min(G.nH, Math.max(1, (BL.minRows | 0) || 1));
    const prof = (k)=> Array.from({ length: G.S }, (_, i)=> i < k ? G.nH : Math.max(minR, G.nH - step * (Math.floor((i - k) / every) + 1)));
    let k = BL.keep != null && BL.keep !== '' ? Math.max(0, BL.keep | 0) : null;
    if (k == null){ k = 0; while (k < G.S && capOf(prof(k)) < total) k++; }
    else if (capOf(prof(k)) < total){
      const kIn = k; while (k < G.S && capOf(prof(k)) < total) k++;
      notes.push(`Bậc thang: giữ ${kIn} lớp cao tối đa không đủ chỗ cho cả lô → tự tăng lên ${k} lớp.`);
    }
    profile = prof(k);
    if (capOf(profile) < total) notes.push(`Bậc thang: kể cả giữ cao tối đa mọi lớp vẫn không đủ chỗ cho cả lô.`);
    // bỏ hẳn các lớp đuôi không cần tới
    for (let i = G.S - 1; i >= 0; i--){
      if (!profile[i]) continue;
      if (capOf(profile) - capRows(i, profile[i]) >= total) profile[i] = 0; else break;
    }
    // phần dư (< 1 lớp): bớt ô ở HÀNG TRÊN CÙNG của các lớp CAO NHẤT (phía trong) → lớp sát cửa đủ hàng, không thấp hơn
    // mức tối thiểu. Mỗi vòng bớt tối đa 1 hàng ở mỗi lớp, lớp cao trước.
    let extra = capOf(profile) - total, trimmedN = 0;
    const cur = profile.slice();
    for (let round = 0; extra > 0 && round < G.nH; round++){
      // cùng chiều cao: bớt ở lớp gần cửa hơn trước → dáng bậc thang vẫn không tăng dần ra cửa
      const order = cur.map((h, i)=> [h, i]).filter(([h])=> h > minR).sort((a,b)=> b[0] - a[0] || b[1] - a[1]);
      if (!order.length) break;
      for (const [, i] of order){
        if (extra <= 0) break;
        const top = cur[i] - 1;
        for (const c of G.free[i][top].slice().reverse()){ if (extra <= 0) break; trimmed.add(i + '|' + top + '|' + c); extra--; trimmedN++; }
        cur[i]--;
      }
    }
    notes.push(`Bậc thang: ${k} lớp đầu cao tối đa ${G.nH} hàng, sau đó cứ ${every} lớp hạ ${step} hàng, thấp nhất ${minR} hàng ` +
      `(mẫu lớp đầy sâu ${fmtIntSafe(G.d)}: ${rowTxt})` +
      (trimmedN ? `; ${trimmedN} ô hàng trên cùng ở các lớp phía trong để trống cho lớp cửa tròn hàng.` : '.'));
  }
  const placed = [], payload = opts.enforcePayload ? container.payload : null;
  let wSum = 0, idx = 0, payloadRejected = 0;
  // Thứ tự ô trong 1 lớp = đúng cách bốc xếp thực tế: xếp HÀNG SÀN ngang hết bề rộng cont, rồi chồng hàng kế lên trên
  // (từ dưới lên, từ vách phải sang trái). Đổi SKU giữa chừng lớp thì SKU sau nối tiếp ở các hàng phía trên của chính lớp đó —
  // không bao giờ chia lớp thành cột đứng 2 SKU cạnh nhau (phi thực tế).
  const cellsOf = (sI)=>{
    const out = [];
    for (let r = 0; r < profile[sI]; r++) G.free[sI][r].forEach(c=> out.push([r, c]));
    return out.filter(([r, c])=> !trimmed.has(sI + '|' + r + '|' + c));
  };
  for (let sI = 0; sI < G.S && idx < all.length; sI++){
    for (const [r, c] of cellsOf(sI)){
      if (idx >= all.length) break;
      const it = all[idx];
      if (payload && wSum + it.k.weight > payload + 1e-6){ payloadRejected = all.length - idx; idx = all.length; break; }
      const R = G.rows[r];
      placed.push({ x: sI * G.d, y: R.y, z: R.z0 + c * R.w, sizeX: G.d, sizeY: R.h, sizeZ: R.w,
        skuId: it.k.id, weight: it.k.weight, fragile: !!it.k.fragile, maxStackCount: null, maxStackLoad: null,
        orientCode: R.o.code, instanceId: it.k.id + '_' + it.i, tag: it.customs ? 'customs' : undefined, _row: r });
      wSum += it.k.weight; idx++;
    }
  }
  const unplaced = all.slice(placed.length).map(it=> ({ instanceId: it.k.id + '_' + it.i, skuId: it.k.id, skuCode: it.k.code, weight: it.k.weight,
    volume: it.k.L * it.k.W * it.k.H }));
  const used = placed.length ? Math.max(...placed.map(p=> Math.round(p.x / G.d))) + 1 : 0;
  const rowsUsed = [];
  for (let sI = 0; sI < used; sI++) rowsUsed.push(Math.max(0, ...placed.filter(p=> Math.round(p.x / G.d) === sI).map(p=> p._row + 1)));
  placed.forEach(p=> delete p._row);
  if (cus.length) customsToTop(placed);
  notes.push(`Số hàng (chiều cao) từng lớp, từ đáy ra cửa: ${rowsUsed.join(' · ')}.` + (cus.length ? ` Kiểm hóa: ${cus.length} thùng (${nCus}/SKU) ở lớp sát cửa, nằm TRÊN CÙNG (không thùng nào đè lên).` : ''));
  if (unplaced.length) notes.push(`Kế hoạch lớp không đủ chỗ cho ${unplaced.length} thùng.`);
  return { placed, unplaced, payloadRejected, notes };
}

/* ============================================================
   6a. ĐIỂM MÙ CẤU TRÚC → VÙNG CẤM TỰ SINH
   c: {L,W,H,doorW,doorH}; s: state.container.struct. Tọa độ: x=0 vách kín, x=L cửa; z=0 vách PHẢI (đứng ở cửa nhìn vào).
   ============================================================ */
function buildStructuralZones(c, s){
  const zones = [];
  if (!s || !s.enabled) return zones;
  const add = (z)=>{ if (z.dx > 0.5 && z.dy > 0.5 && z.dz > 0.5) zones.push(Object.assign({ auto:true }, z)); };
  if (s.gusset && s.gusset.on){
    const g = s.gusset;
    add({ kind:'gusset', note:'Gờ góc trên — vách kín, bên phải', x:0, y:c.H - g.dy, z:0,          dx:g.dx, dy:g.dy, dz:g.dz });
    add({ kind:'gusset', note:'Gờ góc trên — vách kín, bên trái', x:0, y:c.H - g.dy, z:c.W - g.dz, dx:g.dx, dy:g.dy, dz:g.dz });
  }
  if (s.topRail && s.topRail.on){
    const r = s.topRail;
    add({ kind:'toprail', note:'Ray nóc — vách phải', x:0, y:c.H - r.dy, z:0,          dx:c.L, dy:r.dy, dz:r.dz });
    add({ kind:'toprail', note:'Ray nóc — vách trái', x:0, y:c.H - r.dy, z:c.W - r.dz, dx:c.L, dy:r.dy, dz:r.dz });
  }
  const depth = (s.header && s.header.depth) || 0;
  if (s.header && s.header.on && c.doorH && c.doorH < c.H){
    add({ kind:'header', note:'Đà cửa (H1 − H2)', x:c.L - depth, y:c.doorH, z:0, dx:depth, dy:c.H - c.doorH, dz:c.W });
  }
  if (s.doorPost && s.doorPost.on && c.doorW && c.doorW < c.W){
    const side = (c.W - c.doorW) / 2;
    add({ kind:'doorpost', note:'Trụ cửa phải', x:c.L - depth, y:0, z:0,          dx:depth, dy:c.H, dz:side });
    add({ kind:'doorpost', note:'Trụ cửa trái', x:c.L - depth, y:0, z:c.W - side, dx:depth, dy:c.H, dz:side });
  }
  if (s.topClear > 0)  add({ kind:'clearance', note:'Khe trần thao tác', x:0, y:c.H - s.topClear, z:0, dx:c.L, dy:s.topClear, dz:c.W });
  if (s.sideClear > 0){
    add({ kind:'clearance', note:'Khe vách hông phải', x:0, y:0, z:0, dx:c.L, dy:c.H, dz:s.sideClear });
    add({ kind:'clearance', note:'Khe vách hông trái', x:0, y:0, z:c.W - s.sideClear, dx:c.L, dy:c.H, dz:s.sideClear });
  }
  if (s.doorClear > 0) add({ kind:'clearance', note:'Khe sát cửa', x:c.L - s.doorClear, y:0, z:0, dx:s.doorClear, dy:c.H, dz:c.W });
  return zones;
}

/* ============================================================
   6b. PALLET ENGINE v2 — thuần túy (không DOM), chạy trong worker.
   Nguyên tắc: MỌI pallet là chồng các LỚP PHẲNG (slab). Lớp bên dưới luôn "đầy" (≥ 75% mặt pallet)
   và cao đều; chỉ lớp TRÊN CÙNG được thưa/lệch cao. → khối hàng vuông vức, quấn màng co / nẹp góc /
   đai được. Không còn dùng bộ xếp 3D tự do (extreme point) để chất thùng lên pallet.
     Tầng 1a: pallet thuần SKU theo MẪU LỚP tối ưu (guillotine DP + pinwheel), ghép column/interlock.
     Tầng 1b: thùng lẻ → lớp đều theo nhóm chiều cao (MaxRects 2D) → lớp trên cùng hỗn hợp.
     Tầng 1c: gộp chồng (merge) để giảm số pallet, theo chế độ trộn SKU.
     Tầng 2 : xếp pallet vào cont (dùng lại packContainer).
   Hệ tọa độ trên mặt pallet: x theo chiều Dài pallet (L), y theo chiều Rộng (W), gốc = góc mặt pallet.
   ============================================================ */

const SLAB_FULL_COVERAGE = 0.75; // lớp phủ ≥ 75% mặt pallet mới được coi là "đầy" (chịu được lớp khác lên trên)

// Tập "kích thước chuẩn": mọi tổ hợp i·a + j·b ≤ limit. Vết cắt chỉ cần xét tại các giá trị này.
function normalSet(limit, a, b){
  const out = new Set([0]);
  for (let i=0; i*a <= limit + 1e-6; i++)
    for (let j=0; i*a + j*b <= limit + 1e-6; j++) out.add(i*a + j*b);
  return Array.from(out).sort((x,y)=> x - y);
}

function homogeneousPattern(X, Y, w, h){
  const nx = Math.floor((X + 1e-6) / w), ny = Math.floor((Y + 1e-6) / h), rects = [];
  for (let u=0; u<nx; u++) for (let v=0; v<ny; v++) rects.push({ x:u*w, y:v*h, w, h });
  return { X, Y, count: rects.length, rects };
}

// Bảng quy hoạch động guillotine cho thùng a×b trên mọi hình chữ nhật con "chuẩn" của X×Y.
// Trả về { ok, count(w,h), build(w,h,ox,oy,out) } — dùng chung cho mẫu guillotine và mẫu pinwheel.
function makeGuillotineDP(X, Y, a, b, allowRot){
  const rot = allowRot && Math.abs(a - b) > 1e-6;
  const sizes = rot ? [[a,b],[b,a]] : [[a,b]];
  const nx = rot ? normalSet(X, a, b) : normalSet(X, a, a);
  const ny = rot ? normalSet(Y, a, b) : normalSet(Y, b, b);
  const NX = nx.length, NY = ny.length;
  const idxLE = (arr, v)=>{ let lo=0, hi=arr.length-1, r=0; while (lo<=hi){ const m=(lo+hi)>>1; if (arr[m] <= v + 1e-6){ r=m; lo=m+1; } else hi=m-1; } return r; };
  if (NX * NY > 60000) return { ok:false, sizes, nx, ny };
  const val = new Int32Array(NX*NY), kind = new Int8Array(NX*NY), arg = new Int32Array(NX*NY);
  for (let i=0; i<NX; i++) for (let j=0; j<NY; j++){
    const x = nx[i], y = ny[j], k = i*NY + j;
    let best = 0, bk = 0, ba = 0;
    for (let o=0; o<sizes.length; o++){
      const [w,h] = sizes[o];
      const c = Math.floor((x + 1e-6)/w) * Math.floor((y + 1e-6)/h);
      if (c > best){ best = c; bk = 0; ba = o; }
    }
    for (let p=1; p<i && nx[p] <= x/2 + 1e-6; p++){
      const c = val[p*NY + j] + val[idxLE(nx, x - nx[p])*NY + j];
      if (c > best){ best = c; bk = 1; ba = p; }
    }
    for (let p=1; p<j && ny[p] <= y/2 + 1e-6; p++){
      const c = val[i*NY + p] + val[i*NY + idxLE(ny, y - ny[p])];
      if (c > best){ best = c; bk = 2; ba = p; }
    }
    val[k] = best; kind[k] = bk; arg[k] = ba;
  }
  function buildIdx(i, j, ox, oy, out){
    const k = i*NY + j, x = nx[i], y = ny[j];
    if (kind[k] === 0){
      const [w,h] = sizes[arg[k]];
      const cx = Math.floor((x + 1e-6)/w), cy = Math.floor((y + 1e-6)/h);
      for (let u=0; u<cx; u++) for (let v=0; v<cy; v++) out.push({ x: ox + u*w, y: oy + v*h, w, h });
    } else if (kind[k] === 1){
      const p = arg[k]; buildIdx(p, j, ox, oy, out); buildIdx(idxLE(nx, x - nx[p]), j, ox + nx[p], oy, out);
    } else {
      const p = arg[k]; buildIdx(i, p, ox, oy, out); buildIdx(i, idxLE(ny, y - ny[p]), ox, oy + ny[p], out);
    }
  }
  return {
    ok: true, nx, ny,
    count: (w, h)=> (w < -1e-6 || h < -1e-6) ? 0 : val[idxLE(nx, w)*NY + idxLE(ny, h)],
    build: (w, h, ox, oy, out)=>{ if (w > 1e-6 && h > 1e-6) buildIdx(idxLE(nx, w), idxLE(ny, h), ox, oy, out); }
  };
}

// Mẫu lớp tối ưu kiểu guillotine (mọi đường cắt thẳng xuyên suốt).
function bestGuillotinePattern(X, Y, a, b, allowRot){
  const dp = makeGuillotineDP(X, Y, a, b, allowRot);
  if (!dp.ok){
    let best = null;
    for (const [w,h] of dp.sizes){ const p = homogeneousPattern(X, Y, w, h); if (!best || p.count > best.count) best = p; }
    return best;
  }
  const rects = []; dp.build(X, Y, 0, 0, rects);
  return { X, Y, count: rects.length, rects };
}

/* Mẫu PINWHEEL (chong chóng, không-guillotine bậc 1): 4 khối quay quanh 1 ô trống ở giữa.
   B1 [0,w1]×[0,h1] · B2 [w1,X]×[0,h2] · B3 [X−w3,X]×[h2,Y] · B4 [0,X−w3]×[h1,Y].
   Mỗi khối điền bằng DP guillotine. Chỉ nhận mẫu có đủ 4 khối (pinwheel thật) — đây là dạng mẫu
   cho phép xen kẽ (interlock) khi lật chiều quay ở lớp kế tiếp. */
function bestPinwheelPattern(X, Y, a, b, allowRot){
  const dp = makeGuillotineDP(X, Y, a, b, allowRot);
  if (!dp.ok) return null;
  const nx = dp.nx.filter(v=> v > 0 && v < X), ny = dp.ny.filter(v=> v > 0 && v < Y);
  if (nx.length * nx.length * ny.length * ny.length > 3e6) return null;
  let best = null;
  for (const w1 of nx) for (const w3 of nx) {
    const x3 = X - w3;
    for (const h1 of ny) for (const h2 of ny){
      if (!((w1 <= x3 + 1e-6) || (h1 <= h2 + 1e-6))) continue;   // B1 ∩ B3 = ∅
      if (!((w1 >= x3 - 1e-6) || (h2 <= h1 + 1e-6))) continue;   // B2 ∩ B4 = ∅
      const c1 = dp.count(w1, h1), c2 = dp.count(X - w1, h2), c3 = dp.count(w3, Y - h2), c4 = dp.count(x3, Y - h1);
      if (!c1 || !c2 || !c3 || !c4) continue;
      const c = c1 + c2 + c3 + c4;
      if (best && c < best.count) continue;
      // Hòa số thùng → chọn mẫu GỌN nhất (khung bao nhỏ, gần vuông) — mẫu gọn mới xen kẽ được với bản lật của nó
      const rects = buildPW(w1, w3, h1, h2);
      let x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity;
      for (const r of rects){ x0=Math.min(x0,r.x); y0=Math.min(y0,r.y); x1=Math.max(x1,r.x+r.w); y1=Math.max(y1,r.y+r.h); }
      const bbox = (x1-x0)*(y1-y0), skew = Math.abs((x1-x0)-(y1-y0));
      if (!best || c > best.count || bbox < best.bbox - 1 || (Math.abs(bbox - best.bbox) <= 1 && skew < best.skew))
        best = { count: c, rects, bbox, skew };
    }
  }
  if (!best) return null;
  return { X, Y, count: best.rects.length, rects: best.rects, pinwheel: true };
  function buildPW(w1, w3, h1, h2){
    const rects = [];
    dp.build(w1, h1, 0, 0, rects);
    dp.build(X - w1, h2, w1, 0, rects);
    dp.build(w3, Y - h2, X - w3, h2, rects);
    dp.build(X - w3, Y - h1, 0, h1, rects);
    return rects;
  }
}

// Dời mẫu vào giữa mặt (phần hở chia đều 2 bên) — cân tâm.
function centerPattern(p){
  if (!p || !p.rects.length) return p;
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  for (const r of p.rects){ minX=Math.min(minX,r.x); minY=Math.min(minY,r.y); maxX=Math.max(maxX,r.x+r.w); maxY=Math.max(maxY,r.y+r.h); }
  const ox = (p.X - (maxX-minX))/2 - minX, oy = (p.Y - (maxY-minY))/2 - minY;
  return Object.assign({}, p, { rects: p.rects.map(r=> ({ x:r.x+ox, y:r.y+oy, w:r.w, h:r.h })) });
}
function mirrorPattern(p, mx, my){
  return Object.assign({}, p, { rects: p.rects.map(r=> ({ x: mx ? p.X - r.x - r.w : r.x, y: my ? p.Y - r.y - r.h : r.y, w:r.w, h:r.h })) });
}
function transposePattern(p){
  return Object.assign({}, p, { X:p.Y, Y:p.X, rects: p.rects.map(r=> ({ x:r.y, y:r.x, w:r.h, h:r.w })) });
}
function patternKey(p){ return p.rects.map(r=> Math.round(r.x)+','+Math.round(r.y)+','+Math.round(r.w)).sort().join(';'); }

// Lớp trên đặt lên lớp dưới: minSup = tỉ lệ đỡ nhỏ nhất (0..1); bridged = tỉ lệ thùng bắc cầu ≥ 2 thùng dưới.
function layerOnLayer(upper, lower){
  let minSup = 1, bridged = 0;
  for (const u of upper.rects){
    let area = 0, n = 0;
    for (const l of lower.rects){
      const ix = Math.max(0, Math.min(u.x+u.w, l.x+l.w) - Math.max(u.x, l.x));
      const iy = Math.max(0, Math.min(u.y+u.h, l.y+l.h) - Math.max(u.y, l.y));
      const a = ix * iy;
      if (a > 0){ area += a; if (a > 0.05 * u.w * u.h) n++; }
    }
    minSup = Math.min(minSup, area / (u.w * u.h));
    if (n >= 2) bridged++;
  }
  return { minSup, bridged: upper.rects.length ? bridged / upper.rects.length : 0 };
}

// Tìm cặp mẫu (dưới, trên) xen kẽ: mỗi lớp đỡ lớp kia ≥ ngưỡng và ≥ 20% thùng bắc cầu mối nối.
// Ứng viên gồm mẫu guillotine, mẫu pinwheel và các phép lật/xoay của chúng (lật pinwheel = đổi chiều quay).
function findInterlockPair(A, a, b, allowRot, thrPct, fixedBottom, extra){
  const X = A.X, Y = A.Y, cands = [A];
  const push = (p)=>{ if (p && p.count > 0 && Math.abs(p.X - X) < 0.5 && Math.abs(p.Y - Y) < 0.5) cands.push(p); };
  const addFamily = (p)=>{ if (!p) return; push(p); push(mirrorPattern(p, true, false)); push(mirrorPattern(p, false, true)); push(mirrorPattern(p, true, true));
    if (Math.abs(X - Y) < 0.5){ const T = transposePattern(p); push(T); push(mirrorPattern(T, true, false)); } };
  addFamily(A);
  (extra || []).forEach(addFamily);
  const alt = bestGuillotinePattern(Y, X, a, b, allowRot);
  if (alt && alt.count > 0) addFamily(centerPattern(transposePattern(alt)));
  for (const [w,h] of (allowRot && Math.abs(a-b) > 1e-6 ? [[a,b],[b,a]] : [[a,b]])) push(centerPattern(homogeneousPattern(X, Y, w, h)));
  const uniq = [], keys = new Set();
  for (const c of cands){ const k = patternKey(c); if (!keys.has(k)){ keys.add(k); uniq.push(c); } }
  let best = null;
  for (const B of (fixedBottom ? [A] : uniq)) for (const T of uniq){
    if (patternKey(B) === patternKey(T)) continue;
    const up = layerOnLayer(T, B);
    if (up.minSup * 100 < thrPct - 1e-6) continue;
    let q = up.bridged;
    if (!fixedBottom){
      const down = layerOnLayer(B, T);
      if (down.minSup * 100 < thrPct - 1e-6) continue;
      q = Math.min(q, down.bridged);
    }
    if (q < 0.2) continue;
    const score = B.count + T.count;
    if (!best || score > best.score || (score === best.score && q > best.q)){
      const swap = !fixedBottom && T.count > B.count;
      best = { bottom: swap ? T : B, top: swap ? B : T, q, score };
    }
  }
  return best;
}

function _withTotal(p){ p.total = p.seq.reduce((s,l)=> s + l.count, 0); return p; }

// Chọn cách ghép lớp theo patternMode: auto | interlock | column | column_toplock
function buildLayerPlan(X, Y, a, b, allowRot, mode, thrPct, maxLayers){
  const G = centerPattern(bestGuillotinePattern(X, Y, a, b, allowRot));
  const PW = centerPattern(bestPinwheelPattern(X, Y, a, b, allowRot));
  const A = (PW && (!G || PW.count > G.count)) ? PW : G; // guillotine ưu tiên khi hòa (dễ xếp tay hơn)
  if (!A || !A.count) return null;
  const extra = PW && PW !== A ? [PW] : [];
  const column = ()=> _withTotal({ kind:'column', seq: Array(maxLayers).fill(A), q:0 });
  if (mode === 'column' || maxLayers < 2) return column();
  if (mode === 'column_toplock'){
    const pr = findInterlockPair(A, a, b, allowRot, thrPct, true, extra);
    if (pr) return _withTotal({ kind:'column_toplock', seq: Array(maxLayers-1).fill(A).concat([pr.top]), q: pr.q });
    return Object.assign(column(), { fallback:true });
  }
  const pr = findInterlockPair(A, a, b, allowRot, thrPct, false, extra);
  if (!pr) return Object.assign(column(), { fallback: mode === 'interlock' });
  const il = _withTotal({ kind: (pr.bottom.pinwheel || pr.top.pinwheel) ? 'pinwheel' : 'interlock',
                          seq: Array.from({length:maxLayers}, (_,i)=> i % 2 === 0 ? pr.bottom : pr.top), q: pr.q });
  if (mode === 'interlock') return il;
  const col = column();
  // auto: ưu tiên xen kẽ nếu KHÔNG mất thùng — TRỪ khi xen kẽ chỉ đạt được bằng mẫu lệch lạ:
  //  · thùng VUÔNG (xoay 90° không đổi gì) → "xen kẽ" phải tách cột/dời lệch (vd 1 thùng + 2 thùng ở cột cuối) — khó hiểu khi
  //    bốc xếp, khung lớp phình/lòi mép;
  //  · 2 mẫu lệch khung bao > dung sai vuông vức → khối không thẳng mép.
  //  Khi đó xếp CỘT THẲNG (mọi lớp giống nhau), trừ khi xen kẽ chứa NHIỀU thùng hơn.
  const bbox = (p)=>{ let x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity;
    p.rects.forEach(r=>{ x0=Math.min(x0,r.x); y0=Math.min(y0,r.y); x1=Math.max(x1,r.x+r.w); y1=Math.max(y1,r.y+r.h); }); return { w: x1-x0, h: y1-y0 }; };
  const bB = bbox(pr.bottom), bT = bbox(pr.top), tol = (typeof STRAP_TOL === 'number' ? STRAP_TOL : 60);
  const odd = Math.abs(a - b) <= 1 || Math.abs(bB.w - bT.w) > tol || Math.abs(bB.h - bT.h) > tol;
  if (odd && il.total <= col.total) return col;
  return il.total >= col.total ? il : col;
}

// Thông số lớp của 1 SKU trên 1 loại pallet (chiều đứng, footprint, số lớp tối đa theo ràng buộc thùng).
function skuLayerGroups(sku, cargoH){
  const groups = new Map();
  for (const o of generateOrientations(sku)){ if (!groups.has(o.w)) groups.set(o.w, []); groups.get(o.w).push(o); }
  const out = [];
  for (const [hUp, list] of groups){
    if (hUp > cargoH + 1e-6) continue;
    const a = list[0].d, b = list[0].h;
    const allowRot = Math.abs(a-b) < 1e-6 || list.some(o=> Math.abs(o.d-b) < 1e-6 && Math.abs(o.h-a) < 1e-6);
    let maxLayers = Math.floor((cargoH + 1e-6) / hUp);
    if (sku.fragile) maxLayers = Math.min(maxLayers, 1);
    if (sku.maxStackCount != null) maxLayers = Math.min(maxLayers, sku.maxStackCount + 1);
    if (sku.maxStackLoad != null && sku.weight > 0) maxLayers = Math.min(maxLayers, Math.floor(sku.maxStackLoad / sku.weight + 1e-9) + 1);
    if (maxLayers >= 1) out.push({ hUp, list, a, b, allowRot, maxLayers });
  }
  return out;
}

/* Chìa mép tối đa (mm/bên) mà KHÔNG làm giảm số pallet đặt cạnh nhau theo bề ngang cont, và nối đuôi theo
   chiều dài cont, so với khi không chìa. Bề ngang tính theo min(rộng lòng, rộng cửa) vì hàng pallet sát cửa
   phải lọt giữa 2 trụ cửa. Ước tính theo cách xếp thẳng hàng (có thể trộn cạnh dài/ngắn trên 1 hàng). */
function overhangCapForPallet(pt, container){
  const usableW = Math.min(container.W || 0, container.doorW || container.W || 0);
  const best = (span)=>{
    let n = 0, slack = 0;
    for (let a=0; a*pt.L <= span + 1e-6; a++){
      const b = Math.floor((span - a*pt.L + 1e-6) / pt.W);
      const k = a + b, sl = span - a*pt.L - b*pt.W;
      if (k > n || (k === n && sl > slack)){ n = k; slack = sl; }
    }
    return { n, slack };
  };
  const w = best(usableW), l = best(container.L || 0);
  const capW = w.n > 0 ? Math.floor(w.slack / (2 * w.n)) : 0;
  const capL = l.n > 0 ? Math.floor(l.slack / (2 * l.n)) : 0;
  return { cap: Math.max(0, Math.min(capW, capL)), capW, capL, nW: w.n, nL: l.n, usableW };
}

// Dãy lớp n tầng từ 1 kế hoạch lớp (lấy theo kiểu đã chọn: column / interlock / pinwheel / column_toplock).
function layerSeqN(lp, n){
  if (n <= 0) return [];
  if (n === 1) return [lp.seq[0]];
  if (lp.kind === 'column_toplock') return Array(n - 1).fill(lp.seq[0]).concat([lp.seq[lp.seq.length - 1]]);
  const out = [];
  for (let i=0; i<n; i++) out.push(lp.seq[lp.kind === 'column' ? 0 : (i % 2 === 0 ? 0 : Math.min(1, lp.seq.length - 1))]);
  return out;
}

/* Kế hoạch pallet thuần 1 SKU: chọn hướng đứng + mẫu lớp cho nhiều thùng nhất.
   Tùy chọn P.allowLayDown (mặc định bật): khi chiều cao còn dư không đủ 1 lớp hướng chính, các lớp TRÊN được
   chất theo hướng khác (vd thùng nằm xuống) để lấp chỗ — chỉ dùng hướng mà thẻ SKU cho phép xoay.
   plan.layers = danh sách lớp từ dưới lên, mỗi lớp mang mẫu + chiều cao + hướng của riêng nó. */
function planSkuPallet(sku, pt, P, thrPct, ohOverride){
  const oh = Math.max(0, ohOverride != null ? ohOverride : (pt._ohEff != null ? pt._ohEff : (pt.overhang || 0)));
  const X = pt.L + 2*oh, Y = pt.W + 2*oh;
  const cargoH = pt._effMaxH - pt.H;
  if (cargoH <= 0) return null;
  const groups = skuLayerGroups(sku, cargoH);
  const byWeight = (pt.maxLoadKg > 0 && sku.weight > 0) ? Math.floor(pt.maxLoadKg / sku.weight + 1e-9) : Infinity;
  // số lớp tối đa theo ràng buộc thùng (không phụ thuộc hướng)
  let capLayers = Infinity;
  if (sku.fragile) capLayers = 1;
  if (sku.maxStackCount != null) capLayers = Math.min(capLayers, sku.maxStackCount + 1);
  if (sku.maxStackLoad != null && sku.weight > 0) capLayers = Math.min(capLayers, Math.floor(sku.maxStackLoad / sku.weight + 1e-9) + 1);
  const lps = new Map();
  for (const g of groups){ const lp = buildLayerPlan(X, Y, g.a, g.b, g.allowRot, P.patternMode, thrPct, Math.max(2, g.maxLayers)); if (lp) lps.set(g, lp); }
  const deco = (g, seq)=> seq.map(p=> Object.assign({}, p, { hUp: g.hUp, orients: g.list, a: g.a, b: g.b }));
  let best = null;
  const consider = (c)=>{
    if (c.count < 1) return;
    if (!best || c.count > best.count || (c.count === best.count && (c.nSec < best.nSec || (c.nSec === best.nSec && c.hUp < best.hUp)))) best = c;
  };
  const mk = (g, lp, layers, nSec, g2)=>{
    const total = layers.reduce((t,l)=> t + l.count, 0);
    const n1 = layers.length - nSec;
    let cnt = Math.min(total, byWeight);
    if (P.strapMode && cnt < total){
      // vuông vức: lớp trên cùng bị cắt bớt (do giới hạn tải) phải còn ≥ 4 thùng để giữ 4 góc
      let acc = 0;
      for (const l of layers){ if (acc + l.count <= cnt){ acc += l.count; continue; } cnt = acc; break; }  // bỏ lớp lẻ trên cùng
    }
    return { skuId: sku.id, ptypeId: pt.id, hUp: g.hUp, orients: g.list, allowRot: g.allowRot, a: g.a, b: g.b,
             lp: Object.assign({}, lp, { seq: layerSeqN(lp, n1), total: layers.slice(0, n1).reduce((t,l)=> t + l.count, 0) }),
             layers, count: cnt, oh, weightLimited: byWeight < total, nSec, secHUp: g2 ? g2.hUp : null };
  };
  // lớp mẫu → "slab giả" để kiểm tra 4 góc ở chế độ vuông vức
  const pseudo = (pat, hUp)=> ({ cartons: pat.rects.map(r=> ({ x: r.x, y: r.y, w: r.w, l: r.h, hh: hUp })) });
  for (const [g, lp] of lps){
    const n0 = Math.min(g.maxLayers, capLayers);
    if (n0 >= 1) consider(mk(g, lp, deco(g, layerSeqN(lp, n0)), 0, null));
    if (P.allowLayDown === false) continue;
    for (const [g2, lp2] of lps){
      if (g2 === g || Math.abs(g2.hUp - g.hUp) < 1) continue;
      for (let n1 = n0; n1 >= 1; n1--){
        const n2 = Math.min(Math.floor((cargoH - n1 * g.hUp + 1e-6) / g2.hUp), g2.maxLayers, capLayers - n1);
        if (n2 < 1) continue;
        const lower = layerSeqN(lp, n1), upper = layerSeqN(lp2, n2);
        // lớp đầu của khối đổi hướng phải được lớp dưới đỡ đủ ngưỡng
        if (layerOnLayer(upper[0], lower[lower.length - 1]).minSup * 100 < thrPct - 1e-6) continue;
        // vuông vức: mọi lớp đổi hướng phải phủ đủ 4 góc khung của lớp đáy
        if (P.strapMode){
          const ref = slabBBox(pseudo(lower[0], g.hUp));
          if (!upper.every(u=> slabCornersOk(pseudo(u, g2.hUp), ref))) continue;
        }
        consider(mk(g, lp, deco(g, lower).concat(deco(g2, upper)), n2, g2));
      }
    }
  }
  return best;
}

// Gợi ý trung thực khi SKU đang phải chất column: chìa mép thêm bao nhiêu / loại pallet nào thì interlock
// được mà KHÔNG mất thùng.
function interlockSuggestion(sku, pt, plan, P, thrPct, types){
  if (!plan || plan.lp.kind !== 'column' || plan.lp.seq.length < 2 || P.patternMode === 'column') return null;
  const P2 = Object.assign({}, P, { patternMode: 'interlock' });
  const base = pt._ohEff != null ? pt._ohEff : (pt.overhang || 0);
  for (const extra of [10, 20, 30]){
    const oh = base + extra;
    if (pt._ohCap != null && oh > pt._ohCap) break; // chìa thêm sẽ làm mất chỗ pallet trong cont → không gợi ý
    const alt = planSkuPallet(sku, pt, P2, thrPct, oh);
    if (alt && alt.lp.kind !== 'column' && alt.count >= plan.count)
      return `chìa mép ${oh} mm/bên → ${alt.lp.kind === 'pinwheel' ? 'pinwheel' : 'interlock'} ${alt.lp.seq[0].count}/lớp, ${alt.count} thùng/pallet`;
  }
  for (const t of types){
    if (t.id === pt.id) continue;
    const alt = planSkuPallet(sku, t, P2, thrPct);
    if (alt && alt.lp.kind !== 'column' && alt.count >= plan.count)
      return `dùng pallet ${t.name} → ${alt.lp.kind === 'pinwheel' ? 'pinwheel' : 'interlock'} ${alt.lp.seq[0].count}/lớp, ${alt.count} thùng/pallet`;
  }
  return null;
}

/* ---------- MaxRects 2D (Best Short Side Fit) — xếp thùng khác loại trong 1 lớp ----------
   items: [{ w, h, rot, ref }]; canAdd(placed, item) → false để bỏ qua (ràng buộc số SKU/lớp). */
function maxRectsPack(W, H, items, canAdd, fixedRects){
  let free = [{ x:0, y:0, w:W, h:H }];
  const placed = [], rest = [];
  const E = 1e-6;
  const splitBy = (R)=>{
    const nf = [];
    for (const f of free){
      if (R.x >= f.x + f.w - E || R.x + R.w <= f.x + E || R.y >= f.y + f.h - E || R.y + R.h <= f.y + E){ nf.push(f); continue; }
      if (R.x > f.x + E)             nf.push({ x:f.x, y:f.y, w:R.x - f.x, h:f.h });
      if (R.x + R.w < f.x + f.w - E) nf.push({ x:R.x + R.w, y:f.y, w:f.x + f.w - R.x - R.w, h:f.h });
      if (R.y > f.y + E)             nf.push({ x:f.x, y:f.y, w:f.w, h:R.y - f.y });
      if (R.y + R.h < f.y + f.h - E) nf.push({ x:f.x, y:R.y + R.h, w:f.w, h:f.y + f.h - R.y - R.h });
    }
    const inside = (a, b)=> a.x >= b.x - E && a.y >= b.y - E && a.x + a.w <= b.x + b.w + E && a.y + a.h <= b.y + b.h + E;
    free = nf.filter((a, i)=> !nf.some((b, j)=> j !== i && inside(a, b) && (!inside(b, a) || j < i)));
  };
  (fixedRects || []).forEach(splitBy);
  for (const it of items){
    if (canAdd && !canAdd(placed, it)){ rest.push(it); continue; }
    let best = null;
    const opts = (it.rot && Math.abs(it.w - it.h) > E) ? [[it.w, it.h, false], [it.h, it.w, true]] : [[it.w, it.h, false]];
    for (const f of free) for (const [w, h, r] of opts){
      if (w > f.w + E || h > f.h + E) continue;
      const ss = Math.min(f.w - w, f.h - h), ls = Math.max(f.w - w, f.h - h);
      if (!best || ss < best.ss - E || (Math.abs(ss - best.ss) < E && (ls < best.ls - E ||
          (Math.abs(ls - best.ls) < E && (f.y < best.y - E || (Math.abs(f.y - best.y) < E && f.x < best.x))))))
        best = { x:f.x, y:f.y, w, h, r, ss, ls };
    }
    if (!best){ rest.push(it); continue; }
    const R = { x:best.x, y:best.y, w:best.w, h:best.h };
    placed.push({ it, x:R.x, y:R.y, w:R.w, h:R.h, rotated: best.r });
    const nf = [];
    for (const f of free){
      if (R.x >= f.x + f.w - E || R.x + R.w <= f.x + E || R.y >= f.y + f.h - E || R.y + R.h <= f.y + E){ nf.push(f); continue; }
      if (R.x > f.x + E)             nf.push({ x:f.x, y:f.y, w:R.x - f.x, h:f.h });
      if (R.x + R.w < f.x + f.w - E) nf.push({ x:R.x + R.w, y:f.y, w:f.x + f.w - R.x - R.w, h:f.h });
      if (R.y > f.y + E)             nf.push({ x:f.x, y:f.y, w:f.w, h:R.y - f.y });
      if (R.y + R.h < f.y + f.h - E) nf.push({ x:f.x, y:R.y + R.h, w:f.w, h:f.y + f.h - R.y - R.h });
    }
    const inside = (a, b)=> a.x >= b.x - E && a.y >= b.y - E && a.x + a.w <= b.x + b.w + E && a.y + a.h <= b.y + b.h + E;
    free = nf.filter((a, i)=> !nf.some((b, j)=> j !== i && inside(a, b) && (!inside(b, a) || j < i)));
  }
  return { placed, rest };
}

/* ---------- Slab (lớp) ----------
   carton trong slab: { x, y, w, l, hh, skuId, weight, fragile, orientCode, maxStackCount, maxStackLoad, tag }
   (x,y,w,l trên mặt pallet; hh = cao thùng). */
function makeSlab(cartons, pt, refCov){
  let h = 0, minH = Infinity, weight = 0, area = 0, fragile = false, capCount = Infinity;
  const skus = new Set();
  for (const c of cartons){
    const top = (c.oy || 0) + c.hh;
    h = Math.max(h, top); minH = Math.min(minH, top); weight += c.weight; if (!c.oy) area += c.w * c.l;
    fragile = fragile || !!c.fragile; skus.add(c.skuId);
    if (c.maxStackCount != null) capCount = Math.min(capCount, c.maxStackCount);
  }
  // Tải đè cho phép của cả lớp: tải phía trên chia theo tỉ lệ diện tích (xấp xỉ) → lấy thùng yếu nhất.
  let capLoad = Infinity;
  for (const c of cartons) if (c.maxStackLoad != null) capLoad = Math.min(capLoad, c.maxStackLoad * area / (c.w * c.l));
  const coverage = area / (pt.L * pt.W);
  const uniform = (h - minH) <= LAYER_H_TOL;
  const stacked = cartons.some(c=> c.oy);
  // Lớp "đầy" (được đỡ lớp khác lên trên): phủ ≥ 75% mặt pallet, HOẶC ≥ 85% độ phủ của mẫu lớp tối ưu của chính
  // SKU đó (refCov). Lý do: có SKU mà lớp xếp kín nhất chỉ phủ ~68% (vd 450×230 trên 1100×1100: 8 thùng) — trước đây
  // lớp kín như vậy bị coi là "thưa" nên không được chồng lớp nào lên → mỗi lớp lẻ thành 1 pallet riêng.
  const fullThr = refCov ? Math.min(SLAB_FULL_COVERAGE, 0.85 * refCov) : SLAB_FULL_COVERAGE;
  return { cartons, h, weight, area, coverage, refCov: refCov || null, uniform: uniform && !stacked, full: uniform && !stacked && coverage >= fullThr - 1e-9 && !fragile,
           fragile, capCount, capLoad, skus: Array.from(skus), density: area > 0 ? weight / area : 0 };
}

function centerCartons(cartons, pt){
  if (!cartons.length) return cartons;
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  for (const c of cartons){ minX=Math.min(minX,c.x); minY=Math.min(minY,c.y); maxX=Math.max(maxX,c.x+c.w); maxY=Math.max(maxY,c.y+c.l); }
  const ox = (pt.L - (maxX-minX))/2 - minX, oy = (pt.W - (maxY-minY))/2 - minY;
  return cartons.map(c=> Object.assign({}, c, { x: c.x + ox, y: c.y + oy }));
}

function cartonFromSku(sku, x, y, w, l, hh, orientCode, tag){
  return { x, y, w, l, hh, skuId: sku.id, weight: sku.weight, fragile: !!sku.fragile, orientCode,
           maxStackCount: sku.maxStackCount, maxStackLoad: sku.maxStackLoad, tag: tag || null };
}

// Các lớp theo kế hoạch pallet thuần SKU. count < 1 lớp: lấy các ô gần tâm trước (cân tâm).
// Chọn k ô trong 1 lớp thiếu: giữ 4 ô ở 4 GÓC trước (để nẹp góc/đai được), rồi các ô gần tâm (cân tâm).
function pickLayerRects(layer, k){
  const rects = layer.rects;
  if (rects.length <= k) return rects;
  let x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity;
  for (const r of rects){ x0=Math.min(x0,r.x); y0=Math.min(y0,r.y); x1=Math.max(x1,r.x+r.w); y1=Math.max(y1,r.y+r.h); }
  const chosen = [];
  if (k >= 4){
    for (const [cx, cy] of [[x0+1,y0+1],[x1-1,y0+1],[x0+1,y1-1],[x1-1,y1-1]]){
      const r = rects.find(r=> cx >= r.x && cx <= r.x + r.w && cy >= r.y && cy <= r.y + r.h);
      if (r && !chosen.includes(r)) chosen.push(r);
    }
  }
  const mx = (x0+x1)/2, my = (y0+y1)/2, d = (r)=> Math.hypot(r.x + r.w/2 - mx, r.y + r.h/2 - my);
  for (const r of rects.slice().sort((a,b)=> d(a) - d(b))){ if (chosen.length >= k) break; if (!chosen.includes(r)) chosen.push(r); }
  return chosen.slice(0, k);
}

// Các lớp theo kế hoạch pallet thuần SKU (mỗi lớp có thể khác hướng thùng).
function slabsFromPlan(plan, sku, count, pt){
  const out = []; let left = count;
  const layers = plan.layers || plan.lp.seq.map(p=> Object.assign({}, p, { hUp: plan.hUp, orients: plan.orients, a: plan.a, b: plan.b }));
  for (let li=0; li<layers.length && left > 0; li++){
    const layer = layers[li];
    const rects = pickLayerRects(layer, left);
    const refCov = layer.count * layer.a * layer.b / (pt.L * pt.W);
    out.push(makeSlab(rects.map(r=>{
      const o = layer.orients.find(o=> Math.abs(o.d - r.w) < 1e-6 && Math.abs(o.h - r.h) < 1e-6) || layer.orients[0];
      return cartonFromSku(sku, r.x - plan.oh, r.y - plan.oh, r.w, r.h, layer.hUp, o.code);
    }), pt, refCov));
    left -= rects.length;
  }
  return out;
}

/* ---------- Pallet "vuông vức": nẹp 4 góc + đai trên-dưới được ----------
   Điều kiện cho 1 lớp đặt lên chồng: 4 GÓC của khung hàng (lấy theo lớp đáy) đều có thùng, các thùng ở góc cao bằng
   nhau và bằng thùng cao nhất của lớp — nẹp góc chạy thẳng từ đáy tới đỉnh, dây đai đi qua đỉnh phẳng ở 4 góc. */
let STRAP_TOL = 60;     // mm — lệch mép/góc cho phép giữa các lớp (chế độ vuông vức) — lấy từ cài đặt pallet
let LAYER_H_TOL = 1;   // mm — chênh cao tối đa giữa các thùng trong 1 lớp "phẳng" — lấy từ cài đặt pallet
let SUPPORT_EPS = 1.0; // mm — khe hở tối đa vẫn tính là "chạm đỡ" (= LAYER_H_TOL khi chất pallet)
// Áp dung sai từ cài đặt pallet (gọi ở đầu mỗi lần chạy mode Pallet trong worker).
function applyPalletTolerances(P){
  STRAP_TOL = P.strapTol > 0 ? P.strapTol : 60;
  LAYER_H_TOL = Math.max(1, P.layerHTol || 0);
  SUPPORT_EPS = LAYER_H_TOL + 0.01;
}
function slabBBox(slab){
  let x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity;
  for (const c of slab.cartons){ x0=Math.min(x0,c.x); y0=Math.min(y0,c.y); x1=Math.max(x1,c.x+c.w); y1=Math.max(y1,c.y+c.l); }
  return { x0, y0, x1, y1 };
}
function slabCornersOk(slab, ref){
  const topH = Math.max(...slab.cartons.map(c=> (c.oy || 0) + c.hh));
  const bb = slabBBox(slab);
  if (bb.x0 < ref.x0 - STRAP_TOL || bb.y0 < ref.y0 - STRAP_TOL || bb.x1 > ref.x1 + STRAP_TOL || bb.y1 > ref.y1 + STRAP_TOL) return false;
  const T = STRAP_TOL;
  return [[ref.x0 + T, ref.y0 + T], [ref.x1 - T, ref.y0 + T], [ref.x0 + T, ref.y1 - T], [ref.x1 - T, ref.y1 - T]].every(([px, py])=>
    slab.cartons.some(c=> (c.oy || 0) + c.hh >= topH - 2 && px >= c.x - 0.5 && px <= c.x + c.w + 0.5 && py >= c.y - 0.5 && py <= c.y + c.l + 0.5));
}
// Lớp "đủ": đúng số thùng của mẫu lớp tối ưu (≥ 97% độ phủ mẫu) — không thiếu thùng nào, kể cả lớp trên cùng.
function isCompleteSlab(sl){
  if (!sl || !sl.full) return false;
  return sl.refCov ? sl.coverage >= 0.97 * sl.refCov - 1e-9 : sl.coverage >= SLAB_FULL_COVERAGE - 1e-9;
}
// Nẹp 4 góc + đai được: mọi lớp ĐỦ thùng (không lớp lẻ) và thẳng mép 4 góc với lớp đáy.
function stackStrapOk(st){
  if (!st.slabs.length) return true;
  const ref = slabBBox(st.slabs[0]);
  return st.slabs.every(sl=> slabCornersOk(sl, ref) && isCompleteSlab(sl));
}

/* ---------- Chính sách trộn SKU trên pallet ----------
   mode: none (1 SKU/pallet) | full (tự do) | partial (≤ N SKU/lớp, ≤ K SKU/pallet, cùng nhóm mix group) */
function makeMixPolicy(P, groupOf){
  const mode = P.mixMode || 'full';
  const N = mode === 'none' ? 1 : (mode === 'partial' ? Math.max(1, P.mixN || 1) : Infinity);
  const K = mode === 'none' ? 1 : (mode === 'partial' ? Math.max(1, P.mixK || 1) : Infinity);
  const sameGroup = (ids)=>{ if (mode !== 'partial') return true; const g = new Set(ids.map(id=> groupOf(id) || '')); return g.size <= 1; };
  return {
    mode, N, K, strap: !!P.strapMode,
    layerOk: (ids)=> ids.length <= N && sameGroup(ids),
    palletOk: (ids)=> ids.length <= K && sameGroup(ids)
  };
}

// Thông số lớp (chiều đứng, footprint) của mỗi SKU — lấy theo kế hoạch pallet nếu có.
function layerSpecOf(sku, pt, plan){
  if (plan){
    const best = Math.max(...plan.lp.seq.map(l=> l.count));
    return { hUp: plan.hUp, a: plan.a, b: plan.b, allowRot: plan.allowRot, orients: plan.orients, refCov: best * plan.a * plan.b / (pt.L * pt.W) };
  }
  const gs = skuLayerGroups(sku, pt._effMaxH - pt.H);
  if (!gs.length) return null;
  gs.sort((g1, g2)=> (g2.a*g2.b - g1.a*g1.b) || (g1.hUp - g2.hUp)); // footprint lớn nhất = vững nhất
  const g = gs[0];
  const pat = bestGuillotinePattern(pt.L, pt.W, g.a, g.b, g.allowRot);
  return { hUp: g.hUp, a: g.a, b: g.b, allowRot: g.allowRot, orients: g.list, refCov: (pat ? pat.count : 0) * g.a * g.b / (pt.L * pt.W) || null };
}

function specItem(it, spec){
  return { w: spec.a, h: spec.b, rot: spec.allowRot, ref: it, spec };
}
function cartonFromPacked(pk, skuById, tag){
  const sp = pk.it.spec, sku = skuById[pk.it.ref.skuId];
  const o = sp.orients.find(o=> Math.abs(o.d - pk.w) < 1e-6 && Math.abs(o.h - pk.h) < 1e-6) || sp.orients[0];
  const c = cartonFromSku(sku, pk.x, pk.y, pk.w, pk.h, sp.hUp, o.code, tag || (pk.it.ref._tag || null));
  c.iid = pk.it.ref.instanceId;
  return c;
}

/* Tầng 1b: thùng lẻ → (1) lớp ĐỀU theo nhóm chiều cao (đủ đầy mới nhận); (2) phần còn lại → lớp trên cùng
